s progress toward Product Goal.","examTip":"PSM II: output vs outcome discrimination.","realWorld":"Bring customer evidence into Review; reorder toward outcomes.","remember":"Value outcomes beat ticket output.","certifications":["PSM-II"],"competency":"Managing Products with Agility","topic":"Product Management"},{"id":142,"category":"Advanced Scenarios","difficulty":"Expert","type":"scenario","examTrack":"PSM-II","focusArea":"Developing People and Teams","question":"A Scrum Master notices Developers adapting the Sprint Backlog throughout the day without waiting for tomorrow’s Daily Scrum. A manager complains this is 'breaking the process.' Is the manager correct?","options":[{"id":"a","text":"Yes — plans may only change in the Daily Scrum","correct":false},{"id":"b","text":"No — the Daily Scrum is not the only time Developers may adjust their plan; they often meet throughout the day","correct":true},{"id":"c","text":"Yes — only the Scrum Master may change the Sprint Backlog","correct":false},{"id":"d","text":"Yes — only the Product Owner updates the Sprint Backlog hourly","correct":false}],"correctWhy":"The Guide states the Daily Scrum is not the only time Developers are allowed to adjust their plan. They often meet throughout the day for more detailed discussions about adapting or re-planning.","wrongWhy":{"a":"Directly contradicts the Guide.","c":"Sprint Backlog is by and for Developers.","d":"PO collaborates on scope vs Sprint Goal; does not own the Developer plan."},"guideInsight":"Daily Scrum section — adaptation beyond the 15 minutes.","examTip":"Process police vs Guide literacy — choose Guide.","realWorld":"Encourage continuous adaptation toward the Sprint Goal.","remember":"Developers can re-plan anytime — not only at Daily Scrum.","certifications":["PSM-II"],"competency":"Developing People and Teams","topic":"Advanced Scenarios"},{"id":143,"category":"Definition of Done","difficulty":"Expert","type":"scenario","examTrack":"PSM-II","focusArea":"Developing and Delivering Products Professionally","question":"Two teams on one product disagree: Team A’s Done excludes performance testing; Team B’s includes it. Releases are inconsistent. What must they do?","options":[{"id":"a","text":"Keep different Done definitions forever for autonomy","correct":false},{"id":"b","text":"Mutually define and comply with the same Definition of Done; if an organizational standard exists, follow it as a minimum","correct":true},{"id":"c","text":"Let the Scrum Masters each pick a Done secretly","correct":false},{"id":"d","text":"Use no Definition of Done to move faster","correct":false}],"correctWhy":"If DoD is an organizational standard, all Scrum Teams follow it as a minimum. Otherwise the Scrum Team creates an appropriate DoD. Multiple teams on one product must mutually define and comply with the same DoD. Developers must conform.","wrongWhy":{"a":"Inconsistent Done destroys product-level transparency.","c":"DoD is not a private SM artifact.","d":"Without Done, Increments aren’t transparent or releasable."},"guideInsight":"DoD organizational minimum; multi-team same DoD.","examTip":"Same product → same Done.","realWorld":"Facilitate a joint DoD workshop; start from org standards.","remember":"Multiple teams on one product share one Definition of Done.","certifications":["PSM-II"],"competency":"Developing and Delivering Products Professionally","topic":"Definition of Done"},{"id":144,"category":"Advanced Scenarios","difficulty":"Expert","type":"scenario","examTrack":"PSM-II","focusArea":"Managing Products with Agility","question":"At Sprint Review, a stakeholder demands Developers start a new initiative tomorrow that would endanger the Sprint Goal of the current Sprint still in progress (Review is second-to-last; Retro remains). Best handling?","options":[{"id":"a","text":"Start immediately; stakeholders override Sprint Goals","correct":false},{"id":"b","text":"Collaborate on Product Backlog adaptation for future work; do not make changes that endanger the current Sprint Goal; PO accountability for ordering remains","correct":true},{"id":"c","text":"Cancel Retro to start the new work sooner","correct":false},{"id":"d","text":"Have the Scrum Master insert the initiative into the Sprint Backlog tonight","correct":false}],"correctWhy":"During the Sprint, no changes are made that would endanger the Sprint Goal. Sprint Review may adjust the Product Backlog for new opportunities. Retro still concludes the Sprint. SM doesn’t take over Developer/PO accountabilities.","wrongWhy":{"a":"Stakeholders don’t override Sprint Goal protections.","c":"Skipping Retro loses improvement inspection.","d":"SM doesn’t own Sprint Backlog content decisions."},"guideInsight":"Sprint constraints; Review backlog adaptation; Retro concludes Sprint.","examTip":"Separate current Sprint Goal protection from future backlog adaptation.","realWorld":"Capture the initiative on the Product Backlog; finish empiricism for this Sprint.","remember":"Adapt the Product Backlog at Review — don’t endanger the current Sprint Goal.","certifications":["PSM-II"],"competency":"Managing Products with Agility","topic":"Advanced Scenarios"},{"id":145,"category":"Leadership & Coaching","difficulty":"Expert","type":"scenario","examTrack":"PSM-II","focusArea":"Developing People and Teams","question":"Which action best reflects servant leadership as a Scrum Master without becoming passive or controlling?","options":[{"id":"a","text":"Silently taking notes while the team violates Done for months","correct":false},{"id":"b","text":"Actively teaching, coaching, facilitating, and causing impediment removal to improve effectiveness while leaving accountabilities intact","correct":true},{"id":"c","text":"Issuing daily task assignments and performance ratings","correct":false},{"id":"d","text":"Owning product strategy decisions for the Product Owner","correct":false}],"correctWhy":"Scrum Masters are true leaders who serve. They are accountable for the Scrum Team’s effectiveness by enabling improved practices within the framework — via coaching, facilitation, teaching, and impediment removal — not passivity or command-and-control.","wrongWhy":{"a":"Passivity abandons effectiveness accountability.","c":"Command-and-control contradicts self-management.","d":"Taking PO accountability is not serving."},"guideInsight":"SM as true leader who serves; accountable for team effectiveness.","examTip":"Servant leadership ≠ do nothing; ≠ become boss.","realWorld":"Intervene on system/process issues; don’t seize content ownership.","remember":"Serve actively — teach, coach, facilitate, remove impediments.","certifications":["PSM-II"],"competency":"Developing People and Teams","topic":"Leadership & Coaching"},{"id":146,"category":"Roadmaps","difficulty":"Advanced","type":"scenario","examTrack":"PSM-II","focusArea":"Managing Products with Agility","question":"Leadership wants a roadmap of fixed scope dates for 18 months treated as contracts. How can the Scrum Master help keep planning empirical?","options":[{"id":"a","text":"Agree that roadmaps override the Product Goal and empiricism","correct":false},{"id":"b","text":"Encourage a Product Goal-oriented roadmap of hypotheses/forecasts inspected and adapted as Increments and feedback arrive","correct":true},{"id":"c","text":"Ban any talk of the future beyond tomorrow","correct":false},{"id":"d","text":"Replace the Product Owner with a roadmap committee","correct":false}],"correctWhy":"Scrum uses empiricism for complex work. Forecasts can help but don’t replace empiricism. The Product Goal guides long-term planning; the backlog emerges. Roadmaps as complementary practice must remain adaptable.","wrongWhy":{"a":"Fixed-scope contracts in complexity create false certainty.","c":"Empirical planning still looks ahead using evidence.","d":"PO is one person, not a committee."},"guideInsight":"Empiricism; Product Goal; forecasting doesn’t replace empiricism.","examTip":"Roadmaps OK as forecasts — not as immutable guarantees.","realWorld":"Show assumptions, confidence, and review cadence tied to Sprint Reviews.","remember":"Roadmaps forecast — they don’t replace empiricism or the PO.","certifications":["PSM-II"],"competency":"Managing Products with Agility","topic":"Roadmaps"},{"id":147,"category":"Sprint Backlog","difficulty":"Advanced","type":"tf","examTrack":"PSM-II","focusArea":"Understanding and Applying the Scrum Framework","question":"True or False: The Sprint Backlog is a highly visible, real-time picture of the work Developers plan to accomplish during the Sprint to achieve the Sprint Goal, and it is updated throughout the Sprint as more is learned.","options":[{"id":"a","text":"True","correct":true},{"id":"b","text":"False","correct":false}],"correctWhy":"The Guide describes the Sprint Backlog exactly this way: by and for Developers; highly visible; real-time; updated throughout the Sprint; enough detail to inspect progress in the Daily Scrum.","wrongWhy":{"b":"This is a direct Guide statement."},"guideInsight":"Sprint Backlog definition and update behavior.","examTip":"Static Sprint Backlogs are an anti-pattern.","realWorld":"Keep the plan living; inspect daily toward the Goal.","remember":"Sprint Backlog is real-time and updated as learning emerges.","certifications":["PSM-II"],"competency":"Understanding and Applying the Scrum Framework","topic":"Sprint Backlog"},{"id":148,"category":"Anti-Patterns","difficulty":"Expert","type":"scenario","examTrack":"PSM-II","focusArea":"Developing People and Teams","question":"A Scrum Master facilitates brilliantly but always makes the final call on technical disputes 'to save time.' Over months, Developers stop deciding. What accountability is being damaged?","options":[{"id":"a","text":"Product Owner ordering of the Product Backlog only","correct":false},{"id":"b","text":"Developers’ self-management and accountability for how work is done and for holding each other accountable","correct":true},{"id":"c","text":"Stakeholder budgeting accountability","correct":false},{"id":"d","text":"No accountability is affected if facilitation is excellent","correct":false}],"correctWhy":"Developers decide how to turn PBIs into Increments and hold each other accountable as professionals. An SM who becomes the final technical authority undermines self-management despite good facilitation skills.","wrongWhy":{"a":"The damaged accountability here is Developers’ how/self-management.","c":"Not the primary Guide accountability at stake.","d":"Excellent facilitation still fails if it seizes ownership."},"guideInsight":"Developer accountabilities; SM coaches self-management.","examTip":"Facilitation must not become decision ownership.","realWorld":"Facilitate divergence/convergence; leave the decision with Developers.","remember":"Facilitate decisions — don’t become the decision.","certifications":["PSM-II"],"competency":"Developing People and Teams","topic":"Anti-Patterns"},{"id":149,"category":"Advanced Scenarios","difficulty":"Expert","type":"scenario","examTrack":"PSM-II","focusArea":"Understanding and Applying the Scrum Framework","question":"Which option best describes a PSM II-ready way to reason when asked 'What should the Scrum Master do next?'","options":[{"id":"a","text":"Pick the most controlling action that finishes work fastest","correct":false},{"id":"b","text":"Identify the transparency/accountability/empiricism gap, then choose teach, coach, facilitate, mentor, or cause impediment removal while preserving self-management","correct":true},{"id":"c","text":"Always escalate to HR first","correct":false},{"id":"d","text":"Always rewrite the Scrum Guide for the local culture first","correct":false}],"correctWhy":"PSM II emphasizes applying Scrum in complex situations: find the real gap (transparency, accountabilities, inspection/adaptation, quality, org impediment), then apply an appropriate SM service without seizing others’ accountabilities. Scrum is immutable.","wrongWhy":{"a":"Control often harms self-management and empiricism.","c":"HR may sometimes help, but it’s not the default Scrum move.","d":"The framework is immutable; complement with practices, don’t rewrite core rules."},"guideInsight":"SM services; empiricism pillars; immutable framework.","examTip":"Use a consistent reasoning workflow on every scenario stem.","realWorld":"Journal missed practice questions by gap type + stance chosen.","remember":"Diagnose the gap → choose a serving stance → preserve empiricism.","certifications":["PSM-II"],"competency":"Understanding and Applying the Scrum Framework","topic":"Advanced Scenarios"},{"id":150,"category":"Advanced Scenarios","difficulty":"Expert","type":"scenario","examTrack":"PSM-II","focusArea":"Evolving the Agile Organization","question":"An enterprise keeps predictive budgeting but wants Scrum Teams. Finance asks for a single annual commitment of all scope. What is the most Professional Scrum Master guidance?","options":[{"id":"a","text":"Pretend complex product work can be guaranteed annually without inspection","correct":false},{"id":"b","text":"Help the organization inspect and adapt funding/governance so empirical product planning can work — make trade-offs transparent rather than false certainty","correct":true},{"id":"c","text":"Abolish all budgets because Scrum forbids money conversations","correct":false},{"id":"d","text":"Have Scrum Masters sign personal delivery bonds for the year","correct":false}],"correctWhy":"SM helps employees and stakeholders enact an empirical approach for complex work and advises Scrum implementations. Hybrid environments need protected empiricism: transparent forecasts and frequent adaptation, not fake certainty or SM hero contracts.","wrongWhy":{"a":"False certainty increases risk.","c":"Budget constraints are real; empiricism informs value trade-offs within them.","d":"Personal bonds recreate project-manager anti-patterns."},"guideInsight":"Empirical approach for complex work; SM organizational coaching.","examTip":"PSM II hybrid/org design questions: protect empiricism pragmatically.","realWorld":"Propose incremental funding against Product Goals and evidence from Increments.","remember":"Evolve governance toward empiricism — don’t fake annual certainty.","certifications":["PSM-II"],"competency":"Evolving the Agile Organization","topic":"Advanced Scenarios"},{"id":1001,"certifications":["PSPO-I"],"category":"Empiricism","competency":"Understanding and Applying the Scrum Framework","topic":"Empiricism","difficulty":"Foundation","type":"single","question":"According to the 2020 Scrum Guide, Scrum is founded on which combination?","options":[{"id":"a","text":"Empiricism and lean thinking","correct":true},{"id":"b","text":"Predictive planning and stage-gate control","correct":false},{"id":"c","text":"Detailed upfront requirements and fixed scope","correct":false},{"id":"d","text":"Resource utilization targets and earned value only","correct":false}],"correctWhy":"The 2020 Scrum Guide states that Scrum is founded on empiricism and lean thinking. Empiricism means knowledge comes from experience and decisions are based on what is observed. Lean thinking reduces waste and focuses on the essentials.","wrongWhy":{"b":"Predictive stage-gate control contradicts empiricism and is not a Scrum foundation.","c":"Fixed upfront requirements conflict with inspecting and adapting based on evidence.","d":"Utilization and earned-value metrics alone are not Scrum's theoretical foundation."},"guideInsight":"Scrum Theory: empiricism and lean thinking","examTip":"Remember the pair empiricism + lean thinking from the Guide's theory section.","realWorld":"A Product Owner who insists on a complete requirements pack before the first Sprint is fighting empiricism instead of learning from Increments.","remember":"Scrum rests on empiricism and lean thinking."},{"id":1002,"certifications":["PSPO-I"],"category":"Scrum Pillars","competency":"Understanding and Applying the Scrum Framework","topic":"Transparency, Inspection, Adaptation","difficulty":"Foundation","type":"single","question":"A colleague asks which three pillars make empiricism work inside Scrum. What should a Product Owner understand?","options":[{"id":"a","text":"Transparency, Inspection, and Adaptation","correct":true},{"id":"b","text":"Commitment, Focus, and Courage","correct":false},{"id":"c","text":"Planning, Tracking, and Reporting","correct":false},{"id":"d","text":"Vision, Roadmap, and Release","correct":false}],"correctWhy":"Empiricism in Scrum rests on Transparency, Inspection, and Adaptation. The Scrum Values are a separate set that supports how people work within the framework.","wrongWhy":{"b":"These are Scrum Values (incomplete), not the three empiricism pillars.","c":"These are traditional project-control activities, not Scrum's pillars.","d":"Vision and release concepts support product work but are not the empiricism pillars."},"guideInsight":"Three pillars of empiricism: Transparency, Inspection, Adaptation","examTip":"Do not confuse pillars (TIA) with values (Commitment, Focus, Openness, Respect, Courage).","realWorld":"If the Product Backlog is opaque, stakeholders cannot usefully inspect progress at Sprint Review.","remember":"Pillars = Transparency, Inspection, Adaptation."},{"id":1003,"certifications":["PSPO-I"],"category":"Scrum Values","competency":"Understanding and Applying the Scrum Framework","topic":"Scrum Values","difficulty":"Foundation","type":"tf","question":"True or False: The five Scrum Values are Commitment, Focus, Openness, Respect, and Courage.","options":[{"id":"a","text":"True","correct":true},{"id":"b","text":"False","correct":false}],"correctWhy":"The 2020 Scrum Guide names Commitment, Focus, Openness, Respect, and Courage as the Scrum Values. They guide how the Scrum Team and stakeholders behave when using the framework.","wrongWhy":{"b":"False is incorrect because those five values are exactly what the Guide lists."},"guideInsight":"Scrum Values: Commitment, Focus, Openness, Respect, Courage","examTip":"Values support pillars; do not swap the two lists.","realWorld":"Openness helps a Product Owner share uncertainty about market feedback instead of pretending the backlog is certain.","remember":"Values: Commitment, Focus, Openness, Respect, Courage."},{"id":1004,"certifications":["PSPO-I"],"category":"Product Owner Accountability","competency":"Managing Products with Agility","topic":"Product Owner","difficulty":"Foundation","type":"single","question":"What is the Product Owner primarily accountable for?","options":[{"id":"a","text":"Maximizing the value of the product resulting from the work of the Scrum Team","correct":true},{"id":"b","text":"Assigning daily tasks to each Developer","correct":false},{"id":"c","text":"Facilitating every Scrum event as the default facilitator","correct":false},{"id":"d","text":"Ensuring Developers follow a fixed technical architecture","correct":false}],"correctWhy":"The Product Owner is accountable for maximizing the value of the product resulting from the Scrum Team's work. Ordering the Product Backlog and ensuring it is transparent are key ways that accountability is exercised.","wrongWhy":{"b":"Developers are self-managing and decide how to turn Product Backlog items into Increments; the PO does not assign tasks.","c":"The Scrum Master is accountable for establishing Scrum; facilitation is not the PO's primary accountability.","d":"Technical approach is owned by the Developers within the Definition of Done and quality needs."},"guideInsight":"Product Owner accountability: maximize product value","examTip":"Anchor PO questions on value maximization and Product Backlog management.","realWorld":"When stakeholders argue for pet features, the PO decides order based on value toward the Product Goal.","remember":"The Product Owner maximizes product value."},{"id":1005,"certifications":["PSPO-I"],"category":"Product Owner","competency":"Managing Products with Agility","topic":"Single Product Owner","difficulty":"Foundation","type":"tf","question":"True or False: The Product Owner is one person, not a committee.","options":[{"id":"a","text":"True","correct":true},{"id":"b","text":"False","correct":false}],"correctWhy":"The Scrum Guide states the Product Owner is one person. They may represent the needs of many stakeholders, but accountability for Product Backlog decisions remains with that one person.","wrongWhy":{"b":"False is incorrect; the Guide explicitly says the Product Owner is one person, not a committee."},"guideInsight":"Product Owner is one person, not a committee","examTip":"Committees can advise; they cannot share PO accountability.","realWorld":"A steering group can give input, but one named PO must make and stand behind backlog ordering decisions.","remember":"One Product Owner, not a committee."},{"id":1006,"certifications":["PSPO-I"],"category":"Product Backlog","competency":"Managing Products with Agility","topic":"Product Backlog Ordering","difficulty":"Foundation","type":"single","question":"Who is accountable for ordering the Product Backlog?","options":[{"id":"a","text":"The Product Owner","correct":true},{"id":"b","text":"The Scrum Master","correct":false},{"id":"c","text":"The Developers alone","correct":false},{"id":"d","text":"The stakeholders by majority vote","correct":false}],"correctWhy":"Ordering the Product Backlog is part of the Product Owner's accountability for effective Product Backlog management. Others may help, but the Product Owner remains accountable.","wrongWhy":{"b":"The Scrum Master coaches and helps with Scrum effectiveness, not backlog ordering accountability.","c":"Developers collaborate on refinement and sizing, but do not own Product Backlog order.","d":"Stakeholders provide needs and feedback; they do not replace the Product Owner's ordering accountability."},"guideInsight":"Product Owner manages and orders the Product Backlog","examTip":"Help and input are fine; accountability stays with the PO.","realWorld":"Sales may lobby for a feature next, but the PO decides whether it advances the Product Goal enough to rise in order.","remember":"The Product Owner orders the Product Backlog."},{"id":1007,"certifications":["PSPO-I"],"category":"Product Goal","competency":"Managing Products with Agility","topic":"Product Goal","difficulty":"Foundation","type":"single","question":"What is the Product Goal in the 2020 Scrum Guide?","options":[{"id":"a","text":"A long-term objective for the Scrum Team that describes a future state of the product","correct":true},{"id":"b","text":"The list of tasks Developers must finish each day","correct":false},{"id":"c","text":"A fixed annual budget target set by finance","correct":false},{"id":"d","text":"The agenda for the Sprint Retrospective","correct":false}],"correctWhy":"The Product Goal is the long-term objective for the Scrum Team. It describes a future state of the product that the team plans to achieve, and the Product Backlog emerges to fulfill it.","wrongWhy":{"b":"Daily tasks are not the Product Goal; Developers self-manage their work.","c":"Budget targets are organizational constraints, not the Product Goal commitment.","d":"The Retrospective focuses on continuous improvement of the team's effectiveness, not the Product Goal definition."},"guideInsight":"Product Goal is the Product Backlog's commitment","examTip":"Link Product Goal (product), Sprint Goal (Sprint), Definition of Done (Increment).","realWorld":"A Product Goal like 'customers can complete checkout without leaving the app' focuses backlog decisions for many Sprints.","remember":"Product Goal = long-term product objective."},{"id":1008,"certifications":["PSPO-I"],"category":"Artifacts and Commitments","competency":"Understanding and Applying the Scrum Framework","topic":"Artifact Commitments","difficulty":"Foundation","type":"single","question":"Which commitment is associated with the Product Backlog?","options":[{"id":"a","text":"The Product Goal","correct":true},{"id":"b","text":"The Sprint Goal","correct":false},{"id":"c","text":"The Definition of Done","correct":false},{"id":"d","text":"The Daily Scrum agenda","correct":false}],"correctWhy":"Each Scrum artifact has a commitment: Product Backlog → Product Goal; Sprint Backlog → Sprint Goal; Increment → Definition of Done. These commitments reinforce empiricism and focus.","wrongWhy":{"b":"The Sprint Goal is the commitment of the Sprint Backlog.","c":"The Definition of Done is the commitment of the Increment.","d":"The Daily Scrum has no artifact commitment; it is an event for Developers."},"guideInsight":"Artifact commitments: Product Goal, Sprint Goal, Definition of Done","examTip":"Memorize the three artifact–commitment pairs.","realWorld":"Without a Product Goal, backlog ordering becomes a popularity contest instead of progress toward a future product state.","remember":"Product Backlog commitment = Product Goal."},{"id":1009,"certifications":["PSPO-I"],"category":"Increment","competency":"Understanding and Applying the Scrum Framework","topic":"Definition of Done","difficulty":"Foundation","type":"single","question":"What does the Definition of Done describe?","options":[{"id":"a","text":"A formal description of the state of the Increment when it meets the quality measures required for the product","correct":true},{"id":"b","text":"A ranking of Product Backlog items by stakeholder vote","correct":false},{"id":"c","text":"A schedule of which stakeholders attend Sprint Planning","correct":false},{"id":"d","text":"A personal performance scorecard for Developers","correct":false}],"correctWhy":"The Definition of Done is a formal description of the state of the Increment when it meets the required quality measures. Work cannot be considered part of an Increment unless it meets the Definition of Done.","wrongWhy":{"b":"Ordering is Product Owner accountability, not the Definition of Done.","c":"Attendance logistics are not the Definition of Done.","d":"DoD is about Increment quality, not individual performance ratings."},"guideInsight":"Definition of Done is the Increment's commitment","examTip":"If it is not Done, it is not part of the Increment—regardless of effort spent.","realWorld":"A feature shown in Review that fails DoD should not be treated as releasable product.","remember":"DoD defines when an Increment is Done."},{"id":1010,"certifications":["PSPO-I"],"category":"Scrum Team","competency":"Developing People and Teams","topic":"Self-Managing Teams","difficulty":"Foundation","type":"single","question":"What does it mean that a Scrum Team is self-managing?","options":[{"id":"a","text":"The team internally decides who does what, when, and how","correct":true},{"id":"b","text":"Managers outside the team assign every task each morning","correct":false},{"id":"c","text":"The Product Owner alone decides technical implementation steps","correct":false},{"id":"d","text":"Stakeholders dictate pairings and work sequences","correct":false}],"correctWhy":"Self-managing means the Scrum Team internally decides who does what, when, and how. The Guide uses self-managing rather than older language such as self-organising.","wrongWhy":{"b":"External daily task assignment contradicts self-management.","c":"The Product Owner manages value and backlog order, not Developers' day-to-day technical work.","d":"Stakeholders influence needs and feedback; they do not run the team's internal work management."},"guideInsight":"Scrum Teams are self-managing","examTip":"Prefer the Guide term self-managing over self-organising.","realWorld":"During the Sprint, Developers pull work and collaborate without waiting for a manager's task list.","remember":"Self-managing: who, when, and how decided inside the team."},{"id":1011,"certifications":["PSPO-I"],"category":"Developers","competency":"Developing People and Teams","topic":"Developers Accountability","difficulty":"Foundation","type":"tf","question":"True or False: Developers are accountable for creating a usable Increment each Sprint that meets the Definition of Done.","options":[{"id":"a","text":"True","correct":true},{"id":"b","text":"False","correct":false}],"correctWhy":"Developers are the people in the Scrum Team committed to creating any aspect of a usable Increment each Sprint. Meeting the Definition of Done is essential for that accountability.","wrongWhy":{"b":"False is incorrect; creating a Done Increment each Sprint is a core Developer accountability."},"guideInsight":"Developers create a usable Increment meeting the Definition of Done","examTip":"Use Developers, not Development Team, for 2020 Guide language.","realWorld":"If unfinished work piles up, the team has not produced a Done Increment regardless of busy activity.","remember":"Developers deliver a Done Increment each Sprint."},{"id":1012,"certifications":["PSPO-I"],"category":"Sprint","competency":"Understanding and Applying the Scrum Framework","topic":"Sprint as Container","difficulty":"Foundation","type":"single","question":"Which statement about the Sprint is correct?","options":[{"id":"a","text":"Sprints are fixed-length events of one month or less that contain the other Scrum events","correct":true},{"id":"b","text":"Sprints continue until stakeholders approve every Product Backlog item","correct":false},{"id":"c","text":"Sprints have no timebox as long as the Product Goal is pursued","correct":false},{"id":"d","text":"Sprints are canceled whenever a stakeholder changes their mind","correct":false}],"correctWhy":"Sprints are containers for all other events and are fixed length of one month or less to create consistency. Shorter Sprints reduce risk and enable more frequent learning.","wrongWhy":{"b":"Sprints are timeboxed; they do not extend until every item is approved.","c":"The Sprint is explicitly timeboxed in the Guide.","d":"Only the Product Owner has authority to cancel a Sprint, and cancellation is rare; stakeholder mood swings alone are not an automatic cancel rule."},"guideInsight":"Sprint: timebox of one month or less containing other events","examTip":"Know Sprint length and that it contains Planning, Daily Scrums, Review, and Retrospective.","realWorld":"A two-week Sprint rhythm gives the PO frequent chances to inspect value and adapt the backlog.","remember":"Sprints are fixed length, one month or less."},{"id":1013,"certifications":["PSPO-I"],"category":"Sprint Goal","competency":"Understanding and Applying the Scrum Framework","topic":"Sprint Goal","difficulty":"Foundation","type":"single","question":"The team is drafting Sprint Planning outcomes and asks what the Sprint Goal actually is. Which description matches the Scrum Guide?","options":[{"id":"a","text":"The single objective for the Sprint that creates coherence and focus","correct":true},{"id":"b","text":"A complete list of all Product Backlog items for the next year","correct":false},{"id":"c","text":"A mandatory velocity target assigned by management","correct":false},{"id":"d","text":"The meeting notes from Sprint Review","correct":false}],"correctWhy":"The Sprint Goal is the single objective for the Sprint. It is the commitment for the Sprint Backlog and provides flexibility for Developers regarding the exact work needed to achieve it.","wrongWhy":{"b":"A year-long item list is not a Sprint Goal.","c":"Velocity is not required by Scrum and is not the Sprint Goal.","d":"Review notes are outputs of an event, not the Sprint Goal."},"guideInsight":"Sprint Goal is the Sprint Backlog's commitment","examTip":"Sprint Goal creates why; selected backlog items and plan create what/how.","realWorld":"With a clear Sprint Goal, the team can negotiate scope details when unexpected work appears without losing purpose.","remember":"Sprint Goal = one coherent Sprint objective."},{"id":1014,"certifications":["PSPO-I"],"category":"Product Backlog Transparency","competency":"Managing Products with Agility","topic":"Product Backlog Transparency","difficulty":"Foundation","type":"tf","question":"True or False: The Product Owner is accountable for ensuring that the Product Backlog is transparent, visible, and understood.","options":[{"id":"a","text":"True","correct":true},{"id":"b","text":"False","correct":false}],"correctWhy":"Effective Product Backlog management includes ensuring the Product Backlog is transparent, visible, and understood. That accountability belongs to the Product Owner, even when others help refine items.","wrongWhy":{"b":"False is incorrect; transparency of the Product Backlog is explicitly part of the Product Owner's accountability."},"guideInsight":"PO ensures Product Backlog transparency, visibility, and understanding","examTip":"Delegation of refinement work does not remove PO accountability.","realWorld":"If stakeholders cannot find the current ordered backlog, inspection at Review becomes guesswork.","remember":"PO keeps the Product Backlog transparent and understood."},{"id":1015,"certifications":["PSPO-I"],"category":"Product Value","competency":"Managing Products with Agility","topic":"Maximizing Value","difficulty":"Intermediate","type":"single","question":"A Product Owner receives conflicting requests from sales, support, and compliance. What best reflects Scrum?","options":[{"id":"a","text":"The Product Owner considers stakeholder needs, then orders the Product Backlog to maximize product value toward the Product Goal","correct":true},{"id":"b","text":"Each stakeholder group owns a portion of the Product Backlog and ranks its own items","correct":false},{"id":"c","text":"The Scrum Master decides the order to keep peace among stakeholders","correct":false},{"id":"d","text":"Developers pick whichever request is easiest so utilization stays high","correct":false}],"correctWhy":"The Product Owner represents stakeholder needs but remains accountable for ordering work to maximize value. Empiricism and the Product Goal guide those trade-offs.","wrongWhy":{"b":"Multiple backlog owners create a committee; the Product Owner is one person.","c":"The Scrum Master does not order the Product Backlog.","d":"Ease and utilization are not the Guide's measure of product value."},"guideInsight":"PO balances stakeholder needs while remaining accountable for value","examTip":"Look for answers where one PO decides order toward value and Product Goal.","realWorld":"Compliance may be urgent for risk, but the PO still makes the ordering call and explains the trade-off.","remember":"One PO orders for value amid conflicting asks."},{"id":1016,"certifications":["PSPO-I"],"category":"Product Backlog Refinement","competency":"Managing Products with Agility","topic":"Refinement","difficulty":"Intermediate","type":"multi","question":"Which statements about Product Backlog refinement are consistent with the 2020 Scrum Guide? Select all that apply.","options":[{"id":"a","text":"Refinement is the act of breaking down and further defining Product Backlog items into smaller, more precise items","correct":true},{"id":"b","text":"Refinement adds details such as description, order, and size as appropriate","correct":true},{"id":"c","text":"Refinement must be a formal Scrum event with a fixed agenda every day","correct":false},{"id":"d","text":"Only the Scrum Master may refine Product Backlog items","correct":false}],"correctWhy":"The Guide describes refinement as ongoing decomposition and clarification of Product Backlog items, including details like description, order, and size. It is not listed as a formal Scrum event.","wrongWhy":{"c":"Refinement is an ongoing activity, not a fifth formal Scrum event.","d":"The Product Owner and Developers collaborate; the Scrum Master is not the sole refiner."},"guideInsight":"Product Backlog refinement is ongoing, not a formal event","examTip":"Know the five events; refinement is continuous work on the backlog.","realWorld":"Teams often spend a portion of Sprint capacity clarifying upcoming items so Sprint Planning is smoother.","remember":"Refinement breaks down and clarifies Product Backlog items."},{"id":1017,"certifications":["PSPO-I"],"category":"Sizing Work","competency":"Managing Products with Agility","topic":"Who Sizes Work","difficulty":"Intermediate","type":"single","question":"Who is accountable for sizing Product Backlog items the Scrum Team may later select?","options":[{"id":"a","text":"The Developers who will perform the work","correct":true},{"id":"b","text":"The Product Owner alone, without Developer input","correct":false},{"id":"c","text":"The Scrum Master using a standard company estimate","correct":false},{"id":"d","text":"External stakeholders who requested the feature","correct":false}],"correctWhy":"The people doing the work size it. Developers size Product Backlog items because they have the skills to understand the effort and complexity of creating a Done Increment.","wrongWhy":{"b":"The Product Owner may help clarify, but does not unilaterally size work the Developers will perform.","c":"The Scrum Master may coach estimation practices but does not own sizes.","d":"Stakeholders express needs; they do not size the Developers' work."},"guideInsight":"Developers who will perform the work size Product Backlog items","examTip":"Clarify vs. size: PO clarifies value/order; Developers size.","realWorld":"A PO asking 'how big is this?' should expect a Developer-led conversation, not a decree from marketing.","remember":"Developers size the work."},{"id":1018,"certifications":["PSPO-I"],"category":"Forecasting","competency":"Managing Products with Agility","topic":"Forecasting and Release Planning","difficulty":"Intermediate","type":"single","question":"How should a Product Owner approach forecasting when stakeholders ask when a set of Product Backlog items might be available?","options":[{"id":"a","text":"Use empiricism: inspect past progress and the current Product Backlog to create a forecast that can be adapted as more is learned","correct":true},{"id":"b","text":"Promise a fixed date based only on initial optimism, then refuse to revisit it","correct":false},{"id":"c","text":"Avoid any forecast because Scrum forbids planning beyond the current Sprint","correct":false},{"id":"d","text":"Require a complete waterfall schedule before any Sprint begins","correct":false}],"correctWhy":"Scrum uses empiricism. Forecasts are possible by inspecting progress and the Product Backlog, but they remain forecasts that adapt as reality is observed—not fixed contracts against unknown work.","wrongWhy":{"b":"Immutable optimistic promises ignore inspection and adaptation.","c":"Scrum does not forbid longer-range forecasting; it forbids pretending forecasts are certainty.","d":"A full waterfall schedule before starting contradicts lean thinking and empiricism."},"guideInsight":"Forecasting uses transparency of Product Backlog and past progress","examTip":"Forecasts are okay; certainty theater is not.","realWorld":"A PO might say 'based on recent throughput, this slice looks like roughly three Sprints,' then update after each Review.","remember":"Forecast empirically; adapt as you learn."},{"id":1019,"certifications":["PSPO-I"],"category":"Stakeholders and Customers","competency":"Managing Products with Agility","topic":"Sprint Review Stakeholders","difficulty":"Intermediate","type":"multi","question":"Which statements about stakeholders and the Sprint Review align with the 2020 Scrum Guide? Select all that apply.","options":[{"id":"a","text":"The Scrum Team presents the results of their work to key stakeholders","correct":true},{"id":"b","text":"Progress toward the Product Goal is discussed","correct":true},{"id":"c","text":"Attendees collaborate on what to do next, and the Product Backlog may be adjusted","correct":true},{"id":"d","text":"The Sprint Review is only a unilateral status presentation with no collaboration","correct":false}],"correctWhy":"Sprint Review is a working session where the Scrum Team and stakeholders inspect the Increment and Product Backlog, discuss Product Goal progress, and adapt next steps. Collaboration is essential.","wrongWhy":{"d":"A one-way status meeting misses the Guide's collaborative, inspect-and-adapt purpose."},"guideInsight":"Sprint Review inspects Increment and adapts Product Backlog with stakeholders","examTip":"Review = inspect outcome + adapt backlog, not a slide-only gate.","realWorld":"Customer feedback in Review often reshapes upcoming Product Backlog order the same day.","remember":"Sprint Review is collaborative inspection and adaptation."},{"id":1020,"certifications":["PSPO-I"],"category":"Release of Increment","competency":"Managing Products with Agility","topic":"Releasing Value","difficulty":"Intermediate","type":"single","question":"Which statement about delivering an Increment is consistent with the 2020 Scrum Guide?","options":[{"id":"a","text":"An Increment may be delivered to stakeholders prior to the end of the Sprint; the Sprint Review is not a gate to releasing value","correct":true},{"id":"b","text":"Value may only be released during the Sprint Review meeting","correct":false},{"id":"c","text":"Only one Increment is allowed per Sprint under any circumstances","correct":false},{"id":"d","text":"Increments cannot be released until the Retrospective is finished","correct":false}],"correctWhy":"The Guide states that an Increment may be delivered to stakeholders before Sprint end and that Sprint Review should never be considered a gate to releasing value. Multiple Increments may be created within a Sprint.","wrongWhy":{"b":"The Sprint Review is not a release gate.","c":"Multiple Increments can be created during a Sprint.","d":"The Retrospective improves the team; it is not a release gate."},"guideInsight":"Increment can be released before Sprint end; Review is not a gate","examTip":"Watch for trap answers that make Review or Retrospective a release gate.","realWorld":"A Done payment fix can go to production mid-Sprint if the PO chooses, without waiting for Friday's Review.","remember":"Done Increments can ship before Sprint end."},{"id":1021,"certifications":["PSPO-I"],"category":"Sprint Planning","competency":"Understanding and Applying the Scrum Framework","topic":"Sprint Planning Topics","difficulty":"Intermediate","type":"multi","question":"According to the 2020 Scrum Guide, Sprint Planning addresses which topics? Select all that apply.","options":[{"id":"a","text":"Why is this Sprint valuable?","correct":true},{"id":"b","text":"What can be Done this Sprint?","correct":true},{"id":"c","text":"How will the chosen work get Done?","correct":true},{"id":"d","text":"Who will receive individual performance ratings this Sprint?","correct":false}],"correctWhy":"Sprint Planning covers three topics: Why is this Sprint valuable?, What can be Done this Sprint?, and How will the chosen work get Done? The result includes a Sprint Goal and Sprint Backlog.","wrongWhy":{"d":"Individual performance ratings are not a Sprint Planning topic in Scrum."},"guideInsight":"Sprint Planning topics: Why, What, How","examTip":"Map Why→Sprint Goal, What→selected items, How→plan by Developers.","realWorld":"A PO proposes why the Sprint matters; Developers collaborate on what is feasible and how to approach it.","remember":"Sprint Planning: Why, What, How."},{"id":1022,"certifications":["PSPO-I"],"category":"Sprint Goal Negotiation","competency":"Managing Products with Agility","topic":"Scope Flexibility","difficulty":"Intermediate","type":"single","question":"During a Sprint, Developers discover the selected work is larger than expected. What should happen regarding the Sprint Goal?","options":[{"id":"a","text":"The Developers negotiate the scope of the Sprint Backlog with the Product Owner without changing the Sprint Goal if possible","correct":true},{"id":"b","text":"The Product Owner unilaterally rewrites the Definition of Done to make unfinished work Done","correct":false},{"id":"c","text":"The Scrum Master cancels the Sprint immediately","correct":false},{"id":"d","text":"Stakeholders add more items so capacity is fully booked","correct":false}],"correctWhy":"If the work turns out differently than expected, Developers collaborate with the Product Owner to negotiate the scope of the Sprint Backlog within the Sprint without affecting the Sprint Goal where possible. Quality via DoD is not sacrificed.","wrongWhy":{"b":"Lowering DoD to declare undone work Done breaks transparency and quality.","c":"Only the Product Owner can cancel a Sprint, and cancellation is uncommon; the SM does not cancel.","d":"Adding more work under pressure worsens focus and does not protect the Sprint Goal."},"guideInsight":"Scope of Sprint Backlog may be negotiated with PO; Sprint Goal provides focus","examTip":"Negotiate scope with PO; do not weaken DoD or invent SM cancel powers.","realWorld":"The team drops a lower-value selected item after talking with the PO so the Sprint Goal remains achievable.","remember":"Negotiate Sprint Backlog scope with the PO; keep focus on the Sprint Goal."},{"id":1023,"certifications":["PSPO-I"],"category":"Daily Scrum","competency":"Developing People and Teams","topic":"Daily Scrum Purpose","difficulty":"Intermediate","type":"tf","question":"True or False: The Daily Scrum is a 15-minute event for the Developers to inspect progress toward the Sprint Goal and adapt the Sprint Backlog as necessary.","options":[{"id":"a","text":"True","correct":true},{"id":"b","text":"False","correct":false}],"correctWhy":"The Daily Scrum is a 15-minute event for Developers. Its purpose is to inspect progress toward the Sprint Goal and adapt the Sprint Backlog as needed, producing an actionable plan for the next day of work.","wrongWhy":{"b":"False is incorrect; that statement matches the Guide's description of the Daily Scrum."},"guideInsight":"Daily Scrum: Developers inspect Sprint Goal progress and adapt Sprint Backlog","examTip":"PO attendance is not required; Daily Scrum is for Developers.","realWorld":"Developers sync on Sprint Goal risks without turning the meeting into a status report for managers.","remember":"Daily Scrum is for Developers' Sprint Goal focus."},{"id":1024,"certifications":["PSPO-I"],"category":"Product Owner Delegation","competency":"Managing Products with Agility","topic":"Delegation and Accountability","difficulty":"Intermediate","type":"single","question":"The Product Owner asks Developers to help write clearer Product Backlog item descriptions. Which statement is correct?","options":[{"id":"a","text":"The Product Owner may delegate Product Backlog management work, yet remains accountable for its outcomes","correct":true},{"id":"b","text":"Once Developers help, the Product Owner is no longer accountable for the Product Backlog","correct":false},{"id":"c","text":"Only the Scrum Master may write Product Backlog items","correct":false},{"id":"d","text":"Delegation is forbidden; the Product Owner must do every backlog edit personally","correct":false}],"correctWhy":"The Guide allows the Product Owner to delegate work related to Product Backlog management. Accountability for the Product Backlog and value maximization still remains with the Product Owner.","wrongWhy":{"b":"Delegation does not transfer accountability away from the Product Owner.","c":"The Scrum Master is not the backlog author by default.","d":"The Guide explicitly allows the Product Owner to have others do Product Backlog management work."},"guideInsight":"PO may delegate backlog work but remains accountable","examTip":"Separate doing the work from owning the accountability.","realWorld":"A PO partners with Developers on refinement workshops while still making ordering decisions.","remember":"Delegate work, keep PO accountability."},{"id":1025,"certifications":["PSPO-I"],"category":"Business Strategy","competency":"Managing Products with Agility","topic":"Product Vision and Strategy","difficulty":"Intermediate","type":"single","question":"How does a Product Goal relate to business strategy in Scrum?","options":[{"id":"a","text":"The Product Goal provides a long-term product objective that focuses the Scrum Team's work so strategy can be pursued empirically Sprint by Sprint","correct":true},{"id":"b","text":"The Product Goal replaces the need for any stakeholder involvement","correct":false},{"id":"c","text":"Business strategy must be fully specified as tasks inside the Sprint Backlog before Sprint 1","correct":false},{"id":"d","text":"The Product Goal is owned by the Scrum Master as a coaching metric","correct":false}],"correctWhy":"The Product Goal is a long-term objective describing a future product state. It connects strategic intent to the Product Backlog so the team can inspect progress and adapt while remaining focused.","wrongWhy":{"b":"Stakeholders remain essential for feedback and needs.","c":"Strategy is not frozen into a complete Sprint Backlog before starting.","d":"The Product Owner is accountable for the Product Goal; it is not an SM metric."},"guideInsight":"Product Goal focuses Scrum Team on a future product state","examTip":"Think strategy → Product Goal → ordered Product Backlog → Sprint Goals.","realWorld":"A strategy to enter a new market becomes a Product Goal that steers which backlog items rise to the top.","remember":"Product Goal turns strategy into a shared product objective."},{"id":1026,"certifications":["PSPO-I"],"category":"Increment Quality","competency":"Understanding and Applying the Scrum Framework","topic":"Done Increment","difficulty":"Intermediate","type":"multi","question":"Which statements about the Increment are correct per the 2020 Scrum Guide? Select all that apply.","options":[{"id":"a","text":"An Increment is a concrete stepping stone toward the Product Goal","correct":true},{"id":"b","text":"Each Increment is additive to all prior Increments and thoroughly verified","correct":true},{"id":"c","text":"Work cannot be considered part of an Increment unless it meets the Definition of Done","correct":true},{"id":"d","text":"An Increment is only conceptual documentation until after release approval meetings","correct":false}],"correctWhy":"The Increment is a concrete, Done stepping stone toward the Product Goal. It builds on prior Increments, is verified, and only includes work meeting the Definition of Done—supporting transparency for inspection.","wrongWhy":{"d":"An Increment is usable product value meeting DoD, not merely conceptual paperwork waiting for approval theater."},"guideInsight":"Increment: Done, additive stepping stone toward Product Goal","examTip":"No DoD → not in the Increment, even if work looked finished.","realWorld":"A half-tested screen is not an Increment item the PO should treat as releasable.","remember":"Only Done work is part of the Increment."},{"id":1027,"certifications":["PSPO-I"],"category":"Scrum Master and Product Owner","competency":"Developing People and Teams","topic":"Accountabilities Collaboration","difficulty":"Intermediate","type":"single","question":"A Product Owner struggles to keep the Product Backlog ordered and understood. How can the Scrum Master help without taking over Product Ownership?","options":[{"id":"a","text":"Help the Product Owner find techniques for effective Product Backlog management and cause stakeholders to respect ordering decisions","correct":true},{"id":"b","text":"Take ownership of backlog ordering decisions permanently","correct":false},{"id":"c","text":"Cancel the Sprint whenever stakeholders complain","correct":false},{"id":"d","text":"Assign Developers' tasks so the Product Owner can focus on stakeholders","correct":false}],"correctWhy":"The Scrum Master serves the Product Owner by helping with Product Goal definition techniques, effective Product Backlog management, and fostering an environment where stakeholders understand empiricism and respect PO decisions—without becoming the Product Owner.","wrongWhy":{"b":"Backlog ordering accountability stays with the Product Owner.","c":"Sprint cancellation is a rare Product Owner authority, not an SM response to complaints.","d":"Developers are self-managing; the SM does not assign their tasks."},"guideInsight":"Scrum Master serves the Product Owner without assuming PO accountability","examTip":"SM coaches and enables; PO still owns value and backlog order.","realWorld":"An SM might coach stakeholder workshops so the PO's ordering becomes clearer and better respected.","remember":"SM enables the PO; does not become the PO."},{"id":1028,"certifications":["PSPO-I"],"category":"Sprint Review","competency":"Managing Products with Agility","topic":"Adapting the Product Backlog","difficulty":"Intermediate","type":"tf","question":"True or False: During the Sprint Review, the Product Backlog may be adjusted to meet new opportunities.","options":[{"id":"a","text":"True","correct":true},{"id":"b","text":"False","correct":false}],"correctWhy":"The Guide describes Sprint Review as inspecting the outcomes of the Sprint and determining future adaptations. The Product Backlog may be adjusted to meet new opportunities based on that collaboration.","wrongWhy":{"b":"False is incorrect; adjusting the Product Backlog based on Review insights is expected."},"guideInsight":"Sprint Review may result in Product Backlog adjustments","examTip":"Review outcomes feed adaptation of what to do next.","realWorld":"A surprising customer reaction can move a previously lower item higher after Review.","remember":"Sprint Review can change upcoming backlog order."},{"id":1029,"certifications":["PSPO-I"],"category":"Product Backlog Emergence","competency":"Managing Products with Agility","topic":"Emergent Product Backlog","difficulty":"Intermediate","type":"single","question":"Which description of the Product Backlog matches the 2020 Scrum Guide?","options":[{"id":"a","text":"An emergent, ordered list of what is needed to improve the product; it is the single source of work undertaken by the Scrum Team","correct":true},{"id":"b","text":"A frozen contract of scope signed before Sprint 1 that cannot change","correct":false},{"id":"c","text":"A personal task list maintained separately by each Developer","correct":false},{"id":"d","text":"A status report produced only after each release","correct":false}],"correctWhy":"The Product Backlog is emergent and ordered. It is the single source of work for the Scrum Team and evolves as the product and environment are better understood.","wrongWhy":{"b":"A frozen scope contract contradicts emergence and empiricism.","c":"Work comes from the shared Product Backlog, not private Developer lists as the source of product work.","d":"The Product Backlog is a living plan for improvement, not a post-release report."},"guideInsight":"Product Backlog: emergent, ordered, single source of work","examTip":"Emergent means it changes as learning happens.","realWorld":"After each Increment, new items appear and old ones drop as the PO learns what customers actually use.","remember":"The Product Backlog is emergent and ordered."},{"id":1030,"certifications":["PSPO-I"],"category":"Scrum Events Timeboxes","competency":"Understanding and Applying the Scrum Framework","topic":"Event Timeboxes","difficulty":"Intermediate","type":"multi","question":"Which timeboxes are correctly stated for a one-month Sprint? Select all that apply.","options":[{"id":"a","text":"Sprint Planning is timeboxed to a maximum of eight hours","correct":true},{"id":"b","text":"Sprint Review is timeboxed to a maximum of four hours","correct":true},{"id":"c","text":"Sprint Retrospective is timeboxed to a maximum of three hours","correct":true},{"id":"d","text":"Daily Scrum is timeboxed to a maximum of one hour","correct":false}],"correctWhy":"For a one-month Sprint, Planning is max eight hours, Review max four hours, and Retrospective max three hours. Daily Scrum is always a 15-minute event for Developers.","wrongWhy":{"d":"Daily Scrum is timeboxed to 15 minutes, not one hour."},"guideInsight":"Event maximum timeboxes scale with Sprint length; Daily Scrum is 15 minutes","examTip":"Memorize 8 / 15 min / 4 / 3 for a one-month Sprint.","realWorld":"Shorter Sprints usually mean proportionally shorter Planning, Review, and Retrospective.","remember":"Daily Scrum is 15 minutes; other events have maximums."},{"id":1031,"certifications":["PSPO-I"],"category":"Self-Managing Collaboration","competency":"Developing People and Teams","topic":"Cross-Functional Team","difficulty":"Intermediate","type":"single","question":"Why does the Scrum Guide describe the Scrum Team as cross-functional?","options":[{"id":"a","text":"Members have all the skills necessary to create value each Sprint","correct":true},{"id":"b","text":"Each member must hold every specialized job title in the company","correct":false},{"id":"c","text":"The team must include managers who approve every design decision","correct":false},{"id":"d","text":"Cross-functionality means the Product Owner writes all test code","correct":false}],"correctWhy":"Cross-functional means the Scrum Team has all skills needed to create value each Sprint. That supports self-management and reduces hand-offs that delay learning.","wrongWhy":{"b":"Having necessary skills as a team does not require every person to hold every title.","c":"External approval managers are not required for cross-functionality.","d":"The Product Owner is accountable for value and backlog, not for performing all testing."},"guideInsight":"Scrum Teams are cross-functional and self-managing","examTip":"Cross-functional = skills on the team to deliver Done Increments.","realWorld":"A team that must wait weeks for an outside group to finish every Increment is missing cross-functionality.","remember":"Cross-functional teams have the skills to create value each Sprint."},{"id":1032,"certifications":["PSPO-I"],"category":"Transparency of Artifacts","competency":"Understanding and Applying the Scrum Framework","topic":"Artifact Transparency","difficulty":"Intermediate","type":"single","question":"Why is artifact transparency critical for a Product Owner?","options":[{"id":"a","text":"Without transparency, inspection is misleading and adaptation decisions about value will be flawed","correct":true},{"id":"b","text":"Transparency is optional if the Product Owner trusts the team","correct":false},{"id":"c","text":"Transparency exists only to satisfy auditors and has no product purpose","correct":false},{"id":"d","text":"Transparency replaces the need for a Definition of Done","correct":false}],"correctWhy":"Empiricism requires transparent artifacts so inspection is based on a shared understanding of reality. If the Product Backlog or Increment state is opaque, the Product Owner cannot reliably adapt for value.","wrongWhy":{"b":"Trust does not remove the need for transparent artifacts.","c":"Transparency serves empiricism and value decisions, not only audit compliance.","d":"Definition of Done strengthens Increment transparency; it is not replaced by a vague call for transparency."},"guideInsight":"Transparency enables meaningful inspection and adaptation","examTip":"Connect PO value decisions to transparent Product Backlog and Done Increments.","realWorld":"If 'almost Done' items are treated as Done, forecasts and release choices will be wrong.","remember":"Opaque artifacts make value decisions unreliable."},{"id":1033,"certifications":["PSPO-I"],"category":"Product Goal Focus","competency":"Managing Products with Agility","topic":"One Product Goal","difficulty":"Advanced","type":"scenario","question":"A Scrum Team is asked to pursue two different Product Goals at the same time for one product because two executives disagree. What should the Product Owner do?","options":[{"id":"a","text":"Ensure there is one Product Goal for the product at a time so the Product Backlog and team focus remain coherent","correct":true},{"id":"b","text":"Create two Product Backlogs and two Product Goals and let Developers choose day by day","correct":false},{"id":"c","text":"Ask the Scrum Master to vote as a tie-breaker Product Owner","correct":false},{"id":"d","text":"Freeze the Product Backlog until both executives approve every item","correct":false}],"correctWhy":"The Guide states that the Product Goal is the long-term objective and that the Scrum Team must fulfill (or abandon) one objective before taking on the next. One Product Owner keeps focus with a single Product Goal guiding one Product Backlog.","wrongWhy":{"b":"Multiple competing goals and backlogs for one product destroy focus and transparency.","c":"The Scrum Master is not a second Product Owner.","d":"Waiting for dual executive sign-off on every item recreates committee ownership and stalls empiricism."},"guideInsight":"One Product Goal at a time; Product Backlog emerges to fulfill it","examTip":"Advanced scenarios often test focus: one PO, one Product Goal, one Product Backlog.","realWorld":"The PO facilitates a decision on the primary product objective, then orders work accordingly while parking the alternate goal.","remember":"Fulfill or abandon one Product Goal before taking the next."},{"id":1034,"certifications":["PSPO-I"],"category":"Stakeholder Pressure","competency":"Managing Products with Agility","topic":"Protecting Empiricism","difficulty":"Advanced","type":"scenario","question":"Mid-Sprint, a senior stakeholder demands the team stop the Sprint Goal and immediately start a new initiative that was never refined. What is the most appropriate Product Owner response?","options":[{"id":"a","text":"Engage the stakeholder, explain current Sprint Goal commitments, and if the initiative is more valuable, either negotiate within Scrum or consider canceling the Sprint—an authority only the Product Owner has","correct":true},{"id":"b","text":"Instruct the Scrum Master to cancel the Sprint on the stakeholder's behalf","correct":false},{"id":"c","text":"Tell Developers to treat the Sprint Backlog as fixed forever and ignore the stakeholder entirely","correct":false},{"id":"d","text":"Add the unrefined initiative to the Sprint Backlog without discussion and extend the Sprint until it is finished","correct":false}],"correctWhy":"The Product Owner maximizes value and is the only person with authority to cancel a Sprint. Mid-Sprint disruption is handled through collaboration and, rarely, cancellation—not by SM cancel powers, pretending the Sprint Backlog cannot change in discussion with the PO, or extending the Sprint timebox.","wrongWhy":{"b":"The Scrum Master does not cancel Sprints.","c":"The Sprint Backlog can be adapted; Developers may renegotiate scope with the PO. Ignoring stakeholders forever is not openness.","d":"Dumping unrefined work in and extending the Sprint violates focus, refinement sense, and the Sprint timebox."},"guideInsight":"Only the Product Owner may cancel a Sprint; Sprint is a timebox","examTip":"Separate rare PO cancellation from routine scope negotiation with Developers.","realWorld":"Often the PO parks the new idea on the Product Backlog for refinement rather than blowing up the current Sprint Goal.","remember":"PO handles value trade-offs; only PO may cancel a Sprint."},{"id":1035,"certifications":["PSPO-I"],"category":"Definition of Done Conflict","competency":"Understanding and Applying the Scrum Framework","topic":"Multiple Teams DoD","difficulty":"Advanced","type":"multi","question":"Multiple Scrum Teams work on one product. Which statements about Done are correct? Select all that apply.","options":[{"id":"a","text":"If a Definition of Done exists from the organization, all Scrum Teams must follow it as a minimum","correct":true},{"id":"b","text":"If there is no organizational standard, the Scrum Teams must define a Definition of Done appropriate for the product","correct":true},{"id":"c","text":"The integrated work of all teams must be Done to form a single usable Increment","correct":true},{"id":"d","text":"Each team may invent incompatible Done criteria so integration quality is optional","correct":false}],"correctWhy":"Organizational DoD is a minimum when present; otherwise teams define one appropriate for the product. With multiple teams on one product, they must mutually define and comply with the same Definition of Done so their integrated output is a Done Increment.","wrongWhy":{"d":"Incompatible Done criteria undermine transparency and a usable integrated Increment."},"guideInsight":"Shared DoD across teams on one product; organizational DoD is a minimum","examTip":"Multi-team product questions almost always require a shared Done standard.","realWorld":"Teams agree on shared quality bars for the product Increment rather than shipping team-local 'done' that does not integrate.","remember":"One product needs a shared Definition of Done."},{"id":1036,"certifications":["PSPO-I"],"category":"Forecasting Under Uncertainty","competency":"Managing Products with Agility","topic":"Release Planning Empiricism","difficulty":"Advanced","type":"scenario","question":"Leadership wants a 12-month feature roadmap with guaranteed dates. The Product Backlog is still highly uncertain. What should the Product Owner emphasize?","options":[{"id":"a","text":"Provide forecasts based on transparent Product Backlog ordering and observed progress, while making clear that plans will adapt as Increments produce evidence","correct":true},{"id":"b","text":"Guarantee every date now because Scrum requires predictive certainty for releases","correct":false},{"id":"c","text":"Refuse any discussion of future work beyond tomorrow's Daily Scrum","correct":false},{"id":"d","text":"Replace the Product Goal with a Gantt chart owned by stakeholders","correct":false}],"correctWhy":"Scrum enables forecasting through transparency and empiricism, not certainty contracts for unknown work. The Product Owner can share a forecast and Product Goal direction while adapting as Increments reveal reality.","wrongWhy":{"b":"Scrum does not require predictive certainty; that contradicts empiricism.","c":"Longer-range Product Backlog planning and forecasting are valid; Daily Scrum is not the planning horizon limit.","d":"Stakeholders do not replace the Product Goal commitment with a committee Gantt."},"guideInsight":"Plans are forecasts adapted via inspection of Increments","examTip":"Reject both 'no forecasting allowed' and 'dates are guarantees.'","realWorld":"A PO shows a near-term forecast for the next few Sprints and keeps farther items coarse until refined.","remember":"Forecast with evidence; do not fake certainty."},{"id":1037,"certifications":["PSPO-I"],"category":"Self-Management Boundaries","competency":"Developing People and Teams","topic":"PO and Developers Boundaries","difficulty":"Advanced","type":"multi","question":"Which practices preserve self-management while still allowing the Product Owner to maximize value? Select all that apply.","options":[{"id":"a","text":"The Product Owner orders Product Backlog items based on value","correct":true},{"id":"b","text":"Developers decide how to accomplish the work for a Done Increment","correct":true},{"id":"c","text":"Developers and the Product Owner collaborate to clarify items and negotiate Sprint scope when needed","correct":true},{"id":"d","text":"The Product Owner assigns each Developer a daily task list during the Daily Scrum","correct":false}],"correctWhy":"Value ordering is PO accountability; how the work is done is for self-managing Developers. Collaboration on clarity and scope negotiation is expected. Assigning daily tasks in the Daily Scrum violates Developer ownership of that event and self-management.","wrongWhy":{"d":"The Daily Scrum is for Developers; the PO does not use it to assign tasks."},"guideInsight":"PO owns value/order; Developers own how; collaborate on clarity and scope","examTip":"Correct answers usually keep accountabilities distinct but collaborative.","realWorld":"A healthy PO says what outcome matters; Developers swarm on the approach without waiting for micromanagement.","remember":"Order and value for PO; how-to for Developers."},{"id":1038,"certifications":["PSPO-I"],"category":"Release Decision","competency":"Managing Products with Agility","topic":"Value Release Timing","difficulty":"Advanced","type":"scenario","question":"Three days into a two-week Sprint, Developers produce a Done Increment that would immediately reduce customer support load. A manager says nothing can go live until Sprint Review. What should the Product Owner conclude?","options":[{"id":"a","text":"The Increment may be released now if releasing maximizes value; Sprint Review is not a gate to releasing value","correct":true},{"id":"b","text":"Scrum forbids any release except during Sprint Review","correct":false},{"id":"c","text":"The team must wait because only one Increment is permitted per Sprint","correct":false},{"id":"d","text":"The Scrum Master must approve production releases as the release manager","correct":false}],"correctWhy":"Done Increments may be delivered to stakeholders prior to Sprint end. Sprint Review must not be treated as a release gate. Multiple Increments may also be created in a Sprint. Release decisions are about value, typically with the Product Owner's product accountability—not an SM release-manager mandate in the Guide.","wrongWhy":{"b":"The Guide explicitly rejects treating Review as a release gate.","c":"Multiple Increments may be created during a Sprint.","d":"The Scrum Master is not defined as the production release approver."},"guideInsight":"Release value when Done; Review is not a gate","examTip":"Advanced release questions often cite mid-Sprint delivery of a Done Increment.","realWorld":"Support-cost-saving fixes often ship as soon as they are Done rather than waiting for a demo ceremony.","remember":"Ship Done value when it makes sense—not only at Review."},{"id":1039,"certifications":["PSPO-I"],"category":"Empiricism vs Predictive Control","competency":"Understanding and Applying the Scrum Framework","topic":"Adaptation Decisions","difficulty":"Advanced","type":"single","question":"A Product Owner keeps a detailed 18-month task plan and discourages changing Product Backlog items after Sprint Planning even when the Increment shows customers do not use a feature. Which Scrum foundation is most violated?","options":[{"id":"a","text":"Empiricism—decisions are not being adapted based on what is observed","correct":true},{"id":"b","text":"The requirement that user stories and story points be used","correct":false},{"id":"c","text":"The rule that the Product Owner must attend every Daily Scrum","correct":false},{"id":"d","text":"The mandate that velocity must increase every Sprint","correct":false}],"correctWhy":"Empiricism requires transparency, inspection, and adaptation based on observation. Ignoring Increment evidence to protect a long predictive plan violates Scrum's foundation. Scrum does not require user stories, story points, PO attendance at Daily Scrum, or rising velocity.","wrongWhy":{"b":"User stories and story points are not mandated by the Scrum Guide.","c":"The Product Owner is not required at every Daily Scrum.","d":"Velocity is not a Scrum mandate."},"guideInsight":"Empiricism: adapt based on observation of reality","examTip":"When evidence is ignored, the answer is usually empiricism/adaptation.","realWorld":"If analytics show zero usage, a PO should reconsider ordering rather than mechanically finishing a year-old plan.","remember":"Observe Increment evidence, then adapt the backlog."},{"id":1040,"certifications":["PSPO-I"],"category":"Accountability Clarity","competency":"Developing People and Teams","topic":"Scrum Team Accountabilities","difficulty":"Advanced","type":"multi","question":"Which statements correctly reflect 2020 Scrum Guide accountabilities? Select all that apply.","options":[{"id":"a","text":"The Product Owner is accountable for maximizing product value and for effective Product Backlog management","correct":true},{"id":"b","text":"Developers are accountable for creating a plan for the Sprint, adapting their plan each day toward the Sprint Goal, and instilling quality by adhering to a Definition of Done","correct":true},{"id":"c","text":"The Scrum Master is accountable for establishing Scrum as defined in the Scrum Guide and for the Scrum Team's effectiveness","correct":true},{"id":"d","text":"Stakeholders are accountable for assigning tasks to Developers and canceling Sprints","correct":false}],"correctWhy":"The Guide defines three accountabilities within the Scrum Team: Product Owner, Scrum Master, and Developers, with the duties listed above. Stakeholders provide needs and collaborate in events like Sprint Review but do not take Developer task assignment or Sprint cancellation authority.","wrongWhy":{"d":"Stakeholders do not assign Developer tasks or cancel Sprints; cancellation is a Product Owner authority."},"guideInsight":"Three Scrum Team accountabilities: PO, SM, Developers","examTip":"Use accountabilities language; avoid outdated 'roles' traps when the Guide wording is tested.","realWorld":"Clear accountabilities stop committees from micromanaging Developers while still giving stakeholders a voice through the PO and Review.","remember":"PO value, Developers Done plan, SM Scrum effectiveness."},{"id":1041,"certifications":["PSPO-I"],"category":"Product Goal","competency":"Managing Products with Agility","topic":"Product Goal","difficulty":"Foundation","type":"single","question":"A Product Owner faces competing feature requests that pull the product in different directions. Which action best uses the Product Goal to guide decisions?","options":[{"id":"a","text":"Treat the Product Goal as optional inspiration and prioritize whichever stakeholder is loudest this week.","correct":false},{"id":"b","text":"Order Product Backlog items so the team advances toward the current Product Goal, deferring work that does not move that goal.","correct":true},{"id":"c","text":"Ask Developers to vote on which Product Goal they prefer before ordering anything.","correct":false},{"id":"d","text":"Replace the Product Goal every Sprint so it matches whatever was delivered.","correct":false}],"correctWhy":"The Product Goal is the Product Backlog’s commitment and a long-term target for the Scrum Team. Ordering work that advances that goal is how the Product Owner steers value.","wrongWhy":{"a":"Stakeholder volume is not a substitute for a coherent Product Goal.","c":"Developers do not decide the Product Goal; the Product Owner remains accountable for maximizing product value.","d":"The Product Goal may evolve, but it should not simply be rewritten to match whatever shipped."},"guideInsight":"The Product Goal describes a future state of the product that can serve as a target for the Scrum Team to plan against.","examTip":"When answers mention the Product Goal, ask whether backlog ordering clearly advances that commitment.","realWorld":"Rejecting a popular request because it does not move the Product Goal is often the Product Owner’s highest-leverage decision.","remember":"Product Goal = Product Backlog commitment; order for progress toward it."},{"id":1042,"certifications":["PSPO-I"],"category":"Product Backlog","competency":"Managing Products with Agility","topic":"Backlog ordering","difficulty":"Foundation","type":"single","question":"Two Product Backlog items have similar effort, but one unlocks a major customer segment while the other mainly delights an internal influencer. What should the Product Owner prioritize?","options":[{"id":"a","text":"The influencer’s request, because internal satisfaction always comes first.","correct":false},{"id":"b","text":"Whichever item Developers say is more interesting to build.","correct":false},{"id":"c","text":"The item expected to deliver greater product value toward the Product Goal and customers.","correct":true},{"id":"d","text":"Neither; leave ordering undecided until Sprint Planning and let urgency decide.","correct":false}],"correctWhy":"The Product Owner is accountable for maximizing the value of the product resulting from the work of the Scrum Team, which includes ordering the Product Backlog.","wrongWhy":{"a":"Internal influencers are stakeholders, but value to the product and customers comes first.","b":"Developers own how work is done, not how the Product Backlog is ordered for value.","d":"Ordering is ongoing Product Owner work; waiting for urgency is poor backlog management."},"guideInsight":"Product Backlog ordering optimizes value; the Product Owner remains accountable even when others help.","examTip":"Prefer answers that maximize product value over politics or developer preference alone.","realWorld":"Say no (or not now) to low-value influence when a clearer customer outcome is available.","remember":"Order by expected value relative to the Product Goal."},{"id":1043,"certifications":["PSPO-I"],"category":"Sprint","competency":"Understanding and Applying the Scrum Framework","topic":"Sprint cancellation","difficulty":"Foundation","type":"tf","question":"True or False: Only the Product Owner has the authority to cancel a Sprint, and cancellation makes sense when the Sprint Goal becomes obsolete.","options":[{"id":"a","text":"True","correct":true},{"id":"b","text":"False","correct":false}],"correctWhy":"A Sprint can be cancelled if the Sprint Goal becomes obsolete. Only the Product Owner has the authority to cancel the Sprint.","wrongWhy":{"b":"The Scrum Guide assigns Sprint cancellation authority solely to the Product Owner when the Sprint Goal is obsolete."},"guideInsight":"Sprint cancellation is rare; power rests with the Product Owner, typically when the Sprint Goal no longer makes sense.","examTip":"Pair “only PO cancels” with “Sprint Goal obsolete”—both ideas often appear together.","realWorld":"A sudden regulatory ban on the planned capability can obsolete a Sprint Goal and justify cancellation.","remember":"Only PO cancels; reason = Sprint Goal obsolete."},{"id":1044,"certifications":["PSPO-I"],"category":"Definition of Done","competency":"Understanding and Applying the Scrum Framework","topic":"Quality and Done","difficulty":"Foundation","type":"single","question":"Stakeholders urge the Product Owner to ship more this Sprint by relaxing the Definition of Done. What should the Product Owner do?","options":[{"id":"a","text":"Agree temporarily; quality can be recovered next Sprint.","correct":false},{"id":"b","text":"Refuse to lower Done; work that does not meet Done is not part of the Increment, and quality does not decrease.","correct":true},{"id":"c","text":"Let Developers skip Done for items that are “almost finished.”","correct":false},{"id":"d","text":"Replace Done with stakeholder acceptance as the only bar.","correct":false}],"correctWhy":"The Definition of Done creates transparency. If a Product Backlog item does not meet Done, it cannot be released or even presented at the Sprint Review. Quality does not decrease when work is “done.”","wrongWhy":{"a":"Deferring quality creates technical debt and violates the expectation that Done means Done.","c":"Almost finished work returns to the Product Backlog for future consideration; it is not an Increment.","d":"Stakeholder opinions do not replace the shared Definition of Done."},"guideInsight":"Done work meets the Definition of Done; incomplete items are not part of the Increment.","examTip":"Any option that trades quality for volume by weakening Done is almost always wrong.","realWorld":"Protect Done even under release pressure; unfinished work stays on the backlog, not in production.","remember":"Do not decrease quality; undone work is not Increment."},{"id":1045,"certifications":["PSPO-I"],"category":"Product Owner accountability","competency":"Managing Products with Agility","topic":"Product Owner accountabilities","difficulty":"Foundation","type":"multi","question":"Which responsibilities belong to the Product Owner accountability? (Select all that apply.)","options":[{"id":"a","text":"Developing and explicitly communicating the Product Goal","correct":true},{"id":"b"
