fficulty":"Intermediate","type":"single","question":"What composes the Sprint Backlog?","options":[{"id":"a","text":"The Sprint Goal (why), the set of Product Backlog items selected for the Sprint (what), plus an actionable plan for delivering the Increment (how)","correct":true},{"id":"b","text":"Only the Product Goal","correct":false},{"id":"c","text":"All future Product Backlog items for the year","correct":false},{"id":"d","text":"A change request log owned by the PMO","correct":false}],"correctWhy":"The Sprint Backlog is composed of the Sprint Goal (why), the set of Product Backlog items selected for the Sprint (what), as well as an actionable plan for delivering the Increment (how).","wrongWhy":{"b":"Product Goal is the Product Backlog's commitment.","c":"That is not the Sprint Backlog; PB is emergent for the product.","d":"Not a Scrum artifact definition."},"guideInsight":"Sprint Backlog = Sprint Goal + selected PBIs + plan","examTip":"Why/What/How maps directly to Sprint Backlog composition.","realWorld":"Keep the Sprint Backlog highly visible and real-time for Developers.","remember":"Sprint Backlog = why + what + how.","examTrack":"PSM-I","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Sprint Backlog"},{"id":38,"category":"Sprint Backlog","difficulty":"Intermediate","type":"tf","question":"True or False: The Sprint Backlog is a plan by and for the Developers and is updated throughout the Sprint as more is learned.","options":[{"id":"a","text":"True","correct":true},{"id":"b","text":"False","correct":false}],"correctWhy":"The Sprint Backlog is a plan by and for the Developers. It is a highly visible, real-time picture of the work that the Developers plan to accomplish during the Sprint in order to achieve the Sprint Goal. Consequently, the Sprint Backlog is updated throughout the Sprint as more is learned.","wrongWhy":{"b":"False is incorrect — ownership and continuous update are explicit in the Guide."},"guideInsight":"Sprint Backlog: by and for Developers; highly visible; updated throughout Sprint","examTip":"SM/PO do not 'own' the Sprint Backlog plan.","realWorld":"If only the Jira board admin updates tasks, Developers aren't owning their plan.","remember":"Sprint Backlog = Developers' living plan.","examTrack":"PSM-I","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Sprint Backlog"},{"id":39,"category":"Increment","difficulty":"Intermediate","type":"multi","question":"Select all that apply. Which statements about the Increment are true?","options":[{"id":"a","text":"Multiple Increments may be created within a Sprint","correct":true},{"id":"b","text":"The sum of the Increments is presented at the Sprint Review thus supporting empiricism","correct":true},{"id":"c","text":"An Increment may be delivered to stakeholders prior to the end of the Sprint","correct":true},{"id":"d","text":"The Sprint Review should be considered a gate to releasing value","correct":false}],"correctWhy":"Multiple Increments may be created in a Sprint. Their sum is presented at the Sprint Review supporting empiricism. An Increment may be delivered to stakeholders prior to the end of the Sprint. The Sprint Review should never be considered a gate to releasing value.","wrongWhy":{"d":"This statement is false per the Guide — Review is not a release gate."},"guideInsight":"Increment delivery flexibility; Review is not a release gate","examTip":"Any option making Review a release gate is wrong.","realWorld":"Release when Done and valuable — even mid-Sprint if that serves users.","remember":"Ship Done Increments anytime; Review ≠ gate.","examTrack":"PSM-I","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Increment"},{"id":40,"category":"Definition of Done","difficulty":"Intermediate","type":"scenario","question":"A Product Backlog item is nearly finished, but automated tests required by the Definition of Done are incomplete at Sprint end. What happens?","options":[{"id":"a","text":"It cannot be released or even presented at the Sprint Review; it returns to the Product Backlog for future consideration","correct":true},{"id":"b","text":"It may be presented at Sprint Review if stakeholders agree to waive the DoD","correct":false},{"id":"c","text":"It automatically carries into the next Sprint Backlog unchanged","correct":false},{"id":"d","text":"The Scrum Master marks it Done to protect team morale","correct":false}],"correctWhy":"If a Product Backlog item does not meet the Definition of Done, it cannot be released or even presented at the Sprint Review. Instead, it returns to the Product Backlog for future consideration.","wrongWhy":{"b":"DoD cannot be waived for Review presentation.","c":"It returns to the Product Backlog; selection for a future Sprint is a planning decision, not automatic carry-over as Done work.","d":"SM cannot override DoD to fake completion."},"guideInsight":"Work not meeting DoD returns to Product Backlog; cannot release or present at Review","examTip":"Incomplete ≠ Done Increment. Never waive DoD for the Review.","realWorld":"Split work or renegotiate scope earlier rather than bringing undoned work to Review.","remember":"Not Done → back to Product Backlog; no Review presentation.","examTrack":"PSM-I","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Definition of Done"},{"id":41,"category":"Product Goal","difficulty":"Intermediate","type":"single","question":"What must be true before a Scrum Team pursues the next Product Goal?","options":[{"id":"a","text":"The previous Product Goal must be fulfilled or abandoned","correct":true},{"id":"b","text":"All stakeholders must sign a new charter","correct":false},{"id":"c","text":"Velocity must exceed a fixed threshold","correct":false},{"id":"d","text":"The Scrum Master must rewrite the Definition of Done","correct":false}],"correctWhy":"The Product Goal is the long-term objective for the Scrum Team. They must fulfill (or abandon) one objective before taking on the next.","wrongWhy":{"b":"Not a Scrum Guide requirement.","c":"Velocity is not a Guide concept/requirement.","d":"DoD changes aren't the prerequisite for a new Product Goal."},"guideInsight":"One Product Goal at a time: fulfill or abandon before the next","examTip":"Product Goals aren't piled in parallel as competing long-term objectives.","realWorld":"Abandoning a Product Goal is valid when the product strategy changes — make it explicit.","remember":"Fulfill or abandon Product Goal before the next.","examTrack":"PSM-I","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Product Goal"},{"id":42,"category":"Sprint Goal","difficulty":"Intermediate","type":"single","question":"Who creates the Sprint Goal, and when?","options":[{"id":"a","text":"The Scrum Team creates it during Sprint Planning; it must be finalized prior to the end of Sprint Planning","correct":true},{"id":"b","text":"The Product Owner alone creates it after Planning","correct":false},{"id":"c","text":"Stakeholders vote on it in the Sprint Review","correct":false},{"id":"d","text":"The Scrum Master assigns it on day one","correct":false}],"correctWhy":"Topic One of Sprint Planning: the Product Owner proposes how the product could increase its value and the whole Scrum Team then collaborates to define a Sprint Goal that communicates why the Sprint is valuable. The Sprint Goal must be finalized prior to the end of Sprint Planning.","wrongWhy":{"b":"The whole Scrum Team collaborates; it is finalized in Planning, not after by PO alone.","c":"Sprint Goal is set in Planning, not voted in Review.","d":"SM does not assign the Sprint Goal."},"guideInsight":"Sprint Goal created in Sprint Planning; finalized before Planning ends","examTip":"Whole team collaborates on Sprint Goal; finalize before Planning ends.","realWorld":"Start Planning with value ('why'), not with a random pull of tickets.","remember":"Sprint Goal finalized before Sprint Planning ends.","examTrack":"PSM-I","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Sprint Goal"},{"id":43,"category":"Product Backlog","difficulty":"Intermediate","type":"single","question":"What is Product Backlog refinement?","options":[{"id":"a","text":"The act of breaking down and further defining Product Backlog items into smaller more precise items; an ongoing activity","correct":true},{"id":"b","text":"A formal Scrum event with a mandatory timebox of four hours","correct":false},{"id":"c","text":"Rewriting the Sprint Goal daily","correct":false},{"id":"d","text":"A release approval meeting","correct":false}],"correctWhy":"Refinement is the act of breaking down and further defining Product Backlog items into smaller more precise items. This is an ongoing activity to add details such as description, order, and size. Attributes often vary with the domain.","wrongWhy":{"b":"Refinement is ongoing work, not one of the five formal Scrum events.","c":"Sprint Goal is created in Planning; not refined as 'refinement.'","d":"Not a release approval meeting."},"guideInsight":"Product Backlog refinement: ongoing; break down and define PBIs","examTip":"Refinement is NOT a 5th Scrum event — ongoing activity.","realWorld":"Invest in refinement so Sprint Planning can focus on Why/What/How confidently.","remember":"Refinement = ongoing, not a formal event.","examTrack":"PSM-I","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Product Backlog"},{"id":44,"category":"Stakeholder Interaction","difficulty":"Intermediate","type":"single","question":"A key stakeholder wants a new feature added immediately during the Sprint, which would endanger the Sprint Goal. What is the appropriate response?","options":[{"id":"a","text":"No changes are made that would endanger the Sprint Goal; the stakeholder works through the Product Owner; scope may be clarified/renegotiated with the PO without endangering the Sprint Goal","correct":true},{"id":"b","text":"Developers must accept all stakeholder requests immediately","correct":false},{"id":"c","text":"The Scrum Master re-prioritizes the Sprint Backlog for the stakeholder","correct":false},{"id":"d","text":"The Sprint is automatically extended to fit the new feature","correct":false}],"correctWhy":"During the Sprint, no changes are made that would endanger the Sprint Goal. The Product Owner is accountable for the Product Backlog; those who want changes convince the PO. Scope may be clarified and renegotiated with the PO as more is learned.","wrongWhy":{"b":"Developers don't take unfiltered mid-Sprint inserts that blow the Sprint Goal.","c":"SM doesn't reorder product priorities for stakeholders.","d":"Sprint length is fixed."},"guideInsight":"During Sprint: no changes endangering Sprint Goal; negotiate via PO","examTip":"Stakeholders → PO → backlog/scope negotiation; protect Sprint Goal.","realWorld":"Park the request on the Product Backlog and inspect at Review if it's not Sprint-Goal-safe.","remember":"Protect Sprint Goal; channel requests through PO.","examTrack":"PSM-I","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Stakeholder Interaction"},{"id":45,"category":"Customer Collaboration","difficulty":"Intermediate","type":"single","question":"How does the Scrum Master serve the Product Owner regarding stakeholder collaboration?","options":[{"id":"a","text":"Helping establish stakeholder collaboration as requested or needed","correct":true},{"id":"b","text":"Replacing the Product Owner in all customer meetings","correct":false},{"id":"c","text":"Preventing stakeholders from attending the Sprint Review","correct":false},{"id":"d","text":"Ordering the Product Backlog on the PO's behalf without transparency","correct":false}],"correctWhy":"The Scrum Master serves the Product Owner by helping find techniques for effective Product Goal definition and Product Backlog management; helping the Scrum Team understand the need for clear and concise Product Backlog items; helping establish empirical product planning for a complex environment; and helping facilitate stakeholder collaboration as requested or needed.","wrongWhy":{"b":"SM serves/facilitates; does not replace PO accountability.","c":"Sprint Review includes key stakeholders.","d":"Backlog accountability remains with the PO; secrecy harms transparency."},"guideInsight":"SM serves PO: techniques, clear PBIs, empirical planning, stakeholder collaboration","examTip":"Know the four PO-service bullets for the SM.","realWorld":"SM coaches collaboration design; PO still owns value decisions.","remember":"SM helps PO with stakeholder collaboration — doesn't replace PO.","examTrack":"PSM-I","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Customer Collaboration"},{"id":46,"category":"Product Management","difficulty":"Intermediate","type":"single","question":"What is the single source of work undertaken by the Scrum Team?","options":[{"id":"a","text":"The Product Backlog","correct":true},{"id":"b","text":"A separate defect tracker outside Scrum","correct":false},{"id":"c","text":"Executive email requests","correct":false},{"id":"d","text":"The Sprint Retrospective notes alone","correct":false}],"correctWhy":"The Product Backlog is the single source of work undertaken by the Scrum Team. Work should be reflected there for transparency.","wrongWhy":{"b":"Defects that are work for the team should be represented via the Product Backlog for a single source of truth.","c":"Emails are inputs; they become work through the PO/Product Backlog.","d":"Retro improvements may become backlog/Sprint Backlog items, but Retro notes aren't the single source of product work."},"guideInsight":"Product Backlog is the single source of work","examTip":"Side backlogs break transparency.","realWorld":"Merge 'shadow backlogs' into one Product Backlog ordered by the PO.","remember":"One Product Backlog = single source of work.","examTrack":"PSM-I","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Product Management"},{"id":47,"category":"Release Planning","difficulty":"Intermediate","type":"single","question":"Leadership asks when feature X will ship. The team has a burn-up chart. What guidance aligns with the Scrum Guide?","options":[{"id":"a","text":"Forecasts may use practices like burn-ups, but they do not replace empiricism; in complex work only what has happened informs forward-looking decisions","correct":true},{"id":"b","text":"Promise a fixed date from the burn-up and freeze the Product Backlog","correct":false},{"id":"c","text":"Only the Scrum Master may give release dates","correct":false},{"id":"d","text":"Release planning is forbidden in Scrum","correct":false}],"correctWhy":"Projective practices may forecast progress, but do not diminish empiricism. In complex environments, what will happen is unknown; only what has already happened may be used for forward-looking decision-making. Releases can occur whenever an Increment meets DoD — Review is not a gate.","wrongWhy":{"b":"Freezing the backlog and guaranteeing dates denies emergence and empiricism.","c":"Value/ordering is PO accountability; forecasts are empirical, not SM-owned promises.","d":"Scrum doesn't forbid planning releases; it forbids replacing empiricism with false certainty."},"guideInsight":"Forecasting ≠ certainty; empiricism remains essential; deliver Done Increments when valuable","examTip":"Don't claim the Guide bans forecasts — it bans treating them as replacements for empiricism.","realWorld":"Share forecast ranges and Inspect/Adapt each Sprint toward the Product Goal.","remember":"Forecasts help; empiricism rules.","examTrack":"PSM-I","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Release Planning"},{"id":48,"category":"Roadmaps","difficulty":"Intermediate","type":"single","question":"How should a product roadmap be treated in light of the 2020 Scrum Guide?","options":[{"id":"a","text":"As a helpful expression of direction toward the Product Goal, updated empirically — not as a substitute for empiricism or a fixed promise that freezes learning","correct":true},{"id":"b","text":"As a mandatory Scrum artifact replacing the Product Backlog","correct":false},{"id":"c","text":"As a commitment that forbids Product Backlog changes","correct":false},{"id":"d","text":"As something only the Scrum Master owns","correct":false}],"correctWhy":"The Guide does not define 'roadmap' as a Scrum artifact. The Product Goal is the long-term objective; the Product Backlog is emergent. Forecasting practices don't replace empiricism. A roadmap, if used, should support transparency toward the Product Goal without pretending certainty in complex work.","wrongWhy":{"b":"Roadmaps are not a Scrum artifact; Product Backlog remains the single source of work.","c":"The Product Backlog is emergent; Sprint Review may adjust it.","d":"Product value and backlog management are PO accountabilities."},"guideInsight":"Product Goal + emergent Product Backlog; forecasts don't replace empiricism","examTip":"If 'roadmap' appears, anchor answers in Product Goal/empiricism — never invent Guide rules about roadmaps.","realWorld":"Keep roadmaps thin and revise after each Review based on evidence.","remember":"Roadmaps (if used) serve Product Goal + empiricism — not fixed contracts.","examTrack":"PSM-I","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Roadmaps"},{"id":49,"category":"Scaling Concepts","difficulty":"Intermediate","type":"single","question":"If Scrum Teams become too large, what does the Guide suggest?","options":[{"id":"a","text":"Reorganize into multiple cohesive Scrum Teams each focused on the same product; share the same Product Goal, Product Backlog, and Product Owner","correct":true},{"id":"b","text":"Create a hierarchy of Scrum Masters who assign work across teams","correct":false},{"id":"c","text":"Split into component sub-teams with separate Product Owners competing for priority","correct":false},{"id":"d","text":"Add a project manager layer above the Scrum Team","correct":false}],"correctWhy":"If Scrum Teams become too large, they should consider reorganizing into multiple cohesive Scrum Teams, each focused on the same product. Therefore, they should share the same Product Goal, Product Backlog, and Product Owner.","wrongWhy":{"b":"No hierarchies within Scrum Team; SM doesn't assign work.","c":"Multiple POs for one product backlog contradicts sharing one PO; Guide says same PO.","d":"Scrum Teams have no sub-teams or hierarchies; adding PM hierarchy is not the Guide's guidance."},"guideInsight":"Scaling hint in Guide: multiple teams share Product Goal, Product Backlog, and Product Owner","examTip":"Same product → same Product Goal, PB, PO. Also same DoD when multiple teams.","realWorld":"Don't scale by inventing component silos with conflicting backlogs.","remember":"Too large → multiple teams; same Goal, Backlog, PO.","examTrack":"PSM-I","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Scaling Concepts"},{"id":50,"category":"Risk Management","difficulty":"Intermediate","type":"single","question":"How does Scrum help control risk?","options":[{"id":"a","text":"By using an iterative, incremental approach to optimize predictability and control risk, with formal opportunities to inspect and adapt","correct":true},{"id":"b","text":"By completing a comprehensive risk register before Sprint 1 and never changing it","correct":false},{"id":"c","text":"By maximizing batch size of delivery","correct":false},{"id":"d","text":"By avoiding stakeholder inspection until project end","correct":false}],"correctWhy":"Scrum employs an iterative, incremental approach to optimize predictability and control risk. Four formal events enable inspection and adaptation inside the Sprint container, reducing risk through frequent empirical feedback.","wrongWhy":{"b":"Complex domains require ongoing empiricism, not a static upfront risk register as the control mechanism.","c":"Larger batches increase risk; Increments are stepping stones.","d":"Sprint Review invites key stakeholder inspection each Sprint."},"guideInsight":"Iterative/incremental approach controls risk; events for inspection/adaptation","examTip":"Risk control in Scrum = short Sprints + Done Increments + inspect/adapt.","realWorld":"Fail small and learn each Sprint instead of betting the release on unvalidated work.","remember":"Short Sprints + Increments control risk.","examTrack":"PSM-I","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Risk Management"},{"id":51,"category":"Dependency Management","difficulty":"Intermediate","type":"scenario","question":"Two Scrum Teams work on one product and discover a dependency that threatens both Sprint Goals. What aligns with the Guide?","options":[{"id":"a","text":"They share the same Product Goal, Product Backlog, and Product Owner; they should also mutually define and share the same Definition of Done; collaborate to adapt plans while protecting Sprint Goals","correct":true},{"id":"b","text":"Each team creates its own Product Owner to escalate against the other","correct":false},{"id":"c","text":"Ignore the dependency until the Sprint Retrospective after release","correct":false},{"id":"d","text":"Merge into one 25-person team with a hierarchy","correct":false}],"correctWhy":"Multiple teams on one product share Product Goal, Product Backlog, and Product Owner. If multiple Scrum Teams are working together on a product, they must mutually define and comply with the same Definition of Done. Adaptation happens ASAP when new information emerges.","wrongWhy":{"b":"Guide says share the same Product Owner.","c":"Adapt ASAP; waiting increases risk to Sprint Goals.","d":"Teams typically 10 or fewer; no hierarchies."},"guideInsight":"Multi-team: same Product Goal, PB, PO; same mutually defined DoD","examTip":"Dependencies → transparency + collaboration + shared PO/DoD, not rival POs.","realWorld":"Make cross-team dependencies visible on the shared Product Backlog and adapt Sprint plans daily.","remember":"One product: shared Goal, Backlog, PO, DoD.","examTrack":"PSM-I","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Dependency Management"},{"id":52,"category":"Work Spillover","difficulty":"Intermediate","type":"single","question":"Work selected for the Sprint is not completed by Sprint end and does not meet the Definition of Done. What happens to that work?","options":[{"id":"a","text":"It returns to the Product Backlog for future consideration","correct":true},{"id":"b","text":"It is automatically placed at the top of the next Sprint Backlog","correct":false},{"id":"c","text":"It is presented at Sprint Review as Done if effort was high","correct":false},{"id":"d","text":"It is deleted permanently","correct":false}],"correctWhy":"If a Product Backlog item does not meet the Definition of Done, it cannot be released or even presented at the Sprint Review. Instead, it returns to the Product Backlog for future consideration.","wrongWhy":{"b":"Automatic carry-over into the next Sprint Backlog is not mandated; ordering/selection happens via PO and Sprint Planning.","c":"Effort doesn't waive DoD.","d":"It returns for future consideration, not deletion by rule."},"guideInsight":"Incomplete/undone work returns to the Product Backlog","examTip":"Spillover ≠ automatic next Sprint commitment.","realWorld":"Re-estimate and reorder undone work against current Product Goal value.","remember":"Undone work → Product Backlog, not auto-next-Sprint.","examTrack":"PSM-I","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Work Spillover"},{"id":53,"category":"Incomplete Work","difficulty":"Intermediate","type":"tf","question":"True or False: Work cannot be considered part of an Increment unless it meets the Definition of Done.","options":[{"id":"a","text":"True","correct":true},{"id":"b","text":"False","correct":false}],"correctWhy":"The Guide states that work cannot be considered part of an Increment unless it meets the Definition of Done.","wrongWhy":{"b":"False is incorrect — meeting DoD is required for Increment inclusion."},"guideInsight":"Increment membership requires Definition of Done","examTip":"Partial coding ≠ Increment.","realWorld":"Demo only what is truly Done to preserve transparency.","remember":"No DoD → not an Increment.","examTrack":"PSM-I","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Incomplete Work"},{"id":54,"category":"Anti-Patterns","difficulty":"Intermediate","type":"scenario","question":"A Scrum Master assigns tasks to Developers every morning and collects status for a burndown they alone update. Why is this an anti-pattern?","options":[{"id":"a","text":"Developers are self-managing; they create and adapt the Sprint Backlog plan and hold each other accountable; Daily Scrum is for Developers to inspect progress toward the Sprint Goal","correct":true},{"id":"b","text":"Because burn-downs are forbidden by the Scrum Guide","correct":false},{"id":"c","text":"Because the Product Owner must assign all tasks","correct":false},{"id":"d","text":"Because only stakeholders may manage the Sprint Backlog","correct":false}],"correctWhy":"Developers are self-managing, meaning they internally decide who does what, when, and how. They create the Sprint Backlog plan and adapt it daily. The SM is a true leader who serves — coaching self-management — not assigning tasks. Burn-downs are allowed but don't replace empiricism.","wrongWhy":{"b":"Burn-downs are not forbidden.","c":"PO does not assign Developer tasks.","d":"Sprint Backlog is by and for Developers."},"guideInsight":"Self-managing Developers; SM serves/coaches; Daily Scrum not status to SM","examTip":"SM-as-task-assigner is a top exam anti-pattern.","realWorld":"Facilitate impediment removal and coaching instead of becoming the team's dispatcher.","remember":"SM doesn't assign work; Developers self-manage.","examTrack":"PSM-I","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Anti-Patterns"},{"id":55,"category":"Leadership & Coaching","difficulty":"Intermediate","type":"single","question":"The Scrum Guide describes the Scrum Master as which kind of leader?","options":[{"id":"a","text":"A true leader who serves the Scrum Team and the larger organization","correct":true},{"id":"b","text":"A line manager with hiring and firing authority over Developers","correct":false},{"id":"c","text":"A project manager who controls scope, cost, and schedule","correct":false},{"id":"d","text":"A secretary who books rooms only","correct":false}],"correctWhy":"The Scrum Master is accountable for establishing Scrum as defined in the Scrum Guide. They do this by helping everyone understand Scrum theory and practice, both within the Scrum Team and the organization. The Scrum Master is a true leader who serves the Scrum Team and the larger organization.","wrongWhy":{"b":"SM accountability is not defined as hierarchical people management.","c":"Triple-constraint PM control is not the SM role.","d":"Serving includes coaching, facilitation, impediment removal, and org adoption — more than logistics."},"guideInsight":"Scrum Master: true leader who serves","examTip":"2020 language: 'true leader who serves' (servant leadership framing).","realWorld":"Measure SM success by team effectiveness and Scrum adoption, not by task assignment volume.","remember":"SM = true leader who serves.","examTrack":"PSM-I","certifications":["PSM-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Leadership & Coaching"},{"id":56,"category":"Organizational Change","difficulty":"Advanced","type":"multi","question":"Select all that apply. An organization wants Scrum but a project manager still authorizes Sprint scope changes that endanger Sprint Goals. Which Guide-aligned statements should guide the Scrum Master and organization?","options":[{"id":"a","text":"The Scrum Master leads, trains, and coaches the organization in its Scrum adoption","correct":true},{"id":"b","text":"No changes are made during the Sprint that would endanger the Sprint Goal","correct":true},{"id":"c","text":"The Product Owner is one person, not a committee, and others influence by convincing the Product Owner","correct":true},{"id":"d","text":"A project manager should become a second Product Owner with equal backlog authority","correct":false}],"correctWhy":"The SM serves the organization by leading/training/coaching Scrum adoption and helping enact empiricism. During the Sprint, no changes endanger the Sprint Goal. The PO is one person; others convince the PO. Adding a second PO/PM with equal backlog authority contradicts the Guide.","wrongWhy":{"d":"PO is one person, not a committee or dual authority with a PM."},"guideInsight":"SM serves organization; protect Sprint Goal; PO is one person","examTip":"Org-change scenarios combine SM org-service + Sprint rules + single PO.","realWorld":"Coach leadership that value/scope decisions flow through one PO while Sprint Goals stay protected.","remember":"Org adoption coaching + protect Sprint Goal + one PO.","examTrack":"PSM-I","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Organizational Change"},{"id":57,"category":"Scrum Master Accountability","difficulty":"Advanced","type":"multi","question":"Select all that apply. How does the Scrum Master serve the organization?","options":[{"id":"a","text":"Leading, training, and coaching the organization in its Scrum adoption","correct":true},{"id":"b","text":"Planning and advising Scrum implementations within the organization","correct":true},{"id":"c","text":"Helping employees and stakeholders understand and enact an empirical approach for complex work","correct":true},{"id":"d","text":"Removing barriers between stakeholders and Scrum Teams","correct":true}],"correctWhy":"These four are the Guide's list of how the Scrum Master serves the organization.","wrongWhy":{},"guideInsight":"SM serves organization (four bullets)","examTip":"Memorize Team / PO / Organization service lists separately.","realWorld":"Org coaching is part of the job — not 'only team-level facilitation.'","remember":"SM serves org: adoption, advise implementations, empiricism, remove barriers.","examTrack":"PSM-I","certifications":["PSM-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Scrum Master Accountability"},{"id":58,"category":"Product Owner Accountability","difficulty":"Advanced","type":"single","question":"Who has the authority to cancel a Sprint?","options":[{"id":"a","text":"Only the Product Owner","correct":true},{"id":"b","text":"Only the Scrum Master","correct":false},{"id":"c","text":"Any stakeholder who funds the team","correct":false},{"id":"d","text":"A majority vote of Developers","correct":false}],"correctWhy":"A Sprint could be cancelled if the Sprint Goal becomes obsolete. Only the Product Owner has the authority to cancel the Sprint.","wrongWhy":{"b":"SM does not cancel Sprints.","c":"Stakeholders convince the PO; they don't cancel Sprints themselves.","d":"Developers don't hold cancel authority."},"guideInsight":"Only PO can cancel Sprint; cancel if Sprint Goal obsolete","examTip":"Cancel = rare + PO only + Sprint Goal obsolete.","realWorld":"If the market kills the Sprint Goal's value, PO cancels rather than zombie-executing the Sprint.","remember":"Only the Product Owner cancels a Sprint.","examTrack":"PSM-I","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Product Owner Accountability"},{"id":59,"category":"Sprint","difficulty":"Advanced","type":"multi","question":"Select all that apply. Which are true about Sprints?","options":[{"id":"a","text":"They are fixed length events of one month or less","correct":true},{"id":"b","text":"A new Sprint starts immediately after the conclusion of the previous Sprint","correct":true},{"id":"c","text":"During the Sprint, the Product Backlog is refined as needed","correct":true},{"id":"d","text":"During the Sprint, quality may decrease if needed to meet deadlines","correct":false}],"correctWhy":"Sprints are one month or less; next starts immediately. During Sprint: no changes endangering Sprint Goal; quality does not decrease; Product Backlog refined as needed; scope may be clarified/renegotiated with PO.","wrongWhy":{"d":"Quality does not decrease during the Sprint."},"guideInsight":"Sprint container rules","examTip":"Four 'during the Sprint' rules are frequent exam fodder.","realWorld":"Keep refining mid-Sprint; don't freeze learning for two weeks.","remember":"Sprint: fixed rhythm; quality holds; refine as needed.","examTrack":"PSM-I","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Sprint"},{"id":60,"category":"Sprint Planning","difficulty":"Advanced","type":"scenario","question":"During Sprint Planning Topic Three, who creates the plan for how selected Product Backlog items will be turned into Increments?","options":[{"id":"a","text":"The Developers; how to do so is at their sole discretion — no one else tells them how to turn PBIs into Increments of value","correct":true},{"id":"b","text":"The Product Owner dictates technical tasks","correct":false},{"id":"c","text":"The Scrum Master assigns owners and estimates","correct":false},{"id":"d","text":"Architecture Review Board outside the team","correct":false}],"correctWhy":"For each selected Product Backlog item, the Developers plan the work necessary to create an Increment that meets the Definition of Done. How they do this is at their sole discretion. No one else tells them how to turn Product Backlog items into Increments of value.","wrongWhy":{"b":"PO collaborates on What/Why, not sole technical plan ownership.","c":"SM doesn't assign work.","d":"External bodies don't replace Developer sole discretion on how."},"guideInsight":"Topic Three: Developers plan work; sole discretion on how","examTip":"'Sole discretion' is key Guide language for How.","realWorld":"Architects on the team participate as Developers — not as an external command structure.","remember":"How = Developers' sole discretion.","examTrack":"PSM-I","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Sprint Planning"},{"id":61,"category":"Daily Scrum","difficulty":"Advanced","type":"single","question":"Who decides the structure of the Daily Scrum?","options":[{"id":"a","text":"The Developers; they can select whatever structure and techniques they want, as long as their Daily Scrum focuses on progress toward the Sprint Goal and produces an actionable plan for the next day of work","correct":true},{"id":"b","text":"The Scrum Master must run three mandatory questions","correct":false},{"id":"c","text":"The Product Owner provides a script","correct":false},{"id":"d","text":"Stakeholders choose the agenda weekly","correct":false}],"correctWhy":"Developers can select whatever structure and techniques they want, as long as their Daily Scrum focuses on progress toward the Sprint Goal and produces an actionable plan for the next day of work. This creates focus and improves self-management.","wrongWhy":{"b":"Three questions are not mandated in the 2020 Guide.","c":"PO doesn't script the Daily Scrum.","d":"Daily Scrum is for Developers."},"guideInsight":"Developers choose Daily Scrum structure; focus on Sprint Goal + next-day plan","examTip":"2017 three questions are outdated as a requirement.","realWorld":"Try walking the Sprint Board against the Sprint Goal instead of zombie status rounds.","remember":"Developers structure Daily Scrum; Sprint Goal focus required.","examTrack":"PSM-I","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Daily Scrum"},{"id":62,"category":"Sprint Review","difficulty":"Advanced","type":"scenario","question":"Management wants the Sprint Review used only as a polished slide presentation with no backlog changes allowed. What is wrong with this?","options":[{"id":"a","text":"The Sprint Review is a working session; the Scrum Team should avoid limiting it to a presentation; attendees collaborate on what to do next and the Product Backlog may be adjusted","correct":true},{"id":"b","text":"Nothing — presentations are the defined format","correct":false},{"id":"c","text":"Only Developers may speak; stakeholders must be silent","correct":false},{"id":"d","text":"The Review must be skipped if slides aren't ready","correct":false}],"correctWhy":"The Guide describes Review as inspecting the outcome and determining future adaptations, presenting results to key stakeholders, discussing Product Goal progress, and possibly adjusting the Product Backlog. It is a working session, not merely a presentation.","wrongWhy":{"b":"Avoid limiting Review to a presentation.","c":"Stakeholders participate in the working session.","d":"Events should occur; focus on Increment outcome and adaptation."},"guideInsight":"Sprint Review working session; PB may be adjusted; discuss Product Goal progress","examTip":"Any 'presentation-only / no changes' Review is non-Guide.","realWorld":"Bring stakeholders into trade-off decisions, not a theater demo.","remember":"Review = collaborate & adapt, not slide theater.","examTrack":"PSM-I","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Sprint Review"},{"id":63,"category":"Definition of Done","difficulty":"Advanced","type":"multi","question":"Select all that apply. Which statements about the Definition of Done are correct?","options":[{"id":"a","text":"If the Definition of Done for an Increment is part of the standards of the organization, all Scrum Teams must follow it as a minimum","correct":true},{"id":"b","text":"If it is not an organizational standard, the Scrum Team must create a Definition of Done appropriate for the product","correct":true},{"id":"c","text":"The Developers are required to conform to the Definition of Done","correct":true},{"id":"d","text":"If multiple Scrum Teams are working together on a product, they must mutually define and comply with the same Definition of Done","correct":true}],"correctWhy":"All four statements are directly from the Guide's Definition of Done section.","wrongWhy":{},"guideInsight":"DoD: org minimum; else team creates; Developers conform; multi-team same DoD","examTip":"Multi-team same DoD is a frequent advanced question.","realWorld":"Don't let each team invent incompatible 'Done' on one product.","remember":"One product → shared DoD (org min or mutually defined).","examTrack":"PSM-I","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Definition of Done"},{"id":64,"category":"Technical Excellence","difficulty":"Advanced","type":"single","question":"Where does the Scrum Guide place accountability for instilling quality via the Definition of Done?","options":[{"id":"a","text":"With the Developers","correct":true},{"id":"b","text":"Only with a separate QA department outside the Scrum Team","correct":false},{"id":"c","text":"Only with the Product Owner","correct":false},{"id":"d","text":"Only with the Scrum Master","correct":false}],"correctWhy":"Developers are always accountable for instilling quality by adhering to a Definition of Done. The entire Scrum Team is accountable for creating a valuable, useful Increment every Sprint. Technical excellence practices are how teams meet DoD; Scrum is purposefully incomplete on specific techniques.","wrongWhy":{"b":"Cross-functional teams have all skills to create value each Sprint; quality isn't 'thrown over a wall' as the model.","c":"PO maximizes value and manages PB; Developers instill quality via DoD.","d":"SM helps focus on high-value Done Increments but Developers conform to DoD."},"guideInsight":"Developers instill quality by adhering to DoD; whole team accountable for valuable useful Increment","examTip":"Quality/DoD adherence is a Developer accountability.","realWorld":"Build quality in (tests, integration, standards) so Done means usable every Sprint.","remember":"Developers accountable for DoD quality.","examTrack":"PSM-I","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Technical Excellence"},{"id":65,"category":"Quality","difficulty":"Advanced","type":"multi","question":"Select all that apply. Stakeholders ask to present and release unfinished items that miss the Definition of Done to hit a marketing date. Which statements are true?","options":[{"id":"a","text":"If a Product Backlog item does not meet the Definition of Done, it cannot be released or even presented at the Sprint Review","correct":true},{"id":"b","text":"During the Sprint, quality does not decrease","correct":true},{"id":"c","text":"Work cannot be considered part of an Increment unless it meets the Definition of Done","correct":true},{"id":"d","text":"The Scrum Master may waive the Definition of Done for one Sprint to protect morale","correct":false}],"correctWhy":"Undone items cannot be released or presented at Review and are not part of an Increment. Quality does not decrease during the Sprint. The SM does not waive DoD.","wrongWhy":{"d":"No one waives DoD to fake completion; Developers conform to DoD."},"guideInsight":"DoD required for Increment/release/Review presentation; quality does not decrease","examTip":"Pressure-to-waive-DoD questions: never waive for Review or release.","realWorld":"Offer a smaller Done slice that still supports a meaningful Sprint Goal.","remember":"Never waive DoD for Review or release.","examTrack":"PSM-I","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Quality"},{"id":66,"category":"Transparency","difficulty":"Advanced","type":"single","question":"Why are artifacts and agreed standards (like DoD) critical for transparency?","options":[{"id":"a","text":"Artifacts maximize transparency of key information so decisions based on them have a sound basis; DoD creates transparency by providing a shared understanding of completed work","correct":true},{"id":"b","text":"They exist mainly to satisfy auditors and can be private to managers","correct":false},{"id":"c","text":"Transparency means sharing individual salary data in Daily Scrum","correct":false},{"id":"d","text":"Artifacts replace the need for Inspection events","correct":false}],"correctWhy":"Artifacts are designed to maximize transparency of key information. Decisions made based on them have a sound basis. The DoD creates transparency by providing everyone a shared understanding of what work was completed as part of the Increment.","wrongWhy":{"b":"Transparency is for those inspecting outcomes — hiding from the team/stakeholders undermines empiricism.","c":"Not what artifact transparency means.","d":"Transparency enables inspection; it doesn't remove events."},"guideInsight":"Artifacts maximize transparency; commitments create focus/focus measurement","examTip":"Each artifact has a commitment that reinforces empiricism and value.","realWorld":"If 'Done' means different things to PO and Developers, transparency is broken.","remember":"Artifacts + DoD = decision-grade transparency.","examTrack":"PSM-I","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Transparency"},{"id":67,"category":"Inspection","difficulty":"Advanced","type":"single","question":"What are the four formal events for inspection and adaptation inside the Sprint?","options":[{"id":"a","text":"Sprint Planning, Daily Scrum, Sprint Review, and Sprint Retrospective","correct":true},{"id":"b","text":"Daily Scrum, Sprint Review, Release Planning, and Budget Review","correct":false},{"id":"c","text":"Sprint, Product Backlog, Sprint Backlog, and Increment","correct":false},{"id":"d","text":"Refinement, Estimation, Forecasting, and Roadmapping","correct":false}],"correctWhy":"These four formal events for inspection and adaptation work within the Sprint container: Sprint Planning, Daily Scrum, Sprint Review, and Sprint Retrospective. The Sprint itself is a container event.","wrongWhy":{"b":"Release Planning and Budget Review are not Scrum formal events.","c":"Those are the Sprint and the three artifacts, not the four inspect/adapt events.","d":"Not the four formal Scrum events."},"guideInsight":"Four formal events for inspection/adaptation within the Sprint","examTip":"Sprint is the container; four events inside for inspect/adapt.","realWorld":"Don't skip Retro/Review under delivery pressure — you remove inspect/adapt loops.","remember":"Four events: Planning, Daily, Review, Retro.","examTrack":"PSM-I","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Inspection"},{"id":68,"category":"Adaptation","difficulty":"Advanced","type":"tf","question":"True or False: A Scrum Team is expected to adapt the moment it learns anything new through inspection.","options":[{"id":"a","text":"True","correct":true},{"id":"b","text":"False","correct":false}],"correctWhy":"If any aspects of a process deviate outside acceptable limits or if the resulting product is unacceptable, the process being applied or the materials being produced must be adjusted. The adjustment must be made as soon as possible to minimize further deviation. Adaptation becomes more difficult when people are not empowered or self-managing. A Scrum Team is expected to adapt the moment it learns anything new through inspection.","wrongWhy":{"b":"False is incorrect — ASAP adaptation is explicit."},"guideInsight":"Adapt as soon as possible; Scrum Team adapts when it learns anything new","examTip":"Delaying known adaptations increases waste/risk.","realWorld":"Don't wait for a ceremony if a critical adaptation is clear now (while still using events well).","remember":"Learn → adapt immediately.","examTrack":"PSM-I","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Adaptation"},{"id":69,"category":"Estimation","difficulty":"Advanced","type":"scenario","question":"A Product Owner insists all estimates must be in Story Points because 'the Scrum Guide requires Story Points.' What is the correct clarification?","options":[{"id":"a","text":"The Guide does not require Story Points; Developers are responsible for sizing, and sizing attributes often vary with the domain","correct":true},{"id":"b","text":"Story Points are mandatory and must be assigned by the PO","correct":false},{"id":"c","text":"Only Fibonacci Story Points are allowed","correct":false},{"id":"d","text":"Ideal hours are the only lawful unit","correct":false}],"correctWhy":"Refinement adds details such as description, order, and size. Attributes often vary with the domain of work. Developers who will do the work are responsible for sizing. The Guide never mandates Story Points or velocity.","wrongWhy":{"b":"PO doesn't size; Story Points aren't mandated.","c":"No such Guide rule.","d":"No such Guide rule."},"guideInsight":"Developers size work; Guide does not prescribe estimation units","examTip":"Any 'Guide requires Story Points/velocity' claim is false.","realWorld":"Pick a sizing approach that helps Developers plan empirically — inspect if it helps.","remember":"No mandatory Story Points in the Scrum Guide.","examTrack":"PSM-I","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Estimation"},{"id":70,"category":"Forecasting","difficulty":"Advanced","type":"single","question":"In complex environments, what may be used for forward-looking decision-making according to the Guide?","options":[{"id":"a","text":"Only what has already happened","correct":true},{"id":"b","text":"Detailed predictions of all future work","correct":false},{"id":"c","text":"Executive intuition alone without inspection","correct":false},{"id":"d","text":"A locked annual plan that forbids adaptation","correct":false}],"correctWhy":"In complex environments, what will happen is unknown. Only what has already happened may be used for forward-looking decision-making.","wrongWhy":{"b":"Unknown futures can't be fully predicted in complex domains.","c":"Empiricism requires observation/evidence.","d":"Locked plans that forbid adaptation contradict Scrum."},"guideInsight":"Complex environments: only what has happened informs forward-looking decisions","examTip":"This sentence is a favorite advanced exam quote.","realWorld":"Use Yesterday's Weather / completed Increments to forecast, then revise each Sprint.","remember":"Complex work: past evidence guides forecasts.","examTrack":"PSM-I","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Forecasting"},{"id":71,"category":"Product Goal","difficulty":"Advanced","type":"scenario","question":"A Scrum Team is asked to pursue two different Product Goals at once for the same product because two executives disagree. What does the Guide imply?","options":[{"id":"a","text":"The Product Goal is the long-term objective; the team must fulfill or abandon one objective before taking on the next; the PO is one person who orders the Product Backlog toward that goal","correct":true},{"id":"b","text":"Run two Product Goals in parallel with two Product Backlogs","correct":false},{"id":"c","text":"Let the Scrum Master pick the Product Goal","correct":false},{"id":"d","text":"Abandon the Product Backlog entirely","correct":false}],"correctWhy":"The Product Goal is the long-term objective for the Scrum Team. They must fulfill (or abandon) one objective before taking on the next. The PO is one person accountable for the Product Goal and Product Backlog ordering. Multiple teams on one product share the same Product Goal and Product Backlog.","wrongWhy":{"b":"Single source Product Backlog; one Product Goal at a time.","c":"PO accountability for Product Goal communication/development.","d":"PB remains the single source of work."},"guideInsight":"One Product Goal at a time; PO accounts for it; shared across teams on one product","examTip":"Executives convince the PO — they don't create parallel Product Goals/backlogs.","realWorld":"Facilitate a decision: fulfill, abandon, or redefine a single Product Goal.","remember":"One Product Goal at a time — fulfill or abandon.","examTrack":"PSM-I","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Product Goal"},{"id":72,"category":"Sprint Goal","difficulty":"Advanced","type":"scenario","question":"Developers find they must change which PBIs they implement, but they can still meet the Sprint Goal. What should they do?","options":[{"id":"a","text":"Collaborate with the Product Owner to negotiate the scope of the Sprint Backlog within the Sprint without affecting the Sprint Goal","correct":true},{"id":"b","text":"Cancel the Sprint because any plan change requires cancellation","correct":false},{"id":"c","text":"Secretly change scope without informing the Product Owner","correct":false},{"id":"d","text":"Extend the Sprint until original PBIs and new ones are all Done","correct":false}],"correctWhy":"The Sprint Goal provides flexibility regarding the exact work needed to achieve it. If the work turns out to be different than expected, they collaborate with the PO to negotiate the scope of the Sprint Backlog within the Sprint without affecting the Sprint Goal.","wrongWhy":{"b":"Cancellation is only if Sprint Goal is obsolete; only PO cancels.","c":"Negotiation with PO is required for scope changes.","d":"Sprint length is fixed."},"guideInsight":"Sprint Goal enables scope flexibility via PO negotiation","examTip":"Sprint Goal stable; Sprint Backlog scope negotiable.","realWorld":"Use Daily Scrum insights to renegotiate scope early with the PO.","remember":"Change work, protect Sprint Goal, negotiate with PO.","examTrack":"PSM-I","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Sprint Goal"},{"id":73,"category":"Product Backlog","difficulty":"Advanced","type":"single","question":"Which Product Backlog items are ready for selection in Sprint Planning?","options":[{"id":"a","text":"Those that can be Done by the Scrum Team within one Sprint are deemed ready for selection in a Sprint Planning event","correct":true},{"id":"b","text":"Only items approved by an architecture board","correct":false},{"id":"c","text":"Only items with mandatory Story Point values assigned by the SM","correct":false},{"id":"d","text":"Any idea emailed during Planning, regardless of clarity","correct":false}],"correctWhy":"Product Backlog items that can be Done by the Scrum Team within one Sprint are deemed ready for selection in a Sprint Planning event. Higher-ordered items are usually clearer and more detailed after refinement.","wrongWhy":{"b":"Not a Guide readiness rule.","c":"Story Points/SM sizing not required.","d":"Readiness implies the item can be Done in a Sprint — clarity matters."},"guideInsight":"PBIs Done within one Sprint = ready for Sprint Planning selection","examTip":"Ready ≠ a separate formal Scrum artifact; it's about being Done-able in a Sprint.","realWorld":"Refine until top items are small/clear enough to finish in a Sprint.","remember":"Ready ≈ can be Done in one Sprint.","examTrack":"PSM-I","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Product Backlog"},{"id":74,"category":"Sprint Backlog","difficulty":"Advanced","type":"single","question":"Why does the Guide emphasize that the Sprint Backlog is highly visible and real-time?","options":[{"id":"a","text":"It is a picture of the work Developers plan to accomplish during the Sprint to achieve the Sprint Goal; visibility supports inspection and adaptation","correct":true},{"id":"b","text":"So HR can calculate individual utilization percentages","correct":false},{"id":"c","text":"So the Scrum Master can approve each task before work starts","correct":false},{"id":"d","text":"Because the Sprint Backlog replaces the Product Backlog","correct":false}],"correctWhy":"The Sprint Backlog is a highly visible, real-time picture of the work that the Developers plan to accomplish during the Sprint in order to achieve the Sprint Goal. It is updated throughout the Sprint as more is learned — enabling inspection and adaptation.","wrongWhy":{"b":"Not the purpose of Sprint Backlog visibility.","c":"Developers self-manage; SM doesn't approve tasks as a gate.","d":"Product Backlog remains the single source of work for the product."},"guideInsight":"Sprint Backlog: highly visible, real-time; updated throughout Sprint","examTip":"Visibility exists for empiricism, not micromanagement.","realWorld":"Make the Sprint Goal and plan visible on the same board the team actually uses.","remember":"Visible Sprint Backlog enables inspect & adapt.","examTrack":"PSM-I","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Sprint Backlog"},{"id":75,"category":"Increment","difficulty":"Advanced","type":"tf","question":"True or False: Each Increment is additive to all prior Increments and thoroughly verified, ensuring that all Increments work together.","options":[{"id":"a","text":"True","correct":true},{"id":"b","text":"False","correct":false}],"correctWhy":"An Increment is a concrete stepping stone toward the Product Goal. Each Increment is additive to all prior Increments and thoroughly verified, ensuring that all Increments work together. In order to provide value, the Increment must be usable.","wrongWhy":{"b":"False is incorrect — additivity and verification are explicit."},"guideInsight":"Increments are additive and verified to work together; must be usable","examTip":"Integration/verification is part of being an Increment, not optional.","realWorld":"Continuous integration practices support additive Increments in real teams.","remember":"Increments add up and must work together.","examTrack":"PSM-I","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Increment"},{"id":76,"category":"Scaling Concepts","difficulty":"Advanced","type":"tf","question":"True or False: When multiple Scrum Teams work together on a product, they must mutually define and comply with the same Definition of Done.","options":[{"id":"a","text":"True","correct":true},{"id":"b","text":"False","correct":false}],"correctWhy":"If multiple Scrum Teams are working together on a product, they must mutually define and comply with the same Definition of Done. They also share Product Goal, Product Backlog, and Product Owner when reorganized around one product.","wrongWhy":{"b":"False is incorrect — same DoD is required for multiple teams on a product."},"guideInsight":"Multiple teams on one product share the same Definition of Done","examTip":"Pair with shared Product Goal/Backlog/PO for scaling questions.","realWorld":"Facilitate a cross-team DoD workshop when teams diverge on quality.","remember":"Multi-team product → one shared DoD.","examTrack":"PSM-I","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Scaling Concepts"},{"id":77,"category":"Risk Management","difficulty":"Advanced","type":"scenario","question":"A team proposes a three-month Sprint to 'reduce meeting overhead' and deliver a safer big-bang release. What risk guidance does the Guide imply?","options":[{"id":"a","text":"Sprints are one month or less; longer Sprints can make the Sprint Goal obsolete, increase complexity, and raise risk — short Sprints enable more learning","correct":true},{"id":"b","text":"Three-month Sprints are preferred for complex products","correct":false},{"id":"c","text":"Meeting overhead should always eliminate Daily Scrums","correct":false},{"id":"d","text":"Big-bang releases are required by Scrum","correct":false}],"correctWhy":"Sprints are fixed length of one month or less. When a Sprint's horizon is too long the Sprint Goal may become invalid, complexity may rise, and risk may increase. Shorter Sprints can be employed to generate more learning cycles and limit risk of cost and effort to a smaller time frame.","wrongWhy":{"b":"Opposite of Guide guidance.","c":"Daily Scrums remain a formal event; Developers structure them.","d":"Increments may be delivered before Sprint end; Review isn't a release gate."},"guideInsight":"Longer Sprints increase risk; max one month; shorter Sprints can increase learning","examTip":"Any Sprint > 1 month is automatically wrong.","realWorld":"If overhead feels high, inspect event effectiveness in Retro — don't abolish empiricism.","remember":"Sprint > 1 month increases risk — not allowed.","examTrack":"PSM-I","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Risk Management"},{"id":78,"category":"Dependency Management","difficulty":"Advanced","type":"single","question":"What structural choice in the Scrum Guide reduces dependency chaos when more people are needed on one product?","options":[{"id":"a","text":"Multiple cohesive Scrum Teams focused on the same product, sharing the same Product Goal, Product Backlog, and Product Owner","correct":true},{"id":"b","text":"Component teams with separate Product Backlogs and competing Product Owners","correct":false},{"id":"c","text":"A program manager who assigns tasks across teams daily","correct":false},{"id":"d","text":"Temporary hierarchies inside each Scrum Team","correct":false}],"correctWhy":"If Scrum Teams become too large, reorganize into multiple cohesive Scrum Teams each focused on the same product, sharing Product Goal, Product Backlog, and Product Owner. Scrum Teams are cross-functional and without sub-teams or hierarchies.","wrongWhy":{"b":"Competing POs/backlogs increase dependency conflict.","c":"Task assignment across teams by a PM is not Scrum.","d":"No hierarchies within the Scrum Team."},"guideInsight":"Scaling structure: cohesive teams, shared Goal/Backlog/PO","examTip":"Cohesive + shared PO/PB/Goal is the Guide's scaling seed — not Nexus/SAFe details.","realWorld":"Optimize for feature cohesion over component handoffs when possible.","remember":"Scale with shared Goal, Backlog, PO — cohesive teams.","examTrack":"PSM-I","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Dependency Management"},{"id":79,"category":"Work Spillover","difficulty":"Advanced","type":"scenario","question":"Nearly every Sprint, selected work spills over. Developers say velocity requires carrying spillover automatically. What is the Scrum-aligned response?","options":[{"id":"a","text":"Undone work returns to the Product Backlog; Developers select work they can get to Done; inspect/adapt planning and DoD adherence; forecasts don't replace empiricism","correct":true},{"id":"b","text":"Mandate automatic spillover commitments forever","correct":false},{"id":"c","text":"Abolish the Definition of Done so spillover counts as Done","correct":false},{"id":"d","text":"Extend every Sprint until spillover is zero","correct":false}],"correctWhy":"Undone items return to the Product Backlog for future consideration. Developers select what can be Done in the Sprint. Persistent spillover is a signal to inspect estimation, refinement readiness, focus, and impediments — empirically — not to normalize fake completion.","wrongWhy":{"b":"Automatic carry-over as commitment isn't Guide rule and hides learning.","c":"DoD creates transparency; abolishing it is harmful.","d":"Sprint length is fixed."},"guideInsight":"Spillover returns to PB; select Done-able work; empiricism over ritual velocity","examTip":"Velocity is not a Guide metric — don't weaponize it against DoD.","realWorld":"Pull less, refine better, finish more — protect Sprint Goal and Done.","remember":"Spillover → PB; don't auto-commit or waive DoD.","examTrack":"PSM-I","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Work Spillover"},{"id":80,"category":"Anti-Patterns","difficulty":"Advanced","type":"multi","question":"Select all that apply. Which are anti-patterns relative to the 2020 Scrum Guide?","options":[{"id":"a","text":"Treating the Sprint Review as a release gate","correct":true},{"id":"b","text":"Having a committee act as the Product Owner","correct":true},{"id":"c","text":"Using the Daily Scrum as a status meeting for the Scrum Master","correct":true},{"id":"d","text":"Developers selecting Product Backlog items for the Sprint through discussion with the Product Owner","correct":false}],"correctWhy":"Review is never a release gate; PO is one person not a committee; Daily Scrum is for Developers to inspect Sprint Goal progress, not status reporting to SM. Developers selecting items with PO discussion is correct Scrum.","wrongWhy":{"d":"This is correct Scrum behavior, not an anti-pattern."},"guideInsight":"Common anti-patterns vs Guide rules","examTip":"Multi-select anti-pattern questions mix one correct practice — read carefully.","realWorld":"Coach stakeholders away from Review-as-approval and Daily-as-status.","remember":"Anti-patterns: Review gate, PO committee, Daily status to SM.","examTrack":"PSM-I","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Anti-Patterns"},{"id":81,"category":"Advanced Scenarios","difficulty":"Expert","type":"scenario","question":"An organization claims they use Scrum but skips Sprint Retrospectives to 'go faster,' keeps a separate requirements committee as Product Owner, and releases only after a steering board at Sprint Review. What is the most accurate assessment?","options":[{"id":"a","text":"They are implementing only parts of Scrum; while possible, the result is not Scrum — Scrum is immutable","correct":true},{"id":"b","text":"This is advanced Scrum tailored correctly for enterprises","correct":false},{"id":"c","text":"Skipping Retro is fine if Daily Scrum is longer","correct":false},{"id":"d","text":"A requirements committee is the recommended PO model","correct":false}],"correctWhy":"The Guide states Scrum is immutable. While implementing only parts of Scrum is possible, the result is not Scrum. Retro is a formal event; PO is one person; Review is not a release gate.","wrongWhy":{"b":"These changes break immutability and core accountabilities.","c":"Events aren't interchangeable substitutes.","d":"PO is one person, not a committee."},"guideInsight":"Scrum is immutable; partial implementation is not Scrum","examTip":"Immutability questions often appear as 'Scrum-but' scenarios.","realWorld":"Name the gaps honestly and coach a path back to the full framework.","remember":"Scrum-but (partial) ≠ Scrum; Scrum is immutable.","examTrack":"PSM-I","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Advanced Scenarios"},{"id":82,"category":"Advanced Scenarios","difficulty":"Expert","type":"multi","question":"Select all that apply. Which statements reflect the 2020 Scrum Guide compared with common outdated practices?","options":[{"id":"a","text":"There is one cohesive Scrum Team with no sub-teams or hierarchies","correct":true},{"id":"b","text":"Developers are self-managing and decide who does what, when, and how","correct":true},{"id":"c","text":"The separate Development Team construct with its own hierarchy is the 2020 model","correct":false},{"id":"d","text":"The Scrum Team consists of one Scrum Master, one Product Owner, and Developers","correct":true}],"correctWhy":"2020 defines one Scrum Team (SM, PO, Developers) with no sub-teams or hierarchies. Developers self-manage. The older separate Development Team framing is outdated.","wrongWhy":{"c":"2020 removed the separate Development Team as a managing entity."},"guideInsight":"2020 Scrum Team model vs outdated Development Team hierarchy","examTip":"Experienced practitioner trap: 2017 Development Team vs 2020 Developers in one team.","realWorld":"Dissolve mini-waterfall handoffs and team-lead task assignment inside the team.","remember":"2020: one Scrum Team, no Dev-Team hierarchy.","examTrack":"PSM-I","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Advanced Scenarios"},{"id":83,"category":"Leadership & Coaching","difficulty":"Expert","type":"scenario","question":"Developers ask the Scrum Master to decide who works on which Sprint Backlog item. What is the best coaching response?","options":[{"id":"a","text":"Coach self-management: Developers decide who does what, when, and how; facilitate their planning collaboration toward the Sprint Goal","correct":true},{"id":"b","text":"Assign the tasks since the SM is accountable for delivery dates","correct":false},{"id":"c","text":"Ask the Product Owner to assign owners because PO maximizes value","correct":false},{"id":"d","text":"Escalate to a project manager for a RACI matrix","correct":false}],"correctWhy":"Self-managing means the Scrum Team internally decides who does what, when, and how. The SM coaches the team in self-management and cross-functionality rather than assigning work. Delivery of a valuable useful Increment is a whole-team accountability.","wrongWhy":{"b":"SM is not a task assigner or delivery date owner in that sense.","c":"PO doesn't assign Developer tasks.","d":"Adding PM task control undermines self-management."},"guideInsight":"Self-managing: who/what/when/how decided internally; SM coaches","examTip":"When stuck, teach decision frameworks — don't become the scheduler.","realWorld":"Pair facilitation in Planning Topic Three until the team owns the plan confidently.","remember":"SM coaches self-management — doesn't assign work.","examTrack":"PSM-I","certifications":["PSM-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Leadership & Coaching"},{"id":84,"category":"Organizational Change","difficulty":"Expert","type":"multi","question":"Select all that apply. Which organizational behaviors respect Product Owner decisions as required by the Guide?","options":[{"id":"a","text":"The organization respects the Product Owner's decisions about Product Backlog content and ordering","correct":true},{"id":"b","text":"The Product Owner's decisions are visible in the content and ordering of the Product Backlog","correct":true},{"id":"c","text":"Anyone may unilaterally override the Product Owner by changing the Product Backlog without convincing them","correct":false},{"id":"d","text":"Those who want to change the Product Backlog do so by trying to convince the Product Owner","correct":true}],"correctWhy":"For PO accountability to succeed, the entire organization must respect their decisions. These decisions are visible in the content and ordering of the Product Backlog. Anyone may try to influence by convincing the PO.","wrongWhy":{"c":"Unilateral override without convincing the PO violates Guide expectations."},"guideInsight":"Organization must respect PO decisions; influence by convincing PO","examTip":"Expert exams stress org respect for PO decisions.","realWorld":"If executives reorder Jira overnight, PO accountability is theater — fix governance.","remember":"Respect PO decisions; convince to influence.","examTrack":"PSM-I","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Organizational Change"},{"id":85,"category":"Scrum Adoption","difficulty":"Expert","type":"scenario","question":"A transformation office wants to 'install Scrum' by adding events only, keeping component handoffs, and measuring success by utilization. What should a Scrum Master emphasize?","options":[{"id":"a","text":"Scrum is a lightweight framework for adaptive solutions to complex problems via empiricism and lean thinking; adopt accountabilities, artifacts/commitments, and inspect-adapt events — not meetings bolted onto a waterfall org","correct":true},{"id":"b","text":"Events alone are sufficient to claim Scrum","correct":false},{"id":"c","text":"Utilization is the Guide's primary success metric","correct":false},{"id":"d","text":"Component handoffs are required for cross-functionality","correct":false}],"correctWhy":"Scrum definition and theory require empiricism/lean thinking, a cross-functional self-managing Scrum Team accountable for a valuable useful Increment each Sprint, and the full framework. Partial adoption of events without accountabilities/artifacts is not Scrum. Success is valuable Increments toward Product Goals, not utilization.","wrongWhy":{"b":"Immutability — parts alone aren't Scrum.","c":"Guide focuses on value/Increments/empiricism, not utilization.","d":"Cross-functional means all skills to create value each Sprint — handoffs are often waste."},"guideInsight":"Scrum definition + immutability + whole-team Increment accountability","examTip":"Adoption ≠ ceremony injection.","realWorld":"Start with a real Product Goal, one PO, and Done Increments — then scale learning.","remember":"Adoption needs full framework + empiricism, not ceremony theater.","examTrack":"PSM-I","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Scrum Adoption"},{"id":86,"category":"Agile Mindset","difficulty":"Expert","type":"single","question":"Why is Scrum described as purposefully incomplete?","options":[{"id":"a","text":"It only defines required parts for implementing Scrum theory; other techniques/processes/frameworks may be employed — guidance fills in with intelligence and experience","correct":true},{"id":"b","text":"Because teams should invent their own pillars replacing Transparency","correct":false},{"id":"c","text":"Because the Sprint can be skipped when busy","correct":false},{"id":"d","text":"Because accountabilities are optional suggestions","correct":false}],"correctWhy":"Scrum is purposefully incomplete, only defining the parts required to implement Scrum theory. Rules don't prescribe every detail; various processes, techniques, and methods may be employed within the framework. Scrum is still immutable regarding its defined parts.","wrongWhy":{"b":"Pillars are defined; incompleteness doesn't mean replacing theory.","c":"Sprint is the container heartbeat.","d":"Accountabilities are part of Scrum's definition."},"guideInsight":"Purposefully incomplete vs immutable defined parts","examTip":"Incomplete ≠ optional core. You may add practices; you may not subtract Scrum's essence and still call it Scrum.","realWorld":"Add engineering practices, UX research, etc., inside Scrum without breaking accountabilities.","remember":"Purposefully incomplete: add practices; don't remove Scrum.","examTrack":"PSM-I","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Agile Mindset"},{"id":87,"category":"Customer Collaboration","difficulty":"Expert","type":"tf","question":"True or False: Keeping customers and key stakeholders away from Sprint Reviews for many Sprints weakens empirical product management because the Sprint Review is where the Scrum Team presents results to key stakeholders and collaborates on what to do next toward the Product Goal.","options":[{"id":"a","text":"True","correct":true},{"id":"b","text":"False","correct":false}],"correctWhy":"Sprint Review includes presenting results to key stakeholders, discussing Product Goal progress, and determining future adaptations; the Product Backlog may be adjusted. Without that inspection loop, adaptation and empirical product planning suffer.","wrongWhy":{"b":"False is incorrect — stakeholder inspection at Review is central to empiricism."},"guideInsight":"Sprint Review stakeholder collaboration supports empiricism toward the Product Goal","examTip":"Closed-door multi-Sprint delivery is an empiricism failure mode.","realWorld":"Invite real users/stakeholders to Reviews and release Done Increments early.","remember":"Frequent stakeholder inspection enables adaptation.","examTrack":"PSM-I","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Customer Collaboration"},{"id":88,"category":"Stakeholder Interaction","difficulty":"Expert","type":"single","question":"During Sprint Review, who should be present beyond the Scrum Team according to the Guide's intent?","options":[{"id":"a","text":"Key stakeholders invited by the Product Owner / for whom the Scrum Team presents results and collaborates on what to do next","correct":true},{"id":"b","text":"Only the CEO, always","correct":false},{"id":"c","text":"No one — Review is Developers-only","correct":false},{"id":"d","text":"Only the Scrum Master and auditors","correct":false}],"correctWhy":"The Scrum Team presents the results of their work to key stakeholders and progress toward the Product Goal is discussed. Attendees collaborate on what to do next. The PO often ensures the right stakeholders engage as part of maximizing value and empirical planning.","wrongWhy":{"b":"Not mandated to be only the CEO.","c":"Stakeholders are part of Review.","d":"Not an audit-only meeting."},"guideInsight":"Sprint Review includes key stakeholders; collaborate on next steps","examTip":"Know Review attendees: Scrum Team + key stakeholders.","realWorld":"PO curates stakeholder attendance for decisions that affect the Product Backlog.","remember":"Sprint Review needs key stakeholders, not a private team huddle.","examTrack":"PSM-I","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Stakeholder Interaction"},{"id":89,"category":"Product Management","difficulty":"Expert","type":"scenario","question":"Two business units fund one product and demand two ordered Product Backlogs managed by rotating committees. What is the Scrum-consistent redesign?","options":[{"id":"a","text":"One Product Owner, one Product Backlog, one Product Goal for the product; funders influence by convincing the PO; multiple teams if needed share that Goal/Backlog/PO","correct":true},{"id":"b","text":"Keep two backlogs and two committees — that is still one product in Scrum","correct":false},{"id":"c","text":"Let the SM merge backlogs secretly each week","correct":false},{"id":"d","text":"Create a hierarchy of Product Owners with a 'chief' who assigns Developer tasks","correct":false}],"correctWhy":"Product Backlog is the single source of work. PO is one person, not a committee. Multiple teams on one product share the same Product Goal, Product Backlog, and Product Owner. Organization must respect PO decisions; others convince the PO.","wrongWhy":{"b":"Two backlogs break the single source model for one product.","c":"Secrecy harms transparency; SM doesn't own backlog ordering.","d":"No hierarchies; PO doesn't assign Developer tasks."},"guideInsight":"One product → one PB, one PO, one Product Goal (teams may be multiple)","examTip":"Funding complexity doesn't justify dual backlogs on one product.","realWorld":"Use transparent ordering criteria and a single PO empowered by leadership.","remember":"One product: one PO, one PB, one Product Goal.","examTrack":"PSM-I","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Product Management"},{"id":90,"category":"Release Planning","difficulty":"Expert","type":"scenario","question":"A release manager insists nothing can go live except during Sprint Review approval. How do you respond using the Guide?","options":[{"id":"a","text":"An Increment may be delivered to stakeholders prior to the end of the Sprint; the Sprint Review should never be considered a gate to releasing value; work must meet DoD to be released","correct":true},{"id":"b","text":"Agree — Review is the mandatory release gate in Scrum","correct":false},{"id":"c","text":"Release anytime even if DoD is unmet","correct":false},{"id":"d","text":"Only the Scrum Master can approve production releases","correct":false}],"correctWhy":"The Guide explicitly allows delivering an Increment before Sprint end and states the Sprint Review should never be considered a gate to releasing value. Meeting DoD remains required for Increment/release.","wrongWhy":{"b":"Directly contradicts the Guide.","c":"DoD required.","d":"Not SM's defined authority as release approver."},"guideInsight":"Review is not a release gate; mid-Sprint delivery of Done Increments allowed","examTip":"Memorize the exact 'never a gate' phrase.","realWorld":"Decouple release mechanics from the Review ceremony while keeping stakeholder inspect/adapt.","remember":"Done Increments can release anytime — Review ≠ gate.","examTrack":"PSM-I","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Release Planning"},{"id":91,"category":"Roadmaps","difficulty":"Expert","type":"tf","question":"True or False: The 2020 Scrum Guide defines the product roadmap as an official Scrum artifact with its own commitment.","options":[{"id":"a","text":"True","correct":false},{"id":"b
