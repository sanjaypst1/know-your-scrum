:"Evidence from use and economics, plus testing opinions as hypotheses, strengthens empiricism and value decisions.","wrongWhy":{"c":"Loudest-voice ordering is politics, not value maximization.","d":"Kano analysis is complementary technique, not a Scrum mandate."},"guideInsight":"Empiricism relies on transparency, inspection, and adaptation; market research techniques remain complementary.","examTip":"Prefer observed outcomes over untested opinions—especially executive opinions.","realWorld":"Pair roadmap debates with instrumentation and discovery findings.","remember":"Evidence beats untested opinion."},{"id":2017,"certifications":["PSPO-II"],"category":"Product Owner stances","competency":"Managing Products with Agility","topic":"Complementary PO stances","difficulty":"Advanced","type":"multi","question":"Which stances are generally considered constructive complementary practices for an advanced Product Owner? (Choose the best three.)","options":[{"id":"a","text":"Customer Representative","correct":true},{"id":"b","text":"Collaborator","correct":true},{"id":"c","text":"Influencer","correct":true},{"id":"d","text":"Gatekeeper who blocks Developers from stakeholders","correct":false},{"id":"e","text":"Project Manager who assigns daily tasks to Developers","correct":false}],"correctWhy":"Customer Representative, Collaborator, and Influencer help the PO connect users, enable teamwork, and align the organization—without contradicting Scrum accountabilities.","wrongWhy":{"d":"Gatekeeper is an anti-stance that reduces transparency and feedback.","e":"Project Manager anti-stance invades Developers’ self-management."},"guideInsight":"Stances are complementary practice language; Scrum roles/accountabilities remain Product Owner, Scrum Master, and Developers.","examTip":"Know both strong stances and anti-stances for scenario questions.","realWorld":"Shift from ticket admin toward collaboration, influence, and customer intimacy.","remember":"Strong PO stances enable value; anti-stances create drag."},{"id":2018,"certifications":["PSPO-II"],"category":"Forecasting and release planning","competency":"Managing Products with Agility","topic":"Release planning","difficulty":"Advanced","type":"multi","question":"A Product Owner is preparing a release forecast for leadership. Which practices are sound? (Choose the best two.)","options":[{"id":"a","text":"Base forecasts on historical throughput and remaining work toward a Product Goal, stating assumptions.","correct":true},{"id":"b","text":"Update forecasts as new evidence emerges each Sprint.","correct":true},{"id":"c","text":"Promise an exact date for a large fixed scope to eliminate uncertainty.","correct":false},{"id":"d","text":"Forbid any forecast because only Sprint Backlog items may be discussed publicly.","correct":false}],"correctWhy":"Empirical forecasting uses history, remaining work, and transparent assumptions, then adapts as reality is inspected.","wrongWhy":{"c":"False certainty about complex work is anti-empirical and risky.","d":"Product-level forecasting is legitimate and expected of Product Owners."},"guideInsight":"Scrum enables forecasting through transparency of the Product Backlog and Done Increments; it does not require deterministic long-range promises.","examTip":"Forecasts are living artifacts of empiricism, not contracts carved in stone.","realWorld":"Show range forecasts and what would change the date or scope.","remember":"Update forecasts when evidence changes."},{"id":2019,"certifications":["PSPO-II"],"category":"Evidence-Based Management","competency":"Evolving the Agile Organization","topic":"Key Value Areas","difficulty":"Advanced","type":"multi","question":"In Evidence-Based Management (complementary practice), which are Key Value Areas commonly used to inspect product and organizational capability? (Choose the best four.)","options":[{"id":"a","text":"Current Value","correct":true},{"id":"b","text":"Unrealized Value","correct":true},{"id":"c","text":"Time-to-Market","correct":true},{"id":"d","text":"Ability to Innovate","correct":true},{"id":"e","text":"Mandatory story-point burnup as a Scrum Guide commitment","correct":false}],"correctWhy":"EBM’s four Key Value Areas help organizations discuss value delivered, value possible, delivery speed, and innovation capacity—as complementary measures.","wrongWhy":{"e":"Story-point burnups are optional tracking techniques, not Scrum commitments or EBM Key Value Areas."},"guideInsight":"Label EBM correctly as complementary; do not present its measures as Scrum Guide requirements.","examTip":"Memorize the four KVAs and that they are not Guide-mandated.","realWorld":"Use a few measures per KVA that leadership actually acts on.","remember":"CV, UV, T2M, A2I—useful, not mandatory Scrum."},{"id":2020,"certifications":["PSPO-II"],"category":"Product Backlog management","competency":"Managing Products with Agility","topic":"Refinement and focus","difficulty":"Advanced","type":"multi","question":"Which Product Backlog management behaviors strengthen value focus? (Choose the best two.)","options":[{"id":"a","text":"Keep items near the top clearer and more actionable for upcoming Sprints.","correct":true},{"id":"b","text":"Remove or demote items that no longer serve the Product Goal.","correct":true},{"id":"c","text":"Write every stakeholder request as a permanent backlog item forever.","correct":false},{"id":"d","text":"Require Business Model Canvas updates before any refinement conversation.","correct":false}],"correctWhy":"Effective backlog management keeps near-term work ready and continuously aligns the backlog to the Product Goal, including deletion.","wrongWhy":{"c":"Endless request parking lots create Clerk behavior and obscure value.","d":"Canvas tools are optional; they should not gate refinement."},"guideInsight":"The Product Backlog is an emergent, ordered list; refinement is an ongoing activity, not a separate Scrum event.","examTip":"A brave PO deletes low-value items.","realWorld":"Schedule periodic ‘stop doing’ reviews with stakeholders.","remember":"Refine for readiness; prune for Product Goal focus."},{"id":2021,"certifications":["PSPO-II"],"category":"Stakeholders and customers","competency":"Managing Products with Agility","topic":"Stakeholder conflict","difficulty":"Expert","type":"multi","question":"Sales wants a custom one-off for a single large prospect; Customer Success wants stability for the installed base. Which Product Owner moves are strongest? (Choose the best two.)","options":[{"id":"a","text":"Evaluate the one-off against the Product Goal, maintenance cost, and opportunity cost to the broader customer base.","correct":true},{"id":"b","text":"Seek a smaller experiment or configuration approach if strategic learning is possible without hijacking the product.","correct":true},{"id":"c","text":"Always accept enterprise custom work because revenue today always maximizes long-term value.","correct":false},{"id":"d","text":"Force Developers to maintain a secret branch outside the Definition of Done.","correct":false}],"correctWhy":"Advanced POs weigh strategic value and product integrity, sometimes running bounded experiments, rather than automatically accepting custom forks.","wrongWhy":{"c":"Short-term revenue can destroy Ability to Innovate and Current Value for the majority.","d":"Bypassing Done and transparency creates hidden risk and is an anti-pattern."},"guideInsight":"Maximizing product value includes long-term product health, not only a single deal’s output.","examTip":"Custom work questions test opportunity cost and Product Goal coherence.","realWorld":"Price true cost of custom work or turn it into a generalizable capability.","remember":"One customer’s deal is not automatically the Product Goal."},{"id":2022,"certifications":["PSPO-II"],"category":"Scaling fundamentals","competency":"Understanding and Applying the Scrum Framework","topic":"Definition of Done across teams","difficulty":"Expert","type":"multi","question":"Two teams on one product integrate late and call partially integrated work ‘Done.’ Which statements are correct? (Choose the best two.)","options":[{"id":"a","text":"Multiple teams on one product should share a Definition of Done that produces an integrated usable Increment.","correct":true},{"id":"b","text":"If a broader Done is required, teams must meet it for work to be part of the Increment.","correct":true},{"id":"c","text":"Each team should keep incompatible Done definitions to protect Velocity.","correct":false},{"id":"d","text":"Integration can be deferred indefinitely as long as story points are completed.","correct":false}],"correctWhy":"Done must produce a usable Increment; with multiple teams, Done includes integration expectations that protect transparency of progress.","wrongWhy":{"c":"Incompatible Done definitions create false progress and integration debt.","d":"Points completed without a usable Increment are output theater."},"guideInsight":"If the Definition of Done is part of standards, all Scrum Teams must follow it as a minimum; they may strengthen it but not weaken integration quality.","examTip":"False Done is a classic multi-team trap.","realWorld":"Invest in continuous integration so Done means releasable together.","remember":"Done means integrated and usable for the product."},{"id":2023,"certifications":["PSPO-II"],"category":"Organizational culture","competency":"Evolving the Agile Organization","topic":"Culture and empiricism","difficulty":"Expert","type":"multi","question":"Which cultural conditions most enable Product Owners to maximize value? (Choose the best two.)","options":[{"id":"a","text":"Psychological safety to share bad news and kill ideas early.","correct":true},{"id":"b","text":"Authority aligned with Product Owner accountability for ordering and release decisions.","correct":true},{"id":"c","text":"Punishing teams for failed experiments regardless of learning quality.","correct":false},{"id":"d","text":"Requiring executive pre-approval of every backlog order change.","correct":false}],"correctWhy":"Empiricism needs honesty and decision rights. Without safety and authority, POs become clerks or messengers.","wrongWhy":{"c":"Punishing learning destroys Ability to Innovate and experimentation.","d":"Pre-approval chains recreate Gatekeeper culture and slow adaptation."},"guideInsight":"Organizations succeed with Scrum when they respect accountabilities and enable transparency; culture is outside the Guide but decisive in practice.","examTip":"Link culture symptoms to value accountability failure modes.","realWorld":"Sponsor forums that reward evidence-based kills and pivots.","remember":"Safety plus decision rights enable empirical product leadership."},{"id":2024,"certifications":["PSPO-II"],"category":"Hypothesis and experimentation","competency":"Managing Products with Agility","topic":"Experiment design","difficulty":"Expert","type":"multi","question":"Which experiment design choices best fit an advanced Product Owner? (Choose the best two.)","options":[{"id":"a","text":"Define what evidence would cause you to stop, pivot, or scale before building big.","correct":true},{"id":"b","text":"Prefer the cheapest test that can reduce the most critical uncertainty.","correct":true},{"id":"c","text":"Ship the entire annual roadmap as one experiment to maximize learning volume.","correct":false},{"id":"d","text":"Treat OKRs as proof that no further product evidence is needed.","correct":false}],"correctWhy":"Good experiments pre-define decision criteria and minimize cost of learning—core Experimenter stance practice.","wrongWhy":{"c":"Giant releases maximize risk and confound learning.","d":"OKRs express intent; they do not replace inspecting real outcomes."},"guideInsight":"Empiricism is strengthened by frequent delivery of valuable Increments; complementary experimentation techniques make learning intentional.","examTip":"Look for answers that reduce uncertainty cheaply and decide from evidence.","realWorld":"Write a one-page experiment brief: hypothesis, metric, sample, kill criteria.","remember":"Decide kill/pivot/scale criteria before the build gets big."},{"id":2025,"certifications":["PSPO-II"],"category":"Understanding Scrum","competency":"Understanding and Applying the Scrum Framework","topic":"Product Owner accountability","difficulty":"Expert","type":"multi","question":"Which statements correctly describe Product Owner accountability in Scrum? (Choose the best three.)","options":[{"id":"a","text":"Maximizing the value of the product resulting from the work of the Scrum Team.","correct":true},{"id":"b","text":"Effective Product Backlog management, which may be delegated but remains the Product Owner’s accountability.","correct":true},{"id":"c","text":"Ensuring stakeholders understand and respect Product Backlog ordering.","correct":true},{"id":"d","text":"Assigning tasks to Developers each morning.","correct":false},{"id":"e","text":"Being the only person allowed to talk to customers.","correct":false}],"correctWhy":"These match Scrum Guide Product Owner accountabilities: value, backlog management (delegable work, not accountability), and stakeholder understanding of order.","wrongWhy":{"d":"Developers manage their own Sprint work; PO-as-Project-Manager is an anti-stance.","e":"Gatekeeper anti-stance; collaboration with customers can be shared while PO remains accountable for value decisions."},"guideInsight":"The Product Owner may delegate backlog work but remains accountable; Developers self-manage Sprint execution.","examTip":"Delegation of work ≠ delegation of accountability.","realWorld":"Use analysts/designers for drafting items while the PO owns order and outcomes.","remember":"PO accountability for value cannot be outsourced."},{"id":2026,"certifications":["PSPO-II"],"category":"Sprint Review","competency":"Understanding and Applying the Scrum Framework","topic":"Release timing","difficulty":"Advanced","type":"tf","question":"True or false: A Product Owner may release a Done Increment to users before the Sprint ends.","options":[{"id":"a","text":"True","correct":true},{"id":"b","text":"False","correct":false}],"correctWhy":"Scrum explicitly allows delivering a Done Increment to stakeholders prior to the end of the Sprint when valuable.","wrongWhy":{"b":"False would incorrectly treat the Sprint calendar or Sprint Review as a mandatory release gate."},"guideInsight":"Increments may be delivered before Sprint end; Review still inspects outcomes and adapts the backlog.","examTip":"Release readiness = Done + PO value decision, not Sprint boundary.","realWorld":"Continuous delivery pipelines make mid-Sprint releases routine.","remember":"Done increments can ship mid-Sprint."},{"id":2027,"certifications":["PSPO-II"],"category":"Evidence-Based Management","competency":"Evolving the Agile Organization","topic":"EBM and the Guide","difficulty":"Advanced","type":"tf","question":"True or false: Evidence-Based Management Key Value Areas are mandatory Scrum Guide requirements for every Product Owner.","options":[{"id":"a","text":"True","correct":false},{"id":"b","text":"False","correct":true}],"correctWhy":"EBM is complementary practice. Scrum requires empiricism and value maximization but does not mandate EBM’s specific Key Value Areas.","wrongWhy":{"a":"Treating EBM as mandatory Guide content confuses complementary techniques with Scrum rules."},"guideInsight":"Keep Guide commitments (Product Goal, Increment, events, accountabilities) distinct from EBM measures.","examTip":"If a question implies EBM is required by Scrum, it is usually wrong.","realWorld":"Adopt EBM where it improves decisions; do not fake metrics for compliance theater.","remember":"EBM is complementary, not Guide-mandated."},{"id":2028,"certifications":["PSPO-II"],"category":"Product Goal","competency":"Understanding and Applying the Scrum Framework","topic":"One Product Goal","difficulty":"Advanced","type":"tf","question":"True or false: For a single product, the Scrum Team should pursue multiple Product Goals at the same time to satisfy every department.","options":[{"id":"a","text":"True","correct":false},{"id":"b","text":"False","correct":true}],"correctWhy":"The Product Goal is the long-term objective for the Scrum Team; focus implies one Product Goal for the product at a time.","wrongWhy":{"a":"Multiple simultaneous Product Goals fracture focus and accountability."},"guideInsight":"One product → one Product Goal at a time; additional ambitions wait or replace the current Goal.","examTip":"Department satisfaction is not a reason to multiply Product Goals.","realWorld":"Sequence departmental themes as successive Goals with transparent trade-offs.","remember":"One Product Goal at a time per product."},{"id":2029,"certifications":["PSPO-II"],"category":"Complementary techniques","competency":"Managing Products with Agility","topic":"Optional techniques","difficulty":"Advanced","type":"tf","question":"True or false: Using WSJF, Kano analysis, or story points is required by the Scrum Guide for Product Backlog ordering.","options":[{"id":"a","text":"True","correct":false},{"id":"b","text":"False","correct":true}],"correctWhy":"These are optional complementary techniques. The Guide requires ordered Product Backlog ownership by the Product Owner, not a specific scoring method.","wrongWhy":{"a":"Presenting WSJF/Kano/story points as Scrum rules is a common distractor pattern."},"guideInsight":"Scrum is silent on estimation and prioritization formulas; empiricism and value remain authoritative.","examTip":"Optional technique ≠ Scrum rule.","realWorld":"Use techniques when they clarify trade-offs; drop them when they become bureaucracy.","remember":"Prioritization techniques are optional aids."},{"id":2030,"certifications":["PSPO-II"],"category":"Outcomes versus outputs","competency":"Managing Products with Agility","topic":"Measuring success","difficulty":"Advanced","type":"tf","question":"True or false: A Product Owner can claim success primarily because the team completed many Product Backlog items, even if customer outcomes are unchanged.","options":[{"id":"a","text":"True","correct":false},{"id":"b","text":"False","correct":true}],"correctWhy":"Completing items is output. Product Owner success is tied to maximizing value—outcomes for customers and the organization.","wrongWhy":{"a":"Equating throughput with value is a classic output trap."},"guideInsight":"Maximizing value is not defined as maximizing item count; Increments should be useful steps toward the Product Goal.","examTip":"Challenge any answer that celebrates volume without outcomes.","realWorld":"Report outcome metrics beside delivery metrics in reviews.","remember":"Outcomes, not item count, define PO success."},{"id":2031,"certifications":["PSPO-II"],"category":"Stakeholder conflict","competency":"Managing Products with Agility","topic":"Conflicting stakeholders","difficulty":"Expert","type":"scenario","question":"You are Product Owner for a B2B analytics product. Marketing insists on a public launch of a half-baked AI feature to match a competitor’s announcement. Risk and Legal warn of misleading claims. Developers say a thin, accurate capability could be Done in two Sprints, while the full marketing vision would take a quarter and likely be unstable. Marketing threatens to escalate if the flashy launch is not scheduled next month. What is the strongest move?","options":[{"id":"a","text":"Protect the Product Goal and customer trust by ordering a thin, honest Increment, using evidence of risk and opportunity cost to influence Marketing, and declining a deceptive launch.","correct":true},{"id":"b","text":"Schedule the flashy launch next month and ask Developers to bypass the Definition of Done for demos.","correct":false},{"id":"c","text":"Add both the thin and full versions as equal top priorities so nobody feels blocked.","correct":false},{"id":"d","text":"Hand the decision to a steering committee and stop ordering the backlog until they vote.","correct":false}],"correctWhy":"The Influencer and Decision Maker stances use evidence and trust as value. A usable honest Increment beats a risky announcement that damages Current Value.","wrongWhy":{"b":"Bypassing Done for marketing theater creates false transparency and customer harm.","c":"Equal top priorities abandon ordering and focus.","d":"Abdicating ordering turns the PO into a Clerk and slows empiricism."},"guideInsight":"PO owns value and ordering; Done protects Increment integrity. Influence is complementary practice supporting that accountability.","examTip":"When marketing pressure meets quality/trust risk, protect Done and Product Goal.","realWorld":"Offer Marketing a credible narrative based on what will actually be Done and measurable.","remember":"Do not trade customer trust for announcement theater."},{"id":2032,"certifications":["PSPO-II"],"category":"Forecasting","competency":"Managing Products with Agility","topic":"False certainty","difficulty":"Expert","type":"scenario","question":"Your CFO wants a board slide with a single committed date for a regulatory capability plus twelve growth features. Historical data shows high variability, dependencies on a vendor API, and incomplete discovery for half the growth ideas. What forecast approach is strongest?","options":[{"id":"a","text":"Separate must-meet regulatory outcomes from optional growth bets; forecast ranges with assumptions, risks, and inspection points rather than one false-certain date for everything.","correct":true},{"id":"b","text":"Multiply total story points by average Velocity and publish that date as guaranteed.","correct":false},{"id":"c","text":"Refuse to discuss anything beyond the current Sprint Backlog.","correct":false},{"id":"d","text":"Commit to the earliest date Marketing prefers to maintain executive confidence.","correct":false}],"correctWhy":"Empirical forecasting makes uncertainty visible and separates constrained outcomes from optional scope, preserving honesty with the board.","wrongWhy":{"b":"Story points are optional and still do not create guarantees under high uncertainty.","c":"Product Owners should provide foresight; Scrum does not ban forecasting.","d":"Confidence built on false promises collapses when reality arrives."},"guideInsight":"Transparency includes making risks and progress visible; complementary release planning uses that transparency without claiming certainty.","examTip":"Split mandatory outcomes from optional features in forecasts.","realWorld":"Show a regulatory confidence band and a growth option set updated each Sprint Review.","remember":"Ranges and assumptions beat a fake single date."},{"id":2033,"certifications":["PSPO-II"],"category":"Multi-team product","competency":"Understanding and Applying the Scrum Framework","topic":"Scaling fundamentals","difficulty":"Expert","type":"scenario","question":"Four teams deliver one mobile banking product. Each team has started acting like a mini-product with its own ‘PO,’ backlog, and Product Goal. Customers experience inconsistent journeys. What should you do first?","options":[{"id":"a","text":"Re-establish one Product Owner, one Product Backlog, and one Product Goal, with a shared Definition of Done and transparent ordering across teams.","correct":true},{"id":"b","text":"Create a fifth coordination backlog managed by a project PMO as required by Scrum.","correct":false},{"id":"c","text":"Let each team keep its own Goal but require WSJF scoring for cross-team fairness.","correct":false},{"id":"d","text":"Merge teams into one huge Scrum Team of forty to eliminate coordination.","correct":false}],"correctWhy":"Customer incoherence is a symptom of violating one-product fundamentals. Restore single ownership and focus before adding process layers.","wrongWhy":{"b":"Scrum does not require a PMO backlog; it can obscure product ownership.","c":"WSJF cannot fix split Product Goals and split ownership.","d":"Oversized teams harm self-management; scaling should preserve Scrum Team effectiveness."},"guideInsight":"Multiple teams on one product share Product Goal, Product Backlog, Product Owner, and Done quality expectations.","examTip":"In scaling scenarios, return to one-product rules before frameworks.","realWorld":"Appoint domain representatives who advise without becoming competing Product Owners.","remember":"Fragmented ownership fragments the customer experience."},{"id":2034,"certifications":["PSPO-II"],"category":"Experimentation","competency":"Managing Products with Agility","topic":"Hypothesis-driven development","difficulty":"Expert","type":"scenario","question":"Activation is stuck at 28%. A senior designer is certain a complete visual redesign will fix it. Engineering estimates three months. Support tickets suggest onboarding copy and permission prompts are the main drop-off. What is the strongest Product Owner path?","options":[{"id":"a","text":"Form hypotheses from the drop-off evidence, run smaller experiments on copy/prompts (and maybe a lightweight visual test), and scale only what moves activation.","correct":true},{"id":"b","text":"Fund the three-month redesign immediately because design expertise outweighs support data.","correct":false},{"id":"c","text":"Require a full Business Model Canvas rewrite before any onboarding change.","correct":false},{"id":"d","text":"Ask Developers to estimate story points for the redesign as the measure of expected activation lift.","correct":false}],"correctWhy":"Evidence points to specific friction; Experimenter practice tests high-uncertainty claims cheaply instead of betting a quarter on opinion.","wrongWhy":{"b":"Expertise is input, not outcome evidence; large redesigns may miss the real cause.","c":"Canvas work is complementary and should not block urgent learning.","d":"Effort estimates do not predict outcome lift."},"guideInsight":"Empiricism favors inspecting outcomes of usable Increments; complementary experimentation focuses learning.","examTip":"Prefer smallest tests aligned to observed drop-offs.","realWorld":"Instrument funnel steps and run sequential experiments against a baseline.","remember":"Let drop-off evidence shape the experiment portfolio."},{"id":2035,"certifications":["PSPO-II"],"category":"EBM and organization","competency":"Evolving the Agile Organization","topic":"Ability to Innovate","difficulty":"Expert","type":"scenario","question":"Teams spend most capacity on defects, manual releases, and compliance paperwork. Leadership still demands more feature output. Using Evidence-Based Management as complementary practice, what diagnosis and response are strongest?","options":[{"id":"a","text":"Ability to Innovate and Time-to-Market are constrained; invest in reducing drag (quality, automation, policy waste) so value experiments can resume—not only push more features.","correct":true},{"id":"b","text":"Current Value is automatically healthy if feature counts rise.","correct":false},{"id":"c","text":"Unrealized Value should be ignored until every defect is closed forever.","correct":false},{"id":"d","text":"EBM requires replacing the Product Goal with four mandatory dashboards.","correct":false}],"correctWhy":"Heavy operational drag signals weak Ability to Innovate and slow Time-to-Market. More feature pressure without fixing constraints worsens outcomes.","wrongWhy":{"b":"Feature counts are outputs; Current Value needs customer/business outcomes.","c":"Unrealized Value remains relevant; the issue is capacity to pursue it.","d":"EBM does not replace Product Goals or become a Guide mandate."},"guideInsight":"Scrum needs a usable Done Increment frequently; organizational constraints that prevent that must be addressed. EBM language helps explain why.","examTip":"Connect delivery drag to A2I/T2M, then to value outcomes.","realWorld":"Quantify % capacity on unplanned work and release lead time for leadership.","remember":"Innovation capacity is part of product value strategy."},{"id":2036,"certifications":["PSPO-II"],"category":"Saying no","competency":"Managing Products with Agility","topic":"Opportunity cost","difficulty":"Expert","type":"scenario","question":"Your Product Goal is to reduce checkout abandonment by 20% this half. A regional VP demands a local payment method used by a tiny segment that would consume most of the next three Sprints. Analytics show the top abandonment drivers are address validation and shipping clarity. What do you do?","options":[{"id":"a","text":"Say no for now with data: show abandonment drivers, Product Goal impact, and opportunity cost; offer a later experiment if evidence grows.","correct":true},{"id":"b","text":"Insert the payment method at the top to avoid political risk.","correct":false},{"id":"c","text":"Create a second Product Goal for the regional VP simultaneously.","correct":false},{"id":"d","text":"Have Developers do the payment method as hidden overtime outside Scrum.","correct":false}],"correctWhy":"Decision Maker accountability uses evidence and Product Goal focus. Transparent ‘not now’ preserves value better than political compliance.","wrongWhy":{"b":"Appeasement ordering abandons empiricism and the Goal.","c":"A second concurrent Product Goal dilutes focus for one product.","d":"Hidden work destroys transparency and sustainability."},"guideInsight":"Product Goal focuses Scrum Team work; PO ordering should reflect that focus.","examTip":"Best ‘no’ answers cite Goal, evidence, and opportunity cost together.","realWorld":"Publish a short decision record stakeholders can reuse next time.","remember":"Protect the Product Goal with evidence-backed trade-offs."},{"id":2037,"certifications":["PSPO-II"],"category":"Release and Review","competency":"Managing Products with Agility","topic":"Review vs gate","difficulty":"Expert","type":"scenario","question":"A Done payment-fix Increment is ready on Wednesday. Customers are actively failing payments. The PMO calendar says releases only happen after Friday Sprint Review ‘acceptance.’ What is the strongest Product Owner action?","options":[{"id":"a","text":"Release the Done Increment now to restore value, then use Sprint Review to inspect outcomes and adapt the backlog.","correct":true},{"id":"b","text":"Wait for Friday acceptance because Review is the Scrum release gate.","correct":false},{"id":"c","text":"Release without meeting the Definition of Done to help customers faster.","correct":false},{"id":"d","text":"Cancel the Sprint and start a project recovery plan.","correct":false}],"correctWhy":"Customer harm plus a Done Increment makes immediate release the value-maximizing choice. Review still happens for inspection/adaptation.","wrongWhy":{"b":"Review-as-gate is a misunderstanding that delays value.","c":"Undone work is not an Increment and risks more harm.","d":"Abandoning Scrum is unnecessary when a Done fix exists."},"guideInsight":"Done Increments may be released before Sprint end; Sprint Review is not described as acceptance gating.","examTip":"Urgent value + Done → release; Review still inspects.","realWorld":"Align PMO policy with Scrum’s release flexibility or escalate the constraint as organizational impediment.","remember":"Do not hold Done value hostage to a Review ceremony."},{"id":2038,"certifications":["PSPO-II"],"category":"Anti-stances","competency":"Managing Products with Agility","topic":"Clerk and Story Writer","difficulty":"Expert","type":"scenario","question":"Stakeholders praise you for ‘great backlog hygiene’: thousands of detailed stories, every field filled, yet the product’s NPS and revenue are slipping. You rarely meet customers and mostly refine wording. Which interpretation and shift are strongest?","options":[{"id":"a","text":"You are drifting into Clerk/Story Writer anti-stances; shift toward Customer Representative, Experimenter, and Decision Maker behaviors focused on outcomes.","correct":true},{"id":"b","text":"Backlog volume proves value; keep maximizing story count.","correct":false},{"id":"c","text":"Become a Project Manager who assigns tasks daily to recover NPS.","correct":false},{"id":"d","text":"Gatekeep all stakeholder contact so Developers stay uninterrupted forever.","correct":false}],"correctWhy":"Detailed tickets without customer intimacy and outcome ownership are classic weak patterns. Strong complementary stances reconnect work to value.","wrongWhy":{"b":"Output volume with declining outcomes is failure, not success.","c":"Project Manager anti-stance attacks self-management and misses customer learning.","d":"Gatekeeper anti-stance reduces feedback quality."},"guideInsight":"Effective Product Backlog management serves value maximization; documentation density is not a Guide success criterion.","examTip":"Hygiene without outcomes signals anti-stances.","realWorld":"Block discovery time on your calendar equal to refinement time.","remember":"Backlog polish is not product value."},{"id":2039,"certifications":["PSPO-II"],"category":"Business strategy","competency":"Managing Products with Agility","topic":"Strategy alignment","difficulty":"Expert","type":"scenario","question":"Company strategy pivots to enterprise accounts, but your Product Backlog is still dominated by self-serve freemium experiments. Sales is signing enterprise pilots that the product cannot support securely. What is the strongest coherent response?","options":[{"id":"a","text":"Adapt the Product Goal toward enterprise outcomes, re-order the backlog for the capabilities those outcomes need, and make trade-offs explicit to freemium advocates.","correct":true},{"id":"b","text":"Keep the freemium Product Goal and ask Sales to stop selling until next year.","correct":false},{"id":"c","text":"Create separate Product Goals for freemium and enterprise at the same time on the same product.","correct":false},{"id":"d","text":"Freeze all delivery until a multi-day OKR offsite completes.","correct":false}],"correctWhy":"Strategy, Product Goal, and backlog ordering must align. Enterprise pilots without product capability destroy trust; focus the Goal and backlog accordingly.","wrongWhy":{"b":"Ignoring strategy while Sales moves creates organizational whiplash; the PO should lead product alignment.","c":"Two simultaneous Product Goals on one product break focus.","d":"OKRs are complementary; total freezes delay needed learning."},"guideInsight":"The Product Goal is the Scrum Team’s long-term product objective and should reflect strategic reality.","examTip":"Strategy pivot scenarios → update Product Goal and ordering.","realWorld":"Negotiate a transition Goal that covers security/admin needs for pilots first.","remember":"Misaligned strategy and backlog create false progress."},{"id":2040,"certifications":["PSPO-II"],"category":"Portfolio planning","competency":"Evolving the Agile Organization","topic":"Focus at portfolio level","difficulty":"Expert","type":"scenario","question":"Your organization runs twelve ‘Scrum initiatives’ with shared specialists. Everything is 20% done; nothing delivers meaningful outcomes. Leadership asks Product Owners to ‘try harder.’ What systemic judgement is strongest?","options":[{"id":"a","text":"Too much work-in-progress destroys Time-to-Market and Current Value; concentrate funding and specialists on fewer products/Goals with clear outcome evidence.","correct":true},{"id":"b","text":"Add more status meetings and a portfolio Kanban tool as required by the Scrum Guide.","correct":false},{"id":"c","text":"Measure success by utilization of every specialist at 100%.","correct":false},{"id":"d","text":"Replace Product Owners with a single project scheduler for all initiatives.","correct":false}],"correctWhy":"Portfolio WIP is an organizational design problem. Focusing investment improves flow of value; ‘try harder’ without focus fails.","wrongWhy":{"b":"Scrum Guide does not mandate portfolio tooling; meetings alone do not create focus.","c":"Utilization maximizes busyness, not outcomes.","d":"A scheduler recreates Project Manager control and weakens product accountability."},"guideInsight":"Scrum thrives on focus; organizations must fund focus. EBM T2M/CV thinking (complementary) explains the damage of excess WIP.","examTip":"Systemic thrashing → reduce WIP and concentrate value bets.","realWorld":"Kill or pause low-evidence initiatives to free specialists.","remember":"Starting everything finishes almost nothing of value."},{"id":2041,"certifications":["PSPO-II"],"category":"Customer representation","competency":"Managing Products with Agility","topic":"Customers vs stakeholders","difficulty":"Expert","type":"scenario","question":"Internal stakeholders want a feature that makes internal reporting easier, but usability tests show it would confuse end customers and reduce conversion. Stakeholders argue ‘they pay our salaries.’ What is the strongest Product Owner judgement?","options":[{"id":"a","text":"Prioritize customer outcomes that sustain the business, seek an alternative internal reporting approach that does not harm conversion, and explain the evidence.","correct":true},{"id":"b","text":"Always prefer internal stakeholder convenience because they are closer.","correct":false},{"id":"c","text":"Implement both experiences simultaneously without ordering, to keep peace.","correct":false},{"id":"d","text":"Ignore usability evidence because Kano analysis was not formally run.","correct":false}],"correctWhy":"Customer Representative stance (complementary) and value accountability favor end-customer outcomes that fund the organization, while still solving internal needs differently.","wrongWhy":{"b":"Proximity bias is not value maximization.","c":"Lack of ordering avoids the real trade-off.","d":"Usability evidence is valid; Kano is optional complementary technique."},"guideInsight":"PO maximizes product value; stakeholders include customers and users whose outcomes matter empirically.","examTip":"Internal convenience vs customer harm → protect customer outcomes.","realWorld":"Offer an admin-only reporting path that never touches the conversion funnel.","remember":"Salary-payers still lose if customers churn."},{"id":2042,"certifications":["PSPO-II"],"category":"Value ordering","competency":"Managing Products with Agility","topic":"Risk and value","difficulty":"Expert","type":"scenario","question":"You have three candidates near the top: (1) a security patch preventing a plausible breach, (2) a monetization tweak with strong A/B evidence, (3) a popular stakeholder pet feature with no evidence. Capacity allows only one major theme this Sprint. What ordering judgement is strongest?","options":[{"id":"a","text":"Weigh expected value including risk cost of delay; likely elevate the security risk if downside is severe, while planning the proven monetization next—and defer the pet feature.","correct":true},{"id":"b","text":"Choose the pet feature to improve stakeholder satisfaction scores.","correct":false},{"id":"c","text":"Always pick monetization because Scrum forbids working on risk.","correct":false},{"id":"d","text":"Use story points alone: smallest estimate wins.","correct":false}],"correctWhy":"Value includes protecting the product from catastrophic loss. Evidence-backed monetization is strong next; unevidenced pets wait.","wrongWhy":{"b":"Satisfaction of a stakeholder without evidence is weak value logic.","c":"Scrum does not forbid risk-reducing work; risk can dominate value.","d":"Smallest effort is not highest value."},"guideInsight":"Ordering optimizes value under constraints; risk reduction can be high value. Estimation techniques remain optional.","examTip":"Catastrophic risk vs proven upside vs no evidence—defer the last.","realWorld":"Quantify breach impact ranges when debating security vs growth.","remember":"Unevidenced pets lose to risk and proven outcomes."},{"id":2043,"certifications":["PSPO-II"],"category":"Empiricism","competency":"Managing Products with Agility","topic":"Evidence over roadmap theater","difficulty":"Expert","type":"scenario","question":"Leadership wants a 12-month Gantt of features locked for investor updates. Your market is shifting monthly. What approach best preserves agility while meeting the need for foresight?","options":[{"id":"a","text":"Share a Product Goal, near-term forecast of options, and outcome hypotheses with clear revisit cadence—not a locked feature Gantt pretending certainty.","correct":true},{"id":"b","text":"Lock the Gantt and punish teams for any change.","correct":false},{"id":"c","text":"Hide uncertainty from investors because transparency reduces confidence.","correct":false},{"id":"d","text":"Replace the Product Backlog with the Gantt chart as the single source of work.","correct":false}],"correctWhy":"Investors need direction and honesty. Outcome-oriented forecasts with inspection points beat false feature locks in volatile markets.","wrongWhy":{"b":"Punishing adaptation destroys empiricism.","c":"Hiding uncertainty is not transparency and creates bigger trust crashes later.","d":"The Product Backlog remains the single source of work for the Scrum Team."},"guideInsight":"Empiricism requires adaptation based on inspection; complementary roadmapping should not freeze learning.","examTip":"Roadmaps as hypotheses/options beat roadmaps as contracts.","realWorld":"Use Now/Next/Later outcome themes tied to the Product Goal.","remember":"Do not sell false certainty as a roadmap."},{"id":2044,"certifications":["PSPO-II"],"category":"Collaborator stance","competency":"Managing Products with Agility","topic":"Working with Developers","difficulty":"Expert","type":"scenario","question":"Developers warn that a requested integration will create fragile architecture and slow future delivery. A stakeholder says ‘just build what I asked.’ You have historically acted as a messenger. What is the strongest shift?","options":[{"id":"a","text":"Collaborate with Developers on options that achieve the stakeholder outcome with healthier constraints, then decide with transparent trade-offs—not merely relay orders.","correct":true},{"id":"b","text":"Order Developers to implement the request exactly and ignore long-term impact.","correct":false},{"id":"c","text":"Tell Developers to refuse all stakeholder conversations forever.","correct":false},{"id":"d","text":"Write more acceptance criteria alone overnight without involving Developers.","correct":false}],"correctWhy":"Collaborator and Decision Maker stances turn technical insight into better product options. Messenger/Clerk behavior yields brittle products.","wrongWhy":{"b":"Ignoring Ability to Innovate risks future value for short-term output.","c":"Gatekeeping reduces understanding; collaboration is healthier.","d":"Solo Story Writer behavior misses co-creation of solutions."},"guideInsight":"Developers are accountable for creating a Done Increment each Sprint; PO collaborates on what/why while respecting how.","examTip":"Messenger PO is a red flag; look for collaborative optioning.","realWorld":"Facilitate a short design spike with the stakeholder present.","remember":"Translate needs into options—do not merely forward orders."},{"id":2045,"certifications":["PSPO-II"],"category":"Unrealized Value","competency":"Evolving the Agile Organization","topic":"Current vs Unrealized Value","difficulty":"Expert","type":"scenario","question":"Your product has strong Current Value with loyal customers, but surveys show a large adjacent segment would pay for a workflow you do not support. Leadership only funds maintenance. Using EBM as complementary practice, what should you emphasize?","options":[{"id":"a","text":"Unrealized Value is material; fund discovery and thin Increments to test whether the adjacent segment’s outcomes justify strategic investment.","correct":true},{"id":"b","text":"Ignore Unrealized Value because Current Value is already good.","correct":false},{"id":"c","text":"Claim Time-to-Market is irrelevant for growth bets.","correct":false},{"id":"d","text":"Treat EBM measures as replacing Sprint Goals.","correct":false}],"correctWhy":"Healthy Current Value can coexist with large Unrealized Value. Advanced product leadership balances protecting today with testing tomorrow’s opportunity.","wrongWhy":{"b":"Complacency invites disruption and leaves money/outcomes on the table.","c":"Slow learning increases the cost of pursuing Unrealized Value.","d":"Sprint Goals remain Scrum commitments; EBM does not replace them."},"guideInsight":"Product Goal selection can target unrealized outcomes; EBM vocabulary helps, but remains complementary.","examTip":"Strong CV + large UV → justify discovery investment.","realWorld":"Run a beachhead experiment with a small cohort before a platform rewrite.","remember":"Today’s success can hide tomorrow’s unrealized opportunity."},{"id":2046,"certifications":["PSPO-II"],"category":"Organizational design","competency":"Evolving the Agile Organization","topic":"Funding and accountability","difficulty":"Expert","type":"scenario","question":"Finance funds projects with fixed scope and date, then assigns a ‘Product Owner’ who cannot change scope without a change board. Teams still run Sprints. What is the core problem from a PSPO II perspective?","options":[{"id":"a","text":"Organizational design grants the PO title without decision rights, converting them into a project clerk and undermining empirical value maximization.","correct":true},{"id":"b","text":"Sprints are illegal unless Finance joins Daily Scrum.","correct":false},{"id":"c","text":"Fixed dates are always compatible with empiricism if story points are used.","correct":false},{"id":"d","text":"Change boards are mandated by the Scrum Guide for all backlog changes.","correct":false}],"correctWhy":"Accountability without authority is theater. Fixed-scope project funding plus change boards recreate Gatekeeper/Clerk dynamics incompatible with PO accountability.","wrongWhy":{"b":"Finance attendance at Daily Scrum is not a Scrum rule and misses the real issue.","c":"Story points do not reconcile false certainty with complex work.","d":"Change boards are organizational constraints, not Guide requirements."},"guideInsight":"Organizations must respect Product Owner accountability for backlog management and value; otherwise Scrum is cosmetic.","examTip":"Title ≠ accountability when decision rights are missing.","realWorld":"Shift funding to products/outcomes with guardrails instead of item change boards.","remember":"A PO without ordering authority is a clerk in disguise."},{"id":2047,"certifications":["PSPO-II"],"category":"Product Goal focus","competency":"Understanding and Applying the Scrum Framework","topic":"Sprint Goal alignment","difficulty":"Expert","type":"scenario","question":"During Sprint Planning, stakeholders push ten unrelated items ‘all must start.’ None form a coherent Sprint Goal, and together they do not advance the Product Goal meaningfully. Developers are overwhelmed. What should you do?","options":[{"id":"a","text":"Negotiate a single Sprint Goal that advances the Product Goal, order only the work that serves it, and make the deferred items’ opportunity cost visible.","correct":true},{"id":"b","text":"Load all ten items into the Sprint Backlog to satisfy stakeholders.","correct":false},{"id":"c","text":"Cancel Product Goal focus for this Sprint as a temporary exception.","correct":false},{"id":"d","text":"Let each Developer pick unrelated items without a Sprint Goal.","correct":false}],"correctWhy":"Sprint Goal creates coherence and focus. The PO must influence stakeholders so Sprint work remains a purposeful step toward the Product Goal.","wrongWhy":{"b":"Stuffing the Sprint destroys focus and often fails anyway.","c":"Exceptions that abandon Product Goal focus become the norm.","d":"A Sprint without a Sprint Goal loses the commitment that focuses Developers."},"guideInsight":"The Sprint Goal is the single objective for the Sprint; Product Goal is the longer-term product objective.","examTip":"Many unrelated ‘must starts’ → restore Sprint Goal coherence.","realWorld":"Show a simple ‘if we start all ten, we finish none that matter’ forecast.","remember":"One Sprint Goal beats ten disconnected starts."},{"id":2048,"certifications":["PSPO-II"],"category":"Influencer stance","competency":"Managing Products with Agility","topic":"Organizational influence","difficulty":"Expert","type":"scenario","question":"Legal requires a two-week review before any customer-facing release, routinely aging Done Increments. Customers wait; competitors ship weekly. What is the strongest Product Owner approach?","options":[{"id":"a","text":"Influence Legal toward risk-based, parallel, or pre-cleared patterns so Done Increments can reach customers faster without ignoring real constraints.","correct":true},{"id":"b","text":"Secretly release without Legal to prove a point.","correct":false},{"id":"c","text":"Accept the delay forever because organizational policies always override value.","correct":false},{"id":"d","text":"Stop creating Increments until Legal becomes the Product Owner.","correct":false}],"correctWhy":"Influencer stance treats constraints as problems to reshape with evidence (lead time, risk tiers), not as excuses for permanent value delay or reckless bypass.","wrongWhy":{"b":"Covert releases destroy trust and may create legal exposure.","c":"Passive acceptance abandons maximizing value and Time-to-Market.","d":"Legal is a stakeholder constraint, not a replacement Product Owner."},"guideInsight":"Scrum expects valuable Done Increments frequently; organizational policies that systematically prevent that are improvement targets.","examTip":"Constraint scenarios reward influence and system change, not rebellion or surrender.","realWorld":"Pilot a fast-path review for low-risk changes with metrics.","remember":"Influence the system that delays Done value."},{"id":2049,"certifications":["PSPO-II"],"category":"Outcomes and Increment","competency":"Managin const DIFFICULTIES = ['Foundation', 'Intermediate', 'Advanced', 'Expert'];
const QUESTION_TYPES = ['single', 'multi', 'tf', 'scenario'];

const SM_ONLY = new Set([
  'Scrum Master Accountability',
  'Facilitation & Coaching',
  'Leadership & Coaching'
]);

function inferCertifications(q) {
  if (Array.isArray(q.certifications) && q.certifications.length) {
    return [...new Set(q.certifications.filter((id) => CERT_IDS.includes(id)))];
  }
  const certs = new Set();
  if (q.examTrack === 'PSM-II') {
    certs.add('PSM-II');
    return [...certs];
  }
  certs.add('PSM-I');
  if (!SM_ONLY.has(q.category)) certs.add('PSPO-I');
  return [...certs];
}

function normalizeQuestion(q) {
  const certifications = inferCertifications(q);
  return {
    ...q,
    certifications,
    competency: q.competency || q.focusArea || 'Understanding and Applying the Scrum Framework',
    topic: q.topic || q.category || 'General',
    category: q.category || q.topic || 'General',
    type: q.type || 'single',
    question: q.question || q.stem || '',
    options: Array.isArray(q.options) ? q.options : [],
    correctWhy: q.correctWhy || q.explanation || '',
    wrongWhy: q.wrongWhy || {},
    guideInsight: q.guideInsight || q.scrumGuideReference || '',
    examTip: q.examTip || '',
    realWorld: q.realWorld || '',
    remember: q.remember || ''
  };
}

function shuffle(arr, random = Math.random) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function grade(question, selectedIds) {
  const correctIds = question.options.filter((o) => o.correct).map((o) => o.id);
  const correct = new Set(correctIds);
  const selected = new Set(selectedIds || []);
  const fully = selected.size === correct.size && [...selected].every((id) => correct.has(id));
  let overlap = 0;
  selected.forEach((id) => { if (correct.has(id)) overlap += 1; });
  const partial = !fully && question.type === 'multi' && overlap > 0 && selected.size > 0;
  return { correct: fully, partial, correctIds, selected: [...selected] };
}

function sampleBalanced(items, count, random = Math.random) {
  if (!items.length) return [];
  const n = Math.max(0, Math.min(count, items.length));
  const groups = new Map();
  items.forEach((q) => {
    const key = q.topic || q.category || 'General';
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(q);
  });
  const keys = shuffle([...groups.keys()], random);
  keys.forEach((key) => groups.set(key, shuffle(groups.get(key), random)));
  const out = [];
  while (out.length < n) {
    let added = false;
    for (const key of keys) {
      const bucket = groups.get(key);
      if (bucket && bucket.length) {
        out.push(bucket.shift());
        added = true;
        if (out.length >= n) break;
      }
    }
    if (!added) break;
  }
  return out;
}

function filterPool(questions, { cert, topics, difficulty } = {}) {
  return questions.filter((q) => {
    if (cert && !(q.certifications || []).includes(cert)) return false;
    if (difficulty && q.difficulty !== difficulty) return false;
    if (topics && topics.length && !topics.includes(q.topic) && !topics.includes(q.category) && !topics.includes(q.competency)) return false;
    return true;
  });
}

function prepareOptions(question, random = Math.random) {
  if (question.type === 'tf') return [...question.options];
  return shuffle(question.options, random);
}

function summarize(results, questionsById) {
  const total = results.length;
  const correct = results.filter((r) => r.correct).length;
  const unanswered = results.filter((r) => r.unanswered).length;
  const incorrect = results.filter((r) => !r.correct && !r.unanswered).length;
  const pct = total ? Math.round((correct / total) * 100) : 0;
  const by = (keyFn) => {
    const map = {};
    results.forEach((r) => {
      const q = questionsById.get(r.id);
      if (!q) return;
      const key = keyFn(q);
      map[key] = map[key] || { correct: 0, total: 0 };
      map[key].total += 1;
      if (r.correct) map[key].correct += 1;
    });
    return map;
  };
  return {
    total,
    correct,
    incorrect,
    unanswered,
    pct,
    byTopic: by((q) => q.topic || q.category),
    byCompetency: by((q) => q.competency),
    byDifficulty: by((q) => q.difficulty)
  };
}

function readinessLabel(pct) {
  if (pct >= 90) return 'Scrum Expert';
  if (pct >= 85) return 'Practice target met';
  if (pct >= 70) return 'Strong Foundation';
  if (pct >= 60) return 'Developing';
  return 'Needs Improvement';
}

function backTarget(stack) {
  if (!Array.isArray(stack) || stack.length <= 1) return 'home';
  return stack[stack.length - 2];
}

function validateBank(questions) {
  const errors = [];
  const ids = new Set();
  const stems = new Set();
  questions.forEach((raw, index) => {
    const q = normalizeQuestion(raw);
    const where = `q${q.id ?? index}`;
    if (q.id == null || ids.has(q.id)) errors.push(`${where}: duplicate or missing id`);
    ids.add(q.id);
    const stemKey = String(q.question).trim().toLowerCase();
    if (!stemKey) errors.push(`${where}: empty stem`);
    if (stems.has(stemKey)) errors.push(`${where}: duplicate stem`);
    stems.add(stemKey);
    if (!q.certifications.length) errors.push(`${where}: no certification`);
    q.certifications.forEach((c) => {
      if (!CERT_IDS.includes(c)) errors.push(`${where}: unknown certification ${c}`);
    });
    if (!QUESTION_TYPES.includes(q.type)) errors.push(`${where}: bad type ${q.type}`);
    if (!DIFFICULTIES.includes(q.difficulty)) errors.push(`${where}: bad difficulty ${q.difficulty}`);
    if (!q.topic) errors.push(`${where}: missing topic`);
    if (!q.competency) errors.push(`${where}: missing competency`);
    if (!q.correctWhy) errors.push(`${where}: missing explanation`);
    if (!q.options.length) errors.push(`${where}: no options`);
    q.options.forEach((o) => {
      if (!o || !o.id || !String(o.text || '').trim()) errors.push(`${where}: empty option`);
    });
    const correct = q.options.filter((o) => o.correct);
    if (q.type === 'multi' && correct.length < 2) errors.push(`${where}: multi needs 2+ correct`);
    if (q.type !== 'multi' && correct.length !== 1) errors.push(`${where}: expected exactly 1 correct`);
    const wrong = q.options.filter((o) => !o.correct);
    wrong.forEach((o) => {
      if (!q.wrongWhy || !q.wrongWhy[o.id]) errors.push(`${where}: missing wrongWhy.${o.id}`);
    });
  });
  return errors;
}

function weakTopics(summary, limit = 3) {
  return Object.entries(summary.byTopic || {})
    .map(([name, row]) => ({ name, pct: row.total ? Math.round((row.correct / row.total) * 100) : 0, total: row.total }))
    .filter((row) => row.total > 0)
    .sort((a, b) => a.pct - b.pct)
    .slice(0, limit);
}

          <div style="margin-top:0.8rem">
            <span style="font-size:0.75rem;font-weight:700;color:var(--text-muted)">Focus areas</span>
            <div class="topic-picks" id="topicPicks">${topics.map((t) => `<label><input type="checkbox" value="${escapeHtml(t)}" checked /> ${escapeHtml(t)}</label>`).join('')}</div>
          </div>
          <div style="margin-top:1rem"><button class="btn btn-primary" id="btnBegin" type="button">Begin</button></div>
          <p class="disclaimer">Multiple-answer items score as correct only when every right option is selected and no incorrect option is selected. This practice target is not an official result.</p>
        </div>
      </div>
    </section>`;
  }

  function applyPreset(mode) {
    const c = CERTS[state.cert];
    const count = document.getElementById('qCount');
    const minutes = document.getElementById('qMinutes');
    const feedback = document.getElementById('qFeedback');
    const title = document.getElementById('setupTitle');
    state.mode = mode;
    title.textContent = { quick: 'Quick Practice', focused: 'Focused Practice', mock: 'Mock Assessment', custom: 'Custom Practice' }[mode];
    if (mode === 'quick') { count.value = '10'; minutes.value = '0'; feedback.value = 'immediate'; }
    if (mode === 'focused') { count.value = '20'; minutes.value = '0'; feedback.value = 'immediate'; }
    if (mode === 'mock') { ensureOption(count, String(c.mock.count)); minutes.value = String(c.mock.minutes); feedback.value = 'end'; }
    if (mode === 'custom') { feedback.value = 'immediate'; }
  }
  function ensureOption(select, value) {
    if (![...select.options].some((o) => o.value === value)) {
      const opt = document.createElement('option');
      opt.value = value; opt.textContent = value; select.appendChild(opt);
    }
    select.value = value;
  }

  function begin() {
    const topics = [...document.querySelectorAll('#topicPicks input:checked')].map((el) => el.value);
    const difficulty = document.getElementById('qDiff').value;
    const count = Number(document.getElementById('qCount').value);
    const minutes = Number(document.getElementById('qMinutes').value) || 0;
    state.feedbackMode = document.getElementById('qFeedback').value;
    let pool = filterPool(QUESTIONS, { cert: state.cert, topics, difficulty });
    if (!pool.length) { toast('No questions match those filters.'); return; }
    const picked = sampleBalanced(pool, count);
    state.queue = picked.map((q) => ({ ...q, _options: prepareOptions(q) }));
    state.index = 0;
    state.answers = {};
    state.flagged = {};
    state.revealed = {};
    state.submitted = false;
    state.startedAt = Date.now();
    state.secondsLeft = minutes > 0 ? minutes * 60 : null;
    stopTimer();
    if (state.secondsLeft != null) startTimer();
    saveSession();
    go('quiz');
  }

  function saveSession() {
    saveStore({
      session: {
        cert: state.cert, mode: state.mode, feedbackMode: state.feedbackMode,
        ids: state.queue.map((q) => q.id),
        optionOrder: Object.fromEntries(state.queue.map((q) => [q.id, q._options.map((o) => o.id)])),
        index: state.index, answers: state.answers, flagged: state.flagged, revealed: state.revealed,
        startedAt: state.startedAt, secondsLeft: state.secondsLeft, submitted: state.submitted
      }
    });
  }
  function restoreSession() {
    const s = store.session;
    if (!s || !s.ids || !s.ids.length) return false;
    state.cert = s.cert;
    state.mode = s.mode;
    state.feedbackMode = s.feedbackMode;
    state.queue = s.ids.map((id) => {
      const q = BY_ID.get(id);
      if (!q) return null;
      const order = s.optionOrder[id] || q.options.map((o) => o.id);
      const _options = order.map((oid) => q.options.find((o) => o.id === oid)).filter(Boolean);
      return { ...q, _options };
    }).filter(Boolean);
    state.index = s.index || 0;
    state.answers = s.answers || {};
    state.flagged = s.flagged || {};
    state.revealed = s.revealed || {};
    state.startedAt = s.startedAt || Date.now();
    state.secondsLeft = s.secondsLeft;
    state.submitted = !!s.submitted;
    if (!state.submitted && state.secondsLeft != null) startTimer();
    return state.queue.length > 0;
  }

  function startTimer() {
    stopTimer();
    state.timerId = setInterval(() => {
      state.secondsLeft -= 1;
      const el = document.getElementById('timerDisplay');
      if (el) el.textContent = formatTime(state.secondsLeft);
      if (state.secondsLeft <= 0) {
        stopTimer();
        toast('Time is up. Submitting what you answered.');
        submitAssessment();
      }
    }, 1000);
  }
  function stopTimer() { if (state.timerId) clearInterval(state.timerId); state.timerId = null; }
  function formatTime(s) {
    const n = Math.max(0, s | 0);
    return `${Math.floor(n / 60)}:${String(n % 60).padStart(2, '0')}`;
  }

  function current() { return state.queue[state.index]; }

  function quizHtml() {
    const q = current();
    const c = CERTS[state.cert];
    const selected = new Set((state.answers[q.id] || {}).selected || []);
    const revealed = !!state.revealed[q.id] || state.submitted;
    const graded = revealed ? grade(q, [...selected]) : null;
    const options = q._options.map((opt, i) => {
      let cls = 'option';
      if (selected.has(opt.id)) cls += ' selected';
      if (revealed && opt.correct && selected.has(opt.id)) cls += ' correct';
      else if (revealed && selected.has(opt.id) && !opt.correct) cls += ' incorrect';
      else if (revealed && opt.correct) cls += ' missed';
      return `<button class="${cls}" type="button" data-opt="${opt.id}" ${revealed ? 'disabled' : ''}>
        <span class="option-key">${String.fromCharCode(65 + i)}</span>
        <span class="option-text">${escapeHtml(opt.text)}</span></button>`;
    }).join('');
    const feedback = revealed ? feedbackHtml(q, graded) : '';
    const nav = state.queue.map((item, i) => {
      const ans = state.answers[item.id];
      const show = state.revealed[item.id] || state.submitted;
      let cls = '';
      if (i === state.index) cls += ' current';
      if (state.flagged[item.id]) cls += ' flagged';
      if (show && ans) cls += grade(BY_ID.get(item.id), ans.selected || []).correct ? ' good' : ' bad';
      else if (ans && ans.selected && ans.selected.length) cls += ' answered';
      return `<button type="button" class="${cls}" data-jump="${i}" aria-label="Question ${i + 1}">${i + 1}</button>`;
    }).join('');
    return `<section class="screen active" style="display:block;padding:1rem 0 3rem">
      <div class="wrap quiz-layout">
        <article class="glass question-card">
          <div class="progress-meta"><span>${escapeHtml(c.name)} · ${escapeHtml(state.mode || 'practice')}</span><span id="timerDisplay">${state.secondsLeft == null ? 'Untimed' : formatTime(state.secondsLeft)}</span></div>
          <div class="progress-track" style="margin:0.4rem 0 1rem"><div class="progress-fill" style="width:${((state.index + 1) / state.queue.length) * 100}%"></div></div>
          <div class="q-meta">
            <span class="pill primary">${escapeHtml(q.topic)}</span>
            <span class="pill diff-${q.difficulty}">${escapeHtml(q.difficulty)}</span>
            <span class="pill">${escapeHtml(q.competency)}</span>
          </div>
          <p style="color:var(--text-dim);font-size:0.85rem">Question ${state.index + 1} of ${state.queue.length}${q.type === 'multi' ? ' · Select all that apply. Score is all-or-nothing.' : ''}</p>
          <h2 class="q-text">${escapeHtml(q.question)}</h2>
          <div class="options" role="group" aria-label="Answer options">${options}</div>
          <div class="quiz-actions">
            <div class="left">
              <button class="btn btn-ghost btn-sm" id="btnPrev" type="button">Previous</button>
              <button class="btn btn-ghost btn-sm" id="btnFlag" type="button">${state.flagged[q.id] ? 'Flagged' : 'Flag for review'}</button>
            </div>
            <div class="right">
              ${state.feedbackMode === 'immediate' && !revealed ? '<button class="btn btn-primary" id="btnSubmitOne" type="button">Submit answer</button>' : ''}
              ${state.index < state.queue.length - 1 ? '<button class="btn btn-secondary" id="btnNext" type="button">Next</button>' : '<button class="btn btn-primary" id="btnFinish" type="button">Submit assessment</button>'}
            </div>
          </div>
          <div class="feedback ${feedback ? 'show' : ''}" id="feedback">${feedback}</div>
        </article>
        <aside class="glass side-sticky">
          <h3 style="margin-bottom:0.6rem">Questions</h3>
          <div class="q-nav">${nav}</div>
          <button class="btn btn-secondary btn-sm" id="btnFinishSide" type="button" style="margin-top:0.8rem;width:100%">Submit assessment</button>
        </aside>
      </div>
    </section>`;
  }

  function feedbackHtml(q, graded) {
    const correctOpts = q.options.filter((o) => o.correct);
    const wrong = q.options.filter((o) => !o.correct).map((o) =>
      `<div class="wrong-item"><strong>${escapeHtml(o.text)}</strong><span>${escapeHtml(q.wrongWhy[o.id] || '')}</span></div>`).join('');
    const banner = graded.correct ? 'ok' : graded.partial ? 'partial' : 'bad';
    const label = graded.correct ? 'Correct' : graded.partial ? 'Partially selected — not scored correct' : 'Not correct';
    return `<div class="feedback-banner ${banner}">${label}</div>
      <div class="edu-block success-tone"><h4>Correct answer</h4><p><strong>${correctOpts.map((o) => escapeHtml(o.text)).join(' · ')}</strong></p><p style="margin-top:0.45rem">${escapeHtml(q.correctWhy)}</p></div>
      <div class="edu-block warn-tone"><h4>Why other options are weaker or incorrect</h4>${wrong}</div>
      <div class="edu-block insight-tone"><h4>Scrum Guide insight</h4><p>${escapeHtml(q.guideInsight)}</p><p style="margin-top:0.35rem">${escapeHtml(q.competency)} · ${escapeHtml(q.topic)}</p></div>
      <div class="edu-block tip-tone"><h4>Practice tip</h4><p>${escapeHtml(q.examTip)}</p></div>
      <div class="edu-block remember-tone"><h4>Remember</h4><p>${escapeHtml(q.remember)}</p></div>
      <p style="margin-top:0.4rem"><a href="mailto:sanjay.scrum@gmail.com?subject=Know%20Your%20Scrum%20question%20${q.id}">Report an issue with this question</a></p>`;
  }

  function toggleOption(id) {
    const q = current();
    if (state.revealed[q.id] || state.submitted) return;
    const row = state.answers[q.id] || { selected: [] };
    const selected = new Set(row.selected);
    if (q.type === 'multi') selected.has(id) ? selected.delete(id) : selected.add(id);
    else selected.clear(), selected.add(id);
    state.answers[q.id] = { selected: [...selected] };
    saveSession();
    render();
  }

  function submitOne() {
    const q = current();
    const selected = (state.answers[q.id] || {}).selected || [];
    if (!selected.length) { toast('Select an answer first.'); return; }
    state.revealed[q.id] = true;
    saveSession();
    render();
  }

  function submitAssessment() {
    const unanswered = state.queue.filter((q) => !((state.answers[q.id] || {}).selected || []).length).length;
    if (unanswered && state.secondsLeft !== 0) {
      const ok = window.confirm(`${unanswered} question${unanswered === 1 ? ' is' : 's are'} unanswered. Submit anyway?`);
      if (!ok) return;
    }
    stopTimer();
    state.submitted = true;
    state.queue.forEach((q) => { state.revealed[q.id] = true; });
    const results = state.queue.map((q) => {
      const selected = (state.answers[q.id] || {}).selected || [];
      const g = grade(q, selected);
      return { id: q.id, correct: g.correct, partial: g.partial, unanswered: selected.length === 0, selected, flagged: !!state.flagged[q.id] };
    });
    const summary = summarize(results, BY_ID);
    const elapsed = Math.round((Date.now() - state.startedAt) / 1000);
    state.lastSummary = { ...summary, results, elapsed, cert: state.cert, mode: state.mode, target: CERTS[state.cert].mock.target };
    const history = store.history || [];
    history.push({ cert: state.cert, mode: state.mode, pct: summary.pct, at: Date.now(), correct: summary.correct, total: summary.total });
    saveStore({ history, session: null });
    state.submitted = true;
    go('results');
  }

  function resultsHtml() {
    const s = state.lastSummary;
    if (!s) return `<section class="wrap" style="padding:2rem 0"><p>No result yet.</p></section>`;
    const c = CERTS[s.cert];
    const met = s.pct >= s.target;
    const bars = (map) => Object.entries(map).sort((a, b) => (a[1].correct / a[1].total) - (b[1].correct / b[1].total)).map(([name, row]) => {
      const pct = Math.round((row.correct / row.total) * 100);
      return `<div class="hbar-row"><span class="name">${escapeHtml(name)}</span><div class="hbar-track"><div class="hbar-fill" style="width:${pct}%"></div></div><span class="pct">${pct}%</span></div>`;
    }).join('');
    const weak = weakTopics(s).map((w) => `<div class="rec"><strong>${escapeHtml(w.name)} — ${w.pct}%</strong><br>Revisit the 2020 Scrum Guide on this topic, then retry the missed questions.</div>`).join('');
    const flagged = s.results.filter((r) => r.flagged);
    const missed = s.results.filter((r) => !r.correct);
    return `<section class="screen active" style="display:block;padding:1.5rem 0 3rem">
      <div class="wrap">
        <div class="glass score-hero">
          <p class="eyebrow">${escapeHtml(c.name)} · ${escapeHtml(s.mode || 'practice')}</p>
          <h2>${s.pct}%</h2>
          <p>${s.correct} correct · ${s.incorrect} incorrect · ${s.unanswered} unanswered · ${formatTime(s.elapsed)} used</p>
          <div class="readiness-badge">${met ? 'Practice target met' : 'Below the practice target'} · ${s.target}% target</div>
          <p class="disclaimer">This comparison is for practice only. It does not predict or guarantee an official certification outcome.</p>
        </div>
        <div class="charts-grid">
          <div class="glass chart-card"><h3>By topic</h3><div class="hbar">${bars(s.byTopic)}</div></div>
          <div class="glass chart-card"><h3>By competency</h3><div class="hbar">${bars(s.byCompetency)}</div></div>
        </div>
        <div class="glass chart-card" style="margin-top:1rem"><h3>By difficulty</h3><div class="hbar">${bars(s.byDifficulty)}</div></div>
        <div class="glass chart-card" style="margin-top:1rem"><h3>Study next</h3><div class="recs">${weak || '<div class="rec">Broad coverage. Try a harder difficulty or the other certification.</div>'}</div>
          <p style="margin-top:0.7rem;color:var(--text-muted)">Flagged: ${flagged.length}. Incorrect or unanswered: ${missed.length}.</p>
        </div>
        <div class="results-actions">
          <button class="btn btn-primary" id="btnRetryMissed" type="button">Retry incorrect</button>
          <button class="btn btn-secondary" id="btnReview" type="button">Review responses</button>
          <button class="btn btn-secondary" id="btnNew" type="button">New practice</button>
          <button class="btn btn-ghost" id="btnResultsHome" type="button">Certification home</button>
        </div>
        <div id="reviewBlock" class="review-list" hidden></div>
      </div>
    </section>`;
  }

  function bindScreen() {
    main.querySelectorAll('[data-start]').forEach((btn) => btn.addEventListener('click', () => {
      state.cert = btn.dataset.start;
      state.stack = ['home', 'setup'];
      go('setup', { replace: true });
    }));
    main.querySelectorAll('[data-mode]').forEach((btn) => btn.addEventListener('click', () => applyPreset(btn.dataset.mode)));
    const beginBtn = document.getElementById('btnBegin');
    if (beginBtn) beginBtn.addEventListener('click', begin);
    main.querySelectorAll('[data-opt]').forEach((btn) => btn.addEventListener('click', () => toggleOption(btn.dataset.opt)));
    main.querySelectorAll('[data-jump]').forEach((btn) => btn.addEventListener('click', () => { state.index = Number(btn.dataset.jump); saveSession(); render(); }));
    const prev = document.getElementById('btnPrev');
    if (prev) prev.addEventListener('click', () => { if (state.index > 0) { state.index -= 1; saveSession(); render(); } });
    const next = document.getElementById('btnNext');
    if (next) next.addEventListener('click', () => { if (state.index < state.queue.length - 1) { state.index += 1; saveSession(); render(); } });
    const flag = document.getElementById('btnFlag');
    if (flag) flag.addEventListener('click', () => {
      const q = current();
      state.flagged[q.id] = !state.flagged[q.id];
      saveSession();
      render();
    });
    const one = document.getElementById('btnSubmitOne');
    if (one) one.addEventListener('click', submitOne);
    const fin = document.getElementById('btnFinish');
    if (fin) fin.addEventListener('click', submitAssessment);
    const fin2 = document.getElementById('btnFinishSide');
    if (fin2) fin2.addEventListener('click', submitAssessment);
    const retry = document.getElementById('btnRetryMissed');
    if (retry) retry.addEventListener('click', () => {
      const ids = (state.lastSummary.results || []).filter((r) => !r.correct).map((r) => r.id);
      if (!ids.length) { toast('Nothing to retry.'); return; }
      state.queue = ids.map((id) => ({ ...BY_ID.get(id), _options: prepareOptions(BY_ID.get(id)) }));
      state.index = 0; state.answers = {}; state.revealed = {}; state.flagged = {}; state.submitted = false;
      state.feedbackMode = 'immediate'; state.mode = 'retry'; state.startedAt = Date.now(); state.secondsLeft = null;
      go('quiz');
    });
    const review = document.getElementById('btnReview');
    if (review) review.addEventListener('click', () => {
      const block = document.getElementById('reviewBlock');
      block.hidden = false;
      block.innerHTML = state.lastSummary.results.filter((r) => !r.correct || r.flagged).map((r) => {
        const q = BY_ID.get(r.id);
        const g = grade(q, r.selected || []);
        return `<article class="glass" style="padding:1rem;margin-top:0.7rem"><h3>${escapeHtml(q.question)}</h3>${feedbackHtml(q, g)}</article>`;
      }).join('') || '<p>No incorrect or flagged questions.</p>';
    });
    const neu = document.getElementById('btnNew');
    if (neu) neu.addEventListener('click', () => go('setup'));
    const rh = document.getElementById('btnResultsHome');
    if (rh) rh.addEventListener('click', () => { state.stack = ['home']; go('home', { replace: true }); });
    if (state.screen === 'setup' && !state.mode) applyPreset('quick');
  }

  document.getElementById('btnBack').addEventListener('click', () => {
    const target = backTarget(state.stack);
    requestLeave(target);
  });
  document.getElementById('btnHome').addEventListener('click', () => requestLeave('home'));
  document.getElementById('leaveStay').addEventListener('click', () => { state.pendingLeave = null; dialog.close(); });
  document.getElementById('leaveGo').addEventListener('click', () => {
    const target = state.pendingLeave || 'home';
    dialog.close();
    saveSession();
    stopTimer();
    state.pendingLeave = null;
    if (target === 'home') { state.stack = ['home']; go('home', { replace: true }); }
    else { state.stack.pop(); go(target, { replace: true }); }
  });
  document.getElementById('btnTheme').addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme') || 'dark';
    document.documentElement.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
    saveStore({});
  });
  document.addEventListener('keydown', (e) => {
    if (e.target.matches('input, textarea, select')) return;
    if (e.key === 'Escape' && dialog.open) { dialog.close(); return; }
    if (state.screen !== 'quiz') return;
    if (['1','2','3','4','5','6'].includes(e.key)) {
      const opt = current()._options[Number(e.key) - 1];
      if (opt) toggleOption(opt.id);
    }
  });

  window.addEventListener('hashchange', () => {
    if (hashing) return;
    const part = (location.hash || '#/').replace(/^#\/?/, '');
    if (!part) {
      if (state.screen !== 'home') requestLeave('home');
      return;
    }
    const [screen, cert] = part.split('/');
    if (CERTS[cert]) state.cert = cert;
    if (screen === 'setup' && CERTS[state.cert]) go('setup');
    else if (screen === 'home') requestLeave('home');
  });

  if (store.theme) document.documentElement.setAttribute('data-theme', store.theme);
  if (location.hash.startsWith('#/quiz') && restoreSession()) {
    state.stack = ['home', 'setup', 'quiz'];
    state.screen = 'quiz';
  } else if (location.hash.startsWith('#/setup/')) {
    state.cert = location.hash.split('/')[2];
    if (CERTS[state.cert]) { state.stack = ['home', 'setup']; state.screen = 'setup'; }
  }
  render();
})();

</script>
</body>
</html>
