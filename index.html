,"text":"Creating and clearly communicating Product Backlog items","correct":true},{"id":"c","text":"Assigning daily tasks to each Developer","correct":false},{"id":"d","text":"Ordering Product Backlog items","correct":true}],"correctWhy":"The Product Owner is accountable for effective Product Backlog management, including the Product Goal, creating and communicating items, ordering, and ensuring transparency.","wrongWhy":{"c":"Developers are self-managing; they decide who does what within the Sprint."},"guideInsight":"Product Owner accountabilities center on value and Product Backlog effectiveness, not directing daily developer work.","examTip":"On multi-select PO questions, reject any option that assigns tasks to Developers.","realWorld":"A strong PO clarifies goals and backlog order; a weak PO micromanages the Sprint Backlog.","remember":"PO: Goal, items, order, transparency—not task assignment."},{"id":1046,"certifications":["PSPO-I"],"category":"Stakeholders","competency":"Managing Products with Agility","topic":"Stakeholder pressure mid-Sprint","difficulty":"Foundation","type":"scenario","question":"Mid-Sprint, a VP demands the Developers drop the Sprint Goal and build a last-minute demo for an executive visit. The Product Owner wants to keep trust with both the VP and the team. What is the best response?","options":[{"id":"a","text":"Order Developers to abandon the Sprint Goal immediately; the VP outranks Scrum.","correct":false},{"id":"b","text":"Protect the Sprint Goal; discuss the request’s value, offer to order it on the Product Backlog, and invite the VP to the Sprint Review for feedback on the Increment.","correct":true},{"id":"c","text":"Quietly add the demo work without changing the Sprint Backlog so nobody notices the conflict.","correct":false},{"id":"d","text":"Cancel the Sprint automatically because any new request makes the Sprint Goal obsolete.","correct":false}],"correctWhy":"The Sprint Goal is the Sprint’s commitment. Scope may be renegotiated with the Product Owner as more is learned, but arbitrary mid-Sprint redirection undermines empiricism. New ideas go to the Product Backlog; cancellation is only when the Sprint Goal is obsolete.","wrongWhy":{"a":"Hierarchy does not override Scrum accountabilities or the Sprint Goal.","c":"Hidden scope changes destroy transparency.","d":"A new request does not automatically obsolete the Sprint Goal."},"guideInsight":"During the Sprint, no changes are made that would endanger the Sprint Goal; the Product Backlog may be refined as needed.","examTip":"Stakeholder pressure scenarios usually reward protecting the Sprint Goal and using the Product Backlog and Sprint Review.","realWorld":"Offer a clear path: backlog order now, review the Increment soon, plan the demo work next if it wins on value.","remember":"New asks → Product Backlog; protect Sprint Goal unless truly obsolete."},{"id":1047,"certifications":["PSPO-I"],"category":"Sprint Planning","competency":"Understanding and Applying the Scrum Framework","topic":"Sprint value and Sprint Goal","difficulty":"Foundation","type":"single","question":"In Sprint Planning, who proposes how the product could increase its value and usefulness in the current Sprint?","options":[{"id":"a","text":"The Scrum Master, because they facilitate all planning decisions","correct":false},{"id":"b","text":"The Product Owner","correct":true},{"id":"c","text":"Stakeholders attending as mandatory participants","correct":false},{"id":"d","text":"Only the Developers, without Product Owner input","correct":false}],"correctWhy":"Topic One of Sprint Planning: The Product Owner proposes how the product could increase its value and utility in the current Sprint. The whole Scrum Team then collaborates to define a Sprint Goal.","wrongWhy":{"a":"The Scrum Master facilitates but does not propose product value direction.","c":"Stakeholders may be invited for advice; they are not the ones who propose Sprint value.","d":"Developers collaborate on the plan and how; the Product Owner proposes why the Sprint is valuable."},"guideInsight":"PO proposes why this Sprint is valuable; the Scrum Team crafts the Sprint Goal together.","examTip":"Remember the split: PO proposes value; team crafts Sprint Goal; Developers own how.","realWorld":"Start planning by stating the value hypothesis for the Sprint, then shape a shared Sprint Goal.","remember":"PO proposes Sprint value; whole team crafts Sprint Goal."},{"id":1048,"certifications":["PSPO-I"],"category":"Developers","competency":"Developing People and Teams","topic":"Self-managing Developers","difficulty":"Foundation","type":"tf","question":"True or False: Developers are accountable for creating a plan for the Sprint (the Sprint Backlog) and for adapting their plan each day toward the Sprint Goal.","options":[{"id":"a","text":"True","correct":true},{"id":"b","text":"False","correct":false}],"correctWhy":"Developers are accountable for creating a plan for the Sprint (the Sprint Backlog), instilling quality by adhering to a Definition of Done, and adapting their plan each day toward the Sprint Goal.","wrongWhy":{"b":"These are explicit Developer accountabilities in the Scrum Guide."},"guideInsight":"Self-managing Developers own the Sprint Backlog and daily adaptation toward the Sprint Goal.","examTip":"If an option has the Product Owner writing the Sprint Backlog, it is wrong.","realWorld":"PO clarifies what and why; Developers plan and replan the how within the Sprint.","remember":"Developers create and adapt the Sprint Backlog."},{"id":1049,"certifications":["PSPO-I"],"category":"Product Backlog","competency":"Managing Products with Agility","topic":"Product Backlog refinement","difficulty":"Foundation","type":"single","question":"Product Backlog refinement is taking longer than expected because items lack clarity. Who is accountable for ensuring Product Backlog items are understood to the level needed?","options":[{"id":"a","text":"The Scrum Master alone, as the refinement meeting owner","correct":false},{"id":"b","text":"The Product Owner, though Developers may contribute","correct":true},{"id":"c","text":"Only Developers, because they will implement the items","correct":false},{"id":"d","text":"Stakeholders, who must write every Product Backlog item","correct":false}],"correctWhy":"The Product Owner may do the above work or may delegate responsibility to others, but remains accountable. Ensuring items are transparent, clear, and understood is part of effective Product Backlog management.","wrongWhy":{"a":"The Scrum Master helps the team be effective; they do not own backlog clarity.","c":"Developers help refine size and how, but PO remains accountable for backlog management.","d":"Stakeholders provide input; they do not own the Product Backlog."},"guideInsight":"Refinement is an ongoing activity; PO accountability does not disappear when others help.","examTip":"Delegation is allowed; accountability always stays with the Product Owner.","realWorld":"Invite Developers into refinement for sizing and clarity, but own the final ordering and communication.","remember":"Others may help refine; PO stays accountable."},{"id":1050,"certifications":["PSPO-I"],"category":"Product Backlog","competency":"Managing Products with Agility","topic":"Transparent Product Backlog","difficulty":"Foundation","type":"multi","question":"Which practices support effective Product Backlog management? (Select all that apply.)","options":[{"id":"a","text":"Ensuring the Product Backlog is transparent, visible, and understood","correct":true},{"id":"b","text":"Hiding lower-ordered items from Developers to reduce distraction","correct":false},{"id":"c","text":"Ordering items to best achieve goals and missions","correct":true},{"id":"d","text":"Keeping only one person able to see the full Product Backlog","correct":false}],"correctWhy":"Effective Product Backlog management includes developing the Product Goal, creating and communicating items, ordering items, and ensuring the Product Backlog is transparent, visible, and understood.","wrongWhy":{"b":"Transparency requires a visible, understood backlog—not selective hiding.","d":"A private backlog undermines empiricism and collaboration."},"guideInsight":"Transparency of the Product Backlog enables inspection and adaptation by the Scrum Team and stakeholders.","examTip":"Any answer that reduces backlog visibility is a red flag.","realWorld":"A single ordered, visible backlog beats multiple private wish lists.","remember":"Transparent + ordered Product Backlog = inspectable value plan."},{"id":1051,"certifications":["PSPO-I"],"category":"Increment","competency":"Understanding and Applying the Scrum Framework","topic":"Undone work at Sprint end","difficulty":"Foundation","type":"scenario","question":"At Sprint end, two Product Backlog items are nearly complete but do not meet the Definition of Done. Stakeholders want them shown as delivered. What should happen?","options":[{"id":"a","text":"Present them as part of the Increment and mark them Done to keep stakeholders happy.","correct":false},{"id":"b","text":"Return them to the Product Backlog for future consideration; only Done work is part of the Increment.","correct":true},{"id":"c","text":"Automatically start the next Sprint with those items already in progress and locked.","correct":false},{"id":"d","text":"Ask the Scrum Master to declare a partial Done for reporting purposes.","correct":false}],"correctWhy":"If a Product Backlog item does not meet the Definition of Done, it cannot be released or even presented at the Sprint Review. Instead, it returns to the Product Backlog for future consideration.","wrongWhy":{"a":"Presenting undone work as Done destroys transparency.","c":"Future selection happens in Sprint Planning; items are not automatically locked into the next Sprint.","d":"There is no partial Done for Increment inclusion."},"guideInsight":"The Increment is the sum of all Product Backlog items completed during a Sprint that meet Done, plus previous Increments.","examTip":"Nearly Done is not Done—expect “return to Product Backlog.”","realWorld":"Be honest in the Sprint Review: show the usable Increment, and discuss leftover work as backlog candidates.","remember":"Undone → back to Product Backlog; not in Increment."},{"id":1052,"certifications":["PSPO-I"],"category":"Self-managing teams","competency":"Developing People and Teams","topic":"PO and self-management","difficulty":"Foundation","type":"single","question":"A Product Owner wants faster delivery and begins assigning each Developer specific tasks each morning. What is wrong with this approach?","options":[{"id":"a","text":"Nothing; the Product Owner manages Developers’ daily work.","correct":false},{"id":"b","text":"It undermines self-management; Developers decide how to accomplish their work within the Sprint.","correct":true},{"id":"c","text":"Only the Scrum Master may assign tasks; the Product Owner should assign them through the Scrum Master.","correct":false},{"id":"d","text":"Tasks may be assigned only during the Sprint Review.","correct":false}],"correctWhy":"Scrum Teams are self-managing, meaning they internally decide who does what, when, and how. Developers own turning Product Backlog items into Increments of value.","wrongWhy":{"a":"The Product Owner does not manage Developers’ daily tasks.","c":"Nobody outside the Developers assigns their work; the Scrum Master does not become a task dispatcher.","d":"Sprint Review is for inspecting the Increment and adapting the Product Backlog, not assigning tasks."},"guideInsight":"Self-managing teams decide who does what, when, and how.","examTip":"PO owns value and backlog; Developers own the how inside the Sprint.","realWorld":"If delivery is slow, improve backlog clarity and collaboration—do not become a task manager.","remember":"Self-managing Developers choose who/when/how."},{"id":1053,"certifications":["PSPO-I"],"category":"Commitments","competency":"Understanding and Applying the Scrum Framework","topic":"Scrum commitments","difficulty":"Foundation","type":"multi","question":"Which statements about Scrum commitments are correct? (Select all that apply.)","options":[{"id":"a","text":"The Product Goal is the commitment for the Product Backlog","correct":true},{"id":"b","text":"The Sprint Goal is the commitment for the Sprint Backlog","correct":true},{"id":"c","text":"The Definition of Done is the commitment for the Increment","correct":true},{"id":"d","text":"A numeric team output metric is the commitment for each Developer","correct":false}],"correctWhy":"Each artifact has a commitment: Product Goal for the Product Backlog, Sprint Goal for the Sprint Backlog, and Definition of Done for the Increment.","wrongWhy":{"d":"Output metrics are not Scrum artifact commitments and are not required by the Scrum Guide."},"guideInsight":"Commitments reinforce empiricism and focus for each artifact.","examTip":"Memorize the three commitment pairings; reject invented output-metric commitments.","realWorld":"Use commitments in conversations: “Does this Sprint Backlog still serve the Sprint Goal?”","remember":"Product Goal / Sprint Goal / Definition of Done."},{"id":1054,"certifications":["PSPO-I"],"category":"Sprint Planning","competency":"Understanding and Applying the Scrum Framework","topic":"Crafting the Sprint Goal","difficulty":"Foundation","type":"single","question":"Who crafts the Sprint Goal?","options":[{"id":"a","text":"The Product Owner alone before Sprint Planning","correct":false},{"id":"b","text":"The Scrum Team collaboratively","correct":true},{"id":"c","text":"Stakeholders by majority vote","correct":false},{"id":"d","text":"The Scrum Master after estimating capacity","correct":false}],"correctWhy":"The whole Scrum Team then collaborates to define a Sprint Goal that communicates why the Sprint is valuable to stakeholders.","wrongWhy":{"a":"The Product Owner proposes value; the Sprint Goal is crafted by the Scrum Team.","c":"Stakeholders do not vote the Sprint Goal into existence.","d":"The Scrum Master facilitates; they do not author the Sprint Goal alone."},"guideInsight":"Sprint Goal creation is a collaborative Scrum Team activity during Sprint Planning.","examTip":"Distinguish “PO proposes value” from “Scrum Team crafts Sprint Goal.”","realWorld":"A jointly owned Sprint Goal keeps Developers focused when trade-offs appear mid-Sprint.","remember":"Whole Scrum Team crafts the Sprint Goal."},{"id":1055,"certifications":["PSPO-I"],"category":"Value","competency":"Managing Products with Agility","topic":"Measuring and optimizing value","difficulty":"Intermediate","type":"single","question":"After several Sprints, output is high but customer outcomes are flat. What should the Product Owner focus on next?","options":[{"id":"a","text":"Push Developers to increase output further until outcomes magically improve","correct":false},{"id":"b","text":"Inspect whether selected Product Backlog items actually advance the Product Goal and customer value, then adapt ordering and strategy","correct":true},{"id":"c","text":"Replace the Definition of Done so more items count as finished","correct":false},{"id":"d","text":"Stop Sprint Reviews to save time for building","correct":false}],"correctWhy":"The Product Owner maximizes value, not merely output. Empiricism requires inspecting outcomes against the Product Goal and adapting the Product Backlog.","wrongWhy":{"a":"More output without better selection does not guarantee value.","c":"Weakening Done reduces quality and transparency.","d":"Sprint Reviews are essential for inspecting the Increment and adapting the backlog with stakeholders."},"guideInsight":"Value optimization is the Product Owner’s core accountability; empiricism applies to product decisions too.","examTip":"Separate output from outcome; PSPO answers prefer value inspection over more busywork.","realWorld":"Use Sprint Reviews and customer evidence to reorder ruthlessly when outcomes stall.","remember":"Maximize value, not just throughput."},{"id":1056,"certifications":["PSPO-I"],"category":"Forecasting","competency":"Managing Products with Agility","topic":"Forecasting and release planning","difficulty":"Intermediate","type":"multi","question":"A Product Owner must communicate a release forecast to leadership. Which approaches align with Scrum? (Select all that apply.)","options":[{"id":"a","text":"Base forecasts on progress against the Product Goal using empirical evidence from past Increments","correct":true},{"id":"b","text":"Promise a fixed scope and date as an unchangeable contract regardless of learning","correct":false},{"id":"c","text":"Update forecasts as the Product Backlog and understanding of Done work evolve","correct":true},{"id":"d","text":"Require Developers to guarantee exact delivery dates for every Product Backlog item individually","correct":false}],"correctWhy":"Scrum is founded on empiricism. Forecasts improve with transparency of Done Increments and an ordered Product Backlog; they are not rigid promises that ignore learning.","wrongWhy":{"b":"Fixed scope-and-date contracts conflict with empiricism and adaptation.","d":"Individual item guarantees ignore complexity and self-management."},"guideInsight":"Release planning in Scrum is empirical: inspect progress, adapt the plan, communicate ranges or conditions honestly.","examTip":"Avoid answers that invent mandatory output metrics or force rigid date/scope locks.","realWorld":"Show leadership the ordered backlog, Done history, and risks—then revise the forecast as you learn.","remember":"Forecast with empiricism; revise as you learn."},{"id":1057,"certifications":["PSPO-I"],"category":"Sprint Goal","competency":"Understanding and Applying the Scrum Framework","topic":"Renegotiating scope","difficulty":"Intermediate","type":"scenario","question":"During the Sprint, Developers discover that delivering the full forecasted scope would endanger the Sprint Goal. What should the Product Owner and Developers do?","options":[{"id":"a","text":"Silently drop quality so everything still “fits.”","correct":false},{"id":"b","text":"Collaborate to renegotiate the scope of the Sprint Backlog without endangering the Sprint Goal","correct":true},{"id":"c","text":"Immediately cancel the Sprint because any scope change requires cancellation","correct":false},{"id":"d","text":"Add more people mid-Sprint and keep every item without discussion","correct":false}],"correctWhy":"Scope may be clarified and renegotiated with the Product Owner as more is learned. No changes should be made that would endanger the Sprint Goal, and quality does not decrease.","wrongWhy":{"a":"Quality does not decrease; Done still applies.","c":"Scope renegotiation is not the same as Sprint cancellation.","d":"Adding people without collaboration does not address focus on the Sprint Goal."},"guideInsight":"The Sprint Goal provides flexibility: the exact scope can flex if the goal remains intact.","examTip":"Look for “renegotiate scope with PO” while protecting Sprint Goal and quality.","realWorld":"Cut or defer lower-value Sprint Backlog items so the Sprint Goal still lands as a Done Increment.","remember":"Scope can flex; Sprint Goal and quality should not."},{"id":1058,"certifications":["PSPO-I"],"category":"Business strategy","competency":"Managing Products with Agility","topic":"Product strategy and Product Goal","difficulty":"Intermediate","type":"single","question":"Leadership announces a new market strategy that conflicts with the current Product Goal. What is the Product Owner’s best next move?","options":[{"id":"a","text":"Ignore strategy and keep the old Product Goal forever to avoid disrupting Developers","correct":false},{"id":"b","text":"Work with stakeholders to adapt the Product Goal and re-order the Product Backlog so the product strategy and Scrum Team focus stay aligned","correct":true},{"id":"c","text":"Keep two Product Goals at once so nobody feels left out","correct":false},{"id":"d","text":"Ask the Scrum Master to choose the strategy for the product","correct":false}],"correctWhy":"The Product Goal can change, but it remains a single coherent target. The Product Owner collaborates with stakeholders and manages the Product Backlog to pursue product value under the evolving strategy.","wrongWhy":{"a":"Ignoring strategy disconnects the product from business reality.","c":"One Product, one Product Backlog, one Product Goal at a time for focus.","d":"Product value and goal direction are Product Owner accountabilities."},"guideInsight":"The Product Goal provides focus; when strategy shifts, adapt the goal and backlog rather than fragmenting focus.","examTip":"One product → one Product Backlog → one Product Goal.","realWorld":"Translate strategy into a revised Product Goal, then show the reordered backlog at the next Sprint Review.","remember":"Adapt Product Goal with strategy; keep a single focus."},{"id":1059,"certifications":["PSPO-I"],"category":"Increment","competency":"Understanding and Applying the Scrum Framework","topic":"Usable Increment","difficulty":"Intermediate","type":"tf","question":"True or False: A new Increment replaces earlier Increments, so previous work does not need to keep working with it.","options":[{"id":"a","text":"True","correct":true},{"id":"b","text":"False","correct":false}],"correctWhy":"The Scrum Guide states that each Increment is additive to all prior Increments and thoroughly verified, ensuring that all Increments work together.","wrongWhy":{"b":"Additivity and verification of Increments working together are explicit Increment characteristics."},"guideInsight":"An Increment is a concrete stepping stone toward the Product Goal and must be usable.","examTip":"Increments are cumulative and integrated—not isolated demos of disconnected work.","realWorld":"If new Done work breaks prior capabilities, it is not a healthy Increment.","remember":"Increments are additive and must work together."},{"id":1060,"certifications":["PSPO-I"],"category":"Stakeholders","competency":"Managing Products with Agility","topic":"Stakeholder collaboration","difficulty":"Intermediate","type":"single","question":"Multiple departments each want their own prioritized list for the same product. How should the Product Owner respond?","options":[{"id":"a","text":"Maintain one Product Backlog for the product and order items to maximize overall product value","correct":true},{"id":"b","text":"Create a separate Product Backlog per department to keep politics calm","correct":false},{"id":"c","text":"Let each department pull Developers directly during the Sprint","correct":false},{"id":"d","text":"Average all requests into equal priority so fairness replaces value","correct":false}],"correctWhy":"There is one Product Backlog for a product. The Product Owner orders it to maximize value, which requires integrating stakeholder needs rather than splintering backlogs.","wrongWhy":{"b":"Multiple backlogs for one product destroy focus and transparency.","c":"Stakeholders do not pull Developers mid-Sprint outside Scrum accountabilities.","d":"Equal priority is not value-based ordering."},"guideInsight":"One product has one Product Backlog; the Product Owner is accountable for its ordering.","examTip":"“One Product Backlog” is a frequent correct theme under stakeholder conflict.","realWorld":"Facilitate trade-off conversations using one visible ordered backlog tied to the Product Goal.","remember":"One product, one Product Backlog, value-based order."},{"id":1061,"certifications":["PSPO-I"],"category":"Sprint Review","competency":"Managing Products with Agility","topic":"Sprint Review outcomes","difficulty":"Intermediate","type":"multi","question":"Which outcomes are appropriate results of a Sprint Review? (Select all that apply.)","options":[{"id":"a","text":"Attendees collaborate on what to do next","correct":true},{"id":"b","text":"The Product Backlog may be adjusted to meet new opportunities","correct":true},{"id":"c","text":"The Scrum Master rates each Developer’s individual performance","correct":false},{"id":"d","text":"The Scrum Team and stakeholders inspect the outcome of the Sprint and the Increment","correct":true}],"correctWhy":"The Sprint Review is to inspect the outcome of the Sprint and determine future adaptations. The Scrum Team presents results, and attendees collaborate on next steps; the Product Backlog may be adjusted.","wrongWhy":{"c":"Sprint Review is not a performance appraisal meeting."},"guideInsight":"Sprint Review is a working session for inspection and Product Backlog adaptation, not a status theater or HR review.","examTip":"Correct Sprint Review answers emphasize collaboration and backlog adaptation.","realWorld":"Leave the Review with clearer ordering and validated learning, not just applause for a demo.","remember":"Inspect Increment → adapt Product Backlog together."},{"id":1062,"certifications":["PSPO-I"],"category":"Customers","competency":"Managing Products with Agility","topic":"Customer validation","difficulty":"Intermediate","type":"scenario","question":"A Product Owner is confident about a major Product Backlog item, but customers have not validated the underlying assumption. Developers can deliver it in one Sprint. What is the most prudent approach?","options":[{"id":"a","text":"Order the full item immediately at the top and skip validation to move faster","correct":false},{"id":"b","text":"Slice or sequence work to create a valuable Done Increment that tests the assumption early, then adapt ordering based on learning","correct":true},{"id":"c","text":"Ask Developers to build three alternative full solutions in parallel without a Product Goal","correct":false},{"id":"d","text":"Postpone all delivery until a 12-month analysis document is complete","correct":false}],"correctWhy":"Empiricism favors delivering valuable Increments that enable inspection. The Product Owner should reduce risk by learning from real Done Increments rather than assuming value.","wrongWhy":{"a":"Unvalidated big bets maximize risk, not value.","c":"Parallel full builds without focus waste capacity and dilute the Product Goal.","d":"Lengthy analysis without Increments delays learning."},"guideInsight":"Increments are stepping stones toward the Product Goal and enable feedback loops with customers and stakeholders.","examTip":"Prefer early valuable Increments that validate assumptions over big-bang delivery.","realWorld":"Order the smallest valuable slice that answers the riskiest customer question first.","remember":"Use Done Increments to validate value assumptions."},{"id":1063,"certifications":["PSPO-I"],"category":"Product Owner","competency":"Managing Products with Agility","topic":"Single Product Owner","difficulty":"Intermediate","type":"single","question":"A committee insists on jointly owning Product Backlog decisions “by consensus.” What Scrum stance should prevail?","options":[{"id":"a","text":"The Product Owner is one person; others may influence, but the Product Owner remains accountable for value and backlog decisions","correct":true},{"id":"b","text":"Consensus committees are required by Scrum for all ordering decisions","correct":false},{"id":"c","text":"The Scrum Master becomes the final decision-maker when committees disagree","correct":false},{"id":"d","text":"Developers vote to break ties on Product Backlog order","correct":false}],"correctWhy":"The Product Owner is one person, not a committee. The Product Owner may represent the needs of many stakeholders, but remains accountable for maximizing value and effective Product Backlog management.","wrongWhy":{"b":"Scrum does not replace the Product Owner with a consensus committee.","c":"The Scrum Master does not own product decisions.","d":"Developers do not order the Product Backlog by vote."},"guideInsight":"Represent many needs; decide as one accountable Product Owner.","examTip":"“PO is one person, not a committee” is a classic correct idea.","realWorld":"Gather input widely, decide clearly, and communicate the ordered backlog.","remember":"One Product Owner; not a decision committee."},{"id":1064,"certifications":["PSPO-I"],"category":"Definition of Done","competency":"Understanding and Applying the Scrum Framework","topic":"Organizational Done standards","difficulty":"Intermediate","type":"single","question":"An organization provides a Definition of Done. The Scrum Team wants stricter quality checks. What is appropriate?","options":[{"id":"a","text":"The Scrum Team may define a stronger Definition of Done that includes the organizational standard as a minimum","correct":true},{"id":"b","text":"The team must weaken the organizational Done to ship faster","correct":false},{"id":"c","text":"Only the Product Owner may change Done without Developers","correct":false},{"id":"d","text":"Done is optional once stakeholders verbally approve a demo","correct":false}],"correctWhy":"If the Definition of Done for an Increment is part of organizational standards, all Scrum Teams must follow it as a minimum. If it is not an organizational standard, the Scrum Team must create a Definition of Done appropriate for the product.","wrongWhy":{"b":"Organizational Done is a minimum; weakening it is not appropriate.","c":"Done is a shared quality commitment for the Increment, not a unilateral PO toggle.","d":"Verbal approval does not replace Done."},"guideInsight":"Organizational Done is a floor; teams can go above it, not below it.","examTip":"Remember: org Done = minimum; team may strengthen.","realWorld":"Keep compliance checks from the org standard, then add team-specific quality bars.","remember":"Org Done is minimum; team can make it stronger."},{"id":1065,"certifications":["PSPO-I"],"category":"Self-managing teams","competency":"Developing People and Teams","topic":"Cross-functional collaboration","difficulty":"Intermediate","type":"multi","question":"Which statements describe a healthy relationship between the Product Owner and Developers? (Select all that apply.)","options":[{"id":"a","text":"The Product Owner clarifies Product Backlog items and desired outcomes","correct":true},{"id":"b","text":"Developers decide how to turn selected items into a Done Increment","correct":true},{"id":"c","text":"The Product Owner dictates technical designs and individual assignments daily","correct":false},{"id":"d","text":"They collaborate during Sprint Planning on the Sprint Goal and selected work","correct":true}],"correctWhy":"PO accountability centers on value and backlog clarity; Developers are accountable for the plan and the how. Sprint Planning is a collaboration across the Scrum Team.","wrongWhy":{"c":"Dictating technical design and assignments violates self-management."},"guideInsight":"Respect accountabilities while collaborating intensely on value and the Sprint Goal.","examTip":"Correct options separate what/why (PO) from how (Developers).","realWorld":"Spend energy on clarifying outcomes; trust Developers on implementation choices.","remember":"PO clarifies value; Developers own the how."},{"id":1066,"certifications":["PSPO-I"],"category":"Product Backlog","competency":"Managing Products with Agility","topic":"Emerging Product Backlog","difficulty":"Intermediate","type":"single","question":"Why is it acceptable—and expected—that the Product Backlog changes frequently?","options":[{"id":"a","text":"Because Scrum forbids any form of planning","correct":false},{"id":"b","text":"Because it is a living artifact that evolves as more is learned about the product, users, market, and technology","correct":true},{"id":"c","text":"Because Developers may reorder it freely without Product Owner involvement","correct":false},{"id":"d","text":"Because the Sprint Goal must change every day","correct":false}],"correctWhy":"The Product Backlog is an emergent, ordered list of what is needed to improve the product. It is never complete and evolves as understanding grows.","wrongWhy":{"a":"Scrum plans through empirical events and artifacts; it does not forbid planning.","c":"Ordering remains a Product Owner accountability.","d":"The Sprint Goal provides focus for the Sprint and is not meant to thrash daily."},"guideInsight":"Emergence of the Product Backlog is a feature of empiricism, not a failure of planning.","examTip":"Living backlog = good; living accountability chaos = bad.","realWorld":"Update ordering after every meaningful learning from customers or Sprint Reviews.","remember":"Product Backlog emerges with learning."},{"id":1067,"certifications":["PSPO-I"],"category":"Sprint","competency":"Understanding and Applying the Scrum Framework","topic":"Sprint as container","difficulty":"Intermediate","type":"tf","question":"True or False: During the Sprint, the Product Goal may be changed freely whenever stakeholders request it, even if that endangers the Sprint Goal.","options":[{"id":"a","text":"True","correct":false},{"id":"b","text":"False","correct":true}],"correctWhy":"During the Sprint, no changes are made that would endanger the Sprint Goal. Scope may be renegotiated, but focus on the Sprint Goal remains. Product Goal changes are strategic and should not casually blow up the current Sprint’s commitment.","wrongWhy":{"a":"Endangering the Sprint Goal mid-Sprint contradicts Scrum’s Sprint rules."},"guideInsight":"Sprints create stability for focus while still allowing empirical adaptation of scope with the Product Owner.","examTip":"False whenever an option lets stakeholders casually endanger the Sprint Goal.","realWorld":"Park strategic Product Goal shifts for transparent backlog adaptation; finish or renegotiate the current Sprint responsibly.","remember":"Do not endanger the Sprint Goal mid-Sprint."},{"id":1068,"certifications":["PSPO-I"],"category":"Value","competency":"Managing Products with Agility","topic":"Ordering trade-offs","difficulty":"Intermediate","type":"single","question":"A compliance item has low user delight but blocks entering a regulated market that is central to the Product Goal. A flashy feature has high excitement but little strategic impact. What should the Product Owner order first?","options":[{"id":"a","text":"The flashy feature, because delight always outranks strategy","correct":false},{"id":"b","text":"The compliance item, because it enables progress toward the Product Goal and unlocks value","correct":true},{"id":"c","text":"Neither; wait until Developers invent a third option","correct":false},{"id":"d","text":"Whatever item has the longest description","correct":false}],"correctWhy":"Ordering should optimize value relative to the Product Goal. Enabling a strategic market entry can be higher value than short-term excitement.","wrongWhy":{"a":"Delight without strategic progress may not maximize product value.","c":"The Product Owner must still order based on current knowledge.","d":"Description length is irrelevant to value."},"guideInsight":"Value includes strategic enablement, risk reduction, and customer outcomes—not only visible wow features.","examTip":"Tie ordering choices back to the Product Goal under trade-off questions.","realWorld":"Make the strategic why visible so stakeholders understand why compliance outranks glitter.","remember":"Order for Product Goal value, not just excitement."},{"id":1069,"certifications":["PSPO-I"],"category":"Scrum Master","competency":"Developing People and Teams","topic":"PO effectiveness coaching","difficulty":"Intermediate","type":"single","question":"The Product Owner struggles to communicate a clear Product Goal. How can the Scrum Master best help?","options":[{"id":"a","text":"Take over Product Owner accountability and order the backlog personally","correct":false},{"id":"b","text":"Help the Product Owner find techniques for effective Product Goal definition and stakeholder communication while leaving accountability with the Product Owner","correct":true},{"id":"c","text":"Cancel Sprint Planning until the Product Owner is replaced","correct":false},{"id":"d","text":"Instruct Developers to invent a Product Goal without the Product Owner","correct":false}],"correctWhy":"The Scrum Master serves the Product Owner by helping find techniques for effective Product Goal definition and Product Backlog management, without taking over the accountability.","wrongWhy":{"a":"Accountabilities are not swapped because coaching is hard.","c":"Stopping Scrum events does not develop the Product Owner.","d":"Developers should not replace the Product Owner’s goal accountability."},"guideInsight":"Scrum Master service to the Product Owner is coaching and enabling, not proxy product ownership.","examTip":"SM helps PO be effective; SM does not become PO.","realWorld":"Facilitate stakeholder workshops and clarity techniques, then step back so the PO decides.","remember":"Scrum Master coaches; Product Owner remains accountable."},{"id":1070,"certifications":["PSPO-I"],"category":"Release","competency":"Managing Products with Agility","topic":"Release decisions","difficulty":"Intermediate","type":"single","question":"When can a Done Increment be released to stakeholders or customers?","options":[{"id":"a","text":"Only at the end of a multi-Sprint release train mandated by Scrum","correct":false},{"id":"b","text":"Whenever the Product Owner decides the Increment is ready to release; an Increment may be released prior to the end of the Sprint","correct":true},{"id":"c","text":"Only after the Scrum Master signs a release certificate","correct":false},{"id":"d","text":"Never mid-Sprint, even if the work meets the Definition of Done","correct":false}],"correctWhy":"An Increment may be delivered to stakeholders prior to the end of the Sprint. The Sprint Review should never be considered a gate to releasing value. The Product Owner may choose to release more frequently.","wrongWhy":{"a":"Scrum does not require multi-Sprint release trains.","c":"Release authority is not a Scrum Master certification step.","d":"Done Increments can be released before Sprint end."},"guideInsight":"Done creates a usable Increment; release timing is a Product Owner value decision.","examTip":"Sprint Review is not a release gate.","realWorld":"Release as soon as value and risk warrant—don’t wait for ceremony.","remember":"Done Increment can release anytime PO chooses."},{"id":1071,"certifications":["PSPO-I"],"category":"Transparency","competency":"Understanding and Applying the Scrum Framework","topic":"Artifact transparency","difficulty":"Intermediate","type":"tf","question":"True or False: The Product Owner remains accountable for Product Backlog transparency even when refinement work is shared with Developers.","options":[{"id":"a","text":"True","correct":true},{"id":"b","text":"False","correct":false}],"correctWhy":"Ensuring that the Product Backlog is transparent, visible, and understood is explicitly part of the Product Owner’s Product Backlog management accountability.","wrongWhy":{"b":"Transparency of the Product Backlog is a Product Owner accountability in the Scrum Guide."},"guideInsight":"Without a transparent Product Backlog, inspection and adaptation of product direction fail.","examTip":"PO accountability includes communication and transparency, not just writing items.","realWorld":"If stakeholders are surprised by priorities, backlog transparency is broken.","remember":"PO ensures Product Backlog transparency."},{"id":1072,"certifications":["PSPO-I"],"category":"Daily Scrum","competency":"Developing People and Teams","topic":"PO at Daily Scrum","difficulty":"Intermediate","type":"single","question":"A Product Owner wants to attend the Daily Scrum every day to give task instructions. What guidance fits Scrum?","options":[{"id":"a","text":"The Daily Scrum is for Developers; if the Product Owner attends, they should not direct how Developers plan their day’s work","correct":true},{"id":"b","text":"The Product Owner must run the Daily Scrum and assign work","correct":false},{"id":"c","text":"Stakeholders must attend and vote on impediments","correct":false},{"id":"d","text":"The Daily Scrum replaces Sprint Planning when the Product Owner is present","correct":false}],"correctWhy":"The Daily Scrum is a 15-minute event for the Developers. If the Product Owner or Scrum Master attend, they participate as Developers only if they are actively working on Sprint Backlog items; they do not use it to assign tasks.","wrongWhy":{"b":"Developers conduct the Daily Scrum to inspect progress toward the Sprint Goal.","c":"Stakeholders are not required Daily Scrum participants.","d":"Daily Scrum does not replace Sprint Planning."},"guideInsight":"Daily Scrum supports Developer self-management and Sprint Goal focus.","examTip":"PO may listen; PO must not turn Daily Scrum into task assignment.","realWorld":"Share backlog clarifications outside or after Daily Scrum; let Developers adapt their plan.","remember":"Daily Scrum is for Developers’ plan, not PO tasking."},{"id":1073,"certifications":["PSPO-I"],"category":"Value optimization","competency":"Managing Products with Agility","topic":"Opportunity cost","difficulty":"Advanced","type":"single","question":"Two initiatives could be started, but the Scrum Team can only pursue one Product Goal focus. Initiative A has clearer short-term revenue; Initiative B better positions the product for a strategic Product Goal over the next year. Evidence is incomplete. What is the strongest Product Owner move?","options":[{"id":"a","text":"Start both fully and ask Developers to context-switch constantly","correct":false},{"id":"b","text":"Choose based only on who shouted loudest in the last meeting","correct":false},{"id":"c","text":"Make an explicit Product Goal choice, order the Product Backlog accordingly, and use frequent Done Increments to validate or revise that strategic bet","correct":true},{"id":"d","text":"Freeze the Product Backlog for a year so no empirical learning can change course","correct":false}],"correctWhy":"Focus requires a coherent Product Goal. The Product Owner must make value judgments under uncertainty, then use empiricism—transparent Increments and backlog adaptation—to learn whether the bet is paying off.","wrongWhy":{"a":"Splitting focus across competing goals reduces effectiveness.","b":"Noise is not evidence of value.","d":"Freezing the backlog rejects empiricism."},"guideInsight":"Managing products with agility means committing to a direction while keeping feedback loops short enough to adapt.","examTip":"Advanced items reward focused Product Goal + empirical validation, not parallel everything.","realWorld":"Document the bet, order for it, and schedule learning checkpoints via Sprint Reviews and releases.","remember":"Pick a Product Goal focus; validate with Increments."},{"id":1074,"certifications":["PSPO-I"],"category":"Scaling accountabilities","competency":"Understanding and Applying the Scrum Framework","topic":"Multiple teams one product","difficulty":"Advanced","type":"multi","question":"Several Scrum Teams work on one product. Which statements are consistent with Scrum? (Select all that apply.)","options":[{"id":"a","text":"They share one Product Backlog","correct":true},{"id":"b","text":"They share one Product Goal","correct":true},{"id":"c","text":"Each team should invent a conflicting Product Goal to maximize local optimization","correct":false},{"id":"d","text":"They should define and comply with an integrated Definition of Done so the combined work forms a usable Done Increment","correct":true}],"correctWhy":"If Scrum Teams become too large they should reorganize into multiple cohesive teams, each focused on the same product. Therefore, they should share the same Product Goal, Product Backlog, and Product Owner. Combined work must meet an integrated Done.","wrongWhy":{"c":"Conflicting Product Goals destroy product focus."},"guideInsight":"Multiple teams on one product still need one Product Owner, one Product Goal, and one Product Backlog.","examTip":"Watch for “one product / one backlog / one goal / integrated Done.”","realWorld":"Coordinate through a shared backlog and Done rather than separate product kingdoms.","remember":"One product: one PO, Goal, Backlog; integrated Done."},{"id":1075,"certifications":["PSPO-I"],"category":"Sprint cancellation","competency":"Understanding and Applying the Scrum Framework","topic":"Obsolete Sprint Goal judgement","difficulty":"Advanced","type":"scenario","question":"Three days into a Sprint, a competitor releases a free alternative that makes the current Sprint Goal’s planned differentiation worthless. Completing the Sprint as planned would produce little customer value. What should the Product Owner do?","options":[{"id":"a","text":"Force Developers to finish every Sprint Backlog item anyway to protect utilization metrics","correct":false},{"id":"b","text":"Consider cancelling the Sprint because the Sprint Goal is obsolete, then re-plan with a new Sprint Goal toward updated value","correct":true},{"id":"c","text":"Secretly replace all Sprint Backlog items without telling anyone, keeping the old Sprint Goal label","correct":false},{"id":"d","text":"Ask stakeholders to cancel the Sprint by majority email vote","correct":false}],"correctWhy":"A Sprint could be cancelled if the Sprint Goal becomes obsolete. Only the Product Owner has authority to cancel. When the goal no longer makes sense, continuing for utilization wastes value.","wrongWhy":{"a":"Utilization is not the measure of success; value and the Sprint Goal are.","c":"Hidden wholesale replacement without transparency and a coherent Sprint Goal is not Scrum.","d":"Cancellation authority is not a stakeholder vote."},"guideInsight":"Cancellation is rare and costly, but appropriate when the Sprint Goal is truly obsolete.","examTip":"Advanced cancellation scenarios hinge on obsolete Sprint Goal + only PO authority.","realWorld":"Cancel transparently, harvest any usable Done learning, and start a new Sprint aimed at a viable goal.","remember":"Obsolete Sprint Goal → PO may cancel."},{"id":1076,"certifications":["PSPO-I"],"category":"Stakeholders","competency":"Managing Products with Agility","topic":"Conflicting stakeholder value","difficulty":"Advanced","type":"single","question":"Sales wants short-term custom one-offs; customer success wants stability; strategy wants a platform Product Goal. Developers are overloaded by interruptions. What should the Product Owner optimize for?","options":[{"id":"a","text":"Whatever request arrived most recently","correct":false},{"id":"b","text":"A transparent ordering toward the Product Goal that balances value, while protecting the Sprint Goal from interruptions that would endanger it","correct":true},{"id":"c","text":"Letting each stakeholder pull 33% of Developer capacity every Sprint by policy","correct":false},{"id":"d","text":"Stopping all stakeholder communication to reduce conflict","correct":false}],"correctWhy":"The Product Owner must maximize product value under a coherent Product Goal, keep the Product Backlog ordered and transparent, and ensure Sprint focus is not destroyed by unplanned redirection.","wrongWhy":{"a":"Recency is not a value strategy.","c":"Equal capacity quotas replace value-based ordering with politics.","d":"Stakeholders remain essential collaborators, especially at Sprint Review."},"guideInsight":"Agility in product management is deciding trade-offs openly against a Product Goal, not pleasing everyone equally.","examTip":"Advanced stakeholder items reward Product Goal focus + Sprint Goal protection.","realWorld":"Publish the ordered backlog rationale; route interrupt work through backlog ordering, not hallway pulls.","remember":"Optimize to Product Goal; protect Sprint Goal focus."},{"id":1077,"certifications":["PSPO-I"],"category":"Quality","competency":"Understanding and Applying the Scrum Framework","topic":"Quality under pressure","difficulty":"Advanced","type":"tf","question":"True or False: When pressure rises, it is acceptable for the Product Owner to negotiate a lower Definition of Done for the current Sprint so more items appear complete, as long as a “fix-later” list is created.","options":[{"id":"a","text":"True","correct":false},{"id":"b","text":"False","correct":true}],"correctWhy":"Quality does not decrease when work is “done.” Work that does not meet Done is not part of the Increment. Creating a fix-later list while calling undone work complete breaks transparency.","wrongWhy":{"a":"Lowering Done to inflate completion falsifies the Increment and violates Scrum’s quality expectation."},"guideInsight":"Done is the quality commitment for the Increment; pressure does not rewrite that commitment casually.","examTip":"False: any “reduce Done now, fix later, still call it Done.”","realWorld":"Renegotiate scope, not quality, when the Sprint is over-committed.","remember":"Pressure → renegotiate scope, not Done."},{"id":1078,"certifications":["PSPO-I"],"category":"Forecasting","competency":"Managing Products with Agility","topic":"Release planning under uncertainty","difficulty":"Advanced","type":"single","question":"Leadership demands a precise date for an uncertain multi-Increment initiative. What Product Owner response best reflects Scrum?","options":[{"id":"a","text":"Invent a confident date without evidence to reduce anxiety","correct":false},{"id":"b","text":"Provide an empirical forecast based on current Product Backlog order and observed progress of Done Increments, and explain that the forecast will adapt as learning emerges","correct":true},{"id":"c","text":"Force Developers to promise personal delivery dates for every item","correct":false},{"id":"d","text":"Refuse all forecasting because Scrum bans planning","correct":false}],"correctWhy":"Scrum supports forecasting through transparency and empiricism. Plans are revised as more is known; honesty about uncertainty is part of maximizing long-term value and trust.","wrongWhy":{"a":"False certainty destroys trust when reality diverges.","c":"Individual promises ignore complexity and self-managing teamwork.","d":"Scrum includes planning via Sprint Planning, backlog ordering, and empirical forecasts."},"guideInsight":"Forecasting is valuable; pretending certainty in complex work is not.","examTip":"Prefer empirical, adaptable forecasts over false precision or “no planning.”","realWorld":"Show assumptions, risks, and re-forecast cadence tied to Sprint Reviews and releases.","remember":"Forecast empirically; adapt as you learn."},{"id":1079,"certifications":["PSPO-I"],"category":"Product Goal","competency":"Managing Products with Agility","topic":"Product Goal lifecycle","difficulty":"Advanced","type":"multi","question":"Which statements about the Product Goal are correct in practice? (Select all that apply.)","options":[{"id":"a","text":"The Product Goal is the long-term objective for the Scrum Team","correct":true},{"id":"b","text":"Before a Scrum Team starts on a new Product Goal, it is expected they have completed or abandoned the previous one, or agreed it is obsolete","correct":true},{"id":"c","text":"The Product Goal replaces the need for a Product Backlog","correct":false},{"id":"d","text":"The Product Backlog emerges to fulfill the Product Goal","correct":true}],"correctWhy":"The Product Goal is the long-term objective. The Product Backlog emerges to fulfill it. The Scrum Team is expected to fulfill or abandon one Product Goal before taking on the next.","wrongWhy":{"c":"The Product Goal is the commitment for the Product Backlog; it does not eliminate the backlog."},"guideInsight":"Product Goals create strategic focus; the backlog is the path of emergent work toward that focus.","examTip":"Multi-select often includes “complete/abandon previous Product Goal before next.”","realWorld":"Avoid stacking simultaneous Product Goals that pull the team in opposite directions.","remember":"One Product Goal at a time; backlog emerges to fulfill it."},{"id":1080,"certifications":["PSPO-I"],"category":"Self-managing teams","competency":"Developing People and Teams","topic":"PO overreach vs accountability","difficulty":"Advanced","type":"scenario","question":"A Product Owner repeatedly rejects Developers’ technical approach during the Sprint and insists on a specific implementation, causing rework and missed Sprint Goal risk. Stakeholders love the PO’s “hands-on” style. What should change?","options":[{"id":"a","text":"Nothing; Product Owners must control technical design to maximize value","correct":false},{"id":"b","text":"The Product Owner should refocus on clarifying outcomes, ordering, and Sprint value; Developers should retain self-management over how to meet Done and the Sprint Goal, with collaboration instead of control","correct":true},{"id":"c","text":"Developers should ignore the Definition of Done to satisfy the Product Owner’s design faster","correct":false},{"id":"d","text":"Stakeholders should assign tasks directly to Developers to bypass the conflict","correct":false}],"correctWhy":"Developers are accountable for creating a plan and adapting toward the Sprint Goal, and for turning items into a Done Increment. Self-managing teams decide how. The Product Owner maximizes value through goals and backlog management, not by commandeering implementation.","wrongWhy":{"a":"Hands-on control of how work is done is not a Product Owner accountability.","c":"Quality and Done still apply.","d":"Stakeholders bypassing the team worsens self-management and focus."},"guideInsight":"Sustainable value comes from clear product direction plus a self-managing, cross-functional team that owns the how.","examTip":"When PO “help” becomes technical command-and-control, the correct repair is restoring accountabilities.","realWorld":"Express constraints and acceptance outcomes; let Developers propose approaches and inspect via Done Increments.","remember":"PO owns value/why; Developers own how—even under stakeholder praise."},{"id":2001,"certifications":["PSPO-II"],"category":"Product value","competency":"Managing Products with Agility","topic":"Outcomes versus outputs","difficulty":"Advanced","type":"single","question":"A Product Owner is praised for delivering a large volume of features each quarter, yet customer retention and willingness to pay are flat. What is the strongest interpretation of this situation?","options":[{"id":"a","text":"Output volume is rising while outcomes that matter to customers and the business are not improving.","correct":true},{"id":"b","text":"The Scrum Team must increase Velocity until retention improves.","correct":false},{"id":"c","text":"Story points should replace business KPIs as the primary success measure.","correct":false},{"id":"d","text":"The Definition of Done is the only measure of product value.","correct":false}],"correctWhy":"Value is judged by outcomes such as retention and willingness to pay, not by how many items were shipped. High output with flat outcomes signals a value problem, not a throughput celebration.","wrongWhy":{"b":"Velocity is a team forecasting aid, not a value outcome; raising it does not guarantee retention.","c":"Story points are an optional estimation technique, not a Scrum-mandated success metric.","d":"Done describes quality and releasability, not whether the product created customer or business value."},"guideInsight":"The Product Owner maximizes the value of the product; the Guide does not equate value with feature count. Estimation techniques are complementary practice.","examTip":"Separate outputs (what was built) from outcomes (what changed for customers/business).","realWorld":"Track leading indicators of use and economic results alongside delivery metrics.","remember":"Shipping more is not the same as creating more value."},{"id":2002,"certifications":["PSPO-II"],"category":"Product Goal","competency":"Understanding and Applying the Scrum Framework","topic":"One Product Goal","difficulty":"Advanced","type":"single","question":"Leadership wants three concurrent Product Goals for one product so every department feels represented. What should the Product Owner do?","options":[{"id":"a","text":"Keep a single Product Goal for the product and negotiate prioritization of progress toward that goal.","correct":true},{"id":"b","text":"Accept all three Goals and let each Sprint Goal pick a different one.","correct":false},{"id":"c","text":"Create three Product Backlogs, one per Goal.","correct":false},{"id":"d","text":"Assign each Goal to a different Scrum Team and treat them as separate products.","correct":false}],"correctWhy":"The Scrum Guide states the Product Goal is the long-term objective for the Scrum Team; there is one Product Goal for a product at a time, which focuses empiricism and ordering.","wrongWhy":{"b":"Rotating among competing long-term goals dilutes focus and contradicts one Product Goal at a time.","c":"One product has one Product Backlog; splitting by goal fragments ownership and transparency.","d":"Artificial product splits to please departments hide the real prioritization conflict."},"guideInsight":"One product: one Product Goal, one Product Backlog, one Product Owner. Multiple goals are a prioritization problem, not a structure requirement.","examTip":"When stakeholders demand parallel goals, the PO’s job is focus and transparent trade-offs.","realWorld":"Park secondary themes as future Product Goals after the current one is achieved or abandoned.","remember":"One product has one Product Goal at a time."},{"id":2003,"certifications":["PSPO-II"],"category":"Evidence-Based Management","competency":"Evolving the Agile Organization","topic":"Evidence-Based Management","difficulty":"Advanced","type":"single","question":"Which statement best describes Evidence-Based Management (EBM) relative to Scrum?","options":[{"id":"a","text":"EBM is a complementary approach for measuring value and improvement; it is not a Scrum Guide mandate.","correct":true},{"id":"b","text":"EBM Key Value Areas replace the Product Goal and Sprint Goal.","correct":false},{"id":"c","text":"Teams must report Current Value and Unrealized Value every Daily Scrum.","correct":false},{"id":"d","text":"Without EBM dashboards, a Product Owner is not maximizing value.","correct":false}],"correctWhy":"EBM offers useful lenses (Current Value, Unrealized Value, Time-to-Market, Ability to Innovate) for evidence-based decisions, but Scrum does not require EBM as a framework rule.","wrongWhy":{"b":"Product Goal and Sprint Goal remain Scrum commitments; EBM does not replace them.","c":"The Daily Scrum is for the Developers’ plan toward the Sprint Goal, not mandatory EBM reporting.","d":"Many valid evidence practices exist; EBM is helpful complementary practice, not a license requirement."},"guideInsight":"Scrum Guide rules stay authoritative; EBM is optional complementary practice for inspecting value and capability.","examTip":"Treat EBM as evidence technique, not as mandatory Scrum ceremony content.","realWorld":"Use EBM-style measures when they clarify trade-offs; avoid cargo-cult dashboards.","remember":"EBM informs decisions; it is not a Scrum Guide requirement."},{"id":2004,"certifications":["PSPO-II"],"category":"Forecasting","competency":"Managing Products with Agility","topic":"Empirical forecasting","difficulty":"Advanced","type":"single","question":"Finance asks for a fixed date and a fixed feature list with guaranteed certainty for a six-month roadmap. What is the strongest Product Owner response grounded in empiricism?","options":[{"id":"a","text":"Offer forecasts based on inspected progress and product outcomes, and make uncertainty and trade-offs transparent rather than promising false certainty.","correct":true},{"id":"b","text":"Convert all features to story points and multiply by average Velocity to create a contractual date.","correct":false},{"id":"c","text":"Refuse any forecast because Scrum forbids planning beyond the current Sprint.","correct":false},{"id":"d","text":"Commit to the date and feature list, then use overtime if needed.","correct":false}],"correctWhy":"Complex work cannot be promised with certainty; empirical forecasting uses evidence, ranges, and transparent assumptions while protecting the ability to adapt.","wrongWhy":{"b":"Story points and Velocity are optional aids and still do not create certainty for fixed scope and date.","c":"Product planning and forecasting beyond a Sprint are expected; Scrum forbids false certainty, not foresight.","d":"False commitments and overtime undermine sustainability and empiricism."},"guideInsight":"Empiricism means decisions on observation; forecasts are useful, guarantees about complex work are not.","examTip":"Offer evidence-based forecasts and options (scope, date, or cost), not locked triple constraints.","realWorld":"Present confidence bands, risks, and the next learning milestones instead of a fake Gantt certainty.","remember":"Forecast with evidence; do not manufacture certainty."},{"id":2005,"certifications":["PSPO-II"],"category":"Product Owner stances","competency":"Managing Products with Agility","topic":"Anti-stances","difficulty":"Advanced","type":"single","question":"A Product Owner spends most of the week typing stakeholder requests into tickets and rarely challenges priority or validates outcomes. Which anti-stance does this most closely resemble?","options":[{"id":"a","text":"Backlog Clerk — administering the backlog instead of maximizing value.","correct":true},{"id":"b","text":"Visionary — articulating a compelling future product state.","correct":false},{"id":"c","text":"Experimenter — designing tests to learn about value.","correct":false},{"id":"d","text":"Decision Maker — making timely product decisions with accountability.","correct":false}],"correctWhy":"Clerk behavior treats the Product Owner as a request taker and ticket admin; it is a weak pattern, not a Scrum role, and undermines value ownership.","wrongWhy":{"b":"Visionary is a complementary strong stance focused on direction, not passive intake.","c":"Experimenter validates hypotheses; this scenario shows no learning design.","d":"Decision Maker owns outcomes and trade-offs; clerking avoids decisions."},"guideInsight":"The Product Owner is accountable for maximizing product value and effective Product Backlog management—not for being a scribe. Stances are complementary practice language.","examTip":"Spot anti-stances (Clerk, Story Writer, Project Manager, Gatekeeper) as failure modes.","realWorld":"Protect calendar time for discovery, stakeholder negotiation, and outcome review—not only ticket hygiene.","remember":"A Product Owner is not a backlog clerk."},{"id":2006,"certifications":["PSPO-II"],"category":"Product Backlog management","competency":"Managing Products with Agility","topic":"Value ordering","difficulty":"Advanced","type":"single","question":"Two stakeholders disagree: one wants a compliance feature that avoids fines; the other wants a growth feature with higher short-term revenue. How should the Product Owner order the Product Backlog?","options":[{"id":"a","text":"Order by expected value considering risk, cost of delay, strategic fit, and constraints—then make the trade-off transparent.","correct":true},{"id":"b","text":"Always put compliance first because Scrum requires risk items before value items.","correct":false},{"id":"c","text":"Alternate items from each stakeholder to keep fairness.","correct":false},{"id":"d","text":"Use WSJF scores as a mandatory Scrum rule for ordering.","correct":false}],"correctWhy":"Ordering is the Product Owner’s accountability and should reflect value under real constraints. Compliance and growth are both value/risk considerations to weigh explicitly.","wrongWhy":{"b":"Scrum does not prescribe a fixed rule that compliance always precedes other value.","c":"Fairness rotation is politics, not value maximization.","d":"WSJF can be useful complementary technique but is not a Scrum mandate."},"guideInsight":"The Product Owner orders the Product Backlog; techniques like WSJF or cost-of-delay models are optional aids.","examTip":"When two ‘rights’ collide, choose with transparent value logic, not equal airtime.","realWorld":"Document the decision and the evidence so stakeholders see why one risk or opportunity wins now.","remember":"Order for value under constraints—not for political balance."},{"id":2007,"certifications":["PSPO-II"],"category":"Release planning","competency":"Managing Products with Agility","topic":"Releasing before Sprint end","difficulty":"Advanced","type":"single","question":"A Done Increment is ready mid-Sprint and releasing it would reduce customer pain immediately. Stakeholders say ‘wait for Sprint Review approval.’ What is the strongest judgement?","options":[{"id":"a","text":"A Done Increment may be released whenever the Product Owner decides; Sprint Review is not a release gate.","correct":true},{"id":"b","text":"Releases are only allowed after Sprint Review sign-off.","correct":false},{"id":"c","text":"Releases require a Change Advisory Board outside Scrum before any customer sees work.","correct":false},{"id":"d","text":"Only the Scrum Master can authorize releases mid-Sprint.","correct":false}],"correctWhy":"Scrum allows releasing a Done Increment at any time. Sprint Review inspects outcomes and adapts the Product Backlog; it is not an approval gate for release.","wrongWhy":{"b":"Treating Review as a gate delays value and misreads the event’s purpose.","c":"External boards may be an organizational constraint, but they are not Scrum rules and often slow learning.","d":"Release decisions for value sit with the Product Owner, not the Scrum Master."},"guideInsight":"An Increment is a concrete stepping stone toward the Product Goal and may be delivered to stakeholders prior to the end of the Sprint.","examTip":"If it is Done and valuable, release timing is a PO value decision.","realWorld":"Decouple deployability from the Sprint calendar while keeping Review focused on feedback and adaptation.","remember":"Sprint Review is not a release gate."},{"id":2008,"certifications":["PSPO-II"],"category":"Hypothesis and experimentation","competency":"Managing Products with Agility","topic":"Experimentation","difficulty":"Advanced","type":"single","question":"A Product Owner believes a new onboarding flow will raise activation by 15%. What is the strongest next step?","options":[{"id":"a","text":"Frame a testable hypothesis, design the smallest experiment that can invalidate or support it, then inspect results.","correct":true},{"id":"b","text":"Build the full redesigned onboarding in one large release before measuring anything.","correct":false},{"id":"c","text":"Require OKRs to be written before any Product Backlog item is allowed.","correct":false},{"id":"d","text":"Ask the Developers to estimate story points for the entire redesign as proof of value.","correct":false}],"correctWhy":"Uncertain value claims should be treated as hypotheses. The Experimenter stance (complementary practice) seeks fast evidence rather than big bets based on opinion.","wrongWhy":{"b":"Large unvalidated builds maximize output risk and delay learning.","c":"OKRs can help strategy alignment but are not a Scrum prerequisite for backlog items.","d":"Estimates describe effort, not customer value evidence."},"guideInsight":"Empiricism favors inspection of working product and outcomes; experimentation is complementary practice supporting that mindset.","examTip":"Turn opinions into hypotheses with measurable signals and cheap tests.","realWorld":"Use A/B tests, prototypes, or limited cohorts before full rollout.","remember":"Validate value hypotheses with the smallest useful experiment."},{"id":2009,"certifications":["PSPO-II"],"category":"Stakeholders and customers","competency":"Managing Products with Agility","topic":"Saying no with evidence","difficulty":"Expert","type":"single","question":"A senior executive demands a feature that usage data and customer interviews show almost no one wants. What is the strongest Product Owner action?","options":[{"id":"a","text":"Decline or defer with clear evidence, explain opportunity cost relative to the Product Goal, and invite alternative options.","correct":true},{"id":"b","text":"Add it immediately to the top of the Product Backlog because hierarchy overrides empiricism.","correct":false},{"id":"c","text":"Hide the request and hope the executive forgets.","correct":false},{"id":"d","text":"Force the Developers to build it outside the Sprint Backlog to avoid conflict.","correct":false}],"correctWhy":"Accountability for value includes saying no (or not now) when evidence and Product Goal focus demand it. Transparency and options beat silent compliance.","wrongWhy":{"b":"Title does not create customer value; unvalidated mandates can destroy focus.","c":"Avoidance removes transparency and trust.","d":"Work outside Scrum’s Sprint commitments breaks focus and accountability."},"guideInsight":"The Product Owner is one person accountable for value and backlog ordering; influence and evidence are how hard trade-offs get made.","examTip":"‘No’ is stronger when paired with data, Product Goal impact, and alternatives.","realWorld":"Bring the executive into Sprint Review evidence or a short discovery readout.","remember":"Say no with evidence and Product Goal context."},{"id":2010,"certifications":["PSPO-II"],"category":"Scaling fundamentals","competency":"Understanding and Applying the Scrum Framework","topic":"Multi-team one product","difficulty":"Expert","type":"single","question":"Three Scrum Teams work on one product. Management proposes three Product Owners and three Product Backlogs to ‘speed decisions.’ What is the strongest response?","options":[{"id":"a","text":"Keep one Product Owner, one Product Backlog, and one Product Goal for the product; scale collaboration around that.","correct":true},{"id":"b","text":"Accept three Product Owners if they vote on priority each week.","correct":false},{"id":"c","text":"Create a program backlog above three team backlogs as required by Scrum.","correct":false},{"id":"d","text":"Give each team its own Definition of Done so integration can wait.","correct":false}],"correctWhy":"For one product, Scrum’s scaling fundamentals are one Product Goal, one Product Backlog, one Product Owner, and a shared Definition of Done quality bar.","wrongWhy":{"b":"Multiple Product Owners for one product create conflicting ordering and diluted accountability.","c":"Scrum does not require a program backlog layer; complementary scaling patterns must not violate one-product rules.","d":"Different Done definitions that postpone integration undermine a usable Increment."},"guideInsight":"If multiple Scrum Teams work on a product, they share one Product Goal, one Product Backlog, one Product Owner, and mutually define Done.","examTip":"Speed comes from clarity of ownership, not from multiplying Product Owners.","realWorld":"Use PO support roles carefully without splitting final backlog accountability.","remember":"One product: one PO, one backlog, one Product Goal."},{"id":2011,"certifications":["PSPO-II"],"category":"Product vision","competency":"Managing Products with Agility","topic":"Product vision","difficulty":"Advanced","type":"single","question":"Which statement best describes product vision in relation to Scrum?","options":[{"id":"a","text":"Vision is complementary practice that can inspire direction; the Product Goal is the Scrum commitment that focuses the Scrum Team toward a concrete objective.","correct":true},{"id":"b","text":"The Scrum Guide mandates a vision document before Sprint 1.","correct":false},{"id":"c","text":"Vision replaces the Product Backlog as the single source of work.","correct":false},{"id":"d","text":"Only executives may create vision; Product Owners execute tickets.","correct":false}],"correctWhy":"Strong Product Owners often act as Visionaries (complementary stance), but Scrum’s explicit product commitment is the Product Goal, with work flowing through the Product Backlog.","wrongWhy":{"b":"Vision artifacts are useful practice, not a Guide-mandated document.","c":"The Product Backlog remains the single source of work undertaken by the Scrum Team.","d":"That is Clerk/Project Manager anti-pattern thinking; POs shape product direction."},"guideInsight":"Product Goal is in the Guide; visioning techniques are complementary ways to communicate purpose.","examTip":"Connect vision → Product Goal → ordered backlog → Sprint Goals.","realWorld":"Keep vision inspiring and Product Goal measurable enough to inspect progress.","remember":"Vision inspires; Product Goal commits."},{"id":2012,"certifications":["PSPO-II"],"category":"Business strategy","competency":"Managing Products with Agility","topic":"Strategy and Product Goal","difficulty":"Advanced","type":"single","question":"Strategy shifts from acquiring new customers to expanding revenue from existing accounts. What should change first in Scrum terms?","options":[{"id":"a","text":"Re-evaluate and likely update the Product Goal so backlog ordering and Sprint Goals serve the new strategic outcome.","correct":true},{"id":"b","text":"Keep the old Product Goal and only change marketing OKRs.","correct":false},{"id":"c","text":"Freeze the Product Backlog until a Business Model Canvas workshop finishes.","correct":false},{"id":"d","text":"Switch immediately to project milestones and abandon Increments.","correct":false}],"correctWhy":"The Product Goal connects strategy to empirical product work. When strategy changes, the long-term objective for the product must be inspected and adapted.","wrongWhy":{"b":"OKRs may help communicate strategy but do not substitute for aligning the Product Goal and backlog.","c":"Business Model Canvas is optional complementary practice; freezing learning is rarely justified.","d":"Abandoning Increments throws away empiricism the strategy shift still needs."},"guideInsight":"The Product Goal describes a future state of the product; it should remain coherent with business strategy while remaining the Scrum Team’s focus.","examTip":"Strategy change → Product Goal adaptation → backlog re-ordering.","realWorld":"Brief stakeholders on what stops, starts, and continues after the Goal change.","remember":"Strategic shifts must show up in the Product Goal and ordering."},{"id":2013,"certifications":["PSPO-II"],"category":"Organizational design","competency":"Evolving the Agile Organization","topic":"Organizational design and culture","difficulty":"Expert","type":"single","question":"A company reorganizes so Product Owners must get written approval from four directors before changing Product Backlog order. What is the primary risk?","options":[{"id":"a","text":"Decision latency and diluted Product Owner accountability reduce the ability to maximize value empirically.","correct":true},{"id":"b","text":"The Definition of Done will automatically become stronger.","correct":false},{"id":"c","text":"Sprint Planning will no longer be needed.","correct":false},{"id":"d","text":"Velocity will become a more accurate value measure.","correct":false}],"correctWhy":"Organizational design that turns the Product Owner into a Gatekeeper’s messenger destroys fast feedback and clear accountability for value.","wrongWhy":{"b":"Approval chains do not improve Done; they often slow releases.","c":"Events remain necessary; bureaucracy does not replace them.","d":"Velocity still is not value; governance drag does not improve that."},"guideInsight":"The Product Owner is one person with accountability for effective Product Backlog management; organizations should enable, not dilute, that accountability.","examTip":"Watch for structures that create Gatekeeper anti-stances around the PO.","realWorld":"Move governance to guardrails and outcome reviews, not item-by-item approvals.","remember":"Slow approval chains undermine Product Owner accountability."},{"id":2014,"certifications":["PSPO-II"],"category":"Sprint Review","competency":"Understanding and Applying the Scrum Framework","topic":"Sprint Review purpose","difficulty":"Expert","type":"single","question":"Stakeholders treat Sprint Review as a pass/fail acceptance meeting for releasing. What should the Product Owner reinforce?","options":[{"id":"a","text":"Sprint Review inspects the Increment and Product Backlog progress to adapt future work; release decisions can occur whenever an Increment is Done.","correct":true},{"id":"b","text":"Only unfinished work should be shown so stakeholders can estimate remaining story points.","correct":false},{"id":"c","text":"Sprint Review replaces Sprint Retrospective.","correct":false},{"id":"d","text":"Stakeholders must vote to accept each Product Backlog item individually.","correct":false}],"correctWhy":"Review is a collaborative inspection and adaptation event for the product, not a stage-gate. Done defines releasability quality.","wrongWhy":{"b":"Showing incomplete work as the main focus misses inspection of usable Increment outcomes.","c":"Retrospective remains the team improvement event.","d":"Item-by-item acceptance theater recreates Waterfall gates."},"guideInsight":"Sprint Review is for inspecting progress toward the Product Goal and adapting the Product Backlog; it is not described as a release approval gate.","examTip":"If stakeholders want a gate, educate on Done + continuous release + Review for learning.","realWorld":"Demo outcomes and metrics, then re-order the backlog live with stakeholders.","remember":"Review adapts the product direction; it does not rubber-stamp releases."},{"id":2015,"certifications":["PSPO-II"],"category":"Portfolio planning","competency":"Evolving the Agile Organization","topic":"Portfolio planning","difficulty":"Expert","type":"single","question":"Portfolio leadership funds ten initiatives equally to ‘keep everyone happy,’ starving the highest-value product of capacity. What is the strongest Product Owner stance?","options":[{"id":"a","text":"Use evidence of Current Value and Unrealized Value (EBM as complementary practice) to argue for focusing investment where outcomes and opportunity are greatest.","correct":true},{"id":"b","text":"Accept equal funding because Scrum requires fairness across products.","correct":false},{"id":"c","text":"Merge all products into one backlog regardless of customer and value streams.","correct":false},{"id":"d","text":"Maximize local team utilization even if strategic outcomes suffer.","correct":false}],"correctWhy":"Portfolio focus should follow value and opportunity evidence. Spreading thin often maximizes activity while minimizing strategic outcomes.","wrongWhy":{"b":"Scrum does not mandate equal funding across products.","c":"One backlog applies per product; merging unrelated products creates false unity.","d":"Utilization is an output mindset; portfolio success is about outcomes."},"guideInsight":"Scrum focuses a product empirically; portfolio choices are organizational. EBM Key Value Areas can inform those choices without being Guide rules.","examTip":"Challenge ‘fair share’ funding with opportunity and outcome evidence.","realWorld":"Present cost of delay and unmet customer outcomes for underfunded bets.","remember":"Portfolio focus beats equal underfunding."},{"id":2016,"certifications":["PSPO-II"],"category":"Product value","competency":"Managing Products with Agility","topic":"Evidence over opinion","difficulty":"Advanced","type":"multi","question":"Which actions best support evidence-based Product Ownership? (Choose the best two.)","options":[{"id":"a","text":"Inspect customer behavior and economic indicators after releases.","correct":true},{"id":"b","text":"Treat stakeholder opinions as hypotheses to test when stakes are high.","correct":true},{"id":"c","text":"Rank work solely by who shouts loudest in steering meetings.","correct":false},{"id":"d","text":"Declare Kano categories as mandatory Scrum Guide rules for every item.","correct":false}],"correctWhy"
