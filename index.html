","text":"False","correct":true}],"correctWhy":"The Guide defines three artifacts — Product Backlog, Sprint Backlog, and Increment — with commitments Product Goal, Sprint Goal, and Definition of Done. It does not define a roadmap artifact. Direction is expressed via Product Goal and an emergent Product Backlog; forecasting practices don't replace empiricism.","wrongWhy":{"a":"True is incorrect — roadmap is not a Scrum artifact in the Guide."},"guideInsight":"Only three artifacts and three commitments in the Guide","examTip":"If an answer invents roadmap as a 4th artifact, it's wrong.","realWorld":"Use roadmaps as optional communication aids aligned to Product Goal evidence.","remember":"Artifacts: PB, Sprint Backlog, Increment — not roadmap.","examTrack":"PSM-I","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Roadmaps"},{"id":92,"category":"Technical Excellence","difficulty":"Expert","type":"scenario","question":"Developers propose reducing automated testing required by DoD to show more features at Review. The PO likes more features. What is the correct outcome?","options":[{"id":"a","text":"Quality does not decrease; Developers must conform to DoD; undone quality work means items aren't Increments and can't be presented/released; improve via Retro if DoD should evolve thoughtfully","correct":true},{"id":"b","text":"PO can waive DoD because they maximize value","correct":false},{"id":"c","text":"Features always beat quality measures in Scrum","correct":false},{"id":"d","text":"SM can approve a temporary DoD exception for stakeholder happiness","correct":false}],"correctWhy":"During the Sprint, quality does not decrease. Developers conform to DoD. Work not meeting DoD isn't part of an Increment and can't be released or presented at Review. DoD may improve via inspection (e.g., Retro), but not as a convenience waiver that lowers quality for demo optics.","wrongWhy":{"b":"PO cannot waive DoD to fake Increments.","c":"Value requires usable Done Increments.","d":"SM doesn't grant quality waivers."},"guideInsight":"Quality doesn't decrease; DoD conformance; Retro can improve DoD properly","examTip":"Value without Done is not empiricism — it's theater.","realWorld":"Negotiate smaller scope that still meets DoD and Sprint Goal.","remember":"Don't trade DoD away for demo volume.","examTrack":"PSM-I","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Technical Excellence"},{"id":93,"category":"Incomplete Work","difficulty":"Expert","type":"scenario","question":"At Sprint end, integration of a PBI fails DoD checks. Stakeholders still want to 'see it' in Review as progress evidence. What should the Scrum Team do?","options":[{"id":"a","text":"Do not present it as part of the Increment outcome; return it to the Product Backlog; inspect progress toward Product Goal using only Done work and transparent discussion of learnings","correct":true},{"id":"b","text":"Present it as Done to maintain stakeholder confidence","correct":false},{"id":"c","text":"Count it in the Increment if code was written","correct":false},{"id":"d","text":"Move the Sprint Review to next week when it might pass","correct":false}],"correctWhy":"If a PBI does not meet DoD, it cannot be released or even presented at the Sprint Review; it returns to the Product Backlog. Transparency means not misleading stakeholders. Sprint timebox isn't extended to chase completion for Review.","wrongWhy":{"b":"Presenting undone work as Done destroys transparency.","c":"Must meet DoD to be part of Increment.","d":"Events are timeboxed within the Sprint; next Sprint starts immediately after."},"guideInsight":"Cannot present undone work at Sprint Review; return to PB","examTip":"Expert trap: 'just show progress' vs Guide's 'cannot even be presented.'","realWorld":"Share learning transparently without calling unfinished work an Increment.","remember":"Undone ≠ presentable at Sprint Review.","examTrack":"PSM-I","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Incomplete Work"},{"id":94,"category":"Anti-Patterns","difficulty":"Expert","type":"tf","question":"True or False: Creating analyst, coding, and testing sub-teams with handoffs inside a Scrum Team conflicts with the 2020 Scrum Guide because the Scrum Team has no sub-teams or hierarchies and is cross-functional with all skills needed to create value each Sprint.","options":[{"id":"a","text":"True","correct":true},{"id":"b","text":"False","correct":false}],"correctWhy":"The Scrum Team is a cohesive unit with no sub-teams or hierarchies. It is cross-functional and the entire team is accountable for creating a valuable, useful Increment every Sprint. Internal phase handoffs recreate mini-waterfall.","wrongWhy":{"b":"False is incorrect — sub-teams/hierarchies are explicitly disallowed."},"guideInsight":"No sub-teams/hierarchies; cross-functional whole-team Increment accountability","examTip":"Mini-waterfall inside the Sprint is a top anti-pattern.","realWorld":"Swarm as one team to Done instead of phase gates.","remember":"No sub-teams — one cross-functional Scrum Team.","examTrack":"PSM-I","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Anti-Patterns"},{"id":95,"category":"Developers Accountability","difficulty":"Expert","type":"tf","question":"True or False: Within a Scrum Team, no sub-teams or hierarchies exist; there are no titles for Developers other than Developer, regardless of the work being performed by the person.","options":[{"id":"a","text":"True","correct":true},{"id":"b","text":"False","correct":false}],"correctWhy":"The Guide states there are no sub-teams or hierarchies within the Scrum Team. It is a cohesive unit. Developers are the people in the Scrum Team committed to creating any aspect of a usable Increment each Sprint — regardless of specific skills; they are not given other titles within Scrum.","wrongWhy":{"b":"False is incorrect — the Guide is explicit about no sub-teams/hierarchies and Developers without other Scrum titles."},"guideInsight":"No sub-teams/hierarchies; Developers have no other titles in Scrum","examTip":"People may have skills (UX, data, etc.) but Scrum doesn't create titled sub-roles inside Developers.","realWorld":"Call people Developers in Scrum contexts while valuing their specialist skills.","remember":"In Scrum: Developers — no internal hierarchy/titles.","examTrack":"PSM-I","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Developers Accountability"},{"id":96,"category":"Scrum Values","difficulty":"Expert","type":"scenario","question":"A Product Owner hides declining user metrics from Developers to 'protect focus,' and Developers hide technical risk from the PO to 'avoid worry.' Which values and pillars are primarily undermined?","options":[{"id":"a","text":"Openness (and trust), which prevents Transparency and thus makes Inspection misleading; Adaptation suffers","correct":true},{"id":"b","text":"Only Courage is affected; pillars remain intact","correct":false},{"id":"c","text":"Commitment is strengthened by secrecy","correct":false},{"id":"d","text":"Respect requires hiding bad news","correct":false}],"correctWhy":"The Scrum Values include Openness. When values are embodied, pillars come to life building trust. Hiding information destroys Transparency; Inspection without transparency is misleading and wasteful; Adaptation then fails. Focus is not an excuse for opacity about product/Sprint reality.","wrongWhy":{"b":"Pillars are directly harmed via lost transparency.","c":"Secrecy undermines commitment to goals and empiricism.","d":"Respect includes honesty about risks affecting people/users."},"guideInsight":"Values bring pillars to life; Openness supports Transparency","examTip":"Connect Values ↔ Pillars in expert scenarios.","realWorld":"Make metrics and risks visible in Planning/Review/Daily as appropriate.","remember":"Hiding reality kills Openness → Transparency → inspect/adapt.","examTrack":"PSM-I","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Scrum Values"},{"id":97,"category":"Scrum Theory & Empiricism","difficulty":"Expert","type":"single","question":"Which statement best captures lean thinking as used in the Scrum Guide?","options":[{"id":"a","text":"Lean thinking reduces waste and focuses on the essentials","correct":true},{"id":"b","text":"Lean thinking means maximizing utilization of every individual at all times","correct":false},{"id":"c","text":"Lean thinking requires a separate Lean Officer role in Scrum","correct":false},{"id":"d","text":"Lean thinking replaces empiricism in Scrum","correct":false}],"correctWhy":"The Guide states Scrum is founded on empiricism and lean thinking, and that lean thinking reduces waste and focuses on the essentials. Empiricism remains foundational alongside lean thinking.","wrongWhy":{"b":"Maximizing utilization often creates waste (queues, multitasking).","c":"No such Scrum role.","d":"Lean complements empiricism; it doesn't replace it."},"guideInsight":"Lean thinking: reduce waste; focus on essentials","examTip":"Know the Guide's short lean definition — don't import Toyota jargon as mandatory Scrum.","realWorld":"Remove low-value WIP and ceremony waste that doesn't improve empiricism.","remember":"Lean in Scrum = less waste, essentials first.","examTrack":"PSM-I","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Scrum Theory & Empiricism"},{"id":98,"category":"Sprint Retrospective","difficulty":"Expert","type":"scenario","question":"After Retro, the team lists 20 improvements but schedules none into upcoming work. What did they miss from the Guide?","options":[{"id":"a","text":"The most impactful improvements are addressed as soon as possible and may even be added to the Sprint Backlog for the next Sprint","correct":true},{"id":"b","text":"Retrospectives forbid creating backlog items","correct":false},{"id":"c","text":"Improvements must wait for a quarterly steering committee","correct":false},{"id":"d","text":"Only the Scrum Master may implement improvements alone","correct":false}],"correctWhy":"The Scrum Team identifies the most helpful changes to improve its effectiveness. The most impactful improvements are addressed as soon as possible. They may even be added to the Sprint Backlog for the next Sprint.","wrongWhy":{"b":"Guide explicitly allows adding improvements to next Sprint Backlog.","c":"ASAP, not quarterly gate.","d":"Team owns improvements; SM coaches/serves."},"guideInsight":"Most impactful Retro improvements ASAP; may enter next Sprint Backlog","examTip":"Retro without action is inspection without adaptation — pointless.","realWorld":"Pick one high-impact improvement and make it visible in the next Sprint Backlog.","remember":"Retro improvements → ASAP (optionally next Sprint Backlog).","examTrack":"PSM-I","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Sprint Retrospective"},{"id":99,"category":"Advanced Scenarios","difficulty":"Expert","type":"scenario","question":"Mid-Sprint, market news makes the Sprint Goal obsolete. Developers want to continue anyway to protect velocity charts. Product Owner wants to cancel. Who decides, and why?","options":[{"id":"a","text":"Only the Product Owner has authority to cancel; a Sprint may be cancelled if the Sprint Goal becomes obsolete — forecasts/velocity charts don't override that empiricism","correct":true},{"id":"b","text":"Developers decide because they own the Sprint Backlog","correct":false},{"id":"c","text":"Scrum Master cancels to protect the burn-down","correct":false},{"id":"d","text":"Cancellation is impossible once a Sprint starts","correct":false}],"correctWhy":"A Sprint could be cancelled if the Sprint Goal becomes obsolete. Only the Product Owner has the authority to cancel the Sprint. Forecasting practices do not replace empiricism. Continuing solely to protect charts wastes effort when the goal is obsolete.","wrongWhy":{"b":"Developers don't cancel Sprints.","c":"SM doesn't cancel; burn-downs aren't the decision basis over obsolete goals.","d":"Cancellation is allowed when Sprint Goal is obsolete (PO)."},"guideInsight":"Cancel if Sprint Goal obsolete; only PO authority; empiricism over charts","examTip":"Velocity/burn-down never outrank an obsolete Sprint Goal.","realWorld":"Cancel cleanly, replan a new Sprint immediately with a valid Sprint Goal.","remember":"Obsolete Sprint Goal → PO may cancel.","examTrack":"PSM-I","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Advanced Scenarios"},{"id":100,"category":"Advanced Scenarios","difficulty":"Expert","type":"multi","question":"Select all that apply. A multi-team product group wants to be Guide-compliant. Which must they ensure?","options":[{"id":"a","text":"Shared Product Goal, Product Backlog, and Product Owner across teams on the same product","correct":true},{"id":"b","text":"The same mutually defined Definition of Done complied with by all those teams","correct":true},{"id":"c","text":"Each team remains typically small enough (on the order of 10 or fewer) and cross-functional without hierarchies","correct":true},{"id":"d","text":"A separate Product Owner committee per component team with conflicting backlogs","correct":false}],"correctWhy":"Guide scaling seeds: reorganize into multiple cohesive teams sharing Product Goal, Product Backlog, and PO; mutually define/comply with same DoD; Scrum Teams typically 10 or fewer, cross-functional, no hierarchies. Conflicting PO committees/backlogs violate these rules.","wrongWhy":{"d":"Conflicts with one PO / one PB / one Product Goal model."},"guideInsight":"Multi-team compliance: shared Goal/PB/PO, shared DoD, small cohesive teams","examTip":"Final integrative question — combine scaling + DoD + team design.","realWorld":"Align governance and backlog tooling to one product backlog before scaling headcount.","remember":"Scale with shared Goal, Backlog, PO, DoD — cohesive small teams.","examTrack":"PSM-I","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Advanced Scenarios"},{"id":101,"category":"Leadership & Coaching","difficulty":"Expert","type":"scenario","examTrack":"PSM-II","focusArea":"Developing People and Teams","question":"Developers wait for the Scrum Master to assign tasks every morning after the Daily Scrum. Management praises the Scrum Master for 'keeping people busy.' What should the Scrum Master do?","options":[{"id":"a","text":"Continue assigning work so velocity stays predictable","correct":false},{"id":"b","text":"Coach the Developers to self-manage who does what, when, and how; stop assigning tasks","correct":true},{"id":"c","text":"Ask the Product Owner to assign tasks based on priority","correct":false},{"id":"d","text":"Create a RACI matrix and escalate idle time to HR","correct":false}],"correctWhy":"Developers are self-managing and accountable for creating the Sprint Backlog plan and adapting it daily. A Scrum Master who assigns work undermines self-management and Scrum Team effectiveness.","wrongWhy":{"a":"Predictable busyness is not the goal; empiricism and ownership are.","c":"The Product Owner does not tell Developers how to turn items into Increments.","d":"HR escalation and RACI are control mechanisms that avoid coaching self-management."},"guideInsight":"Scrum Teams are self-managing; Developers create and adapt the Sprint Backlog. Scrum Masters coach self-management and cross-functionality.","examTip":"PSM II trap: 'helpful' Scrum Masters who become task managers. Prefer coaching over control.","realWorld":"Facilitate a conversation about Sprint Goal progress and let Developers pull work; make the anti-pattern visible to management as lost self-management.","remember":"SM coaches self-management — does not assign Developer work.","certifications":["PSM-II"],"competency":"Developing People and Teams","topic":"Leadership & Coaching"},{"id":102,"category":"Daily Scrum","difficulty":"Advanced","type":"scenario","examTrack":"PSM-II","focusArea":"Understanding and Applying the Scrum Framework","question":"A delivery manager insists on attending every Daily Scrum and asks each Developer for individual status against the project plan. The Developers stop discussing the Sprint Goal. As Scrum Master, what is the best first response?","options":[{"id":"a","text":"Allow it because transparency to management is always good","correct":false},{"id":"b","text":"Teach the purpose of the Daily Scrum and coach a format owned by Developers focused on Sprint Goal progress; offer alternative transparency elsewhere","correct":true},{"id":"c","text":"Cancel the Daily Scrum and replace it with a weekly status deck","correct":false},{"id":"d","text":"Require the manager to become Product Owner so attendance is legitimate","correct":false}],"correctWhy":"The Daily Scrum is a 15-minute event for Developers to inspect progress toward the Sprint Goal and adapt the Sprint Backlog. Turning it into a status meeting destroys its purpose. The Scrum Master ensures events are positive, productive, and within the timebox, and helps the organization understand Scrum.","wrongWhy":{"a":"Not all 'transparency' belongs inside the Daily Scrum; wrong audience and purpose harm empiricism.","c":"Cancelling a Scrum event loses an inspection/adaptation opportunity.","d":"Forcing a PO title to justify control is accountability theater."},"guideInsight":"Daily Scrum purpose: inspect Sprint Goal progress and adapt the plan. Events create regularity and minimize need for other meetings.","examTip":"Identify event misuse first, then choose teach/coach over confrontational bans when possible.","realWorld":"Invite the manager to Sprint Review for product transparency; keep Daily Scrum Developer-owned.","remember":"Daily Scrum ≠ status report to management.","certifications":["PSM-II"],"competency":"Understanding and Applying the Scrum Framework","topic":"Daily Scrum"},{"id":103,"category":"Definition of Done","difficulty":"Expert","type":"scenario","examTrack":"PSM-II","focusArea":"Developing and Delivering Products Professionally","question":"To hit a release date, the Product Owner asks the team to present partially tested items at Sprint Review and call them 'Done enough.' Stakeholders need a progress story. What should the Scrum Master do?","options":[{"id":"a","text":"Support the request; Sprint Review is the right place to show unfinished work as Done","correct":false},{"id":"b","text":"Make transparent that work not meeting the Definition of Done is not an Increment and cannot be presented as Done; coach honest inspection of unfinished work returning to the Product Backlog","correct":true},{"id":"c","text":"Secretly lower the Definition of Done for this Sprint only","correct":false},{"id":"d","text":"Extend the Sprint until testing finishes","correct":false}],"correctWhy":"Work cannot be considered part of an Increment unless it meets the Definition of Done. If a PBI does not meet Done, it cannot be released or even presented at the Sprint Review as Done — it returns to the Product Backlog. Quality does not decrease during the Sprint.","wrongWhy":{"a":"Presenting undone work as Done destroys transparency and misleads inspection.","c":"Silently weakening Done creates false progress.","d":"Sprints are fixed length; extending them breaks cadence and predictability."},"guideInsight":"Definition of Done creates shared understanding of completed work. Undone work is not an Increment.","examTip":"PSM II loves quality-vs-date pressure. Protect Done and transparency.","realWorld":"Show what is truly Done; discuss risks and trade-offs openly with stakeholders at Review.","remember":"Not Done → not Increment → not presented as Done at Review.","certifications":["PSM-II"],"competency":"Developing and Delivering Products Professionally","topic":"Definition of Done"},{"id":104,"category":"Product Owner Accountability","difficulty":"Advanced","type":"scenario","examTrack":"PSM-II","focusArea":"Managing Products with Agility","question":"Three stakeholders routinely email Developers with 'urgent' new work mid-Sprint, bypassing the Product Owner. Developers feel obligated to respond. What should the Scrum Master emphasize?","options":[{"id":"a","text":"Developers should always take stakeholder orders because customers come first","correct":false},{"id":"b","text":"Those wanting to change the Product Backlog convince the Product Owner; help restore PO accountability and stakeholder collaboration without isolating stakeholders","correct":true},{"id":"c","text":"The Scrum Master should personally prioritize all stakeholder emails","correct":false},{"id":"d","text":"Freeze all stakeholder contact until the next release","correct":false}],"correctWhy":"The Product Owner is one person accountable for effective Product Backlog management. Others change the backlog by convincing the Product Owner. The Scrum Master facilitates stakeholder collaboration as needed and removes barriers between stakeholders and Scrum Teams — without becoming the PO.","wrongWhy":{"a":"Customer collaboration does not mean bypassing Product Owner accountability.","c":"The SM does not own Product Backlog ordering.","d":"Isolating stakeholders reduces feedback and empiricism."},"guideInsight":"PO is accountable for PB ordering and transparency; org must respect PO decisions.","examTip":"Support the PO; do not replace the PO.","realWorld":"Redirect requests to the PO; improve Sprint Review and refinement so stakeholders feel heard.","remember":"Change the backlog via the Product Owner — not side channels.","certifications":["PSM-II"],"competency":"Managing Products with Agility","topic":"Product Owner Accountability"},{"id":105,"category":"Sprint Goal","difficulty":"Advanced","type":"scenario","examTrack":"PSM-II","focusArea":"Understanding and Applying the Scrum Framework","question":"Halfway through the Sprint, Developers discover the selected work is harder than expected. They can still meet the Sprint Goal by dropping a lower-value selected item. What is the Guide-aligned approach?","options":[{"id":"a","text":"Silently drop the item without telling the Product Owner","correct":false},{"id":"b","text":"Collaborate with the Product Owner to negotiate Sprint Backlog scope without endangering the Sprint Goal","correct":true},{"id":"c","text":"Automatically cancel the Sprint","correct":false},{"id":"d","text":"Add weekend overtime to keep every selected item","correct":false}],"correctWhy":"The Sprint Goal provides flexibility on exact work. If work differs from expectations, Developers collaborate with the Product Owner to negotiate Sprint Backlog scope within the Sprint without affecting the Sprint Goal. No changes endanger the Sprint Goal; quality does not decrease.","wrongWhy":{"a":"Scope negotiation requires PO collaboration; silence reduces transparency.","c":"Only the PO can cancel, and only if the Sprint Goal is obsolete — difficulty alone is not automatic cancellation.","d":"Sustainable pace and quality matter; overtime to protect every item often harms both."},"guideInsight":"Sprint Goal is a commitment by Developers with flexibility; scope may be renegotiated with the PO.","examTip":"Protect the Sprint Goal, not the initial item list.","realWorld":"Replan Daily; make trade-offs visible; keep Done quality intact.","remember":"Negotiate scope with PO; keep Sprint Goal intact.","certifications":["PSM-II"],"competency":"Understanding and Applying the Scrum Framework","topic":"Sprint Goal"},{"id":106,"category":"Organizational Change","difficulty":"Expert","type":"scenario","examTrack":"PSM-II","focusArea":"Evolving the Agile Organization","question":"An organization measures every Developer’s personal velocity and ranks people for bonuses. Collaboration collapses. What is the Scrum Master’s most appropriate organizational service?","options":[{"id":"a","text":"Help management refine individual velocity dashboards for fairness","correct":false},{"id":"b","text":"Teach why individual velocity undermines Scrum Team focus and empiricism; coach outcome-oriented, team-level measures and remove this barrier to effectiveness","correct":true},{"id":"c","text":"Ignore metrics because Scrum forbids all measurement","correct":false},{"id":"d","text":"Fire the lowest-velocity Developers to raise the average","correct":false}],"correctWhy":"The Scrum Master serves the organization by leading, training, and coaching Scrum adoption and helping people enact an empirical approach. Metrics used to control individuals harm openness, focus, and team accountability for a valuable Increment.","wrongWhy":{"a":"Optimizing a harmful metric still harms the team.","c":"Scrum does not forbid evidence; burn-downs etc. can help but do not replace empiricism.","d":"Punitive ranking destroys psychological safety and respect."},"guideInsight":"SM serves the organization: coach empirical approach; remove barriers; improve team effectiveness.","examTip":"PSM II: identify cultural/metric impediments and teach, don’t weaponize velocity.","realWorld":"Propose team outcomes, quality, and learning measures tied to Product Goal progress.","remember":"Individual velocity rankings are an organizational anti-pattern.","certifications":["PSM-II"],"competency":"Evolving the Agile Organization","topic":"Organizational Change"},{"id":107,"category":"Sprint Retrospective","difficulty":"Advanced","type":"scenario","examTrack":"PSM-II","focusArea":"Developing People and Teams","question":"Retrospectives produce long complaint lists but no changes. The next Sprint repeats the same problems. What should the Scrum Master facilitate?","options":[{"id":"a","text":"Skip Retrospectives until the team 'has time'","correct":false},{"id":"b","text":"Help the team identify the most impactful improvement(s) and address them ASAP — even adding them to the next Sprint Backlog","correct":true},{"id":"c","text":"Write the improvement plan alone and assign owners","correct":false},{"id":"d","text":"Replace Retrospectives with a manager-led postmortem","correct":false}],"correctWhy":"The Sprint Retrospective plans ways to increase quality and effectiveness. The team identifies the most helpful changes; the most impactful improvements are addressed as soon as possible and may be added to the next Sprint Backlog.","wrongWhy":{"a":"Skipping the event loses inspection/adaptation of the team’s way of working.","c":"Improvements are owned by the Scrum Team, not dictated by the SM.","d":"Manager-led postmortems often reduce openness and self-management."},"guideInsight":"Retrospective concludes the Sprint; focus on actionable effectiveness improvements.","examTip":"Look for facilitation that yields a concrete experiment, not venting.","realWorld":"Limit WIP of improvements to one or two; inspect whether they actually helped next Retro.","remember":"Retro without adaptation is pointless inspection.","certifications":["PSM-II"],"competency":"Developing People and Teams","topic":"Sprint Retrospective"},{"id":108,"category":"Facilitation & Coaching","difficulty":"Expert","type":"scenario","examTrack":"PSM-II","focusArea":"Developing People and Teams","question":"One senior Developer dominates Sprint Planning technical decisions. Quieter Developers disengage. The Product Owner is frustrated by low shared understanding. Which Scrum Master stance fits best first?","options":[{"id":"a","text":"Decide the technical approach yourself to save time","correct":false},{"id":"b","text":"Facilitate so the whole Developer group can form a shared plan; coach respect and collective accountability","correct":true},{"id":"c","text":"Ask the Product Owner to pick the design","correct":false},{"id":"d","text":"Remove the senior Developer from Planning","correct":false}],"correctWhy":"How work gets done is at the Developers’ sole discretion, collectively. The Scrum Master coaches self-management and cross-functionality and ensures events are positive and productive. Facilitation restores shared ownership.","wrongWhy":{"a":"SM does not become technical decision-maker for the Increment plan.","c":"PO does not tell Developers how to build the Increment.","d":"Exclusion may escalate conflict without teaching collaboration."},"guideInsight":"Topic Three of Sprint Planning is how work gets done — Developers’ discretion.","examTip":"Match stance: facilitate group process; don’t seize content ownership.","realWorld":"Use structured turn-taking, silent writing, or pairing proposals before deciding.","remember":"Facilitate Developer collective ownership — don’t decide for them.","certifications":["PSM-II"],"competency":"Developing People and Teams","topic":"Facilitation & Coaching"},{"id":109,"category":"Increment","difficulty":"Advanced","type":"scenario","examTrack":"PSM-II","focusArea":"Developing and Delivering Products Professionally","question":"The Scrum Team finishes coding but integration and automated checks are deferred to a hardening Sprint. Leadership calls this 'efficient specialization.' What risk should the Scrum Master make transparent?","options":[{"id":"a","text":"None — hardening Sprints are required by Scrum","correct":false},{"id":"b","text":"Without meeting Done each Sprint, there may be no usable Increment; transparency, inspection, and risk control are weakened","correct":true},{"id":"c","text":"The only risk is that Sprint Reviews become too long","correct":false},{"id":"d","text":"Scrum requires separate QA teams after every Sprint","correct":false}],"correctWhy":"An Increment must be usable and meet the Definition of Done. Scrum’s iterative approach optimizes predictability and controls risk by creating a valuable, useful Increment every Sprint — not by deferring quality.","wrongWhy":{"a":"Hardening Sprints are not a Scrum rule; they often signal weak Done.","c":"Review length is secondary to false progress.","d":"Developers include all skills needed; quality is part of Done."},"guideInsight":"Entire Scrum Team accountable for a valuable, useful Increment every Sprint; DoD defines quality.","examTip":"Technical risk deferred = empiricism delayed.","realWorld":"Expand Done to include integration/test; make incomplete work visible as undone.","remember":"No Done Increment each Sprint = hidden technical risk.","certifications":["PSM-II"],"competency":"Developing and Delivering Products Professionally","topic":"Increment"},{"id":110,"category":"Sprint Review","difficulty":"Advanced","type":"scenario","examTrack":"PSM-II","focusArea":"Managing Products with Agility","question":"Stakeholders rarely attend Sprint Review because it is a slide deck of completed tickets with no working product. What should the Scrum Master help the team change?","options":[{"id":"a","text":"Make attendance mandatory with executive punishment for absences","correct":false},{"id":"b","text":"Restore Sprint Review as a working session inspecting the Increment and progress toward the Product Goal, collaborating on what to do next","correct":true},{"id":"c","text":"Cancel Sprint Review and email a PDF status report instead","correct":false},{"id":"d","text":"Only invite stakeholders when the Increment is 'impressive'","correct":false}],"correctWhy":"Sprint Review inspects the outcome of the Sprint and determines future adaptations. The Scrum Team presents results to key stakeholders and discusses Product Goal progress. It is a working session, not merely a presentation. The Review should never be a gate to releasing value.","wrongWhy":{"a":"Force without value won’t create useful inspection.","c":"Replacing the event loses collaborative adaptation.","d":"Skipping feedback when work is imperfect reduces learning."},"guideInsight":"Sprint Review: inspect Increment + environment; adapt Product Backlog; working session.","examTip":"If stakeholders don’t come, inspect whether the event creates real transparency/value.","realWorld":"Show working Done product; ask for decisions and backlog adaptations live.","remember":"Sprint Review is a working session — not a ticket slideshow.","certifications":["PSM-II"],"competency":"Managing Products with Agility","topic":"Sprint Review"},{"id":111,"category":"Transparency","difficulty":"Expert","type":"scenario","examTrack":"PSM-II","focusArea":"Understanding and Applying the Scrum Framework","question":"Burn-down charts look healthy, but production incidents rise after every release. Leadership trusts the charts. What is the deeper empiricism problem?","options":[{"id":"a","text":"The team needs more detailed Gantt charts","correct":false},{"id":"b","text":"Artifact/progress transparency is misleading — inspection without true transparency of quality/Done is wasteful; adapt Done and practices","correct":true},{"id":"c","text":"Incidents prove Scrum does not work for complex products","correct":false},{"id":"d","text":"Stop releasing until a year of hardening is complete","correct":false}],"correctWhy":"Transparency enables inspection; inspection without transparency is misleading and wasteful. Forecast practices like burn-downs do not replace empiricism. Decisions based on low-transparency artifacts diminish value and increase risk.","wrongWhy":{"a":"More predictive artifacts do not fix false Done.","c":"Incidents often reveal weak empiricism, not failure of the framework’s purpose.","d":"Delaying all learning increases risk in complex work."},"guideInsight":"Pillars: transparency → inspection → adaptation. Charts don’t replace observed reality.","examTip":"Ask: what is actually transparent — tasks or releasable quality?","realWorld":"Include operational quality in Done; inspect incidents in Retro and Review.","remember":"Pretty burn-downs ≠ transparent Done quality.","certifications":["PSM-II"],"competency":"Understanding and Applying the Scrum Framework","topic":"Transparency"},{"id":112,"category":"Scrum Master Accountability","difficulty":"Advanced","type":"multi","examTrack":"PSM-II","focusArea":"Developing People and Teams","question":"Select all that apply. Which are valid ways a Scrum Master serves the Product Owner according to the Scrum Guide?","options":[{"id":"a","text":"Helping find techniques for effective Product Goal definition and Product Backlog management","correct":true},{"id":"b","text":"Ordering the Product Backlog when the Product Owner is busy","correct":false},{"id":"c","text":"Helping establish empirical product planning for a complex environment","correct":true},{"id":"d","text":"Facilitating stakeholder collaboration as requested or needed","correct":true}],"correctWhy":"The Guide lists helping with Product Goal/PB techniques, clear concise PBIs, empirical product planning, and facilitating stakeholder collaboration. The SM does not take over PO accountability for ordering.","wrongWhy":{"b":"PO remains accountable for ordering even if work is delegated — SM ordering as default control is not serving."},"guideInsight":"Scrum Master services to the Product Owner (2020 Guide).","examTip":"Serve ≠ substitute accountabilities.","realWorld":"Offer techniques and facilitation; leave value decisions with the PO.","remember":"Coach the PO’s effectiveness — don’t become the PO.","certifications":["PSM-II"],"competency":"Developing People and Teams","topic":"Scrum Master Accountability"},{"id":113,"category":"Self-Managing Teams","difficulty":"Expert","type":"scenario","examTrack":"PSM-II","focusArea":"Developing People and Teams","question":"A functional manager tells Developers how to design the solution 'because they own the architecture career path.' The Sprint Goal is at risk due to conflicting instructions. What should the Scrum Master do?","options":[{"id":"a","text":"Tell Developers to obey the functional manager during the Sprint","correct":false},{"id":"b","text":"Coach that Developers decide how to turn PBIs into Done Increments; make the conflicting authority transparent as an organizational impediment","correct":true},{"id":"c","text":"Rewrite the Sprint Goal to match the manager’s design","correct":false},{"id":"d","text":"Add the manager to the Scrum Team as a second Product Owner","correct":false}],"correctWhy":"How chosen work gets done is at the sole discretion of the Developers. No one else tells them how to turn Product Backlog items into Increments of value. The SM causes removal of impediments and coaches the organization in Scrum.","wrongWhy":{"a":"Obeying external how-to instructions breaks self-management.","c":"Changing the Goal to satisfy control avoids the real impediment.","d":"PO is one person, not a committee; architecture control ≠ PO."},"guideInsight":"Sprint Planning Topic Three; self-managing Developers; SM organizational coaching.","examTip":"Matrix management vs Developer how-accountability is classic PSM II.","realWorld":"Invite architecture collaboration as advice, not command; escalate systemic conflict.","remember":"Only Developers decide how to build the Increment.","certifications":["PSM-II"],"competency":"Developing People and Teams","topic":"Self-Managing Teams"},{"id":114,"category":"Forecasting","difficulty":"Advanced","type":"scenario","examTrack":"PSM-II","focusArea":"Managing Products with Agility","question":"Executives demand a guarantee of exact scope in six months. The Product Owner asks the Scrum Master how to respond while staying empirical. What guidance fits Scrum?","options":[{"id":"a","text":"Promise the full scope and use overtime if forecasts slip","correct":false},{"id":"b","text":"Use forecasts based on what has already happened, keep Product Goal transparent, and adapt plans through frequent inspection — do not pretend certainty in complex work","correct":true},{"id":"c","text":"Refuse all planning beyond the current Sprint","correct":false},{"id":"d","text":"Convert Scrum to a fixed waterfall stage gate for the year","correct":false}],"correctWhy":"In complex environments, what will happen is unknown. Only what has already happened may be used for forward-looking decision making. Practices like burn-ups help but do not replace empiricism. The SM helps establish empirical product planning.","wrongWhy":{"a":"False certainty increases risk and often harms quality.","c":"Empiricism still allows forecasts; it rejects treating them as guarantees.","d":"Abandoning Scrum’s empirical control is not Guide-aligned advice."},"guideInsight":"Forecasting practices ≠ empiricism replacement; unknown future in complexity.","examTip":"Offer ranges, assumptions, and review cadence — not guarantees.","realWorld":"Show Product Goal, ordered backlog, and evidence-based forecasts with explicit uncertainty.","remember":"Forecast with evidence; never guarantee complex outcomes.","certifications":["PSM-II"],"competency":"Managing Products with Agility","topic":"Forecasting"},{"id":115,"category":"Product Goal","difficulty":"Advanced","type":"scenario","examTrack":"PSM-II","focusArea":"Managing Products with Agility","question":"Leadership launches five 'strategic themes' and tells the Scrum Team to pursue all as Product Goals this quarter. What should the Scrum Master reinforce?","options":[{"id":"a","text":"Multiple concurrent Product Goals increase utilization","correct":false},{"id":"b","text":"The Product Goal is the long-term objective; the team must fulfill or abandon one before taking on the next","correct":true},{"id":"c","text":"Developers should vote weekly on which Product Goal matters","correct":false},{"id":"d","text":"Create five Product Backlogs, one per theme","correct":false}],"correctWhy":"The Product Goal is the long-term objective for the Scrum Team. They must fulfill (or abandon) one objective before taking on the next. The Product Backlog emerges to define what fulfills that Product Goal.","wrongWhy":{"a":"Utilization theater reduces focus and empiricism.","c":"PO develops and communicates the Product Goal; popularity contests aren’t the model.","d":"The Product Backlog is the single source of work for the product."},"guideInsight":"Product Goal commitment of the Product Backlog; one objective at a time.","examTip":"Focus > parallel strategic theater.","realWorld":"Help PO make trade-offs transparent to leadership; pick one Product Goal.","remember":"One Product Goal at a time — fulfill or abandon.","certifications":["PSM-II"],"competency":"Managing Products with Agility","topic":"Product Goal"},{"id":116,"category":"Anti-Patterns","difficulty":"Expert","type":"scenario","examTrack":"PSM-II","focusArea":"Evolving the Agile Organization","question":"A PMO requires the Scrum Master to sign a weekly 'RAG status' committing that all Sprint Backlog items will finish. Misses are escalated as personal failure. What is the strongest Scrum-aligned response?","options":[{"id":"a","text":"Sign the commitment to keep PMO calm, then pressure Developers","correct":false},{"id":"b","text":"Teach that forecasts aren’t guarantees; help create transparent empirical reporting without turning the SM into a delivery enforcer","correct":true},{"id":"c","text":"Hide risks until the Sprint Review surprise","correct":false},{"id":"d","text":"Cancel Daily Scrums to free time for PMO reporting","correct":false}],"correctWhy":"The SM establishes Scrum and coaches an empirical approach. Turning the SM into a guarantor of scope undermines self-management and misuses forecasts. Transparency about risk beats false certainty.","wrongWhy":{"a":"Personal guarantees + pressure recreate project-manager anti-patterns.","c":"Hiding risks violates openness and delayed inspection.","d":"Dropping a Scrum event loses inspection/adaptation."},"guideInsight":"SM accountability for Scrum as defined; empiricism over predictive commitments.","examTip":"PSM II: hybrid governance — protect empiricism without dogmatic refusal to communicate.","realWorld":"Share Sprint Goal progress, Done Increment evidence, and impediments — not personal scope oaths.","remember":"SM is not the guarantor of every Sprint Backlog item.","certifications":["PSM-II"],"competency":"Evolving the Agile Organization","topic":"Anti-Patterns"},{"id":117,"category":"Stakeholder Interaction","difficulty":"Advanced","type":"scenario","examTrack":"PSM-II","focusArea":"Managing Products with Agility","question":"A powerful stakeholder says everything is Priority 1 and demands the Product Owner stop ordering the backlog. What should the Scrum Master help happen?","options":[{"id":"a","text":"Accept that all items are equal priority","correct":false},{"id":"b","text":"Support the Product Owner’s accountability to order the Product Backlog; facilitate transparent trade-off conversations with stakeholders","correct":true},{"id":"c","text":"Let the stakeholder reorder the Sprint Backlog directly","correct":false},{"id":"d","text":"Ask Developers to pick whichever items they like","correct":false}],"correctWhy":"The PO is accountable for ordering Product Backlog items. The organization must respect PO decisions. The SM helps with stakeholder collaboration and empirical product planning without removing PO accountability.","wrongWhy":{"a":"If everything is Priority 1, nothing is ordered — transparency fails.","c":"Sprint Backlog is by and for Developers toward the Sprint Goal.","d":"Developers select items with the PO in Planning; they don’t replace PO ordering of the Product Backlog."},"guideInsight":"PO orders PB; decisions visible in content/ordering and inspectable Increment.","examTip":"Facilitate trade-offs; don’t dilute PO accountability.","realWorld":"Use Product Goal and value/risk evidence to make ordering discussable.","remember":"Product Backlog ordering is Product Owner accountability.","certifications":["PSM-II"],"competency":"Managing Products with Agility","topic":"Stakeholder Interaction"},{"id":118,"category":"Quality","difficulty":"Advanced","type":"tf","examTrack":"PSM-II","focusArea":"Developing and Delivering Products Professionally","question":"True or False: During the Sprint, quality may be reduced if the Scrum Team needs to finish more Product Backlog items before the Sprint Review.","options":[{"id":"a","text":"True","correct":false},{"id":"b","text":"False","correct":true}],"correctWhy":"During the Sprint, quality does not decrease. Undone work is not part of the Increment; scope may be negotiated with the PO instead of sacrificing Done.","wrongWhy":{"a":"Lowering quality for volume creates false progress and breaks Guide rules for the Sprint."},"guideInsight":"Sprint constraints: no changes endangering Sprint Goal; quality does not decrease.","examTip":"Quality vs scope — Guide chooses quality.","realWorld":"Negotiate scope; keep DoD; make trade-offs visible.","remember":"Quality does not decrease during the Sprint.","certifications":["PSM-II"],"competency":"Developing and Delivering Products Professionally","topic":"Quality"},{"id":119,"category":"Adaptation","difficulty":"Expert","type":"scenario","examTrack":"PSM-II","focusArea":"Understanding and Applying the Scrum Framework","question":"A Scrum Team runs all events on time but never changes its plan, Done standard, or Product Backlog after learning from Reviews. Stakeholders call them 'compliant.' What is missing?","options":[{"id":"a","text":"More detailed status templates","correct":false},{"id":"b","text":"Adaptation — inspection without adaptation is pointless; empiricism requires adjusting process or product when limits are exceeded","correct":true},{"id":"c","text":"A project charter committee","correct":false},{"id":"d","text":"Mandatory pair programming for all work","correct":false}],"correctWhy":"Inspection enables adaptation; inspection without adaptation is considered pointless. Adaptation must happen ASAP. Scrum events are designed to provoke change.","wrongWhy":{"a":"More documents without change deepen mechanical Scrum.","c":"Committees don’t restore empiricism.","d":"A specific practice may help but isn’t the missing pillar."},"guideInsight":"Adaptation pillar; events provoke change; team adapts when it learns.","examTip":"Mechanical Scrum ≠ empirical Scrum.","realWorld":"Track whether Retro/Review decisions actually change next Sprint’s behavior.","remember":"Inspection without adaptation is pointless.","certifications":["PSM-II"],"competency":"Understanding and Applying the Scrum Framework","topic":"Adaptation"},{"id":120,"category":"Scaling Concepts","difficulty":"Advanced","type":"scenario","examTrack":"PSM-II","focusArea":"Evolving the Agile Organization","question":"Three Scrum Teams work on one product with three Product Owners and three Definitions of Done. Integration fails every Sprint. What Guide-aligned correction should the Scrum Master advocate?","options":[{"id":"a","text":"Keep separate POs and DoDs to maximize team autonomy","correct":false},{"id":"b","text":"Share the same Product Goal, Product Backlog, and Product Owner; mutually define and comply with the same Definition of Done","correct":true},{"id":"c","text":"Add a fourth team to own integration only","correct":false},{"id":"d","text":"Merge into one 30-person Scrum Team immediately","correct":false}],"correctWhy":"If teams become too large they reorganize into multiple cohesive Scrum Teams focused on the same product, sharing Product Goal, Product Backlog, and Product Owner. Multiple teams on a product must mutually define and comply with the same DoD.","wrongWhy":{"a":"Local 'autonomy' that fragments Goal/Backlog/DoD harms product transparency.","c":"An integration-only team often hides weak Done rather than fixing shared Done.","d":"Typically 10 or fewer; huge teams reduce communication effectiveness."},"guideInsight":"Multi-team product: shared Goal, Backlog, PO, and same DoD.","examTip":"PSM II scaling questions stay Guide-faithful (and Nexus awareness helps) — don’t invent SAFe rules as Scrum.","realWorld":"Unify DoD and backlog ownership; inspect integrated Increments.","remember":"One product → shared Goal, Backlog, PO, DoD.","certifications":["PSM-II"],"competency":"Evolving the Agile Organization","topic":"Scaling Concepts"},{"id":121,"category":"Sprint Planning","difficulty":"Advanced","type":"scenario","examTrack":"PSM-II","focusArea":"Understanding and Applying the Scrum Framework","question":"Management hands the Developers a pre-built Sprint Backlog and tells them Sprint Planning is only for estimates. What should the Scrum Master do?","options":[{"id":"a","text":"Accept the plan to avoid conflict","correct":false},{"id":"b","text":"Teach that the entire Scrum Team collaborates to create the plan; Developers select what can be Done and solely decide how","correct":true},{"id":"c","text":"Let management attend as the fourth accountability","correct":false},{"id":"d","text":"Move Planning to after the Sprint starts","correct":false}],"correctWhy":"Sprint Planning’s plan is created by the collaborative work of the entire Scrum Team. Developers select items and plan how. No one else tells them how. The Sprint Backlog is by and for the Developers.","wrongWhy":{"a":"Avoiding conflict preserves an anti-pattern.","c":"Scrum defines SM, PO, Developers — not management as a fourth accountability.","d":"Planning initiates the Sprint."},"guideInsight":"Sprint Planning topics Why/What/How; Sprint Backlog composition.","examTip":"Pre-assigned Sprint Backlogs are a common advanced trap.","realWorld":"Reframe Planning around Sprint Goal; reject handed-down task lists as the plan.","remember":"Sprint Backlog is planned by Developers — not assigned by management.","certifications":["PSM-II"],"competency":"Understanding and Applying the Scrum Framework","topic":"Sprint Planning"},{"id":122,"category":"Incomplete Work","difficulty":"Advanced","type":"scenario","examTrack":"PSM-II","focusArea":"Understanding and Applying the Scrum Framework","question":"Two PBIs are almost finished at Sprint end but fail automated checks in the Definition of Done. Stakeholders want them counted in release notes. Correct handling?","options":[{"id":"a","text":"Include them in the Increment and release notes as Done","correct":false},{"id":"b","text":"They are not part of the Increment; return them to the Product Backlog for future consideration","correct":true},{"id":"c","text":"Carry them invisibly into next Sprint without Product Backlog transparency","correct":false},{"id":"d","text":"Mark them Done if coding hours exceeded the estimate","correct":false}],"correctWhy":"If a PBI does not meet the Definition of Done, it cannot be released or even presented at Sprint Review as Done. It returns to the Product Backlog for future consideration.","wrongWhy":{"a":"Fails Done → not Increment.","c":"Invisible carryover hides transparency of the Product Backlog.","d":"Effort spent does not equal Done."},"guideInsight":"Undone work returns to Product Backlog; Increment requires Done.","examTip":"Almost Done is still not Done.","realWorld":"Keep release notes honest; reorder remaining work with PO.","remember":"Undone work returns to the Product Backlog.","certifications":["PSM-II"],"competency":"Understanding and Applying the Scrum Framework","topic":"Incomplete Work"},{"id":123,"category":"Leadership & Coaching","difficulty":"Expert","type":"scenario","examTrack":"PSM-II","focusArea":"Developing People and Teams","question":"A new Product Owner asks the Scrum Master to 'just tell me what to prioritize each week.' Which response best balances mentoring with accountabilities?","options":[{"id":"a","text":"Take over prioritization until the PO is certified","correct":false},{"id":"b","text":"Mentor with techniques for Product Goal and backlog management while leaving ordering accountability with the PO","correct":true},{"id":"c","text":"Have Developers vote priorities to remove PO burden","correct":false},{"id":"d","text":"Refuse all help because mentoring is not a Scrum Master service","correct":false}],"correctWhy":"The SM helps the PO with techniques for Product Goal definition and Product Backlog management and helps establish empirical product planning — without becoming the PO. Mentoring/coaching supports growth while accountability remains.","wrongWhy":{"a":"Delegating accountability away from the PO violates the Guide model.","c":"Ordering is PO accountability.","d":"Serving the PO with techniques is explicit in the Guide."},"guideInsight":"SM services to PO; PO remains accountable even if work is delegated.","examTip":"PSM II stance choice: mentor/coach ≠ replace.","realWorld":"Teach value/risk/learning ordering; facilitate stakeholder input sessions with the PO leading.","remember":"Mentor the PO’s craft; keep PO accountability.","certifications":["PSM-II"],"competency":"Developing People and Teams","topic":"Leadership & Coaching"},{"id":124,"category":"Risk Management","difficulty":"Advanced","type":"scenario","examTrack":"PSM-II","focusArea":"Developing and Delivering Products Professionally","question":"A dependency on an external approvals team often blocks releasing a Done Increment until weeks after the Sprint. What should the Scrum Master do?","options":[{"id":"a","text":"Treat the delay as normal and stop mentioning it","correct":false},{"id":"b","text":"Make the impediment and its impact on learning/value transparent; cause removal by engaging the organization","correct":true},{"id":"c","text":"Stop creating Increments until approvals are redesigned","correct":false},{"id":"d","text":"Have Developers skip Done criteria that require approval evidence","correct":false}],"correctWhy":"The SM causes removal of impediments to progress and serves the organization by removing barriers between stakeholders and Scrum Teams. An Increment may be delivered before Sprint end; Review is never a release gate — delayed learning increases risk.","wrongWhy":{"a":"Hidden impediments prevent adaptation.","c":"Stopping all value delivery is extreme; make the constraint visible and improve it.","d":"Weakening Done to hide the constraint destroys transparency."},"guideInsight":"SM impediment removal; Increment releasability; empiricism through frequent delivery.","examTip":"Distinguish team-level vs organizational impediments — escalate appropriately.","realWorld":"Quantify delayed feedback cost; partner with leadership on approval redesign.","remember":"Cause impediment removal — don’t normalize release blockers.","certifications":["PSM-II"],"competency":"Developing and Delivering Products Professionally","topic":"Risk Management"},{"id":125,"category":"Scrum Values","difficulty":"Advanced","type":"scenario","examTrack":"PSM-II","focusArea":"Understanding and Applying the Scrum Framework","question":"Developers know a critical defect trend but hide it before Sprint Review to 'protect the team’s reputation.' Which values are most clearly undermined, and what should the Scrum Master reinforce?","options":[{"id":"a","text":"Only Focus — keep discussing features only","correct":false},{"id":"b","text":"Openness and Courage (and Respect for stakeholders’ need for truth); reinforce that values enable transparency, inspection, and adaptation","correct":true},{"id":"c","text":"Commitment to finishing every backlog item regardless of quality","correct":false},{"id":"d","text":"No values apply; defects are only a QA concern","correct":false}],"correctWhy":"Openness about challenges and courage to do the right thing are essential. When values are embodied, the pillars come to life building trust. Hiding defects destroys transparency.","wrongWhy":{"a":"Focus does not justify hiding quality reality.","c":"Commitment is to goals and supporting each other — not false Done.","d":"Quality/Done is whole-team accountability."},"guideInsight":"Scrum Values: Commitment, Focus, Openness, Respect, Courage.","examTip":"Use values as decision filters in scenario stems.","realWorld":"Thank people for surfacing bad news early; inspect defects in Review/Retro.","remember":"Openness + Courage make quality risks discussable.","certifications":["PSM-II"],"competency":"Understanding and Applying the Scrum Framework","topic":"Scrum Values"},{"id":126,"category":"Work Spillover","difficulty":"Advanced","type":"scenario","examTrack":"PSM-II","focusArea":"Understanding and Applying the Scrum Framework","question":"The team repeatedly forecasts too much, spills work every Sprint, and starts 'borrowing' the first days of the next Sprint. Leadership wants a larger Sprint Backlog. Best Scrum Master focus?","options":[{"id":"a","text":"Encourage bigger forecasts to show ambition","correct":false},{"id":"b","text":"Help inspect past performance, capacity, DoD, refinement quality, Sprint Goal focus, and impediments; improve empirical forecasting","correct":true},{"id":"c","text":"Extend Sprint length whenever spillover happens","correct":false},{"id":"d","text":"Count spilled work as Done for morale","correct":false}],"correctWhy":"Developers forecast based on past performance, upcoming capacity, and Definition of Done. Empiricism uses what has happened. Spilled undone work is not Done and should not be masked.","wrongWhy":{"a":"Ambition without evidence increases risk.","c":"Variable Sprint length to hide planning issues harms consistency; Sprints are fixed length ≤ one month.","d":"False Done destroys transparency."},"guideInsight":"Sprint Planning forecast confidence factors; fixed-length Sprints; Done rules.","examTip":"Spillover → inspect system, don’t inflate forecasts.","realWorld":"Tighten ready items, DoD, and focus; forecast fewer items more honestly.","remember":"Forecast from evidence — don’t normalize perpetual spillover.","certifications":["PSM-II"],"competency":"Understanding and Applying the Scrum Framework","topic":"Work Spillover"},{"id":127,"category":"Customer Collaboration","difficulty":"Advanced","type":"scenario","examTrack":"PSM-II","focusArea":"Managing Products with Agility","question":"The Product Owner has not spoken with users in months and orders the backlog from internal opinions only. Sprint Reviews show little learning. How should the Scrum Master help?","options":[{"id":"a","text":"Replace the Product Owner immediately without discussion","correct":false},{"id":"b","text":"Facilitate stakeholder/customer collaboration and coach empirical product planning so feedback informs the Product Backlog","correct":true},{"id":"c","text":"Ban stakeholder input to protect Developer focus forever","correct":false},{"id":"d","text":"Have Developers own the Product Goal","correct":false}],"correctWhy":"SM facilitates stakeholder collaboration as requested/needed and helps establish empirical product planning. PO still maximizes value and manages the backlog — with better feedback loops.","wrongWhy":{"a":"Jumping to replacement skips coaching/teaching first in most scenarios.","c":"Focus matters, but cutting feedback kills empiricism.","d":"PO develops and communicates the Product Goal."},"guideInsight":"SM services to PO; Sprint Review adapts backlog based on environment and feedback.","examTip":"Improve feedback loops without seizing PO accountability.","realWorld":"Help schedule user sessions; bring evidence into refinement and Review.","remember":"Empirical product management needs real stakeholder/customer feedback.","certifications":["PSM-II"],"competency":"Managing Products with Agility","topic":"Customer Collaboration"},{"id":128,"category":"Technical Excellence","difficulty":"Expert","type":"multi","examTrack":"PSM-II","focusArea":"Developing and Delivering Products Professionally","question":"Select all that apply. Which statements align with managing technical risk under Scrum?","options":[{"id":"a","text":"Developers instill quality by adhering to the Definition of Done","correct":true},{"id":"b","text":"Multiple Increments may be created in a Sprint, each meeting Done","correct":true},{"id":"c","text":"Technical debt can be kept invisible if velocity looks good","correct":false},{"id":"d","text":"An Increment must be usable to provide value","correct":true}],"correctWhy":"Developers adhere to DoD; Increments must be usable; multiple Done Increments per Sprint are allowed. Hiding technical debt reduces transparency and increases risk.","wrongWhy":{"c":"Invisible debt misleads inspection and adaptation."},"guideInsight":"DoD, usable Increment, Developer quality accountability.","examTip":"Technical risk questions map to Done + transparency.","realWorld":"Make debt visible in backlog/ordering conversations with PO.","remember":"Usable Done Increments reduce technical risk.","certifications":["PSM-II"],"competency":"Developing and Delivering Products Professionally","topic":"Technical Excellence"},{"id":129,"category":"Agile Mindset","difficulty":"Advanced","type":"scenario","examTrack":"PSM-II","focusArea":"Evolving the Agile Organization","question":"Leaders say 'We do Scrum' but keep annual fixed-scope projects, phase gates before any user feedback, and a separate project manager assigning Developers daily. What should the Scrum Master communicate?","options":[{"id":"a","text":"Any use of Sprint labels means they have Scrum","correct":false},{"id":"b","text":"Scrum exists only in its entirety; implementing only parts is not Scrum — and current practices may cover up problems limiting benefits","correct":true},{"id":"c","text":"Phase gates are required by the Scrum Guide","correct":false},{"id":"d","text":"Project managers must assign work inside Scrum Teams","correct":false}],"correctWhy":"The Scrum framework is immutable. Implementing only parts is possible, but the result is not Scrum. Changing core design or leaving out elements covers up problems and limits benefits.","wrongWhy":{"a":"Labels without accountabilities/events/artifacts/commitments ≠ Scrum.","c":"Phase gates before feedback oppose empiricism.","d":"Self-managing Developers plan their work."},"guideInsight":"Scrum is immutable and purposefully incomplete; try it as is.","examTip":"PSM II often tests 'Scrum theater' vs real empiricism.","realWorld":"Map which Guide elements are missing; coach incremental organizational change.","remember":"Partial Scrum is not Scrum.","certifications":["PSM-II"],"competency":"Evolving the Agile Organization","topic":"Agile Mindset"},{"id":130,"category":"Developers Accountability","difficulty":"Advanced","type":"multi","examTrack":"PSM-II","focusArea":"Understanding and Applying the Scrum Framework","question":"Select all that apply. Developers are always accountable for:","options":[{"id":"a","text":"Creating a plan for the Sprint, the Sprint Backlog","correct":true},{"id":"b","text":"Instilling quality by adhering to a Definition of Done","correct":true},{"id":"c","text":"Maximizing product value by ordering the Product Backlog","correct":false},{"id":"d","text":"Adapting their plan each day toward the Sprint Goal and holding each other accountable as professionals","correct":true}],"correctWhy":"The Guide lists four Developer accountabilities: Sprint Backlog plan, DoD quality, daily adaptation toward Sprint Goal, and mutual professional accountability. Product Backlog ordering is PO accountability.","wrongWhy":{"c":"Maximizing value / ordering PB is Product Owner accountability."},"guideInsight":"Developers accountabilities section of the 2020 Guide.","examTip":"Memorize the four Developer accountabilities for scenario filters.","realWorld":"When SM or managers own the plan, Developer accountability is broken.","remember":"Developers: plan, Done quality, daily adapt, peer accountability.","certifications":["PSM-II"],"competency":"Understanding and Applying the Scrum Framework","topic":"Developers Accountability"},{"id":131,"category":"Sprint","difficulty":"Expert","type":"scenario","examTrack":"PSM-II","focusArea":"Understanding and Applying the Scrum Framework","question":"Market news makes the current Sprint Goal meaningless. Developers are mid-Sprint with unfinished work. Who may cancel the Sprint, and when is cancellation appropriate?","options":[{"id":"a","text":"Only the Scrum Master, whenever velocity dips","correct":false},{"id":"b","text":"Only the Product Owner, if the Sprint Goal becomes obsolete","correct":true},{"id":"c","text":"Any stakeholder who funds the team","correct":false},{"id":"d","text":"Developers by majority vote for any inconvenience","correct":false}],"correctWhy":"A Sprint could be cancelled if the Sprint Goal becomes obsolete. Only the Product Owner has the authority to cancel the Sprint.","wrongWhy":{"a":"SM does not have cancellation authority.","c":"Stakeholders influence via the PO; they don’t cancel Sprints.","d":"Inconvenience ≠ obsolete Sprint Goal; only PO cancels."},"guideInsight":"Sprint cancellation rule — PO only; obsolete Sprint Goal.","examTip":"Rare but tested: cancellation authority.","realWorld":"Prefer negotiating scope if Goal still valuable; cancel when Goal is truly obsolete.","remember":"Only the Product Owner can cancel a Sprint.","certifications":["PSM-II"],"competency":"Understanding and Applying the Scrum Framework","topic":"Sprint"},{"id":132,"category":"Dependency Management","difficulty":"Expert","type":"scenario","examTrack":"PSM-II","focusArea":"Evolving the Agile Organization","question":"Every Sprint, Developers wait on a separate component team outside Scrum. The Sprint Goal often fails. Leadership calls this 'enterprise coordination.' Best Scrum Master approach?","options":[{"id":"a","text":"Accept perpetual waiting as unavoidable destiny","correct":false},{"id":"b","text":"Make dependencies and failed Goals transparent; coach cross-functionality and organizational design changes that enable Done Increments","correct":true},{"id":"c","text":"Remove the Sprint Goal so failure is impossible","correct":false},{"id":"d","text":"Prohibit Developers from communicating with the other team","correct":false}],"correctWhy":"Scrum Teams are cross-functional with all skills necessary to create value each Sprint. The SM coaches cross-functionality, causes impediment removal, and helps the organization evolve empirically. Hiding dependency failure prevents adaptation.","wrongWhy":{"a":"Normalizing Goal failure rejects empiricism.","c":"Removing the Goal removes focus and coherence.","d":"Communication bans worsen coordination."},"guideInsight":"Cross-functional self-managing teams; SM organizational service.","examTip":"Dependencies are often org-design impediments.","realWorld":"Visualize wait time; pursue shared Done, skill expansion, or team rewiring.","remember":"Cross-functionality exists to deliver Done value — not endless waits.","certifications":["PSM-II"],"competency":"Evolving the Agile Organization","topic":"Dependency Management"},{"id":133,"category":"Inspection","difficulty":"Advanced","type":"tf","examTrack":"PSM-II","focusArea":"Understanding and Applying the Scrum Framework","question":"True or False: Scrum’s five events provide cadence that helps with frequent, diligent inspection of artifacts and progress toward goals.","options":[{"id":"a","text":"True","correct":true},{"id":"b","text":"False","correct":false}],"correctWhy":"To help with inspection, Scrum provides cadence in the form of its five events. Artifacts and progress toward agreed goals must be inspected frequently and diligently.","wrongWhy":{"b":"The Guide explicitly ties events to inspection cadence."},"guideInsight":"Inspection pillar + five events cadence.","examTip":"Events exist for empiricism, not ceremony.","realWorld":"If inspection is rare, shorten feedback loops and protect event purposes.","remember":"Five events create inspection cadence.","certifications":["PSM-II"],"competency":"Understanding and Applying the Scrum Framework","topic":"Inspection"},{"id":134,"category":"Product Backlog","difficulty":"Advanced","type":"scenario","examTrack":"PSM-II","focusArea":"Managing Products with Agility","question":"Refinement is skipped for weeks. Sprint Planning becomes hours of confusion. Developers cannot forecast confidently. What should the Scrum Master emphasize?","options":[{"id":"a","text":"Refinement is optional waste Scrum forbids","correct":false},{"id":"b","text":"Product Backlog refinement is an ongoing activity that adds transparency so items can be Ready for selection in Planning","correct":true},{"id":"c","text":"Only the Scrum Master should write all backlog items in isolation","correct":false},{"id":"d","text":"Skip Planning and start coding from stakeholder emails","correct":false}],"correctWhy":"Refinement breaks down and further defines PBIs into smaller more precise items — ongoing detailing of description, order, and size. Items that can be Done in one Sprint are deemed ready for Planning after refining activities.","wrongWhy":{"a":"Refinement is described in the Guide as ongoing activity.","c":"PO may create items (or delegate) but SM writing alone is not the model; Developers size.","d":"Abandoning Planning loses Why/What/How collaboration."},"guideInsight":"Product Backlog refinement; Ready for Sprint Planning.","examTip":"Confused Planning often means weak refinement/transparency.","realWorld":"Establish a lightweight ongoing refinement habit with PO + Developers.","remember":"Refinement makes PBIs ready for Planning.","certifications":["PSM-II"],"competency":"Managing Products with Agility","topic":"Product Backlog"},{"id":135,"category":"Scrum Adoption","difficulty":"Expert","type":"scenario","examTrack":"PSM-II","focusArea":"Evolving the Agile Organization","question":"HR redesigns job titles to 'Scrum Master' for all project managers but keeps command-and-control accountabilities unchanged. What should a Professional Scrum Master do?","options":[{"id":"a","text":"Celebrate the title change as successful adoption","correct":false},{"id":"b","text":"Lead, train, and coach the organization in real Scrum adoption — including accountabilities, empiricism, and self-management — not relabeling","correct":true},{"id":"c","text":"Require every manager to approve Sprint Backlogs","correct":false},{"id":"d","text":"Eliminate Product Owners to simplify roles","correct":false}],"correctWhy":"The SM is accountable for establishing Scrum as defined in the Scrum Guide and serves the organization by leading, training, and coaching its Scrum adoption and planning implementations. Titles without behavior change are not adoption.","wrongWhy":{"a":"Renaming is not establishing Scrum.","c":"Approvals recreate non-self-managing control.","d":"PO accountability is required in Scrum."},"guideInsight":"SM organizational services; establish Scrum as defined.","examTip":"Adoption ≠ vocabulary swap.","realWorld":"Coach leaders on what changes in decision rights, metrics, and team design.","remember":"Adoption means behavior and system change — not titles.","certifications":["PSM-II"],"competency":"Evolving the Agile Organization","topic":"Scrum Adoption"},{"id":136,"category":"Advanced Scenarios","difficulty":"Expert","type":"scenario","examTrack":"PSM-II","focusArea":"Developing People and Teams","question":"During a heated Retrospective, blame escalates and one member shuts down. Timebox is nearly over with no improvement selected. What should the Scrum Master do?","options":[{"id":"a","text":"Declare a winner of the argument and assign actions","correct":false},{"id":"b","text":"Facilitate safety and focus; help the team inspect interactions/process and select at least one actionable improvement before the timebox ends if possible","correct":true},{"id":"c","text":"End Scrum and switch to Kanban permanently mid-event","correct":false},{"id":"d","text":"Invite executives in to decide the team’s improvement","correct":false}],"correctWhy":"The Retro inspects individuals, interactions, processes, tools, and DoD, and plans improvements. The SM ensures events are positive, productive, and timeboxed, coaching self-management rather than deciding for the team.","wrongWhy":{"a":"Assigned 'winners' destroy openness and ownership.","c":"Abandoning the framework mid-conflict avoids facilitation skill.","d":"Executive takeover reduces self-management."},"guideInsight":"Retrospective purpose; SM ensures productive timeboxed events.","examTip":"Facilitation under conflict is core PSM II judgment.","realWorld":"Reset working agreements; use structured formats; protect psychological safety.","remember":"Facilitate safety + one concrete improvement — don’t dictate.","certifications":["PSM-II"],"competency":"Developing People and Teams","topic":"Advanced Scenarios"},{"id":137,"category":"Release Planning","difficulty":"Advanced","type":"scenario","examTrack":"PSM-II","focusArea":"Managing Products with Agility","question":"Stakeholders refuse to release any Increment until a large feature set is complete in nine months. What Scrum Master insight is most accurate?","options":[{"id":"a","text":"Correct — Scrum forbids releasing before a big-bang date","correct":false},{"id":"b","text":"An Increment may be delivered to stakeholders prior to Sprint end; delaying release can delay learning and increase risk","correct":true},{"id":"c","text":"Only the Scrum Master can approve releases","correct":false},{"id":"d","text":"Sprint Review must always be the release gate","correct":false}],"correctWhy":"An Increment may be delivered to stakeholders prior to the end of the Sprint. The Sprint Review should never be considered a gate to releasing value. Frequent delivery supports empiricism and risk control.","wrongWhy":{"a":"Opposite of Guide guidance on releasability.","c":"SM does not own release approval as a gatekeeper role in the Guide.","d":"Explicitly not a release gate."},"guideInsight":"Increment delivery timing; Review is not a release gate.","examTip":"Big-bang holds vs empirical learning — choose learning.","realWorld":"Help PO articulate value of earlier releases; keep Done true.","remember":"Done Increments can release anytime — Review isn’t a gate.","certifications":["PSM-II"],"competency":"Managing Products with Agility","topic":"Release Planning"},{"id":138,"category":"Estimation","difficulty":"Advanced","type":"scenario","examTrack":"PSM-II","focusArea":"Understanding and Applying the Scrum Framework","question":"The PMO mandates story points and a single estimation technique for all teams. Developers already forecast effectively using past throughput. What is Guide-aligned?","options":[{"id":"a","text":"Story points are required by the Scrum Guide","correct":false},{"id":"b","text":"Developers are responsible for sizing; Scrum does not prescribe a particular estimation technique","correct":true},{"id":"c","text":"Only the Product Owner sizes work","correct":false},{"id":"d","text":"Sizing must be done exclusively by the Scrum Master","correct":false}],"correctWhy":"The Developers who will be doing the work are responsible for sizing. The PO may influence by helping understand trade-offs. The Guide does not mandate story points.","wrongWhy":{"a":"Story points are a complementary practice, not a Guide rule.","c":"PO doesn’t solely size.","d":"SM does not own sizing."},"guideInsight":"Developers size PBIs; PO may influence trade-offs.","examTip":"Don’t invent mandated estimation methods as Scrum.","realWorld":"Defend Developer ownership of forecast methods that support empiricism.","remember":"Developers size — techniques are complementary practices.","certifications":["PSM-II"],"competency":"Understanding and Applying the Scrum Framework","topic":"Estimation"},{"id":139,"category":"Advanced Scenarios","difficulty":"Expert","type":"scenario","examTrack":"PSM-II","focusArea":"Developing People and Teams","question":"Management asks the Scrum Master to 'make the team commit to 40 points' because last Sprint delivered 30. The Sprint Goal is already drafted with the PO. Best response?","options":[{"id":"a","text":"Force 40 points to satisfy management","correct":false},{"id":"b","text":"Protect empirical forecasting by Developers based on capacity, past performance, and DoD; use the Sprint Goal for focus rather than a velocity target","correct":true},{"id":"c","text":"Change DoD downward so 40 points fit","correct":false},{"id":"d","text":"Add a second Sprint Goal to absorb extra points","correct":false}],"correctWhy":"Developers select what can be Done using past performance, capacity, and DoD. The Sprint Goal is the single objective creating coherence — not a points target. Velocity as a performance target encourages gaming and weakens quality/openness.","wrongWhy":{"a":"Forced forecasts undermine self-management and empiricism.","c":"Lowering quality to hit metrics violates Sprint quality rule.","d":"Sprint Goal is a single objective."},"guideInsight":"Developer forecast factors; single Sprint Goal; quality does not decrease.","examTip":"Velocity targets are a frequent advanced anti-pattern.","realWorld":"Explain risks of targets; show Goal-oriented planning evidence.","remember":"Velocity is not a commitment target — Sprint Goal is the focus.","certifications":["PSM-II"],"competency":"Developing People and Teams","topic":"Advanced Scenarios"},{"id":140,"category":"Scrum Master Accountability","difficulty":"Expert","type":"multi","examTrack":"PSM-II","focusArea":"Evolving the Agile Organization","question":"Select all that apply. Which services does the Scrum Master provide to the wider organization?","options":[{"id":"a","text":"Leading, training, and coaching the organization in its Scrum adoption","correct":true},{"id":"b","text":"Planning and advising Scrum implementations within the organization","correct":true},{"id":"c","text":"Helping employees and stakeholders understand and enact an empirical approach for complex work","correct":true},{"id":"d","text":"Owning the Product Backlog ordering across the enterprise","correct":false}],"correctWhy":"The Guide lists leading/training/coaching adoption, planning/advising implementations, helping enact empiricism, and removing barriers between stakeholders and Scrum Teams. Ordering the Product Backlog is PO accountability.","wrongWhy":{"d":"Enterprise backlog ordering is not SM accountability."},"guideInsight":"Scrum Master services to the organization.","examTip":"Know SM services to team, PO, and organization as separate lists.","realWorld":"Spend time with leaders on system impediments, not only team ceremonies.","remember":"SM serves the org by coaching adoption and empiricism — not by owning the backlog.","certifications":["PSM-II"],"competency":"Evolving the Agile Organization","topic":"Scrum Master Accountability"},{"id":141,"category":"Product Management","difficulty":"Advanced","type":"scenario","examTrack":"PSM-II","focusArea":"Managing Products with Agility","question":"Output is high (many tickets Done) but customers report no outcome improvement toward the Product Goal. The PO asks what to inspect. What should the Scrum Master highlight?","options":[{"id":"a","text":"Increase ticket output further","correct":false},{"id":"b","text":"Inspect whether the Increment and backlog ordering truly advance the Product Goal and customer value — not just activity","correct":true},{"id":"c","text":"Remove the Product Goal to reduce pressure","correct":false},{"id":"d","text":"Stop Sprint Reviews to avoid bad feedback","correct":false}],"correctWhy":"The Product Goal is the long-term objective; the Increment is a stepping stone toward it. PO maximizes value. High output with weak outcomes signals a transparency/value ordering problem empiricism should expose — especially at Sprint Review.","wrongWhy":{"a":"More output can hide poor outcomes.","c":"Removing the Goal removes focus.","d":"Avoiding feedback blocks adaptation."},"guideInsight":"Product Goal; PO value maximization; Review inspect
