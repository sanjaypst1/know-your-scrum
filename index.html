<style>
/* Scrum Certification Simulator — Premium Design System */
:root, [data-theme="dark"] {
  --bg: #070b14;
  --bg-elev: #0d1424;
  --bg-card: rgba(17, 26, 46, 0.72);
  --bg-glass: rgba(255, 255, 255, 0.04);
  --border: rgba(148, 163, 184, 0.14);
  --border-strong: rgba(148, 163, 184, 0.28);
  --text: #e8eef9;
  --text-muted: #94a3b8;
  --text-dim: #64748b;
  --primary: #38bdf8;
  --primary-2: #818cf8;
  --primary-glow: rgba(56, 189, 248, 0.25);
  --accent: #34d399;
  --accent-glow: rgba(52, 211, 153, 0.2);
  --warn: #fbbf24;
  --danger: #f87171;
  --danger-glow: rgba(248, 113, 113, 0.18);
  --success: #34d399;
  --success-glow: rgba(52, 211, 153, 0.18);
  --purple: #a78bfa;
  --orange: #fb923c;
  --shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
  --radius: 16px;
  --radius-sm: 10px;
  --font: "Segoe UI", "Söhne", "Inter var", ui-sans-serif, system-ui, -apple-system, sans-serif;
  --font-display: "Segoe UI Semibold", "Segoe UI", ui-sans-serif, system-ui, sans-serif;
  --mono: ui-monospace, "Cascadia Code", "SF Mono", Consolas, monospace;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --nav-h: 64px;
}

[data-theme="light"] {
  --bg: #f4f7fb;
  --bg-elev: #ffffff;
  --bg-card: rgba(255, 255, 255, 0.82);
  --bg-glass: rgba(15, 23, 42, 0.03);
  --border: rgba(15, 23, 42, 0.08);
  --border-strong: rgba(15, 23, 42, 0.14);
  --text: #0f172a;
  --text-muted: #475569;
  --text-dim: #64748b;
  --primary: #0284c7;
  --primary-2: #4f46e5;
  --primary-glow: rgba(2, 132, 199, 0.15);
  --accent: #059669;
  --accent-glow: rgba(5, 150, 105, 0.12);
  --warn: #d97706;
  --danger: #dc2626;
  --danger-glow: rgba(220, 38, 38, 0.1);
  --success: #059669;
  --success-glow: rgba(5, 150, 105, 0.1);
  --purple: #7c3aed;
  --orange: #ea580c;
  --shadow: 0 20px 60px rgba(15, 23, 42, 0.08);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.55;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; }
a { color: var(--primary); text-decoration: none; }
img { max-width: 100%; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

/* Ambient background */
.ambient {
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(900px 500px at 12% -10%, rgba(56, 189, 248, 0.14), transparent 60%),
    radial-gradient(700px 480px at 90% 8%, rgba(129, 140, 248, 0.12), transparent 55%),
    radial-gradient(600px 400px at 50% 100%, rgba(52, 211, 153, 0.08), transparent 50%);
}
[data-theme="light"] .ambient {
  background:
    radial-gradient(900px 500px at 12% -10%, rgba(2, 132, 199, 0.1), transparent 60%),
    radial-gradient(700px 480px at 90% 8%, rgba(79, 70, 229, 0.08), transparent 55%),
    radial-gradient(600px 400px at 50% 100%, rgba(5, 150, 105, 0.06), transparent 50%);
}
.grid-overlay {
  position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: 0.35;
  background-image:
    linear-gradient(rgba(148, 163, 184, 0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(148, 163, 184, 0.05) 1px, transparent 1px);
  background-size: 48px 48px;
  mask-image: radial-gradient(ellipse at center, black 20%, transparent 75%);
}

.app { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; }

/* Top bar */
.topbar {
  height: var(--nav-h);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 1.25rem;
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(16px);
  background: color-mix(in srgb, var(--bg) 70%, transparent);
  position: sticky; top: 0; z-index: 50;
}
.brand { display: flex; align-items: center; gap: 0.75rem; font-weight: 700; letter-spacing: -0.02em; }
.brand-mark {
  width: 34px; height: 34px; border-radius: 10px;
  background: linear-gradient(135deg, var(--primary), var(--primary-2));
  display: grid; place-items: center; color: white; font-size: 0.85rem; font-weight: 800;
  box-shadow: 0 8px 24px var(--primary-glow);
}
.brand small { display: block; font-weight: 500; color: var(--text-muted); font-size: 0.72rem; letter-spacing: 0; }
.top-actions { display: flex; align-items: center; gap: 0.5rem; }
.icon-btn {
  width: 38px; height: 38px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--bg-glass);
  display: grid; place-items: center; color: var(--text-muted);
  transition: all 0.2s var(--ease);
}
.icon-btn:hover { color: var(--text); border-color: var(--border-strong); background: var(--bg-card); }
.stat-chip {
  display: none; align-items: center; gap: 0.4rem;
  padding: 0.35rem 0.7rem; border-radius: 999px;
  border: 1px solid var(--border); background: var(--bg-glass);
  font-size: 0.78rem; color: var(--text-muted); font-variant-numeric: tabular-nums;
}
.stat-chip strong { color: var(--text); font-weight: 700; }
@media (min-width: 720px) { .stat-chip { display: inline-flex; } }

/* Screens */
.screen { display: none; flex: 1; animation: fadeUp 0.45s var(--ease); }
.screen.active { display: block; }
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: none; }
}
@keyframes pulseGlow {
  0%, 100% { box-shadow: 0 0 0 0 var(--primary-glow); }
  50% { box-shadow: 0 0 0 8px transparent; }
}
@keyframes scorePop {
  0% { transform: scale(0.6); opacity: 0; }
  60% { transform: scale(1.08); }
  100% { transform: scale(1); opacity: 1; }
}
@keyframes barFill { from { width: 0; } }

.wrap { width: min(1120px, calc(100% - 2rem)); margin: 0 auto; }
.wrap-sm { width: min(820px, calc(100% - 2rem)); margin: 0 auto; }
.wrap-xs { width: min(720px, calc(100% - 2rem)); margin: 0 auto; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
  padding: 0.75rem 1.2rem; border-radius: 12px; font-weight: 600;
  border: 1px solid transparent; transition: all 0.2s var(--ease);
  white-space: nowrap;
}
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary {
  background: linear-gradient(135deg, var(--primary), var(--primary-2));
  color: #fff; box-shadow: 0 10px 30px var(--primary-glow);
}
.btn-primary:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.05); }
.btn-secondary {
  background: var(--bg-glass); border-color: var(--border); color: var(--text);
}
.btn-secondary:hover:not(:disabled) { border-color: var(--border-strong); background: var(--bg-card); }
.btn-ghost { color: var(--text-muted); }
.btn-ghost:hover { color: var(--text); }
.btn-danger { background: var(--danger-glow); color: var(--danger); border-color: color-mix(in srgb, var(--danger) 35%, transparent); }
.btn-success { background: var(--success-glow); color: var(--success); border-color: color-mix(in srgb, var(--success) 35%, transparent); }
.btn-lg { padding: 0.95rem 1.5rem; font-size: 1.05rem; border-radius: 14px; }
.btn-sm { padding: 0.45rem 0.8rem; font-size: 0.85rem; border-radius: 9px; }

/* Cards / glass */
.glass {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  backdrop-filter: blur(18px);
  box-shadow: var(--shadow);
}
.card { padding: 1.35rem; }
.eyebrow {
  font-size: 0.75rem; font-weight: 700; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--primary); margin-bottom: 0.6rem;
}
h1, h2, h3 { letter-spacing: -0.03em; line-height: 1.2; font-family: var(--font-display); }
h1 { font-size: clamp(2rem, 4.5vw, 3.1rem); font-weight: 800; }
h2 { font-size: clamp(1.4rem, 3vw, 1.9rem); font-weight: 750; }
h3 { font-size: 1.1rem; font-weight: 700; }
.lead { color: var(--text-muted); font-size: 1.05rem; max-width: 54ch; }

/* Welcome */
#screen-welcome { padding: 2.5rem 0 4rem; }
.hero-panel {
  display: grid; gap: 2rem;
  grid-template-columns: 1.2fr 0.8fr;
  align-items: stretch; margin-top: 1.5rem;
}
@media (max-width: 900px) { .hero-panel { grid-template-columns: 1fr; } }
.hero-copy { padding: 0.5rem 0; }
.feature-grid {
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem; margin: 1.5rem 0;
}
@media (max-width: 560px) { .feature-grid { grid-template-columns: 1fr; } }
.feature {
  padding: 0.9rem 1rem; border-radius: 12px;
  border: 1px solid var(--border); background: var(--bg-glass);
  font-size: 0.9rem;
}
.feature strong { display: block; margin-bottom: 0.2rem; color: var(--text); }
.feature span { color: var(--text-muted); font-size: 0.82rem; }
.hero-cta { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 1.25rem; }
.side-panel { padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
.metric-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.6rem; }
.metric {
  text-align: center; padding: 0.9rem 0.5rem; border-radius: 12px;
  background: var(--bg-glass); border: 1px solid var(--border);
}
.metric b { display: block; font-size: 1.35rem; font-weight: 800; letter-spacing: -0.03em; }
.metric span { font-size: 0.72rem; color: var(--text-muted); }
.guide-note {
  padding: 1rem; border-radius: 12px; font-size: 0.85rem; color: var(--text-muted);
  background: linear-gradient(135deg, var(--primary-glow), var(--accent-glow));
  border: 1px solid var(--border);
}
.kbd-hint { margin-top: auto; font-size: 0.78rem; color: var(--text-dim); }
kbd {
  display: inline-block; padding: 0.1rem 0.4rem; border-radius: 5px;
  border: 1px solid var(--border-strong); background: var(--bg-elev);
  font-family: var(--mono); font-size: 0.72rem; color: var(--text-muted);
}

/* Mode select */
#screen-modes { padding: 2rem 0 3rem; }
.mode-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 1rem; margin-top: 1.5rem;
}
.mode-card {
  text-align: left; padding: 1.35rem; border-radius: var(--radius);
  border: 1px solid var(--border); background: var(--bg-card);
  backdrop-filter: blur(18px); transition: all 0.25s var(--ease);
  display: flex; flex-direction: column; gap: 0.6rem; min-height: 190px;
}
.mode-card:hover {
  transform: translateY(-3px); border-color: color-mix(in srgb, var(--primary) 50%, var(--border));
  box-shadow: 0 16px 40px var(--primary-glow);
}
.mode-icon {
  width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center;
  background: var(--bg-glass); border: 1px solid var(--border); font-size: 1.2rem;
}
.mode-card h3 { font-size: 1.15rem; }
.mode-card p { color: var(--text-muted); font-size: 0.9rem; flex: 1; }
.mode-meta { font-size: 0.75rem; color: var(--text-dim); font-weight: 600; }

.filters-panel { margin-top: 1.5rem; padding: 1.25rem; }
.filters-row {
  display: grid; grid-template-columns: 1.4fr 1fr 1fr auto; gap: 0.75rem; align-items: end;
}
@media (max-width: 800px) { .filters-row { grid-template-columns: 1fr 1fr; } }
.field label {
  display: block; font-size: 0.75rem; font-weight: 600; color: var(--text-muted);
  margin-bottom: 0.35rem;
}
.field input, .field select {
  width: 100%; padding: 0.7rem 0.85rem; border-radius: 10px;
  border: 1px solid var(--border); background: var(--bg-elev); color: var(--text);
}
.toggle-row {
  display: flex; flex-wrap: wrap; gap: 1rem; margin-top: 1rem; align-items: center;
}
.toggle {
  display: inline-flex; align-items: center; gap: 0.5rem;
  font-size: 0.88rem; color: var(--text-muted); cursor: pointer; user-select: none;
}
.toggle input { accent-color: var(--primary); width: 16px; height: 16px; }

/* Quiz */
#screen-quiz { padding: 1rem 0 3rem; }
.quiz-header {
  display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center;
  justify-content: space-between; margin-bottom: 1rem;
}
.progress-wrap { flex: 1; min-width: 180px; }
.progress-meta {
  display: flex; justify-content: space-between; font-size: 0.78rem;
  color: var(--text-muted); margin-bottom: 0.35rem; font-variant-numeric: tabular-nums;
}
.progress-track {
  height: 8px; border-radius: 999px; background: var(--bg-glass);
  border: 1px solid var(--border); overflow: hidden;
}
.progress-fill {
  height: 100%; width: 0%; border-radius: inherit;
  background: linear-gradient(90deg, var(--primary), var(--primary-2), var(--accent));
  transition: width 0.4s var(--ease);
}
.quiz-stats { display: flex; gap: 0.5rem; flex-wrap: wrap; }
.pill {
  display: inline-flex; align-items: center; gap: 0.35rem;
  padding: 0.35rem 0.7rem; border-radius: 999px; font-size: 0.75rem; font-weight: 650;
  border: 1px solid var(--border); background: var(--bg-glass); color: var(--text-muted);
}
.pill.ok { color: var(--success); border-color: color-mix(in srgb, var(--success) 40%, transparent); background: var(--success-glow); }
.pill.bad { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, transparent); background: var(--danger-glow); }
.pill.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
.pill.primary { color: var(--primary); border-color: color-mix(in srgb, var(--primary) 40%, transparent); background: var(--primary-glow); }
.pill.purple { color: var(--purple); border-color: color-mix(in srgb, var(--purple) 40%, transparent); }

.question-card { padding: 1.5rem; position: relative; overflow: hidden; }
.question-card::before {
  content: ""; position: absolute; inset: 0 auto auto 0; width: 100%; height: 3px;
  background: linear-gradient(90deg, var(--primary), var(--primary-2), var(--accent));
  opacity: 0.85;
}
.q-meta { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; }
.q-text { font-size: clamp(1.1rem, 2.4vw, 1.35rem); font-weight: 650; letter-spacing: -0.02em; margin-bottom: 1.25rem; }
.q-type-hint { font-size: 0.82rem; color: var(--text-dim); margin: -0.75rem 0 1rem; }

.options { display: grid; gap: 0.65rem; }
.option {
  display: grid; grid-template-columns: auto 1fr; gap: 0.85rem; align-items: start;
  text-align: left; padding: 1rem 1.1rem; border-radius: 14px;
  border: 1px solid var(--border); background: var(--bg-glass);
  transition: all 0.2s var(--ease); position: relative;
}
.option:hover:not(.locked) { border-color: var(--border-strong); background: var(--bg-card); transform: translateX(2px); }
.option.selected { border-color: color-mix(in srgb, var(--primary) 60%, var(--border)); background: var(--primary-glow); box-shadow: 0 0 0 1px color-mix(in srgb, var(--primary) 30%, transparent); }
.option.correct { border-color: color-mix(in srgb, var(--success) 70%, transparent); background: var(--success-glow); }
.option.incorrect { border-color: color-mix(in srgb, var(--danger) 70%, transparent); background: var(--danger-glow); }
.option.missed { border-style: dashed; border-color: color-mix(in srgb, var(--success) 55%, transparent); }
.option-key {
  width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center;
  font-size: 0.78rem; font-weight: 700; border: 1px solid var(--border);
  background: var(--bg-elev); color: var(--text-muted); flex-shrink: 0;
}
.option.selected .option-key { border-color: var(--primary); color: var(--primary); }
.option.correct .option-key { border-color: var(--success); color: var(--success); }
.option.incorrect .option-key { border-color: var(--danger); color: var(--danger); }
.option-text { font-size: 0.95rem; padding-top: 0.15rem; }

.quiz-actions {
  display: flex; flex-wrap: wrap; gap: 0.65rem; justify-content: space-between;
  margin-top: 1.25rem; align-items: center;
}
.quiz-actions .left, .quiz-actions .right { display: flex; flex-wrap: wrap; gap: 0.55rem; }

/* Feedback panel */
.feedback {
  margin-top: 1.25rem; display: none; animation: fadeUp 0.4s var(--ease);
}
.feedback.show { display: block; }
.feedback-banner {
  display: flex; align-items: center; gap: 0.75rem;
  padding: 1rem 1.15rem; border-radius: 14px; margin-bottom: 1rem; font-weight: 700;
}
.feedback-banner.ok { background: var(--success-glow); color: var(--success); border: 1px solid color-mix(in srgb, var(--success) 35%, transparent); }
.feedback-banner.bad { background: var(--danger-glow); color: var(--danger); border: 1px solid color-mix(in srgb, var(--danger) 35%, transparent); }
.feedback-banner.partial { background: color-mix(in srgb, var(--warn) 15%, transparent); color: var(--warn); border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent); }

.edu-block {
  padding: 1.1rem 1.2rem; border-radius: 14px; margin-bottom: 0.75rem;
  border: 1px solid var(--border); background: var(--bg-glass);
}
.edu-block h4 {
  font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.07em;
  color: var(--primary); margin-bottom: 0.55rem; font-weight: 750;
}
.edu-block p, .edu-block li { color: var(--text-muted); font-size: 0.92rem; }
.edu-block ul { padding-left: 1.1rem; display: grid; gap: 0.4rem; }
.edu-block.success-tone { border-color: color-mix(in srgb, var(--success) 30%, var(--border)); }
.edu-block.warn-tone { border-color: color-mix(in srgb, var(--warn) 30%, var(--border)); }
.edu-block.insight-tone { border-color: color-mix(in srgb, var(--primary) 30%, var(--border)); }
.edu-block.tip-tone { border-color: color-mix(in srgb, var(--purple) 30%, var(--border)); }
.edu-block.world-tone { border-color: color-mix(in srgb, var(--orange) 30%, var(--border)); }
.edu-block.remember-tone {
  background: linear-gradient(135deg, var(--primary-glow), var(--accent-glow));
  border-color: color-mix(in srgb, var(--accent) 35%, var(--border));
}
.wrong-item { margin-bottom: 0.55rem; }
.wrong-item strong { color: var(--text); display: block; margin-bottom: 0.15rem; font-size: 0.88rem; }

/* Results */
#screen-results { padding: 2rem 0 4rem; }
.score-hero {
  text-align: center; padding: 2rem 1.5rem; margin-bottom: 1.25rem; position: relative;
}
.score-ring {
  width: 160px; height: 160px; margin: 0 auto 1rem; position: relative;
  animation: scorePop 0.6s var(--ease);
}
.score-ring svg { transform: rotate(-90deg); width: 100%; height: 100%; }
.score-ring circle { fill: none; stroke-width: 10; }
.score-ring .track { stroke: var(--border); }
.score-ring .bar { stroke: url(#scoreGrad); stroke-linecap: round; transition: stroke-dashoffset 1s var(--ease); }
.score-center {
  position: absolute; inset: 0; display: grid; place-content: center; text-align: center;
}
.score-center b { font-size: 2.4rem; letter-spacing: -0.04em; line-height: 1; }
.score-center span { font-size: 0.8rem; color: var(--text-muted); }
.readiness-badge {
  display: inline-flex; align-items: center; gap: 0.4rem;
  margin-top: 0.75rem; padding: 0.45rem 0.9rem; border-radius: 999px;
  font-weight: 700; font-size: 0.9rem;
  background: var(--primary-glow); color: var(--primary);
  border: 1px solid color-mix(in srgb, var(--primary) 40%, transparent);
}
.readiness-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 0.75rem; margin: 1.25rem 0;
}
.readiness-card {
  padding: 1rem; border-radius: 14px; border: 1px solid var(--border); background: var(--bg-glass);
}
.readiness-card .label { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 0.35rem; }
.readiness-card .val { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.03em; }
.readiness-card .bar {
  margin-top: 0.55rem; height: 6px; border-radius: 999px; background: var(--border); overflow: hidden;
}
.readiness-card .bar i {
  display: block; height: 100%; border-radius: inherit;
  background: linear-gradient(90deg, var(--primary), var(--accent));
  animation: barFill 0.8s var(--ease);
}

.charts-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin: 1rem 0;
}
@media (max-width: 800px) { .charts-grid { grid-template-columns: 1fr; } }
.chart-card { padding: 1.25rem; }
.chart-card h3 { margin-bottom: 1rem; }
.hbar { display: grid; gap: 0.55rem; }
.hbar-row { display: grid; grid-template-columns: minmax(100px, 1.2fr) 1fr auto; gap: 0.6rem; align-items: center; font-size: 0.8rem; }
.hbar-row .name { color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hbar-track { height: 8px; border-radius: 999px; background: var(--border); overflow: hidden; }
.hbar-fill { height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--primary), var(--primary-2)); }
.hbar-row .pct { font-variant-numeric: tabular-nums; color: var(--text); font-weight: 650; min-width: 3ch; text-align: right; }

.heatmap {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(28px, 1fr)); gap: 4px; margin-top: 0.75rem;
}
.heat-cell {
  aspect-ratio: 1; border-radius: 5px; border: 1px solid transparent;
  background: var(--border); cursor: help;
}
.heat-cell.s0 { background: color-mix(in srgb, var(--danger) 55%, var(--bg)); }
.heat-cell.s1 { background: color-mix(in srgb, var(--warn) 55%, var(--bg)); }
.heat-cell.s2 { background: color-mix(in srgb, var(--accent) 45%, var(--bg)); }
.heat-cell.s3 { background: color-mix(in srgb, var(--success) 70%, var(--bg)); }
.heat-legend { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-top: 0.75rem; font-size: 0.75rem; color: var(--text-muted); }
.heat-legend span { display: inline-flex; align-items: center; gap: 0.3rem; }
.heat-legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

.badge-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 0.65rem;
}
.badge {
  padding: 0.85rem; border-radius: 12px; border: 1px solid var(--border);
  background: var(--bg-glass); text-align: center; opacity: 0.4; filter: grayscale(0.6);
  transition: all 0.25s var(--ease);
}
.badge.earned { opacity: 1; filter: none; border-color: color-mix(in srgb, var(--warn) 45%, var(--border)); background: color-mix(in srgb, var(--warn) 10%, var(--bg-glass)); }
.badge .ico { font-size: 1.4rem; margin-bottom: 0.3rem; }
.badge .name { font-size: 0.82rem; font-weight: 700; }
.badge .desc { font-size: 0.72rem; color: var(--text-muted); margin-top: 0.2rem; }

.recs { display: grid; gap: 0.6rem; }
.rec {
  padding: 0.9rem 1rem; border-radius: 12px; border: 1px solid var(--border);
  background: var(--bg-glass); font-size: 0.9rem; color: var(--text-muted);
}
.rec strong { color: var(--text); }

.results-actions {
  display: flex; flex-wrap: wrap; gap: 0.65rem; justify-content: center; margin-top: 1.5rem;
}

/* Review list */
#screen-review { padding: 2rem 0 3rem; }
.review-list { display: grid; gap: 0.75rem; margin-top: 1.25rem; }
.review-item {
  padding: 1rem 1.15rem; border-radius: 14px; border: 1px solid var(--border);
  background: var(--bg-card); cursor: pointer; text-align: left; transition: all 0.2s var(--ease);
}
.review-item:hover { border-color: var(--border-strong); transform: translateY(-1px); }
.review-item .top { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.5rem; }
.review-item .q { font-weight: 600; font-size: 0.95rem; }

/* Toast / modal helpers */
.toast {
  position: fixed; bottom: 1.25rem; left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--bg-elev); border: 1px solid var(--border-strong); color: var(--text);
  padding: 0.75rem 1.1rem; border-radius: 12px; box-shadow: var(--shadow);
  opacity: 0; pointer-events: none; transition: all 0.3s var(--ease); z-index: 100;
  font-size: 0.9rem; max-width: min(90vw, 420px); text-align: center;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.footer-note {
  text-align: center; padding: 1.5rem; font-size: 0.75rem; color: var(--text-dim);
}
.footer-note a { color: var(--text-muted); }

/* Trainer attribution */
.trainer-card {
  display: grid; grid-template-columns: auto 1fr; gap: 1.1rem; align-items: start;
  margin-top: 2rem; padding: 1.35rem 1.4rem;
}
.trainer-mark {
  width: 56px; height: 56px; border-radius: 16px;
  display: grid; place-items: center; font-weight: 800; letter-spacing: -0.03em;
  color: #fff; font-size: 0.95rem;
  background: linear-gradient(135deg, var(--primary), var(--primary-2));
  box-shadow: 0 10px 28px var(--primary-glow);
}
.trainer-copy h3 { font-size: 1.2rem; margin-bottom: 0.35rem; }
.trainer-copy p { color: var(--text-muted); font-size: 0.92rem; max-width: 62ch; }
.trainer-actions {
  display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; margin-top: 0.9rem;
}
.trainer-creds {
  font-size: 0.75rem; font-weight: 650; letter-spacing: 0.04em;
  color: var(--text-dim); text-transform: uppercase;
}
@media (max-width: 560px) {
  .trainer-card { grid-template-columns: 1fr; }
}

.hidden { display: none !important; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0,0,0,0); border: 0;
}

/* Difficulty colors */
.diff-Foundation { color: var(--accent); }
.diff-Intermediate { color: var(--primary); }
.diff-Advanced { color: var(--purple); }
.diff-Expert { color: var(--orange); }

.nav-back, .nav-home {
  display: inline-flex; align-items: center; gap: 0.35rem;
  min-height: 38px; padding: 0 0.75rem; border-radius: 10px;
  border: 1px solid var(--border); background: var(--bg-glass); color: var(--text);
  font-weight: 650; font-size: 0.88rem;
}
.nav-back:hover, .nav-home:hover { border-color: var(--border-strong); }
.nav-back svg, .nav-home svg { width: 16px; height: 16px; }

.disclaimer {
  margin-top: 1.25rem; padding: 0.9rem 1rem; border-radius: 12px;
  border: 1px solid var(--border); background: var(--bg-glass);
  color: var(--text-muted); font-size: 0.82rem;
}

.cert-grid {
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; margin-top: 1.5rem;
}
@media (max-width: 860px) { .cert-grid { grid-template-columns: 1fr; } }
.cert-card {
  text-align: left; padding: 1.25rem; border-radius: 18px; border: 1px solid var(--border);
  background: var(--bg-card); display: flex; flex-direction: column; gap: 0.55rem;
  min-height: 280px; transition: transform 0.2s var(--ease), border-color 0.2s var(--ease);
}
.cert-card:hover { transform: translateY(-3px); border-color: var(--border-strong); }
.cert-card.tone-indigo { box-shadow: inset 3px 0 0 #818cf8; }
.cert-card.tone-teal { box-shadow: inset 3px 0 0 #2dd4bf; }
.cert-card.tone-violet { box-shadow: inset 3px 0 0 #a78bfa; }
.cert-card.tone-amber { box-shadow: inset 3px 0 0 #fbbf24; }
.cert-top { display: flex; justify-content: space-between; gap: 0.5rem; align-items: center; }
.cert-card h3 { font-size: 1.35rem; }
.cert-card .label { color: var(--text); font-weight: 700; }
.cert-card p { color: var(--text-muted); font-size: 0.9rem; }
.focus-list { margin: 0.2rem 0 0; padding-left: 1.1rem; color: var(--text-muted); font-size: 0.82rem; }
.cert-meta { display: flex; flex-wrap: wrap; gap: 0.4rem; }
.cert-card .btn { margin-top: auto; align-self: flex-start; }

.quiz-layout { display: grid; grid-template-columns: 1fr 220px; gap: 1rem; align-items: start; }
@media (max-width: 900px) { .quiz-layout { grid-template-columns: 1fr; } }
.q-nav {
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.35rem;
}
.q-nav button {
  min-height: 36px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--bg-glass); font-size: 0.75rem; font-weight: 700;
}
.q-nav button.current { outline: 2px solid var(--primary); }
.q-nav button.answered { background: var(--primary-glow); }
.q-nav button.flagged { box-shadow: inset 0 -2px 0 var(--warn); }
.q-nav button.good { background: var(--success-glow); }
.q-nav button.bad { background: var(--danger-glow); }
.side-sticky { position: sticky; top: 80px; padding: 1rem; }

dialog {
  border: 1px solid var(--border-strong); border-radius: 16px; background: var(--bg-elev);
  color: var(--text); padding: 1.25rem; max-width: min(440px, 92vw); box-shadow: var(--shadow);
}
dialog::backdrop { background: rgba(2, 6, 16, 0.62); }
.dialog-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1rem; justify-content: flex-end; }

.topic-picks { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.4rem; }
.topic-picks label {
  display: inline-flex; gap: 0.35rem; align-items: center;
  padding: 0.35rem 0.6rem; border-radius: 999px; border: 1px solid var(--border);
  font-size: 0.78rem; color: var(--text-muted);
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important; transition: none !important;
  }
}

</style>
</head>

<script>
window.SCRUM_QUESTIONS = [{"id":1,"category":"Scrum Theory & Empiricism","difficulty":"Foundation","type":"single","question":"According to the 2020 Scrum Guide, Scrum is founded on which two foundations?","options":[{"id":"a","text":"Empiricism and lean thinking","correct":true},{"id":"b","text":"Predictive planning and detailed upfront design","correct":false},{"id":"c","text":"Command-and-control management and specialization","correct":false},{"id":"d","text":"Waterfall phases and stage-gate approvals","correct":false}],"correctWhy":"The Scrum Guide states Scrum is founded on empiricism and lean thinking. Empiricism asserts that knowledge comes from experience and making decisions based on what is observed. Lean thinking reduces waste and focuses on the essentials.","wrongWhy":{"b":"Predictive planning contradicts empiricism; Scrum optimizes predictability through iteration, not detailed upfront plans.","c":"Scrum Teams are self-managing; command-and-control is not a Scrum foundation.","d":"Waterfall and stage gates are not part of Scrum's theoretical foundation."},"guideInsight":"Scrum Theory: Empiricism and lean thinking","examTip":"Memorize the pair: empiricism + lean thinking — both appear in the 2020 Guide opening theory section.","realWorld":"Teams that still demand a complete requirements document before starting violate empiricism; start with a Product Goal and inspect outcomes each Sprint.","remember":"Scrum = empiricism + lean thinking.","examTrack":"Guide","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Scrum Theory & Empiricism"},{"id":2,"category":"Scrum Pillars","difficulty":"Foundation","type":"single","question":"What are the three pillars of empiricism in Scrum?","options":[{"id":"a","text":"Transparency, Inspection, and Adaptation","correct":true},{"id":"b","text":"Commitment, Focus, and Courage","correct":false},{"id":"c","text":"Planning, Execution, and Closure","correct":false},{"id":"d","text":"Roles, Events, and Artifacts","correct":false}],"correctWhy":"Empiricism rests on three pillars: Transparency, Inspection, and Adaptation. Scrum Values are Commitment, Focus, Openness, Respect, and Courage — different from the pillars.","wrongWhy":{"b":"These are Scrum Values (incomplete set), not the three pillars.","c":"These are traditional project phases, not Scrum pillars.","d":"Roles/accountabilities, events, and artifacts are Scrum's structure, not the empiricism pillars."},"guideInsight":"Three pillars of empiricism: Transparency, Inspection, Adaptation","examTip":"Don't confuse pillars (TIA) with values (CFO RC).","realWorld":"If progress isn't visible (transparency), your Sprint Review inspection will mislead stakeholders.","remember":"Pillars = Transparency, Inspection, Adaptation.","examTrack":"Guide","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Scrum Pillars"},{"id":3,"category":"Scrum Values","difficulty":"Foundation","type":"single","question":"Which set correctly lists the five Scrum Values?","options":[{"id":"a","text":"Commitment, Focus, Openness, Respect, Courage","correct":true},{"id":"b","text":"Transparency, Inspection, Adaptation, Trust, Honesty","correct":false},{"id":"c","text":"Collaboration, Communication, Competence, Clarity, Care","correct":false},{"id":"d","text":"Integrity, Accountability, Ownership, Empathy, Excellence","correct":false}],"correctWhy":"The Scrum Guide names five values: Commitment, Focus, Openness, Respect, and Courage. When these values are embodied by the Scrum Team and those they work with, the empirical Scrum pillars come to life building trust.","wrongWhy":{"b":"Transparency, Inspection, and Adaptation are pillars, not values.","c":"These are not the Scrum Values defined in the Guide.","d":"These may be organizational values but are not the five Scrum Values."},"guideInsight":"Scrum Values: Commitment, Focus, Openness, Respect, Courage","examTip":"Mnemonic: CFO-RC (Commitment, Focus, Openness, Respect, Courage).","realWorld":"A team that hides bad news lacks Openness; courage is needed to raise impediments early.","remember":"Values: Commitment, Focus, Openness, Respect, Courage.","examTrack":"Guide","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Scrum Values"},{"id":4,"category":"Scrum Theory & Empiricism","difficulty":"Foundation","type":"tf","question":"True or False: Scrum is purposefully incomplete and is immutable — implementing only parts of Scrum is not Scrum.","options":[{"id":"a","text":"True","correct":true},{"id":"b","text":"False","correct":false}],"correctWhy":"The Guide states Scrum is purposefully incomplete, leaving room for other techniques. It is immutable; while implementing only parts is possible, the result is not Scrum.","wrongWhy":{"b":"False is incorrect — the Guide explicitly says Scrum is purposefully incomplete and immutable."},"guideInsight":"Definition of Scrum: purposefully incomplete; immutable","examTip":"Exam trap: 'Scrum plus our custom missing pieces' may still be fine practices, but partial Scrum is not Scrum.","realWorld":"Don't rename a status meeting 'Daily Scrum' and claim you 'do Scrum' without the rest of the framework.","remember":"Partial Scrum ≠ Scrum. Scrum is immutable.","examTrack":"Guide","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Scrum Theory & Empiricism"},{"id":5,"category":"Product Owner Accountability","difficulty":"Foundation","type":"single","question":"Who is accountable for maximizing the value of the product resulting from the work of the Scrum Team?","options":[{"id":"a","text":"The Product Owner","correct":true},{"id":"b","text":"The Scrum Master","correct":false},{"id":"c","text":"The Developers","correct":false},{"id":"d","text":"A committee of stakeholders","correct":false}],"correctWhy":"The Product Owner is accountable for maximizing the value of the product resulting from the work of the Scrum Team. The PO is also accountable for effective Product Backlog management.","wrongWhy":{"b":"The Scrum Master is accountable for establishing Scrum and the Scrum Team's effectiveness, not maximizing product value.","c":"Developers create the Increment and are accountable for creating a plan, quality, adapting daily, and holding each other accountable — not maximizing product value.","d":"The Product Owner is one person, not a committee."},"guideInsight":"Product Owner accountability: maximize product value","examTip":"PO = value + Product Backlog management. One person, not a committee.","realWorld":"If a steering committee tries to be 'the PO,' decisions slow and accountability blurs — keep one named PO.","remember":"Only the Product Owner maximizes product value accountability.","examTrack":"Guide","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Product Owner Accountability"},{"id":6,"category":"Scrum Master Accountability","difficulty":"Foundation","type":"single","question":"The Scrum Master is accountable for which of the following?","options":[{"id":"a","text":"Establishing Scrum as defined in the Scrum Guide and the Scrum Team's effectiveness","correct":true},{"id":"b","text":"Assigning tasks to Developers each day","correct":false},{"id":"c","text":"Ordering the Product Backlog","correct":false},{"id":"d","text":"Approving the Definition of Done before each release","correct":false}],"correctWhy":"The Scrum Master is accountable for establishing Scrum as defined in the Scrum Guide and helping everyone understand Scrum theory and practice. They are accountable for the Scrum Team's effectiveness.","wrongWhy":{"b":"Developers are self-managing; the SM does not assign work.","c":"Ordering the Product Backlog is Product Owner accountability.","d":"Developers must conform to the DoD; the SM does not 'approve' releases via DoD gatekeeping as their core accountability."},"guideInsight":"Scrum Master: establishes Scrum; accountable for team effectiveness; serves as true leader","examTip":"SM serves the team, PO, and organization — not a task assigner.","realWorld":"A SM who hands out tickets each morning is practicing project management, not Scrum Mastery.","remember":"SM = Scrum effectiveness + true leadership who serves.","examTrack":"Guide","certifications":["PSM-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Scrum Master Accountability"},{"id":7,"category":"Developers Accountability","difficulty":"Foundation","type":"multi","question":"Select all that apply. Developers are always accountable for which of the following?","options":[{"id":"a","text":"Creating a plan for the Sprint, the Sprint Backlog","correct":true},{"id":"b","text":"Instilling quality by adhering to a Definition of Done","correct":true},{"id":"c","text":"Adapting their plan each day toward the Sprint Goal","correct":true},{"id":"d","text":"Holding each other accountable as professionals","correct":true}],"correctWhy":"The Guide lists four Developer accountabilities: creating the Sprint Backlog plan; instilling quality by adhering to the DoD; adapting their plan each day toward the Sprint Goal; and holding each other accountable as professionals.","wrongWhy":{},"guideInsight":"Developers accountabilities (four items in the Guide)","examTip":"On multi-select, if all four Guide accountabilities appear, select all — they are always accountable for these.","realWorld":"Daily adaptation toward the Sprint Goal is a Developer duty, not something to wait for the SM to dictate.","remember":"Developers: plan Sprint Backlog, quality/DoD, adapt daily, mutual accountability.","examTrack":"Guide","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Developers Accountability"},{"id":8,"category":"Sprint","difficulty":"Foundation","type":"single","question":"What is the maximum length of a Sprint according to the 2020 Scrum Guide?","options":[{"id":"a","text":"One calendar month or less","correct":true},{"id":"b","text":"Exactly two weeks","correct":false},{"id":"c","text":"Six weeks for complex products","correct":false},{"id":"d","text":"As long as needed to finish all selected Product Backlog items","correct":false}],"correctWhy":"Sprints are fixed length events of one month or less to create consistency. A new Sprint starts immediately after the conclusion of the previous Sprint.","wrongWhy":{"b":"Two weeks is common practice but not a Guide requirement; max is one month or less.","c":"Sprints longer than one month are not allowed; longer Sprints can make the Sprint Goal obsolete and increase complexity and risk.","d":"Sprint length is fixed; work does not extend the Sprint."},"guideInsight":"Sprint: fixed length one month or less","examTip":"Remember 'one month or less' — not 'two weeks mandatory.'","realWorld":"If your Sprint keeps slipping past the timebox to 'finish everything,' you no longer have a Sprint.","remember":"Sprint ≤ 1 month; next Sprint starts immediately.","examTrack":"Guide","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Sprint"},{"id":9,"category":"Sprint Planning","difficulty":"Foundation","type":"single","question":"What is the timebox for Sprint Planning for a one-month Sprint?","options":[{"id":"a","text":"Maximum of eight hours","correct":true},{"id":"b","text":"Maximum of four hours","correct":false},{"id":"c","text":"Maximum of fifteen minutes","correct":false},{"id":"d","text":"Maximum of three hours","correct":false}],"correctWhy":"Sprint Planning is timeboxed to a maximum of eight hours for a one-month Sprint. For shorter Sprints, the event is usually shorter.","wrongWhy":{"b":"Four hours is the max for Sprint Review (one-month Sprint), not Planning.","c":"Fifteen minutes is the Daily Scrum timebox.","d":"Three hours is the max for Sprint Retrospective (one-month Sprint)."},"guideInsight":"Sprint Planning timebox: max 8 hours (one-month Sprint)","examTip":"Memorize event timeboxes: Planning 8h, Review 4h, Retro 3h, Daily 15m.","realWorld":"If Planning regularly runs all day beyond eight hours, inspect why refinement or readiness is weak.","remember":"Sprint Planning ≤ 8 hours for a one-month Sprint.","examTrack":"Guide","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Sprint Planning"},{"id":10,"category":"Daily Scrum","difficulty":"Foundation","type":"single","question":"What is the purpose of the Daily Scrum?","options":[{"id":"a","text":"To inspect progress toward the Sprint Goal and adapt the Sprint Backlog as necessary","correct":true},{"id":"b","text":"To report status to the Scrum Master and Product Owner","correct":false},{"id":"c","text":"To assign work for the next 24 hours by the Scrum Master","correct":false},{"id":"d","text":"To demo completed work to stakeholders","correct":false}],"correctWhy":"The purpose of the Daily Scrum is to inspect progress toward the Sprint Goal and adapt the Sprint Backlog as necessary, adjusting the upcoming planned work.","wrongWhy":{"b":"It is not a status meeting for managers; Developers can select whatever structure helps achieve the purpose.","c":"Developers are self-managing; the SM does not assign work.","d":"Demoing to stakeholders happens in the Sprint Review."},"guideInsight":"Daily Scrum: inspect progress toward Sprint Goal; adapt Sprint Backlog; 15-minute timebox for Developers","examTip":"If an answer says 'status to SM/PO/manager,' it is wrong.","realWorld":"Replace three questions with a walk of the Sprint Backlog toward the Sprint Goal if that works better for your team.","remember":"Daily Scrum = Sprint Goal progress + adapt plan (15 min).","examTrack":"Guide","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Daily Scrum"},{"id":11,"category":"Sprint Review","difficulty":"Foundation","type":"single","question":"What is the maximum timebox for the Sprint Review for a one-month Sprint?","options":[{"id":"a","text":"Four hours","correct":true},{"id":"b","text":"Eight hours","correct":false},{"id":"c","text":"Three hours","correct":false},{"id":"d","text":"Fifteen minutes","correct":false}],"correctWhy":"The Sprint Review is the second to last event of the Sprint and is timeboxed to a maximum of four hours for a one-month Sprint.","wrongWhy":{"b":"Eight hours is Sprint Planning's maximum.","c":"Three hours is the Sprint Retrospective maximum.","d":"Fifteen minutes is the Daily Scrum."},"guideInsight":"Sprint Review timebox: max 4 hours (one-month Sprint)","examTip":"Review = 4h; Retro = 3h for one-month Sprints.","realWorld":"Treat Review as a working session with stakeholders, not a slide deck ceremony.","remember":"Sprint Review ≤ 4 hours.","examTrack":"Guide","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Sprint Review"},{"id":12,"category":"Sprint Retrospective","difficulty":"Foundation","type":"single","question":"When does the Sprint Retrospective occur, and what is its maximum timebox for a one-month Sprint?","options":[{"id":"a","text":"It concludes the Sprint; maximum of three hours","correct":true},{"id":"b","text":"It is the first event of the Sprint; maximum of eight hours","correct":false},{"id":"c","text":"It occurs mid-Sprint; maximum of fifteen minutes","correct":false},{"id":"d","text":"It replaces the Sprint Review; maximum of four hours","correct":false}],"correctWhy":"The Sprint Retrospective concludes the Sprint. It is timeboxed to a maximum of three hours for a one-month Sprint. The purpose is to plan ways to increase quality and effectiveness.","wrongWhy":{"b":"Sprint Planning starts the Sprint; Retro concludes it.","c":"Daily Scrum is 15 minutes; Retro is not mid-Sprint.","d":"Review and Retro are distinct events; Retro follows Review."},"guideInsight":"Sprint Retrospective: concludes Sprint; max 3 hours; increase quality and effectiveness","examTip":"Order: Planning → Daily Scrums → Review → Retro (ends Sprint).","realWorld":"Ship the most impactful improvement ASAP — even into the next Sprint Backlog.","remember":"Retro ends the Sprint; ≤ 3 hours.","examTrack":"Guide","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Sprint Retrospective"},{"id":13,"category":"Product Backlog","difficulty":"Foundation","type":"single","question":"What is the Product Backlog?","options":[{"id":"a","text":"An emergent, ordered list of what is needed to improve the product; the single source of work undertaken by the Scrum Team","correct":true},{"id":"b","text":"A fixed scope contract for the release","correct":false},{"id":"c","text":"A task list owned exclusively by the Scrum Master","correct":false},{"id":"d","text":"A Sprint plan created only by Developers","correct":false}],"correctWhy":"The Product Backlog is an emergent, ordered list of what is needed to improve the product. It is the single source of work undertaken by the Scrum Team.","wrongWhy":{"b":"The Product Backlog is emergent, not a fixed contract.","c":"The Product Owner is accountable for Product Backlog management.","d":"The Sprint Backlog is the plan by and for Developers; the Product Backlog is broader and PO-managed for effectiveness."},"guideInsight":"Product Backlog: emergent ordered list; single source of work","examTip":"Product Backlog ≠ Sprint Backlog. Know which commitment maps to which artifact.","realWorld":"Everything the team works on should be visible on the Product Backlog — no shadow workstreams.","remember":"Product Backlog = single source of work; emergent & ordered.","examTrack":"Guide","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Product Backlog"},{"id":14,"category":"Product Goal","difficulty":"Foundation","type":"single","question":"What is the Product Goal?","options":[{"id":"a","text":"The long-term objective for the Scrum Team; a future state of the product that can serve as a target","correct":true},{"id":"b","text":"The objective for a single Sprint only","correct":false},{"id":"c","text":"A list of all defects in the product","correct":false},{"id":"d","text":"The organization's annual OKR set by HR","correct":false}],"correctWhy":"The Product Goal describes a future state of the product which can serve as a target for the Scrum Team to plan against. It is the long-term objective for the Scrum Team. The Product Goal is in the Product Backlog.","wrongWhy":{"b":"That describes the Sprint Goal, not the Product Goal.","c":"Defects may be backlog items; they are not the Product Goal.","d":"OKRs may inform goals, but the Guide defines Product Goal as the product's future state / long-term objective."},"guideInsight":"Product Goal: future state of the product; long-term objective; commitment for Product Backlog","examTip":"Artifact → commitment: Product Backlog → Product Goal.","realWorld":"Without a clear Product Goal, backlog ordering becomes politics instead of progress toward a target.","remember":"Product Goal = long-term product target (in the Product Backlog).","examTrack":"Guide","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Product Goal"},{"id":15,"category":"Sprint Goal","difficulty":"Foundation","type":"single","question":"What is the Sprint Goal?","options":[{"id":"a","text":"The single objective for the Sprint; the commitment for the Sprint Backlog","correct":true},{"id":"b","text":"The sum of all story points selected","correct":false},{"id":"c","text":"A mandatory burn-down chart target","correct":false},{"id":"d","text":"The Product Goal restated word-for-word each Sprint","correct":false}],"correctWhy":"The Sprint Goal is the single objective for the Sprint. It is a commitment by the Developers and provides flexibility regarding the exact work needed. It is the commitment for the Sprint Backlog.","wrongWhy":{"b":"Story points are not defined or required by the Scrum Guide.","c":"Burn-downs are optional forecasting practices and do not replace empiricism.","d":"The Sprint Goal is a Sprint-level objective toward the Product Goal, not a copy of it."},"guideInsight":"Sprint Goal: single objective for the Sprint; Sprint Backlog commitment","examTip":"Sprint Backlog = Sprint Goal + selected PBIs + plan for delivering them.","realWorld":"A good Sprint Goal lets Developers negotiate scope without losing the why.","remember":"Sprint Goal = one objective for the Sprint.","examTrack":"Guide","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Sprint Goal"},{"id":16,"category":"Increment","difficulty":"Foundation","type":"single","question":"What is an Increment?","options":[{"id":"a","text":"A concrete stepping stone toward the Product Goal; additive to prior Increments and thoroughly verified to ensure all Increments work together","correct":true},{"id":"b","text":"Any code committed to a branch, regardless of quality","correct":false},{"id":"c","text":"Only the work presented in the Sprint Review","correct":false},{"id":"d","text":"A project phase deliverable after testing is complete in a later Sprint","correct":false}],"correctWhy":"An Increment is a concrete stepping stone toward the Product Goal. Each Increment is additive to all prior Increments and thoroughly verified, ensuring all Increments work together. To provide value, it must be usable.","wrongWhy":{"b":"Work cannot be considered part of an Increment unless it meets the Definition of Done.","c":"Multiple Increments may be created in a Sprint; the Sprint Review is not a gate to releasing value.","d":"Done work is usable; deferring 'Done' to a later testing Sprint violates the Increment concept."},"guideInsight":"Increment: concrete stepping stone toward Product Goal; must be usable; meets DoD","examTip":"Increment commitment = Definition of Done.","realWorld":"Ship when Done — don't wait for Sprint Review as a release gate.","remember":"Increment = usable, Done stepping stone toward Product Goal.","examTrack":"Guide","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Increment"},{"id":17,"category":"Definition of Done","difficulty":"Foundation","type":"tf","question":"True or False: The Definition of Done is a formal description of the state of the Increment when it meets the quality measures required for the product.","options":[{"id":"a","text":"True","correct":true},{"id":"b","text":"False","correct":false}],"correctWhy":"The Definition of Done is a formal description of the state of the Increment when it meets the quality measures required for the product. It creates transparency by providing everyone a shared understanding of what work was completed.","wrongWhy":{"b":"False is incorrect — this is the Guide's definition of the Definition of Done."},"guideInsight":"Definition of Done: formal description of Increment quality state; creates transparency","examTip":"If it's not Done, it can't be released or even presented at the Sprint Review.","realWorld":"Write DoD so 'Done' means releasable quality, not 'coding finished.'","remember":"DoD = shared quality bar for a usable Increment.","examTrack":"Guide","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Definition of Done"},{"id":18,"category":"Transparency","difficulty":"Foundation","type":"single","question":"According to the Scrum Guide, what does transparency enable?","options":[{"id":"a","text":"Inspection; inspection without transparency is misleading and wasteful","correct":true},{"id":"b","text":"Detailed Gantt charts for executives","correct":false},{"id":"c","text":"Individual performance ratings","correct":false},{"id":"d","text":"Elimination of the need for Adaptation","correct":false}],"correctWhy":"The Guide states that Transparency enables inspection. Inspection without transparency is misleading and wasteful.","wrongWhy":{"b":"Gantt charts are not required by Scrum and are not what transparency 'enables' in the Guide.","c":"Transparency is about the emergent process and work, not HR ratings.","d":"Transparency enables inspection, which enables adaptation — it does not eliminate adaptation."},"guideInsight":"Pillar relationship: Transparency enables Inspection","examTip":"Learn the chain: Transparency → Inspection → Adaptation.","realWorld":"Hidden technical debt makes Sprint Reviews look greener than reality — false transparency.","remember":"No transparency → inspection is wasteful/misleading.","examTrack":"Guide","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Transparency"},{"id":19,"category":"Inspection","difficulty":"Foundation","type":"single","question":"What does Inspection enable in Scrum's empiricism?","options":[{"id":"a","text":"Adaptation; inspection without adaptation is considered pointless","correct":true},{"id":"b","text":"Punishment for variance from the plan","correct":false},{"id":"c","text":"Freezing the Product Backlog until the next release","correct":false},{"id":"d","text":"Replacing the Product Owner with a PMO","correct":false}],"correctWhy":"Inspection enables adaptation. Inspection without adaptation is considered pointless. Scrum events are designed to provoke change.","wrongWhy":{"b":"Empiricism uses inspection to learn, not to punish.","c":"The Product Backlog is emergent and may be adjusted (e.g., at Sprint Review).","d":"Inspection does not change accountabilities."},"guideInsight":"Inspection enables Adaptation; without adaptation, inspection is pointless","examTip":"If you inspect but never change course, you are theater-Scrumming.","realWorld":"Finding a Sprint Goal risk in Daily Scrum should trigger plan adaptation the same day.","remember":"Inspect → Adapt (or the inspection was pointless).","examTrack":"Guide","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Inspection"},{"id":20,"category":"Adaptation","difficulty":"Foundation","type":"tf","question":"True or False: Adaptation becomes more difficult when the people involved are not empowered or self-managing.","options":[{"id":"a","text":"True","correct":true},{"id":"b","text":"False","correct":false}],"correctWhy":"The Guide states that adaptation becomes more difficult when the people involved are not empowered or self-managing. A Scrum Team is expected to adapt the moment it learns anything new through inspection.","wrongWhy":{"b":"False is incorrect — empowerment/self-management is explicitly linked to making adaptation easier."},"guideInsight":"Adaptation ASAP; harder when not empowered/self-managing","examTip":"Self-management isn't optional fluff — it enables timely adaptation.","realWorld":"If Developers must wait three approvals to change approach, adaptation will lag risk.","remember":"No empowerment → adaptation is harder.","examTrack":"Guide","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Adaptation"},{"id":21,"category":"Quality","difficulty":"Foundation","type":"single","question":"During a Sprint, what happens to quality expectations?","options":[{"id":"a","text":"Quality does not decrease","correct":true},{"id":"b","text":"Quality may be lowered to meet the Sprint Goal date","correct":false},{"id":"c","text":"Quality is deferred to a hardening Sprint","correct":false},{"id":"d","text":"Quality is defined only by stakeholders at Sprint Review","correct":false}],"correctWhy":"During the Sprint, quality does not decrease. Scope may be clarified and renegotiated with the Product Owner as more is learned, but quality is not sacrificed.","wrongWhy":{"b":"Lowering quality to hit a date violates the Sprint rules in the Guide.","c":"Hardening Sprints that push quality out contradict Done Increments each Sprint.","d":"Quality measures are expressed via the Definition of Done, not invented at Review."},"guideInsight":"During Sprint: quality does not decrease","examTip":"Scope can flex with PO; quality cannot drop.","realWorld":"Cutting tests on the last day to 'make the demo' creates unfinished Increment risk.","remember":"In a Sprint: quality does not decrease.","examTrack":"Guide","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Quality"},{"id":22,"category":"Estimation","difficulty":"Foundation","type":"single","question":"Who is responsible for sizing Product Backlog items?","options":[{"id":"a","text":"The Developers who will be doing the work","correct":true},{"id":"b","text":"The Product Owner alone","correct":false},{"id":"c","text":"The Scrum Master using planning poker facilitation only","correct":false},{"id":"d","text":"Stakeholders who fund the product","correct":false}],"correctWhy":"Product Backlog refinement includes sizing. The Developers who will be doing the work are responsible for the sizing. The Product Owner may influence Developers by helping them understand and select trade-offs.","wrongWhy":{"b":"The PO may influence understanding/trade-offs but Developers size the work.","c":"Facilitation techniques are optional; the Guide does not require planning poker. Accountability for sizing sits with Developers.","d":"Funders do not size PBIs in Scrum."},"guideInsight":"Product Backlog refinement: Developers responsible for sizing","examTip":"Guide never mandates story points — it says Developers size work.","realWorld":"PO explains value/trade-offs; Developers say how big/complex it is.","remember":"Developers size PBIs; PO may influence understanding.","examTrack":"Guide","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Estimation"},{"id":23,"category":"Forecasting","difficulty":"Foundation","type":"tf","question":"True or False: Various practices exist to forecast progress like burn-downs, burn-ups, or cumulative flows, and the use of these does not diminish the importance of empiricism.","options":[{"id":"a","text":"True","correct":true},{"id":"b","text":"False","correct":false}],"correctWhy":"The Guide notes that various projective practices like burn-downs, burn-ups, or cumulative flows have been used to forecast progress. These do not replace the importance of empiricism. In complex environments, what will happen is unknown; only what has already happened may be used for forward-looking decision-making.","wrongWhy":{"b":"False is incorrect — the Guide explicitly allows such practices while emphasizing empiricism remains essential."},"guideInsight":"Forecasting practices do not replace empiricism","examTip":"Charts are optional aids; empiricism is mandatory.","realWorld":"A green burn-down that ignores undone DoD work is a false forecast.","remember":"Burn-downs OK — they don't replace empiricism.","examTrack":"Guide","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Forecasting"},{"id":24,"category":"Agile Mindset","difficulty":"Foundation","type":"single","question":"Scrum employs an iterative, incremental approach in order to do what?","options":[{"id":"a","text":"Optimize predictability and control risk","correct":true},{"id":"b","text":"Eliminate the need for stakeholder feedback","correct":false},{"id":"c","text":"Guarantee delivery of a fixed scope on a fixed date","correct":false},{"id":"d","text":"Replace all technical practices with meetings","correct":false}],"correctWhy":"Scrum employs an iterative, incremental approach to optimize predictability and to control risk. Empiricism and lean thinking underpin this approach.","wrongWhy":{"b":"Feedback via inspection (e.g., Sprint Review) is essential.","c":"Complex work is uncertain; Scrum does not guarantee fixed scope/date.","d":"Scrum is purposefully incomplete regarding techniques; it does not replace engineering with meetings."},"guideInsight":"Iterative, incremental approach optimizes predictability and controls risk","examTip":"Link iteration/increment to predictability + risk control on exams.","realWorld":"Small Done Increments reduce the risk of a big-bang failure at the end.","remember":"Iterate/increment → predictability ↑, risk ↓.","examTrack":"Guide","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Agile Mindset"},{"id":25,"category":"Scrum Adoption","difficulty":"Foundation","type":"single","question":"A Scrum Team typically consists of how many people?","options":[{"id":"a","text":"10 or fewer","correct":true},{"id":"b","text":"Exactly 7 plus or minus 2 Developers only","correct":false},{"id":"c","text":"15–20 to maximize specialization","correct":false},{"id":"d","text":"No guidance is given on team size","correct":false}],"correctWhy":"The Scrum Team is small enough to remain nimble and large enough to complete significant work within a Sprint, typically 10 or fewer people. In general, smaller teams communicate better and are more productive.","wrongWhy":{"b":"The 2017 Guide referenced Development Team size 3–9; 2020 says Scrum Team typically 10 or fewer.","c":"If Scrum Teams become too large, they should reorganize into multiple cohesive teams.","d":"The Guide gives typical size guidance: 10 or fewer."},"guideInsight":"Scrum Team typically 10 or fewer; one SM, one PO, Developers","examTip":"2017 trap: 'Dev Team 3–9' is outdated; 2020 = Scrum Team typically ≤10.","realWorld":"At 14 people with sub-teams and handoffs, split into multiple Scrum Teams sharing Product Goal/Backlog/PO.","remember":"Scrum Team typically ≤ 10 people.","examTrack":"Guide","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Scrum Adoption"},{"id":26,"category":"Scrum Pillars","difficulty":"Intermediate","type":"multi","question":"Select all that apply. Which statements about the empirical pillars are true according to the 2020 Scrum Guide?","options":[{"id":"a","text":"Transparency enables inspection","correct":true},{"id":"b","text":"Inspection without transparency is misleading and wasteful","correct":true},{"id":"c","text":"Inspection enables adaptation","correct":true},{"id":"d","text":"Adaptation should wait until the next annual planning cycle","correct":false}],"correctWhy":"Transparency enables inspection; inspection without transparency is misleading and wasteful. Inspection enables adaptation. Adaptation must be made as soon as possible — the Scrum Team adapts the moment it learns anything new.","wrongWhy":{"d":"Waiting for an annual cycle contradicts adapting ASAP when new learning emerges."},"guideInsight":"Relationships among Transparency, Inspection, and Adaptation","examTip":"Multi-select pillar questions often include the 'misleading/wasteful' and 'pointless' phrases — know them.","realWorld":"Make work and goals visible so Review/Daily Scrum inspection leads to real change.","remember":"T→I→A; adapt ASAP.","examTrack":"PSM-I","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Scrum Pillars"},{"id":27,"category":"Scrum Values","difficulty":"Intermediate","type":"single","question":"A Developer discovers a serious security defect that could delay a demo stakeholders expect tomorrow. Raising it may be unpopular. Which Scrum Value most directly applies to speaking up now?","options":[{"id":"a","text":"Courage","correct":true},{"id":"b","text":"Focus only — ignore the defect until after the demo","correct":false},{"id":"c","text":"Commitment to the demo slides","correct":false},{"id":"d","text":"Respect by staying silent to avoid conflict","correct":false}],"correctWhy":"Courage means Scrum Team members have the courage to do the right thing and work on tough problems. Speaking up about a serious defect embodies Courage (and supports Openness and Respect for users).","wrongWhy":{"b":"Focus is on the Sprint Goal/work, not ignoring safety/quality issues.","c":"Commitment is to goals and quality as professionals, not to a misleading demo.","d":"Respect includes respecting people impacted by unsafe software; silence is not Respect."},"guideInsight":"Scrum Values come to life to build trust; Courage to do the right thing","examTip":"Scenario answers often map to a value — pick the best-fit value, not a rationalization.","realWorld":"Psychological safety lets Courage show up before production incidents do.","remember":"Tough truth → Courage (and Openness).","examTrack":"PSM-I","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Scrum Values"},{"id":28,"category":"Product Owner Accountability","difficulty":"Intermediate","type":"multi","question":"Select all that apply. Effective Product Backlog management includes which Product Owner accountabilities?","options":[{"id":"a","text":"Developing and explicitly communicating the Product Goal","correct":true},{"id":"b","text":"Creating and clearly communicating Product Backlog items","correct":true},{"id":"c","text":"Ordering Product Backlog items","correct":true},{"id":"d","text":"Ensuring the Product Backlog is transparent, visible, and understood","correct":true}],"correctWhy":"The PO is accountable for effective Product Backlog management, including: developing/communicating the Product Goal; creating/communicating PBIs; ordering PBIs; and ensuring the Product Backlog is transparent, visible, and understood. The PO may do this work or delegate it, but remains accountable.","wrongWhy":{},"guideInsight":"PO Product Backlog management accountabilities","examTip":"Delegation is allowed; accountability never leaves the PO.","realWorld":"If PBIs are unclear, the PO remains accountable even if a BA wrote them.","remember":"PO: Product Goal, create/communicate PBIs, order, transparency.","examTrack":"PSM-I","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Product Owner Accountability"},{"id":29,"category":"Product Owner Accountability","difficulty":"Intermediate","type":"tf","question":"True or False: The Product Owner is one person, not a committee. The Product Owner may represent the needs of many stakeholders in the Product Backlog.","options":[{"id":"a","text":"True","correct":true},{"id":"b","text":"False","correct":false}],"correctWhy":"The Product Owner is one person, not a committee. The PO may represent the needs of many stakeholders in the Product Backlog. Those wanting to change the Product Backlog can do so by trying to convince the Product Owner.","wrongWhy":{"b":"False is incorrect — the Guide explicitly states the PO is one person, not a committee."},"guideInsight":"PO is one person, not a committee; others convince the PO to change the backlog","examTip":"Committees as 'PO' is a classic exam wrong answer.","realWorld":"Stakeholders lobby the PO; they don't silently reorder the backlog.","remember":"PO = one person; convince them to change the backlog.","examTrack":"PSM-I","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Product Owner Accountability"},{"id":30,"category":"Scrum Master Accountability","difficulty":"Intermediate","type":"multi","question":"Select all that apply. The Scrum Master serves the Scrum Team in which of these ways?","options":[{"id":"a","text":"Coaching team members in self-management and cross-functionality","correct":true},{"id":"b","text":"Helping the Scrum Team focus on creating high-value Increments that meet the Definition of Done","correct":true},{"id":"c","text":"Causing the removal of impediments to the Scrum Team's progress","correct":true},{"id":"d","text":"Ensuring that all Scrum events take place and are positive, productive, and kept within the timebox","correct":true}],"correctWhy":"These four bullets are how the Scrum Master serves the Scrum Team per the Guide. The SM also serves the PO and the organization in other listed ways.","wrongWhy":{},"guideInsight":"SM serves Scrum Team: coach self-management/cross-functionality; Done high-value Increments; impede removal; events within timebox","examTip":"Distinguish whom the SM is serving: Team vs PO vs Organization.","realWorld":"SM ensures events happen well — not that the SM runs them as a project meeting chair forever.","remember":"SM for team: coach, Done focus, impediments, events.","examTrack":"PSM-I","certifications":["PSM-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Scrum Master Accountability"},{"id":31,"category":"Developers Accountability","difficulty":"Intermediate","type":"single","question":"Mid-Sprint, Developers realize their plan will not achieve the Sprint Goal if they continue as-is. What should they do?","options":[{"id":"a","text":"Adapt their plan toward the Sprint Goal, collaborating with the Product Owner to negotiate scope of the Sprint Backlog without changing the Sprint Goal if needed","correct":true},{"id":"b","text":"Cancel the Sprint immediately on their own authority","correct":false},{"id":"c","text":"Extend the Sprint by one week to finish everything selected","correct":false},{"id":"d","text":"Lower the Definition of Done so more items look complete","correct":false}],"correctWhy":"Developers adapt their plan each day toward the Sprint Goal. If the work turns out to be different than they expected, they collaborate with the PO to negotiate the scope of the Sprint Backlog within the Sprint without affecting the Sprint Goal. Only the PO can cancel the Sprint.","wrongWhy":{"b":"Only the Product Owner has the authority to cancel the Sprint.","c":"Sprints are fixed length; they are not extended.","d":"Quality does not decrease; DoD is not waived to fake completion."},"guideInsight":"Sprint Goal flexibility: negotiate scope with PO; Developers adapt daily","examTip":"Cancel authority = PO only; Sprint length fixed; quality doesn't drop.","realWorld":"Renegotiate which PBIs support the Sprint Goal rather than silently slipping dates.","remember":"Plan changes OK; Sprint Goal protected; only PO cancels.","examTrack":"PSM-I","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Developers Accountability"},{"id":32,"category":"Sprint Planning","difficulty":"Intermediate","type":"single","question":"Sprint Planning addresses which three topics?","options":[{"id":"a","text":"Why is this Sprint valuable?, What can be Done this Sprint?, How will the chosen work get Done?","correct":true},{"id":"b","text":"Who is available?, What is velocity?, When is the release date?","correct":false},{"id":"c","text":"Budget, Headcount, and Vendor contracts","correct":false},{"id":"d","text":"The three Daily Scrum questions only","correct":false}],"correctWhy":"Sprint Planning addresses three topics: Topic One — Why is this Sprint valuable? (Sprint Goal); Topic Two — What can be Done this Sprint?; Topic Three — How will the chosen work get Done? The whole Scrum Team collaborates.","wrongWhy":{"b":"These may be inputs some teams use, but they are not the three Guide topics.","c":"Not Sprint Planning topics in the Scrum Guide.","d":"The 2020 Guide does not prescribe three Daily Scrum questions; Planning has three topics."},"guideInsight":"Sprint Planning three topics: Why / What / How","examTip":"2017 said 'two questions'; 2020 has three topics including Why (Sprint Goal).","realWorld":"Finalize the Sprint Goal before Planning ends; Developers select What and own How.","remember":"Planning topics: Why valuable, What Done, How.","examTrack":"PSM-I","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Sprint Planning"},{"id":33,"category":"Sprint Planning","difficulty":"Intermediate","type":"tf","question":"True or False: Through discussion with the Product Owner, the Developers select items from the Product Backlog to include in the current Sprint.","options":[{"id":"a","text":"True","correct":true},{"id":"b","text":"False","correct":false}],"correctWhy":"Topic Two of Sprint Planning: through discussion with the Product Owner, the Developers select items from the Product Backlog to include in the current Sprint. The Scrum Team may refine these items during this process, which increases understanding and confidence.","wrongWhy":{"b":"False is incorrect — Developers select items through discussion with the PO."},"guideInsight":"Developers select Product Backlog items for the Sprint (with PO discussion)","examTip":"PO doesn't unilaterally force capacity; Developers select what can be Done.","realWorld":"PO clarifies value; Developers pull what they forecast they can get to Done.","remember":"Developers select Sprint items (discuss with PO).","examTrack":"PSM-I","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Sprint Planning"},{"id":34,"category":"Daily Scrum","difficulty":"Intermediate","type":"multi","question":"Select all that apply. Which statements about the Daily Scrum are correct?","options":[{"id":"a","text":"It is a 15-minute event for the Developers of the Scrum Team","correct":true},{"id":"b","text":"To reduce complexity, it is held at the same time and place every working day of the Sprint","correct":true},{"id":"c","text":"If the Product Owner or Scrum Master are actively working on items in the Sprint Backlog, they participate as Developers","correct":true},{"id":"d","text":"It is the only time Developers are allowed to adjust their plan","correct":false}],"correctWhy":"Daily Scrum is 15 minutes for Developers, same time and place to reduce complexity. PO/SM participate as Developers if actively working on Sprint Backlog items. The Daily Scrum is not the only time Developers are allowed to adjust their plan.","wrongWhy":{"d":"Explicitly false — the Guide says it is not the only time Developers may adjust their plan."},"guideInsight":"Daily Scrum rules: 15 min, Developers, same time/place; not only adjustment time","examTip":"Watch for the 'only time to adjust plan' trap — it is false.","realWorld":"Structure is up to Developers — three questions are optional practice, not required.","remember":"Daily Scrum ≠ only replanning slot.","examTrack":"PSM-I","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Daily Scrum"},{"id":35,"category":"Sprint Review","difficulty":"Intermediate","type":"single","question":"How does the Scrum Guide describe the Sprint Review?","options":[{"id":"a","text":"A working session where the Scrum Team and stakeholders inspect the outcome of the Sprint and determine future adaptations; the Product Backlog may also be adjusted","correct":true},{"id":"b","text":"A formal presentation gate that must approve release","correct":false},{"id":"c","text":"A private Developers-only meeting without stakeholders","correct":false},{"id":"d","text":"A performance appraisal of each Developer","correct":false}],"correctWhy":"During the event, the Scrum Team and stakeholders review what was accomplished in the Sprint and what has changed in their environment. The Product Backlog may also be adjusted. The Sprint Review is a working session and the Scrum Team should avoid limiting it to a presentation.","wrongWhy":{"b":"The Sprint Review is never a gate to releasing value.","c":"The Scrum Team presents the results of their work to key stakeholders.","d":"Not an HR appraisal event."},"guideInsight":"Sprint Review: working session; inspect outcome; adapt; PB may be adjusted","examTip":"'Demo only' is wrong; 'release gate' is wrong.","realWorld":"Invite key stakeholders and use the time to decide what to do next toward the Product Goal.","remember":"Sprint Review = working session, not just a demo.","examTrack":"PSM-I","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Sprint Review"},{"id":36,"category":"Sprint Retrospective","difficulty":"Intermediate","type":"single","question":"In the Sprint Retrospective, the Scrum Team identifies a change to their Definition of Done that would improve quality. What should they do?","options":[{"id":"a","text":"Address the most impactful improvements as soon as possible; they may even be added to the Sprint Backlog for the next Sprint","correct":true},{"id":"b","text":"Wait until the next annual process audit","correct":false},{"id":"c","text":"Ask the PMO to approve all DoD changes before any action","correct":false},{"id":"d","text":"Ignore DoD topics because Retrospectives only discuss interpersonal conflicts","correct":false}],"correctWhy":"The Scrum Team inspects how the last Sprint went with regards to individuals, interactions, processes, tools, and their Definition of Done. The most impactful improvements are addressed as soon as possible and may even be added to the Sprint Backlog for the next Sprint.","wrongWhy":{"b":"Improvements should be ASAP, not annualized.","c":"The Guide does not require PMO approval for team improvements; org standards for DoD are a minimum if they exist.","d":"DoD is explicitly in the Retro inspection scope."},"guideInsight":"Retro inspects individuals, interactions, processes, tools, and DoD; improve ASAP","examTip":"DoD improvements belong in Retro outcomes.","realWorld":"Turn one actionable improvement into next Sprint Backlog work so Retro isn't venting-only.","remember":"Retro → improve ASAP (DoD included).","examTrack":"PSM-I","certifications":["PSM-I","PSPO-I"],"competency":"Understanding and Applying the Scrum Framework","topic":"Sprint Retrospective"},{"id":37,"category":"Sprint Backlog","di
